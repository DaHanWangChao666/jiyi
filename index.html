/* ============================================================
   《记忆修复局》游戏引擎
   ------------------------------------------------------------
   只放逻辑，不放内容。对外暴露 G.Engine。
   ============================================================ */

(function(){
'use strict';

/* ---- 并入第 18 轮扩展卡池（G.CARDS_NEW → G.CARDS） ---- */
if (G.CARDS_NEW){
  Object.keys(G.CARDS_NEW).forEach(function(k){
    if (!G.CARDS[k]) G.CARDS[k] = G.CARDS_NEW[k];
  });
}
/* ---- 并入第 18 轮扩展事件（G.EVENTS_NEW → G.EVENTS） ---- */
if (G.EVENTS_NEW && G.EVENTS){
  G.EVENTS_NEW.forEach(function(e){
    if (!G.EVENTS.some(function(x){ return x.id === e.id; })) G.EVENTS.push(e);
  });
}

/* ---------------- 随机数（支持种子，用于分享） ---------------- */
function makeRng(seed){
  let s = 0;
  const str = String(seed);
  for (let i=0;i<str.length;i++){ s = (s*31 + str.charCodeAt(i)) >>> 0; }
  if (!s) s = 123456789;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- 存档 ---------------- */
const SAVE_KEY = G.CONFIG.saveKey;

function defaultMeta(){
  return {
    frag: 0,
    runs: 0,
    wins: 0,
    up: {},                 // { upgradeId: level }
    lore: [],               // 已解锁 lore id / 索引
    worlds: { zongmen:{ unlocked:true, cleared:0, best:0, bestRealm:0 } },
    seenMetaLore: 0,
    endings: [],            // 已触发结局 id
    totalActions: 0,
    worldActions: 0,        // 世界刻度：累计行动数，推动「飞升之阵」的进度
    worldStage: 0,          // 已解锁的世界线阶段序号
    zhenzhenDown: false,    // 是否击败过隐藏 Boss「镇阵人」
    tianjiao: []            // 已击败的天骄 id（终身成就，第 22 轮）
  };
}

function loadMeta(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultMeta();
    const m = Object.assign(defaultMeta(), JSON.parse(raw));
    m.up = m.up || {};
    m.lore = m.lore || [];
    m.endings = m.endings || [];
    if (!m.worlds) m.worlds = defaultMeta().worlds;
    if (!m.worlds.zongmen) m.worlds.zongmen = { unlocked:true, cleared:0, best:0, bestRealm:0 };
    return m;
  }catch(e){ return defaultMeta(); }
}
function saveMeta(m){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(m)); _saveError = null; return true; }
  catch(e){
    _saveError = { where:'元层', msg:(e && e.message) || '写不进去' };
    return false;
  }
}
function wipeMeta(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

/* ---------------- 局内状态 ---------------- */
let s = null;             // run state
let challenge = null;     // 进行中的挑战

function newRun(lots, seed){
  const C = G.CONFIG;
  const consti = G.CONSTITUTIONS.find(c=>c.id===lots.constitution) || G.CONSTITUTIONS[0];
  const role = G.ROLES.find(r=>r.id===lots.role) || G.ROLES[0];
  const up = meta.up || {};

  const upVal = id => (up[id]||0);

  const maxLife = Math.round(
    (G.REALMS[0].maxLife + upVal('startLife')*10 + (lots.bonus.lifeMax||0))
    * consti.lifeMul * (lots.bonus.lifeMul || 1)
  );

  s = {
    seed: seed,
    rng: makeRng(seed),
    world: 'zongmen',
    worldActions: (meta.worldActions || 0),   // 世界刻度（隐藏 Boss 与世界线的触发依据）

    // 身份与体质
    roleId: role.id, roleName: role.name,
    constId: consti.id, constName: consti.name,
    lots: lots,

    // 寿元
    life: maxLife,
    maxLife: maxLife,

    // 境界
    realmIdx: 0,
    cult: lots.bonus.cultStart || 0,
    attrGain: 0,        // 已经过几次境界成长（每突破一次 +1）
    attrBonus: {},      // 机缘带来的属性加成

    // 资源
    stone: Math.max(0, (lots.bonus.stone||0) + upVal('startStone')*15),
    karma: clamp((lots.bonus.karmaStart||0), 0, 20),
    favor: (lots.bonus.favor||0),

    // 篇章：zongmen 宗门篇 / sanxiu 散修篇
    chapter: 'zongmen',
    sanxiu: { started:false, days:0, herbs:0, fish:0, crops:0, beast:null, befriended:0 },

    // 宗门
    sectQi: clamp(C.sectQiStart + (lots.bonus.sectQi||0) + upVal('sectGain')*15, 0, C.sectQiMax + upVal('sectGain')*15),
    sectQiMax: C.sectQiMax + upVal('sectGain')*15,
    sectCollapsed: false,
    sectContrib: 0,          // 宗门贡献（决定职衔与藏经阁折扣）
    sectActions: 0,          // 累计宗门行动（决定月俸与主线推进）
    storyStage: 0,           // 《三月初七》推进到第几幕

    // 建筑
    buildings: { lingtian:0, danfang:0, cangjing:0, jiangjing:0, dazhen:0, zushi:0 },

    // 弟子
    disciples: [],
    discipleCount: 0,

    // 牌组
    deck: [],
    refine: {},          // 精炼等级：{ 卡名: 0~3 }
    // 长期因果：事件留下的后账
    debts: [],

    // 标记
    flags: (lots.bonus.flags||[]).slice(),
    clues: [],          // 已发现线索 id
    seenEvents: [],     // 已触发事件 id
    log: [],            // 记事

    /* 第 22 轮：比武大会 与 天骄榜 */
    tourney: null,        // 进行中的赛事 { id, round, total, wins, alive }
    tourneyDone: [],      // 本局已参加过的赛道 id
    titles: [],           // 本局挣到的名号（如「炼气魁首」）
    tianjiaoMet: [],      // 本局已遭遇过的天骄 id

    // 统计
    actions: 0,
    pillCounter: 0,
    guardUsed: false,
    restUsed: 0,
    nourishUsed: 0,
    ended: false
  };

  // 起始卡
  (lots.bonus.startCards||[]).forEach(n=>addCard(n, true));
  // 元层传承：额外稀有卡
  const extra = upVal('startCard');
  for (let i=0;i<extra;i++){
    const pool = Object.keys(G.CARDS).filter(k=>{
      const c = G.CARDS[k];
      return !c.hidden && (c.rarity==='玄'||c.rarity==='道');
    });
    addCard(pool[Math.floor(s.rng()*pool.length)], true);
  }
  if (s.deck.length===0) addCard('吐纳诀', true);

  log(`你以「${role.name}」的身份入了山门。${consti.desc}`);
  return s;
}

/* ---------------- 精炼与品阶的威力倍率 ---------------- */
function cardMul(name){
  const c = G.CARDS[name];
  if (!c) return 1;
  const rl = (s.refine && s.refine[name]) || 0;
  const rm = G.RARITY_MUL[c.rarity] || 1;
  return (1 + rl * G.REFINE.perLevel) * rm;
}

/* ---------------- 流派套装 ----------------
   统计每个流派的法宝件数，集齐 need 件即触发联动。 */
function activeSets(){
  const out = [];
  if (!s || !s.deck) return out;
  const count = {};
  s.deck.forEach(function(name){
    const c = G.CARDS[name];
    if (!c || c.type !== '法宝') return;
    const sch = c.school || 'zhong';
    count[sch] = (count[sch] || 0) + 1;
  });
  G.SETS.forEach(function(st){
    const have = count[st.school] || 0;
    if (have >= st.need){
      out.push({ id:st.id, name:st.name, school:st.school, have:have,
                 need:st.need, effect:st.effect, bonus:st.bonus });
    }
  });
  return out;
}
/* 套装加成的聚合 */
function setBonus(){
  const acc = { techMul:0, crit:0, wardPerRound:0, wardHold:false, pillMul:0,
                pillChance:0, cultMul:0, karmaPerAction:0, hpMul:0, dmgTaken:0,
                attr:0, lifeMax:0 };
  activeSets().forEach(function(st){
    const b = st.bonus || {};
    Object.keys(b).forEach(function(k){
      if (typeof b[k] === 'boolean') acc[k] = acc[k] || b[k];
      else acc[k] = (acc[k] || 0) + b[k];
    });
  });
  return acc;
}

/* ---------------- 卡牌聚合效果 ---------------- */
function agg(){
  const o = { power:0, ward:0, cultFlat:0, cultMul:0, costReduce:0, costReducePct:0,
              lifeFlat:0, lifePerAction:0, pillGain:0, karmaPer:0, stonePerAction:0,
              findBonus:0, breakReduce:0, tribulationDmgMul:1, flags:[],
              evade:0, lotBonus:0, attrBonus:{}, techMul:0, critSet:0,
              hpMul:0, dmgTakenSet:0, pillSetMul:0, pillSetChance:0,
              setKarma:0, setAttr:0, wardPerRound:0, wardHold:false };
  if (!s) return o;
  const SB = setBonus();
  s.deck.forEach(name=>{
    const c = G.CARDS[name];
    if (!c) return;
    const cm = cardMul(name);          // 精炼 + 品阶
    /* ⚠️ 术法牌不算进「常驻战力」。
       术法牌的 power 是「这一招有多重」的展示值，实战威力由
       techPower × G.TECHNIQUES.mul 决定。两套数值体系不能相加，
       否则一张术法牌会被算两次，战力显示也会虚高。            */
    const isTech = !!G.TECHNIQUES[name];
    if (typeof c.power==='number' && !isTech) o.power += c.power * cm;
    if (typeof c.ward==='number' && !isTech) o.ward += c.ward;
    if (c.flags) o.flags = o.flags.concat(c.flags);
    const e = c.eff; if (!e) return;
    if (e.power) o.power += e.power * cm;
    if (e.ward) o.ward += e.ward * cm;
    // 法宝的六维属性加成（第 18 轮新增的 attr 字段）
    if (e.attr){
      Object.keys(e.attr).forEach(function(k){ o.attrBonus[k] = (o.attrBonus[k]||0) + e.attr[k]; });
    }
    if (e.cultFlat) o.cultFlat += e.cultFlat;
    if (e.cultMul) o.cultMul += e.cultMul;
    if (e.costReduce) o.costReduce += e.costReduce;
    if (e.costReducePct) o.costReducePct += e.costReducePct;
    if (e.lifePerAction) o.lifePerAction += e.lifePerAction;
    if (e.pillGain) o.pillGain += e.pillGain;
    if (e.karmaPer) o.karmaPer += e.karmaPer;
    if (e.stonePerAction) o.stonePerAction += e.stonePerAction;
    if (e.findBonus) o.findBonus += e.findBonus;
    if (e.breakReduce) o.breakReduce += e.breakReduce;
    if (e.hpMul) o.hpMul += e.hpMul;      // 第 20 轮：以前这个字段也是死的
    if (e.tribulationDmgMul) o.tribulationDmgMul *= e.tribulationDmgMul;
    if (e.evade) o.evade = Math.max(o.evade, e.evade);
    if (e.lotBonus) o.lotBonus += e.lotBonus;
    if (e.flag) o.flags.push(e.flag);
  });
  // 建筑加成
  const b = s.buildings;
  o.stonePerAction += b.lingtian * 1;
  o.findBonus += b.cangjing;
  o.cultFlat += b.cangjing;
  o.ward += b.dazhen * 10;
  o.tribulationDmgMul *= Math.max(0.4, 1 - b.dazhen*0.12);
  o.cultMul += b.zushi * 0.03;
  // 元层加成
  const up = meta.up || {};
  o.cultMul += (up.cultGain||0) * 0.08;
  o.findBonus += Math.floor((up.findGain||0) * 0.5);
  /* ---- 流派套装加成（第 20 轮：这些以前收集完就扔了，从未被读取）----
     现在每一个都有明确的去处：
       techMul      → combatStats().powerMul 之外的招式额外加成（见下）
       crit        → combatStats().critChance
       hpMul       → combatStats().maxHp
       dmgTaken    → combatStats().dmgTakenMul
       pillMul     → usePill() 的丹药效果
       pillChance  → doAction() 的自动产丹
       karmaPerAction → doAction() 的业障累积
       attr        → attrs()（这一个本来就通的）
       wardPerRound / wardHold → advanceRound() 的护体                      */
  o.cultMul += SB.cultMul;
  o.techMul = (o.techMul||0) + SB.techMul;
  o.critSet = SB.crit;
  o.dmgTakenSet = SB.dmgTaken;
  o.pillSetMul = SB.pillMul;
  o.pillSetChance = SB.pillChance;
  o.setKarma = SB.karmaPerAction;
  o.setAttr = SB.attr;
  o.wardPerRound = SB.wardPerRound;
  o.wardHold = SB.wardHold;
  return o;
}

/* ---------------- 行动消耗 ---------------- */
function actionCost(){
  const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
  const base = G.REALMS[s.realmIdx].cost;
  let cost = base * consti.costMul;
  const a = agg();
  cost = (cost - a.costReduce) * (1 - a.costReducePct);
  cost -= (meta.up && meta.up.costCut ? meta.up.costCut*0.5 : 0);
  return Math.max(1, Math.round(cost));
}

/* ---------------- 资源变更 ---------------- */
function log(text){ if (s) s.log.unshift({ t: s.actions, text: text }); if (s && s.log.length>200) s.log.pop(); }

function gainStone(n){ s.stone = Math.max(0, s.stone + n); }
function gainCult(n){ s.cult = Math.max(0, s.cult + Math.round(n)); }
function gainKarma(n){
  const a = agg();
  s.karma = clamp(s.karma + n + (n>0 ? a.karmaPer : 0), 0, 30);
}
function gainFavor(n){ s.favor = s.favor + n; }
function gainSectQi(n){ s.sectQi = clamp(s.sectQi + n, 0, s.sectQiMax); }
function gainLife(n){
  s.life = Math.min(s.maxLife, s.life + n);
}

/* 寿元上限永久提升（同时补满差额） */
function raiseMaxLife(n){
  s.maxLife += n;
  s.life += n;
}

/* ---------------- 核心：执行一次行动 ---------------- */
/* 返回 {ok, cost, msgs[]} */
function doAction(kind){
  if (!s || s.ended) return { ok:false };

  const cost = actionCost();
  const msgs = [];

  // 1. 扣寿元
  s.life -= cost;
  s.actions++;

  // 2. 行动产出
  const a = agg();
  let extra = '';

  if (kind==='cultivate'){
    /* ============================================================
       修行的收益公式（第 23 轮按玩家给的定义重写）
       ------------------------------------------------------------
       玩家给出的定义：

         单次修炼修为 = (修炼速度 × 消耗寿元 + 加法增益) × 乘法增益

       · 修炼速度：每消耗 1 寿元得到的修为量，写在境界表里（G.REALMS[i].speed）
       · 加法增益：功法/法宝的 cultFlat（如「吐纳诀 +1」）
       · 乘法增益：所有乘算来源相乘 —— 功法 cultMul、体质、悟性、
                   抽签加成、宗门气运加持
       ============================================================ */
    const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
    const R = G.REALMS[s.realmIdx] || { speed:1, gain:1 };
    const speed = R.speed || 1;                 // 修炼速度（修为 / 寿元）

    /* 加法部分：基础（修炼速度 × 这一手实际烧掉的寿元）+ 功法法宝的固定加成 */
    const baseAdd = speed * cost + (a.cultFlat || 0);
    /* 乘法部分：把所有乘算来源统一收进来，方便界面逐项展示 */
    const mulParts = [
      ['功法',  1 + (a.cultMul || 0)],
      ['体质',  consti.cultMul || 1],
      ['出身',  s.lots.bonus.cultMul || 1],
      ['悟性',  1 + (attrs().wuxing||0) * 0.012],
      ['气运',  1 + sectBlessing().cult]
    ];
    const mul = mulParts.reduce((n,p)=>n*p[1], 1);
    const gain = Math.max(1, Math.round(baseAdd * mul));
    gainCult(gain);

    /* 提示文案：只说「哪几项在起作用」，不铺满整屏 */
    const active = mulParts.filter(p=>Math.abs(p[1]-1) > 0.005)
                           .map(p=>`${p[0]} ×${p[1].toFixed(2)}`);
    msgs.push(`修为 +${gain}　（修炼速度 ${speed.toFixed(2)}/寿元` +
      (a.cultFlat ? `　增益 +${a.cultFlat}` : '') +
      (active.length ? `　${active.join('　')}` : '') + '）');
  }
  else if (kind==='sectwork'){
    const gain = 8 + Math.round(6 * (1 + a.cultMul*0.4));
    gainStone(gain);
    gainSectQi(2 + s.buildings.jiangjing);
    gainFavor(1);
    msgs.push(`灵石 +${gain}　宗门气运 +${2+s.buildings.jiangjing}　人情 +1`);
    // 宗门事务也沾一点修行（修行不必是唯一出路）
    const cg = Math.round(G.cultBase(s.realmIdx) * 0.5);
    gainCult(cg);
    msgs.push(`修为 +${cg}`);
  }
  else if (kind==='rest'){
    const up = meta.up||{};
    // 恢复量刻意低于行动消耗的两倍，确保「刷恢复」不是最优解
    const heal = Math.round(s.maxLife * 0.14) + (up.restGain||0)*5 + a.lifePerAction*3;
    const before = s.life;
    gainLife(heal);
    gainSectQi(-3);
    gainCult(Math.round(G.cultBase(s.realmIdx)*0.25));
    s.restUsed = (s.restUsed||0) + 1;
    msgs.push(`寿元 +${Math.max(0, s.life - before)}　宗门气运 −3`);
  }
  else if (kind==='nourish'){
    const up = meta.up||{};
    // 永久提升寿元上限，但净收益很薄，且每境界次数有限
    const gain = 16 + (up.startLife||0)*2;
    raiseMaxLife(gain);
    s.nourishUsed = (s.nourishUsed||0) + 1;
    msgs.push(`寿元上限 +${gain}　净收益 ${gain - cost >= 0 ? '+' : ''}${gain - cost}`);
  }

  // 3. 持续产出（建筑 / 法宝）
  if (a.stonePerAction > 0){ gainStone(a.stonePerAction); }
  if (a.lifePerAction > 0){ gainLife(a.lifePerAction); }

  // 丹房产丹
  const dfLv = s.buildings.danfang;
  if (dfLv>0){
    s.pillCounter++;
    const need = Math.max(3, 8 - dfLv) - (a.pillGain>0?1:0);
    if (s.pillCounter >= Math.max(3,need)){
      s.pillCounter = 0;
      const pool = Object.keys(G.CARDS).filter(k=>G.CARDS[k].type==='丹药');
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      msgs.push(`丹房产出【${pick}】`);
    }
  }

  /* 套装「丹火不熄」：每次行动有几率自动产丹（第 20 轮接上，以前是死效果） */
  if (a.pillSetChance > 0 && s.rng() < a.pillSetChance){
    const pool = Object.keys(G.CARDS).filter(k=>G.CARDS[k].type==='丹药');
    if (pool.length){
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      msgs.push(`丹火不熄，炉中自成【${pick}】`);
    }
  }

  // 4. 宗门气运流失
  if (!s.sectCollapsed){
    const zushiCut = s.buildings.zushi;
    const up2 = meta.up || {};
    let drain = Math.max(0, G.CONFIG.sectQiDrain - Math.floor(zushiCut/2) - (up2.sectDrain||0));
    /* ⭐ 气运阈值（第 17 轮）：气运高于阈值时，宗门开始给「阵」供能，
       所以额外流失更快。低于阈值时有安全区，玩家可以安心经营宗门。 */
    const qiTh = (G.WORLD && G.WORLD.qiThreshold) || 75;
    if (s.sectQi > qiTh){
      drain += 1 + Math.floor((s.sectQi - qiTh) / 12);
      s.arrayCharge = (s.arrayCharge||0) + 1;   // 阵的充能计数（隐藏）
    }
    gainSectQi(-drain);
    if (s.sectQi <= 0){
      s.sectCollapsed = true;
      msgs.push('宗门气运见底了。');
      log('宗门气运见底。山门上的灯笼，灭了一盏。');
    }
  }

  // 5. 业障累积（夺道流等）
  /* ⚠️ 第 20 轮修复：这里以前是一段**空操作**——
       const kp = a.karmaPer;
       if (kp>0 && ...) s.karma = clamp(s.karma + 0, 0, 30);   // ← +0
     于是「业障」这个资源在整局里根本不会涨，
     夺道流「涨得最快、代价是业障翻倍」的代价部分完全是假的。
     设计文档说业障满会引来天谴（必死难度），而它永远涨不上去。

     现在：只要身上带着任何「损阴德」的东西，行动就积业障。
     刻意的两处收敛，避免一局直接暴死：
       · 按「件数」算，不按 karmaPer 的点数叠加 —— 点数差别只体现在
         渡劫判定（shouldTribulate 看 karmaPer>=5）与招式自带的业障上
       · 只在修行 / 探索 / 宗门事务上积，静养养身不积                */
  const actsWithKarma = (kind === 'cultivate' || kind === 'explore' || kind === 'sectwork');
  if (actsWithKarma){
    const perAction = ((a.karmaPer > 0) ? 1 : 0) + (a.setKarma || 0);
    if (perAction > 0){
      s.karma = clamp(s.karma + perAction, 0, 30);
      if (s.karma >= G.CONFIG.tribulation.killerKarma){
        msgs.push('业障满了。天上有东西开始找你。');
      }
    }
  }

  // 6. 死亡检查（行动是「耗尽」，不是「被打死」）
  const dead = checkDeath();

  // 7. 挑战重置
  if (challenge){ challenge.usesLeft = challenge.usesPerTurn; }

  // 8. 机缘：修行 / 探索 / 事务 都可能摸到新东西（三选一）
  let cardOffer = null;
  const cc = rollCardChance(kind);
  if (cc > 0 && s.rng() < cc){
    cardOffer = offerCards(3, { bonus: cardBonus() });
    if (!cardOffer.length) cardOffer = null;
  }

  // 9. 宗门：累计宗门行动 → 月俸 & 主线推进（第 15 轮）
  let salary = null;
  if (s.chapter === 'zongmen'){
    if (kind === 'sectwork' || kind === 'cultivate' || kind === 'explore'){
      s.sectActions = (s.sectActions||0) + 1;
      if (s.sectActions % 10 === 0){
        salary = paySalary();
        msgs.push(`月俸 +${salary.amount} 灵石（${salary.rank}）`);
      }
    }
  }

  // 10. 长期因果：以前的选择回来找你
  const debts = checkDebts();

  return { ok:true, cost:cost, msgs:msgs, dead:dead, extra:extra,
           cards:cardOffer, salary:salary, debts:debts };
}

/* ---------------- 死亡判定 ----------------
   · 被外力打死（战斗 / 天劫）→ 身死道消（slay）
   · 寿元自然耗尽            → 寿元耗尽（life）
   两者是不同的结局，情绪也完全不同：一个是「被打断」，一个是「走完了」。
   reason 由调用方给出，因为「扣成负数」既可能来自行动，也可能来自战斗。 */
function checkDeath(reason){
  if (s.life > 0) return null;
  const up = meta.up||{};
  if (up.guard && !s.guardUsed){
    s.guardUsed = true;
    s.life = G.CONFIG.deathGuardHeal;
    log('你倒下去了。有什么东西托了你一把。');
    return { saved:true };
  }
  return endRun(reason === 'slay' ? 'slay' : 'life');
}

/* ---------------- 突破 ---------------- */
function breakNeed(){
  const a = agg();
  const up = meta.up||{};
  const raw = G.REALMS[s.realmIdx].need;
  return Math.round(raw * (1 - a.breakReduce - (up.breakCut||0)*0.07));
}

/* 是否可以突破到下一层。
   ⚠️ 第 21 轮：境界上限由 G.realmCapIndex() 决定（默认锁在元婴），
   不是 G.REALMS.length。完整表仍然保留（敌人曲线要用），
   但玩家这一世走不到那么远。 */
function canBreak(){
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return false;
  if (s.realmIdx >= G.REALMS.length-1) return false;
  return s.cult >= breakNeed();
}

/* 炼气圆满 + 修为已足 → 可以挑战「渡雷池」进入筑基
   ⚠️ 用 major 判断大境界，不要用 tier（tier 是敌人难度阶梯的键） */
function canAscend(){
  const cur = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return false;
  return !!cur && !!next && cur.major === 1 && next.major === 2
      && s.cult >= breakNeed()
      && !s.flags.includes('boss_zhuji_done');
}

/* 是否已经无路可走（已到本世上限） */
function isAtEnd(){
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return true;
  return s.realmIdx >= G.REALMS.length-1;
}

/* 到了上限、且修为已经攒够 → 该收束这一世了。
   上限那一层走到修为满，就走「此世圆满」的结局，
   而不是让玩家继续点到寿元耗尽。 */
function canCapstone(){
  if (!(G.isRealmCapped && G.isRealmCapped(s.realmIdx))) return false;
  if (s.realmIdx >= G.REALMS.length-1) return false;   // 完整表的最后一档另说
  return s.cult >= breakNeed();
}

function doBreak(){
  const next = G.REALMS[s.realmIdx+1];

  // 到了本世上限：修为已足 → 交回界面走收束结局
  if (canCapstone()){
    return { realm: G.REALMS[s.realmIdx].name, capstone: true,
             capName: G.realmCapName ? G.realmCapName() : '' };
  }

  // 炼气圆满 → 筑基：不是普通「突破」，是「渡雷池」，交给 Boss 处理
  if (next && next.major === 2 && !s.flags.includes('boss_zhuji_done')){
    if (!canAscend()) return null;
    return { realm: next.name, needBoss:'boss_zhuji' };
  }

  if (!canBreak()) return null;
  const cur = G.REALMS[s.realmIdx];

  s.cult -= breakNeed();
  s.realmIdx++;
  // 境界成长：属性点（境界越高加成越大）
  const extraAttr = ((meta.up && meta.up.attrGain) || 0);
  s.attrGain = Math.min(G.REALM_ATTR_GAIN.length, (s.attrGain||0) + 1 + extraAttr);
  // 恢复类行动的次数上限随境界重置
  s.restUsed = 0;
  s.nourishUsed = 0;

  // 寿元上限提升 + 奖励寿元
  const reward = cur.reward || 40;
  const oldMax = s.maxLife;
  s.maxLife = Math.round(next.maxLife * (G.CONSTITUTIONS.find(c=>c.id===s.constId).lifeMul));
  const diff = s.maxLife - oldMax;
  s.life += Math.max(0, diff) + reward;

  log(`你突破到了 ${next.name}。寿元上限 ${s.maxLife}。`);

  // 天劫判定（见 G.CONFIG.tribulation）：
  // 金丹以前不降天劫——炼气、筑基都是打基础，不该被雷劈。
  // 只有「逆天」的修士才会在低境界引来天劫。
  const judge = shouldTribulate();
  if (judge.yes){
    return { realm: next.name, tribulation: true, reward: reward,
             maxLife: s.maxLife, tribReason: judge.reason };
  }
  return { realm: next.name, tribulation: false, reward: reward, maxLife: s.maxLife };
}

/* ---------------- 天劫门槛判定 ----------------
   返回 { yes:bool, reason:string, extreme:bool }
   规则：
     ① 境界达到门槛（金丹以上）→ 正常降劫
     ② 低境界但「逆天」→ 才可能降劫（业障滔天 / 属性碾压同阶 / 修了禁忌功法）
     ③ 其余情况一律不降——让玩家安心打基础                        */
function shouldTribulate(){
  const T = G.CONFIG.tribulation;

  // ① 大境界门槛
  if (s.realmIdx >= T.fromRealmIdx){
    return { yes:true, reason:'normal', extreme:false };
  }

  // ② 属性碾压同阶？先算「理论上限」再比比例
  const A = attrs();
  const sum = G.ATTRS.reduce((n,a)=>n + (A[a.id]||0), 0);
  const maxPossible = maxAttrPossible();
  const ratio = maxPossible > 0 ? sum / maxPossible : 0;
  if (ratio >= T.extremeAttrRatio){
    const yes = s.rng() < T.extremeChance;
    return { yes:yes, reason:'attr', extreme:true };
  }

  // ③ 业障滔天？
  if (s.karma >= T.extremeKarma){
    const yes = s.rng() < T.extremeChance;
    return { yes:yes, reason:'karma', extreme:true };
  }

  // ④ 修了禁忌功法？（吞天魔功 / 化功大法 这类）
  const taboo = s.deck.some(n=>{
    const c = G.CARDS[n];
    return c && c.eff && (c.eff.karmaPer||0) >= 5;
  });
  if (taboo && s.karma >= 10){
    const yes = s.rng() < 0.35;
    return { yes:yes, reason:'taboo', extreme:true };
  }

  return { yes:false, reason:'below', extreme:false };
}

/* 属性「理论上限」：抽签可能拿到的最高初始属性 + 全部境界成长 */
let _maxAttrCache = null;
function maxAttrPossible(){
  if (_maxAttrCache !== null) return _maxAttrCache;
  // 每支签里各项属性的最大值之和
  const best = {};
  G.ATTRS.forEach(a=>{ best[a.id] = 0; });
  G.LOTS.forEach(lot=>{
    if (!lot.table) return;
    const per = {};
    G.ATTRS.forEach(a=>{ per[a.id] = 0; });
    lot.table.forEach(t=>{
      if (!t.attrs) return;
      G.ATTRS.forEach(a=>{ per[a.id] = Math.max(per[a.id], t.attrs[a.id]||0); });
    });
    G.ATTRS.forEach(a=>{ best[a.id] += per[a.id]; });
  });
  // 加上全部境界成长
  G.REALM_ATTR_GAIN.forEach(g=>{
    G.ATTRS.forEach(a=>{ best[a.id] += (g[a.id]||0); });
  });
  _maxAttrCache = G.ATTRS.reduce((n,a)=>n + best[a.id], 0);
  return _maxAttrCache;
}

/* ---------------- 抽卡 ---------------- */
function addCard(name, silent){
  if (!G.CARDS[name]) return false;
  if (!s.refine) s.refine = {};
  const c = G.CARDS[name];

  /* ---- 精炼制（第 18 轮）：重复卡不再浪费 ----
     已经有这张卡 → 精炼 +1（上限 3）；满 3 则自动升一品。 */
  if (s.deck.indexOf(name) >= 0){
    const cur = s.refine[name] || 0;
    if (cur < G.REFINE.max){
      s.refine[name] = cur + 1;
      if (!silent) log(`【${name}】精炼至 +${cur+1}。`);
      return { refined:true, name:name, level:cur+1 };
    }
    // 已满精炼 → 升品
    const order = G.REFINE.rarityOrder;
    const idx = order.indexOf(c.rarity);
    if (idx >= 0 && idx < order.length-1){
      c.rarity = order[idx+1];
      s.refine[name] = 0;
      if (!silent) log(`【${name}】品阶提升为「${c.rarity}」！`);
      return { upgraded:true, name:name, rarity:c.rarity };
    }
    // 已至道品：转成修为
    gainCult(G.cultBase(s.realmIdx) * 2);
    if (!silent) log(`【${name}】已至道品，化作修为。`);
    return { converted:true, name:name };
  }

  s.deck.push(name);
  if (c.eff){
    if (c.eff.lifeMax) raiseMaxLife(c.eff.lifeMax);
    if (c.eff.attr){
      addAttrBonus(c.eff.attr);
    }
  }
  if (c.flags) c.flags.forEach(function(f){ if (s.flags.indexOf(f)<0) s.flags.push(f); });
  if (c.eff && c.eff.flag && s.flags.indexOf(c.eff.flag)<0) s.flags.push(c.eff.flag);
  if (!silent) log('你得到了【' + name + '】。');
  return { added:true, name:name };
}

function removeCard(name){
  const i = s.deck.indexOf(name);
  if (i<0) return false;
  s.deck.splice(i,1);
  return true;
}

function randCardName(opts){
  const o = opts||{};
  const a = agg();
  const weights = Object.assign({}, G.CONFIG.rarityWeight);
  // 机缘加成提高高稀有度权重
  const bonus = (a.findBonus||0) + (o.bonus||0);
  weights['玄'] += bonus*4;
  weights['道'] += bonus*1.5;
  weights['良'] += bonus*2;

  const myMajor = (G.REALMS[s.realmIdx] || {major:1}).major;
  const pool = Object.keys(G.CARDS).filter(k=>{
    const c = G.CARDS[k];
    if (c.hidden && s.flags.indexOf('page') < 0) return false;
    if (o.type && c.type!==o.type) return false;
    /* 第 18 轮：高境界才能抽到高境界的卡 */
    if (c.minMajor && c.minMajor > myMajor) return false;
    return true;
  });
  if (!pool.length) return null;
  const total = pool.reduce((sum,k)=>sum + (weights[G.CARDS[k].rarity]||1), 0);
  let r = s.rng()*total;
  for (const k of pool){
    r -= (weights[G.CARDS[k].rarity]||1);
    if (r<=0) return k;
  }
  return pool[pool.length-1];
}

/* ---------------- 抽卡 ----------------
   一次给 3 张候选，由玩家自己选——这是「构筑」的手感来源。
   返回候选数组（不直接入牌组）。                                    */
function offerCards(n, opts){
  const picked = [];
  let guard = 0;
  while (picked.length < n && guard++ < 60){
    const name = randCardName(opts);
    if (!name) break;
    if (!picked.includes(name)) picked.push(name);
  }
  return picked;
}

function rollCardChance(kind){
  const a = agg();
  const up = meta.up || {};
  const luck = (up.cardRate||0) * 0.03;
  if (kind==='explore') return Math.min(0.95, 0.72 + a.findBonus*0.04 + luck);
  if (kind==='cultivate') return Math.min(0.8, 0.26 + a.findBonus*0.03 + luck);
  if (kind==='sectwork') return Math.min(0.8, 0.20 + a.findBonus*0.03 + luck);
  return 0;
}

/* 机缘抽卡时叠加「眼力」升级带来的品质加成 */
function cardBonus(){
  return ((meta.up && meta.up.cardLuck) || 0);
}

/* ---------------- 探索 ---------------- */
function explore(){
  const a = agg();
  const up = meta.up||{};
  const mul = 1 + (up.findGain||0)*0.1;

  const stoneGain = Math.round((6 + s.realmIdx*3 + s.rng()*8) * mul);
  const cultGain  = Math.round((G.cultBase(s.realmIdx)*0.5 + s.rng()*5) * mul);

  gainStone(stoneGain);
  gainCult(cultGain);

  const res = { stone: stoneGain, cult: cultGain, cards: null, hurt: 0 };

  // 机缘事件：受伤
  if (s.rng() < 0.22 - Math.min(0.12, a.evade*0.2)){
    const hurt = Math.round(6 + s.rng()*12 + s.realmIdx*2);
    s.life -= hurt;
    res.hurt = hurt;
  }

  // 得卡：改为「三选一」，交给界面
  if (s.rng() < 0.72 + a.findBonus*0.04){
    res.cards = offerCards(3, { bonus: cardBonus() });
  }
  return res;
}

/* ---------------- 事件收益缩放（第 18 轮） ----------------
   问题：事件奖励原本写死（+20 修为、+10 灵石），到筑基期一次修行就有
   几十修为，事件奖励变成噪音，玩家自然不想选。
   修法：事件只写「基准值」，实际收益 = 基准 × 当前大境界系数。
   这样同一个事件在任何境界都有意义。                            */
/* 事件收益的大境界缩放。
   基准是「炼气期一个 base=20 的中档事件」——在那个尺度上它约等于
   一层的七八成修为，玩家会觉得「遇到好事就往前跳一截」。

   第 19 轮把 a.gain 修好之后（此前 250 处选项根本没给修为），
   这组数字要重算。它按每个大境界 ×4.4 增长，
   而「一层需要的修为」是按 ×4.6 增长的（need = 寿元/4，寿元每境 ×4.6），
   所以两边基本同步：一个 base=20 的中档事件，在任何一个大境界
   都恰好值「一层的六到八成」。写事件的人不需要为不同境界调数字。
   （旧表按 ×5 增长，到渡劫时一个事件值一层半，后期直接跳过境界。） */
/* 事件收益的大境界缩放（第 23 轮重新标定）
   ------------------------------------------------------------
   ⚠️ 这里有一个**单位**问题，改的时候必须一起想清楚，否则 166 个事件
   的文案会集体说谎（verify-eventrewards.js 会当场抓住）。

   事件的写法是：`a.cult(5)` 且文案写死「修为 +5」——
   也就是说，**base 数字在设计上就等于炼气期的修为数**。
   所以缩放的锚点必须是：

        scale[炼气] = 1        ← base 5 就给 5，文案成立
        scale[其它] = gain[大境界] ÷ gain[炼气]

   这样：
      · 炼气期：base 数字 = 修为数字，601 处文案全部成立
      · 任何境界：一个 base=20 的中档事件 = 20 × (gain/3) 修为
        ≈ 6.7 次修行（gain=3 时正好 6.7 次）
      · 事件的份量随境界同步放大，不会在后半程替玩家把活干完

   为什么 anchor 用 gain[炼气] 而不是 gain[炼气九层]：
     因为事件分层的 tier=1 覆盖整个炼气期（一层到九层），
     锚在段首能让炼气期所有文案都对得上（gain 在段内只涨 1.5 倍，
     误差在容差内；这也是第 19 轮定下 tier 分层时就成立的近似）。

   这张表 = round(gain[大境界首层] / gain[炼气一层] × 100) / 100。
   改动 gain 或 speed 之后请重跑：
     node dev/verify-eventrewards.js     （601 处文案对账）
     node dev/verify-cultspeed.js        （事件份量是否恒定）
     node dev/dbg-cultspeed.js           （把新表打出来） */
G.EVENT_SCALE = [0.3, 4.1, 55.4, 757.4, 10436.9, 144086.9, 1988311.1, 27439086.2, 378898800];

function evScale(){
  const major = (G.REALMS[s.realmIdx] || {major:1}).major;
  return G.EVENT_SCALE[Math.min(major-1, G.EVENT_SCALE.length-1)] || 1;
}

/* 收益档位：低/中/高，决定缩放后再乘多少 */
G.GAIN_TIER = { low:0.5, mid:1.0, high:2.2 };

function evGain(base, tier){
  const k = G.GAIN_TIER[tier || 'mid'] || 1;
  return Math.max(1, Math.round(base * evScale() * k));
}
/* 寿元类收益不按大境界缩放（寿元本身已随境界涨），改用百分比 */
function evLifePct(pct){
  return Math.max(1, Math.round((s.maxLife || 100) * pct));
}

/* ---------------- 长期因果（第 18 轮） ----------------
   有些选择会在若干次行动后才回来找你。                          */
function addDebt(cfg){
  if (!s.debts) s.debts = [];
  s.debts.push({ id:cfg.id, name:cfg.name, due:(s.actions||0) + (cfg.after||12),
                 kind:cfg.kind || 'good', text:cfg.text, note:cfg.note,
                 eff:cfg.eff || null });
}
function checkDebts(){
  if (!s.debts || !s.debts.length) return null;
  const due = s.debts.filter(function(d){ return (s.actions||0) >= d.due; });
  if (!due.length) return null;
  s.debts = s.debts.filter(function(d){ return (s.actions||0) < d.due; });
  return due;
}

/* ---------------- 事件动作 API（唯一真源） ----------------
   第 19 轮重构：以前界面、宗门剧情、测试脚本各写了一份 a.cult/a.life……，
   三份慢慢长歪了——测试里少一个 gainStone，就把 events5 里那场决斗的崩溃
   藏了整整一轮。现在只留这一份，界面与测试都用它。
   hook.onDeath(reason) 交给界面处理「死给你看」的过场。            */
function makeActions(hook){
  hook = hook || {};
  const api = {
    _pendingChallenge: null,
    _pendingTianjiao: null,      // 事件里碰上天骄（第 22 轮）
    _pendingTourney: null,       // 事件里把请帖塞给玩家
    _ended: false,

    /* 修为。
       · a.gain(base, tier) —— 只算数，不施加。用来在文案里显示「能给多少」：
             return '……修为 +' + a.gain(20,'mid');
       · a.cult(base, tier) —— 真的加修为，并把加了多少返回。
       第 19 轮之前有一批事件把 a.gain 写在语句位置当成 a.cult 用，
       于是文案上写着「修为 +30」、实际上一点修为都没给（共 118 处）。
       现在两者的分工是明确的，dev/verify-eventrewards.js 会逐个事件
       比对「文案说的数」与「实际加的数」，再长歪就会当场报错。 */
    gain(n, tier){ return evGain(n, tier); },
    cult(n, tier){
      const v = evGain(n, tier);
      s.cult = Math.max(0, s.cult + v);
      return v;
    },
    lifePct(pct){ return evLifePct(pct); },

    life(n){
      if (n > 0){ s.life = Math.min(s.maxLife, s.life + n); return; }
      s.life += n;
      if (s.life <= 0 && !s.ended){
        const d = endRun('life');
        if (hook.onDeath) hook.onDeath(d); else api._ended = true;
      }
    },
    stone(n){ s.stone = Math.max(0, s.stone + n); },
    gainStone(n){ s.stone = Math.max(0, s.stone + n); },
    karma(n){ s.karma = Math.max(0, Math.min(30, s.karma + n)); },
    favor(n){ s.favor += n; },
    sectQi(n){ s.sectQi = Math.max(0, Math.min(s.sectQiMax, s.sectQi + n)); },
    contrib(n){ gainContrib(n); },
    sectContrib(n){ gainContrib(n); },   // 宗门剧情沿用的旧名
    addCard(n){ addCard(n); },
    removeCard(n){ removeCard(n); },

    debt(cfg){ addDebt(cfg); },
    chance(p){ return Math.random() < p; },
    clue(id){ addClue(id); },
    flag(f){ if (s.flags.indexOf(f) < 0) s.flags.push(f); },
    /* 第 22 轮：在事件里碰到「天骄榜」上的人。
       事件只需要写 a.tianjiao()，引擎挑一个当前大境界、
       这一局还没遇过的天骄；挑不到就返回 null（事件可以据此换文案）。 */
    tianjiao(){ api._pendingTianjiao = tianjiaoForRealm(); return api._pendingTianjiao; },
    /* 比武大会：事件里也能直接报名（少数特殊剧情用） */
    tourney(){ const b = tourneyBracket(); if (b) api._pendingTourney = b; return b; },
    randomCard(){
      const pool = Object.keys(G.CARDS).filter(k=>!G.CARDS[k].hidden);
      return pool[Math.floor(Math.random()*pool.length)];
    },
    challenge(cfg){ api._pendingChallenge = cfg; }
  };
  return api;
}

/* ---------------- 事件 ----------------
   事件有三层筛选（第 24 轮补上第三层）：

     ① once / when  —— 老规矩
     ② tier         —— 大境界分层：只抽「通用(0)」与「当前大境界」
     ③ **篇章分层**  —— 只抽「通用」与「当前篇章」的事件

   ③ 是第 24 轮补的。玩家反馈：「进入散修篇之后，接触到的事件大多还是
   宗门事件，散修篇的特色几乎没有体现」。实测确实如此 ——
   当时散修篇可抽的池子是 88 个事件，其中散修专属只有 6 个（6.8%），
   剩下 82 个是宗门事件，而且它们有 33% 的选项还在改「宗门气运/贡献」，
   人已经不在宗门了，那些数值却还在动。

   判定规则（向后兼容，不需要给 160 个事件逐个补字段）：
     · 显式写了 e.chapter        -> 按它判
     · 没写，但 cat 是「宗门」    -> 只在宗门篇出
     · 其余没写的                -> 通用，两个篇章都能出
                                                  */
function eventChapter(e){
  if (e.chapter) return e.chapter;
  if (e.cat === '宗门') return 'zongmen';
  return 'any';
}
/* 当前篇章能不能抽到这个事件 */
function chapterAllows(e, chapter){
  const ec = eventChapter(e);
  return ec === 'any' || ec === chapter;
}

function pickEvent(){
  const myMajor = (G.REALMS[s.realmIdx] || {major:1}).major;
  const myChapter = s.chapter || 'zongmen';
  const pool = G.EVENTS.filter(function(e){
    if (e.once && s.seenEvents.indexOf(e.id) >= 0) return false;
    if (e.when && !e.when(s)) return false;
    /* ② 大境界分层：只抽「通用(0)」与「当前大境界」的事件。
       这样筑基期就不会再碰到炼气期的事件。 */
    const et = e.tier || 0;
    if (et !== 0 && et !== myMajor) return false;
    /* ③ 篇章分层：散修篇不再抽到宗门事件 */
    if (!chapterAllows(e, myChapter)) return false;
    return true;
  });
  if (!pool.length) return null;
  const e = pool[Math.floor(s.rng()*pool.length)];
  s.seenEvents.push(e.id);
  return e;
}

/* ---------------- Boss ----------------
   Boss 是特殊的「事件 + 挑战」组合：有前情文本、有多个非战斗选项，
   打赢/打输都有专属结算文本，并可能直接导向结局。                  */

/* 找出当前应该触发的 Boss（每次行动后检查）
   · 已经打完的 Boss 不再触发（靠各自的 _done 标记）
   · 正在进行的挑战期间不触发
   · 同一个 Boss 在同一次遭遇里不会被重复抓取（_bossActive 标记） */
function pickBoss(){
  if (!s || s.ended) return null;
  if (challenge && challenge.active) return null;
  const list = Object.keys(G.BOSSES).map(k=>G.BOSSES[k]);
  for (const b of list){
    let hit = false;
    try { hit = !!b.trigger(s); } catch(e){ hit = false; }
    if (hit){
      // 防止界面在处理过程中重复触发同一个 Boss
      if (s._bossActive === b.id) return null;
      return b;
    }
  }
  return null;
}

/* 界面在真正展示 Boss 之后调用，锁住这个 Boss 直到遭遇结束 */
function markBossActive(id){
  if (s) s._bossActive = id;
}
function clearBossActive(){
  if (s) s._bossActive = null;
}

/* ---------------- 六维属性 ----------------
   属性 = 初始值（抽签） + 境界成长 + 功法/法宝机缘
   它是战斗、修行、转盘的共同地基。                                  */
function attrBase(){
  if (!s) return {};
  const seed = (s.lots && s.lots.bonus && s.lots.bonus.attrs) || {};
  const base = {};
  G.ATTRS.forEach(a=>{ base[a.id] = (seed[a.id]||0); });
  return base;
}

function attrs(){
  if (!s) return {};
  const out = {};
  G.ATTRS.forEach(a=>{ out[a.id] = 0; });

  // ① 抽签初始
  const seed = (s.lots && s.lots.bonus && s.lots.bonus.attrs) || {};
  G.ATTRS.forEach(a=>{ out[a.id] += (seed[a.id]||0); });

  // ② 境界成长（境界越高，加成越大）
  const gained = s.attrGain || 0;
  for (let i=0;i<gained && i<G.REALM_ATTR_GAIN.length;i++){
    const g = G.REALM_ATTR_GAIN[i];
    G.ATTRS.forEach(a=>{ out[a.id] += (g[a.id]||0); });
  }

  // ③ 机缘（事件 / 功法 / 法宝 / 散修技艺）
  const bonus = s.attrBonus || {};
  G.ATTRS.forEach(a=>{ out[a.id] += (bonus[a.id]||0); });

  // ④ 功法与法宝的常驻加成
  if (s.deck){
    s.deck.forEach(name=>{
      const c = G.CARDS[name];
      if (!c || !c.eff) return;
      if (c.eff.attr){
        Object.keys(c.eff.attr).forEach(k=>{ out[k] = (out[k]||0) + c.eff.attr[k]; });
      }
    });
  }

  // ⑤ 宗门气运加持（第 15 轮新增）——气运不只是数字，它直接加持你
  if (s.chapter === 'zongmen'){
    const bless = sectBlessing();
    G.ATTRS.forEach(a=>{ out[a.id] += bless.attr; });
  }

  return out;
}

/* ---------------- 宗门气运加持 ----------------
   玩家反馈「宗门存在感太低」——所以让气运**直接变成属性**：
   气运充盈你更强，气运将尽你还会被拖累。                        */
function sectTier(){
  const qi = (s && s.sectQi) || 0;
  let cur = G.SECT_TIERS[G.SECT_TIERS.length-1];
  for (const t of G.SECT_TIERS){ if (qi >= t.min){ cur = t; break; } }
  return cur;
}
function sectBlessing(){
  const t = sectTier();
  return { tier:t, attr:t.attr, cult:t.cult, salary:t.salary };
}

/* ---------------- 战斗派生数值 ----------------
   调参要点（踩过两次坑，务必读完再改）：
     ① 境界只给温和的线性乘数。最初让「境界 × 属性」都乘算攻击力，
        结果是二次增长，炼气五层就能一回合秒杀。
     ② 玩家伤害在炼气期约长 7.5 倍，所以敌人 HP 必须同步成长，
        否则高境界「一击秒杀」，玩家根本感觉不到战斗。
     ③ 最终目标：**每个境界的战斗都稳定在 8~14 回合**，
        而且玩家越往后越轻松（成长有体感，但不是无脑碾压）。
     ④ ⚠️ 第 20 轮补上：以前这里**只读 attrs() 和 meta.up**，
        完全没读 agg()。于是「卡牌的常驻战力 / 护体」是空头支票——
        牌组界面把它们算进「常驻战力」，战斗里一分钱不算（33 张卡受影响）。
        现在接上了，但**刻意做成乘算加成而不是平加**：
        因为战力是随境界线性涨的，敌人 HP 是随境界指数涨的，
        平加会让战力在后期变成噪音；乘算才能让「吃卡」在任何境界都有体感。 */
function combatStats(){
  const A = attrs();
  const realmMul = 1 + s.realmIdx * 0.16;
  const attrSum = G.ATTRS.reduce((n,a)=>n + (A[a.id]||0), 0);
  const up = meta.up || {};
  const ag = agg();

  /* 卡牌的常驻战力 → 伤害乘数（最高 ×2）。
     为什么是乘算而不是平加：战力随境界线性涨，敌人 HP 随境界指数涨，
     平加会让「吃卡」在后期变成噪音；乘算才能让每一张卡在任何境界都有体感。
     又为什么要封顶：不然堆满卡就是无敌，而「永远差一点点」才是本作的紧张感来源。 */
  const powerMul = 1 + Math.min(1.0, (ag.power || 0) * 0.005);
  /* 套装「剑冢遗风」：招式伤害 +50%。以前收集了却没人用。 */
  const techMul = 1 + (ag.techMul || 0);

  const hpMulSet = 1 + (ag.hpMul || 0);   // 卡牌与套装「不坏之身」的气血加成
  const maxHp = Math.round(((46 + A.tipo*7 + A.gengu*3) * realmMul) * hpMulSet) + (up.hpBase||0)*12;
  const maxQi = Math.round(24 + A.gengu*4 + A.lingli*1.5) + (up.qiBase||0)*8;
  const qiRegen = Math.max(3, Math.round(5 + A.gengu*1.1)) + (up.qiRegen||0);
  // 普通攻击：由属性总和驱动 × 卡牌战力，不限次数的可靠输出
  const basicAtk = Math.max(3, Math.round((4 + attrSum*0.20) * realmMul * powerMul)) + (up.atkBase||0)*2;
  const techPower = Math.round(Math.max(5, Math.round((6 + attrSum*0.30) * realmMul * powerMul)) * techMul) + (up.techBase||0)*2;
  const critChance = Math.min(0.60, 0.03 + A.shenshi*0.010 + (up.crit||0)*0.02 + (ag.critSet||0));
  const evade = Math.min(0.38, A.shenfa*0.010 + (up.evade||0)*0.015);
  /* 常驻护体：卡牌的 ward 第一次真的有用。
     转换成百分比减伤（上限 35%），而不是直接减去伤害点——
     因为敌人攻击是随境界指数涨的，平减会在后期变成零。 */
  const wardGuard = Math.min(0.35, (ag.ward || 0) * 0.0009);
  /* 基础护体（招式护体的基数）。套装「符阵相生」每轮额外给一层。 */
  const ward = Math.round(realmMul * 3) + (up.wardBase||0)*3 + (ag.wardPerRound || 0);
  /* 受到的伤害乘数：套装「不坏之身」的 −20% 走这里 */
  const dmgTakenMul = clamp((ag.dmgTakenSet || 0) ? 1 + ag.dmgTakenSet : 1, 0.4, 1.5);

  return { attrs:A, attrSum, maxHp, maxQi, qiRegen, basicAtk, techPower,
           critChance, evade, ward, realmMul, powerMul, techMul, wardGuard, dmgTakenMul,
           cardPower: ag.power || 0, cardWard: ag.ward || 0 };
}
/* ---------------- 大境界跨越（第 17 轮） ----------------
   以前「筑基」是结局；现在它只是九个大境界里的第二个。
   所以渡雷池改成「开闸」：赢了就真的进入筑基，游戏继续。        */
function advanceMajor(){
  const cur = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];
  if (!next || next.major !== cur.major + 1) return null;

  const oldMajor = cur.major;
  s.cult = Math.max(0, s.cult - breakNeed());
  s.realmIdx++;
  s.attrGain = Math.min(G.REALM_ATTR_GAIN.length, (s.attrGain||0) + 1 + ((meta.up&&meta.up.attrGain)||0));
  s.restUsed = 0;
  s.nourishUsed = 0;

  const oldMax = s.maxLife;
  const consti = G.CONSTITUTIONS.find(function(c){ return c.id===s.constId; });
  s.maxLife = Math.round(next.maxLife * consti.lifeMul);
  s.life += Math.max(0, s.maxLife - oldMax) + Math.round(next.maxLife * 0.08);

  log('你跨过了一个大境界：' + next.name + '。寿元上限 ' + s.maxLife + '。');

  const md = G.MAJOR_DEFS[next.major-1];
  return { from: oldMajor, to: next.major, realm: next.name,
           majorName: md ? md.name : '?', desc: next.desc, maxLife: s.maxLife };
}

/* ---------------- 挑战（战斗 / 天劫共用） ----------------
   新模型：双方都有 HP，轮流行动，谁先见底谁输。
   · 普通攻击：不限次、不耗真气
   · 招式：耗真气 + 冷却，但威力大得多
   · 敌人每轮都会反击
   · 失败不再直接死，而是进入「转盘」决定后果

   ⚠️ 第 22 轮：挑战必须能被**存档**。
   以前 cfg 里塞的是 win/lose 两个**函数**，JSON 序列化不了，
   于是 saveRun() 只能把整场战斗丢掉 ——
   玩家打到一半关掉页面，重开后战斗凭空消失（审计脚本第 3 项）。
   现在额外支持一套**数据化战果** `outcome`：

     outcome: { win:{cult:90, stone:70, flag:'x'}, lose:{life:-30} }

   纯数据 → 可以原样写进存档 → 读回来还能结算。
   原来的函数形式仍然支持（向后兼容），但新写的内容一律用 outcome。 */

/* 把一份数据化战果施加到局内状态上。字段与事件的 actions API 一一对应。 */
function applyOutcome(o){
  if (!o) return;
  if (typeof o === 'function'){ try{ o(); }catch(e){} return; }
  if (typeof o !== 'object') return;
  const pct = (v) => Math.round((s.maxLife || 100) * v);
  if (o.cult != null)  gainCult(evGain(o.cult, o.tier));
  if (o.stone != null) gainStone(o.stone);
  if (o.karma != null) gainKarma(o.karma);
  if (o.favor != null) gainFavor(o.favor);
  if (o.sectQi != null) gainSectQi(o.sectQi);
  /* life 正数 = 固定值，0~1 之间的小数 = 寿元上限的百分比（与事件一致） */
  if (o.life != null) gainLife(o.life > 0 ? o.life : -pct(-o.life));
  if (o.lifePct != null) gainLife(o.lifePct > 0 ? pct(o.lifePct) : -pct(-o.lifePct));
  if (o.contrib != null) gainContrib(o.contrib);
  if (o.clue) [].concat(o.clue).forEach(c=>addClue(c));
  if (o.flag) [].concat(o.flag).forEach(f=>{ if (s.flags.indexOf(f) < 0) s.flags.push(f); });
  if (o.card) [].concat(o.card).forEach(c=>addCard(c));
}

/* 挑战里的 cfg 只保留「能存进 JSON」的部分。
   函数（win/lose）与大的 stats 对象剔除掉 —— stats 在读档时会重算。 */
function serializableChallenge(){
  if (!challenge || !challenge.active) return null;
  const c = Object.assign({}, challenge, { cfg: null, stats: null });
  const cfg = {};
  Object.keys(challenge.cfg || {}).forEach(function(k){
    const v = challenge.cfg[k];
    if (typeof v === 'function') return;             // 回调不能存
    try{ JSON.stringify(v); cfg[k] = v; }catch(e){}
  });
  c.cfg = cfg;
  return c;
}
function startChallenge(cfg){
  const cs = combatStats();
  const tierKey = cfg.tier || 'normal';
  const tier = G.ENEMY_TIERS[tierKey] || G.ENEMY_TIERS.normal;
  const T = G.TUNE;

  /* 难度阶梯 × 手动微调（兼容旧的 power 参数，当作 ±% 微调） */
  const manual = (cfg.power || 0) / 100;
  const scale = tier.mul * (1 + manual);

  /* 敌人强度 = 一条曲线（G.foePowerAt）× 难度阶梯 × 手动微调
     ⚠️ 第 21 轮重做。旧公式是
          foeBase(×2.4/大境界) × (1 + 境界序数 × 0.72)
        那个 0.72 的线性项其实承担了绝大部分成长（到大乘时贡献 ×52），
        而它是在属性表还只有 41 个值时调的；属性表扩到 72 个值之后，
        同一个大境界内玩家涨 6 倍、敌人只涨 1.3 倍 → 中期开始一路横扫。
     现在敌人只跟着**一条**曲线走：G.foePowerAt()，它由玩家自己的
     伤害公式镜像而来（见 realms.js 的说明），两边永远不会脱节。   */
  const power = (typeof G.foePowerAt === 'function') ? G.foePowerAt(s.realmIdx) : 1;
  const hpCurve  = 1 + (power - 1) * (T.curveHp  != null ? T.curveHp  : 1.0);
  const atkCurve = 1 + (power - 1) * (T.curveAtk != null ? T.curveAtk : 1.0);

  /* 天骄：在同境界「凶物」的基础上再乘一层倍率（第 22 轮）。
     玩家要求「除非数值远超同境界，否则不可能战胜」——
     所以这不是强一点，是量级上的差距（气血 ×3.2 / 攻击 ×2.0）。 */
  const TJ = (cfg.tianjiao && G.TIANJIAO_MUL) ? G.TIANJIAO_MUL : { hp:1, atk:1 };

  const foeHpMax = Math.round(G.foeHpBase * hpCurve * scale * TJ.hp);
  const foeAtk = Math.round(G.foeAtkBase * atkCurve * scale * 0.9 * TJ.atk);

  challenge = {
    active: true,
    cfg: cfg,
    type: cfg.type || 'fight',
    killer: !!cfg.killer,
    bossId: cfg.bossId || null,
    tier: tierKey,

    round: 1,
    maxRounds: cfg.rounds || 40,

    // 敌方
    foeName: cfg.name || '对手',
    foeHp: foeHpMax,
    foeHpMax: foeHpMax,
    foeAtk: foeAtk,
    foeMajor: cfg.major || null,        // 敌人的大境界（不填则按 tier 推断）
    foeTierLabel: tier.label,

    // 我方（战斗内临时状态，战斗结束即丢弃）
    hp: cs.maxHp,
    hpMax: cs.maxHp,
    qi: cs.maxQi,
    qiMax: cs.maxQi,
    qiRegen: cs.qiRegen,
    stats: null,            // 读档时重算；新建时在下面填

    cooldowns: {},          // { 招式名: 剩余回合 }
    buffs: { evade:0, dmgMul:1, ward:0 },

    over: false,
    result: null,
    logLines: [],

    /* 本场战斗属于哪个「赛事 / 榜单」场景（第 22 轮）。
       tourney: { bracket, round, total }  —— 比武大会第几轮
       tianjiao: 'id'                      —— 天骄榜上是谁
       这两个都要能存档，所以是纯数据。 */
    tourney: cfg.tourney || null,
    tianjiaoId: cfg.tianjiaoId || null,
    isTianjiao: !!cfg.tianjiao,
    /* 数据化战果（可存档） */
    outcome: cfg.outcome || null
  };
  challenge.stats = cs;
  return challenge;
}

/* ---------------- 敌人境界显示 ----------------
   把敌人的强度换算成「境界」，超过玩家太多就显示「境界未知」。
   这样玩家能一眼看出：这场我该不该打。                          */
function foeRealmInfo(){
  const ch = challenge;
  if (!ch) return { label:'?', known:false, compare:'' };
  const myIdx = s.realmIdx;
  const t = G.ENEMY_TIERS[ch.tier] || G.ENEMY_TIERS.normal;

  // 用 tier 折算「相当于玩家第几层」
  const tierOffset = { weak:-2, normal:0, elite:2, boss:4, terror:6 }[ch.tier] || 0;
  let foeIdx = myIdx + tierOffset + (ch.cfg.realmOffset || 0);
  if (foeIdx < 0) foeIdx = 0;

  const gap = foeIdx - myIdx;
  // 超出玩家 5 层以上 → 境界未知
  const known = gap <= 5;

  let label;
  if (!known){
    label = '境界未知';
  } else {
    label = G.REALMS[Math.min(foeIdx, G.REALMS.length-1)].name;
  }

  let compare = '';
  if (known){
    if (gap <= -2) compare = '远不如你';
    else if (gap <= 0) compare = '与你相当';
    else if (gap <= 2) compare = '略强于你';
    else compare = '强你不少';
  } else {
    compare = '深不可测';
  }
  return { label:label, known:known, compare:compare, gap:gap, tierLabel:t.label };
}

/* ---------------- 战斗胜利奖励 ----------------
   打赢必须有回报——否则「打斗」就只是风险，不是选择。
   奖励随敌人强度与你当前境界缩放。                              */
function grantCombatRewards(){
  const ch = challenge;
  if (!ch) return null;
  const t = G.ENEMY_TIERS[ch.tier] || G.ENEMY_TIERS.normal;
  const scale = G.foeBase(s.realmIdx) * t.mul;

  const stone = Math.round((14 + s.realmIdx*5) * scale);
  const cult  = Math.round((10 + G.cultBase(s.realmIdx)*0.35) * scale);
  gainStone(stone);
  gainCult(cult);

  const out = { stone:stone, cult:cult, card:null, extra:'' };

  // 强敌有额外掉落
  if (ch.tier === 'boss' || ch.tier === 'terror'){
    if (s.rng() < 0.55){
      const name = randCardName({ bonus:2 });
      if (name){ addCard(name); out.card = name; }
    }
    const fav = 1 + Math.floor(s.rng()*2);
    gainFavor(fav);
    out.extra = `人情 +${fav}`;
  } else if (ch.tier === 'elite'){
    if (s.rng() < 0.25){
      const name = randCardName({ bonus:1 });
      if (name){ addCard(name); out.card = name; }
    }
  }

  // 打赢天劫：额外的修为与寿元
  if (ch.type === 'tribulation'){
    gainCult(Math.round(G.cultBase(s.realmIdx)*0.8));
    gainLife(Math.round(s.maxLife*0.06));
    out.extra = (out.extra?out.extra+'　':'') + '渡过一劫，心境更稳';
  }

  log(`你胜了 ${ch.foeName}。灵石 +${stone}，修为 +${cult}。`);
  return out;
}

/* 计算一次攻击的伤害 */
function calcDamage(base, mul, opts){
  opts = opts || {};
  const ch = challenge;
  const cs = ch.stats;
  let dmg = base * (mul||1);
  let crit = false;
  if (!opts.noCrit && s.rng() < cs.critChance){ crit = true; dmg *= 1.8; }
  dmg *= 0.9 + s.rng()*0.2;               // ±10% 浮动
  if (ch.buffs.dmgMul) dmg *= ch.buffs.dmgMul;
  return { dmg: Math.max(1, Math.round(dmg)), crit: crit };
}

/* ---- 玩家行动：普通攻击（不限次、不耗真气） ---- */
function basicAttack(){
  const ch = challenge;
  if (!ch || ch.over) return { ok:false, msg:'战斗已结束' };
  const r = calcDamage(ch.stats.basicAtk, 1);
  ch.foeHp -= r.dmg;
  pushLog(`你挥出一击，造成 ${r.dmg} 点伤害${r.crit?'（重击！）':''}`);
  const after = advanceRound();
  return { ok:true, dmg:r.dmg, crit:r.crit,
           over:!!(after && after.over), result:after ? after.result : null };
}

/* ---- 招式的「材料成本」（灵石 / 阳寿） ----
   ⚠️ 第 20 轮接上：卡面上一直写着 cost:{stone:40, life:5}，
   但引擎从来没有读过它 —— 又一个「界面承诺了、引擎不认」的空头支票。
   现在招式除了真气，还要付这笔材料。
   life 写的是**寿元上限的百分比**（跟事件一致），因为高境界寿元是百万级，
   写死数字会在后期变成噪音。                                          */
function techCostOf(name){
  const t = G.TECHNIQUES[name];
  return (t && t.cost) || null;
}
/* 这种材料付不付得起？（返回 null 表示付得起，否则返回缺什么的说明） */
function techCostBlock(name){
  const c = techCostOf(name);
  if (!c) return null;
  if (c.stone && s.stone < c.stone) return `灵石不足（需 ${c.stone}，有 ${s.stone}）`;
  if (c.life){
    const need = evLifePct(c.life);
    if (need >= s.life) return `阳寿不足（这一招要 ${need}，你只剩 ${Math.round(s.life)}）`;
  }
  return null;
}
/* 真的扣掉（调用前必须已经过 techCostBlock） */
function payTechCost(name){
  const c = techCostOf(name);
  if (!c) return '';
  const paid = [];
  if (c.stone){ gainStone(-c.stone); paid.push(`灵石 −${c.stone}`); }
  if (c.life){
    const need = evLifePct(c.life);
    s.life -= need;
    paid.push(`寿元 −${need}`);
    const d = checkDeath('slay');
    if (d && !d.saved) return paid.join('　') + '　（你把自己烧完了）';
  }
  return paid.join('　');
}

/* ---- 处理一件「招式附带的效果」（护体 / 治疗 / 业障 / 闪避） ----
   ⚠️ 第 20 轮抽出：以前只有 kind 对应的那一种效果会生效，
   于是『万符归阵』（伤害 + 护体）这种复合招式，护体那一半会被静默丢弃。 */
function applyTechEffect(name, t){
  const ch = challenge;
  const msgs = [];
  if (t.ward){
    const v = Math.round(ch.stats.ward * t.ward);
    ch.buffs.ward += v;
    msgs.push(`护体 +${v}`);
  }
  if (t.heal){
    const before = ch.hp;
    ch.hp = Math.min(ch.hpMax, ch.hp + Math.round(ch.stats.techPower * t.heal));
    msgs.push(`回复 ${ch.hp - before} 点气血`);
  }
  if (t.karma){ gainKarma(t.karma); msgs.push(`业障 ${t.karma > 0 ? '+' : ''}${t.karma}`); }
  if (t.evade){
    ch.buffs.evade = Math.min(0.6, ch.buffs.evade + t.evade);
    msgs.push('身形隐没，闪避提升');
  }
  return msgs;
}

/* ---- 玩家行动：使用招式 ---- */
function useTechnique(name){
  const ch = challenge;
  if (!ch || ch.over) return { ok:false };
  const t = G.TECHNIQUES[name];
  const c = G.CARDS[name];
  if (!t || !c) return { ok:false, msg:'没有这门招式' };
  if ((ch.cooldowns[name]||0) > 0) return { ok:false, msg:`${name} 还在冷却（剩 ${ch.cooldowns[name]} 回合）` };
  if (ch.qi < t.qi) return { ok:false, msg:`真气不足（需要 ${t.qi}，现有 ${ch.qi}）` };
  const blocked = techCostBlock(name);
  if (blocked) return { ok:false, msg:blocked };

  ch.qi -= t.qi;
  ch.cooldowns[name] = t.cd + 1;   // +1 因为本回合末会统一减 1
  const costTxt = payTechCost(name);

  /* 第 20 轮的招式威力 = 属性驱动的基础 × 招式倍率 × 卡牌常驻战力加成 */
  const dmgBase = ch.stats.techPower * (ch.stats.powerMul || 1);
  let msg = '';
  if (t.kind === 'dmg'){
    const r = calcDamage(dmgBase, t.mul);
    ch.foeHp -= r.dmg;
    msg = `【${name}】造成 ${r.dmg} 点伤害${r.crit?'（重击！）':''}`;
  } else if (t.kind === 'heal'){
    msg = `【${name}】`;
  } else if (t.kind === 'ward'){
    msg = `【${name}】`;
  } else if (t.kind === 'buff'){
    msg = `【${name}】`;
  } else if (t.kind === 'karma'){
    msg = `【${name}】心念一净`;
  } else {
    const r = calcDamage(dmgBase, 1);
    ch.foeHp -= r.dmg;
    msg = `【${name}】造成 ${r.dmg} 点伤害`;
  }
  /* 招式自带的附加效果（护体 / 回血 / 减业障 / 闪避） */
  const extras = applyTechEffect(name, t);
  if (extras.length) msg += '　' + extras.join('　');
  if (costTxt) msg += `　(${costTxt})`;
  pushLog(msg);
  const after = advanceRound();
  return { ok:true, msg:msg, over:!!(after && after.over), result:after ? after.result : null };
}

/* ---- 使用丹药 ----
   ⚠️ 第 24 轮：丹药以前**只能在战斗里吃**（`if (!ch || ch.over) return`），
   于是玩家攒了一堆回血丹、破障丹，打完架就只能看着。
   玩家反馈：「丹药什么的物品，仅能在战斗中使用，在战斗外无法使用」。

   现在战斗内外都能用：
     · 战斗内：u.life 补的是**战斗气血**（ch.hp）
     · 战斗外：u.life 补的是**寿元**（s.life）—— 这才是它在局外的对应物
   其余效果（修为 / 寿元上限 / 业障）两边完全一致。

   第 20 轮还接过套装「丹火不熄」的「丹药效果翻倍」。 */
function usePill(name){
  const c = G.CARDS[name];
  if (!c || c.type !== '丹药') return { ok:false, msg:'这不是丹药' };
  if (!s || s.ended) return { ok:false, msg:'这一局已经结束了' };
  const idx = s.deck.indexOf(name);
  if (idx < 0) return { ok:false, msg:`你身上没有【${name}】` };

  const ch = (challenge && !challenge.over) ? challenge : null;
  s.deck.splice(idx, 1);

  const pillMul = 1 + (agg().pillSetMul || 0);
  const u = c.use || {};
  const parts = [];

  if (u.life){
    const v = Math.round(u.life * pillMul);
    if (ch){
      const b = ch.hp;
      ch.hp = Math.min(ch.hpMax, ch.hp + v);
      parts.push(`气血 +${ch.hp - b}`);
    } else {
      const b = s.life;
      gainLife(v);
      parts.push(`寿元 +${s.life - b}`);
    }
  }
  if (u.cult){ const v = Math.round(u.cult * pillMul); gainCult(v); parts.push(`修为 +${v}`); }
  if (u.lifeMax){
    const v = Math.round(u.lifeMax * pillMul);
    raiseMaxLife(v);                       // raiseMaxLife 会同时补上当前值
    if (ch){ ch.hpMax += v; ch.hp += v; }
    parts.push(`寿元上限 +${v}`);
  }
  if (u.karma){ gainKarma(u.karma); parts.push(`业障 ${u.karma > 0 ? '+' : ''}${u.karma}`); }
  if (pillMul > 1) parts.push(`丹火不熄 ×${pillMul.toFixed(1)}`);

  const msg = `服下【${name}】` + (parts.length ? '：' + parts.join('　') : '');
  if (ch) pushLog(msg);
  else log(msg);
  saveRun();                               // 吃药也落盘（第 22 轮的规矩）
  // 战斗内吃完要过一回合；战斗外没有回合这回事
  return ch ? advanceRound() : { ok:true, msg, outOfBattle:true };
}

/* 身上还有哪些丹药（给「储物袋」面板用）。
   数据全部来自牌组 —— 丹药是「一张牌 = 一枚」，用完就没了。 */
function inventory(){
  if (!s || !s.deck) return [];
  const count = {};
  s.deck.forEach(n=>{ count[n] = (count[n]||0) + 1; });
  const out = [];
  Object.keys(count).forEach(n=>{
    const c = G.CARDS[n];
    if (!c || c.type !== '丹药') return;
    const u = c.use || {};
    out.push({
      name: n, card: c, count: count[n],
      effect: {
        life: u.life || 0, cult: u.cult || 0,
        lifeMax: u.lifeMax || 0, karma: u.karma || 0
      },
      desc: c.desc || '',
      rarity: c.rarity
    });
  });
  /* 稀有度高的排前面，同档按名字稳定排序 */
  const order = { '道':0, '玄':1, '良':2, '凡':3 };
  out.sort((a,b)=> (order[a.rarity] - order[b.rarity]) || a.name.localeCompare(b.name));
  return out;
}
/* 丹药总数（给底栏角标用） */
function pillCount(){
  if (!s || !s.deck) return 0;
  return s.deck.filter(n=>{ const c=G.CARDS[n]; return c && c.type==='丹药'; }).length;
}

function pushLog(t){
  if (!challenge) return;
  challenge.logLines.push(t);
  if (challenge.logLines.length > 6) challenge.logLines.shift();
}

/* ---- 推进一个回合：敌人行动 → 冷却递减 → 判定 ---- */
function advanceRound(){
  const ch = challenge;
  if (!ch || ch.over) return ch;

  // 敌人反击
  if (ch.foeHp > 0){
    const totalEvade = Math.min(0.65, ch.stats.evade + ch.buffs.evade);
    if (s.rng() < totalEvade){
      pushLog(`${ch.foeName} 扑了个空`);
    } else {
      let dmg = ch.foeAtk * (0.9 + s.rng()*0.2);
      /* ① 常驻护体（卡牌 ward）：按百分比减免，上限 35% */
      dmg *= (1 - (ch.stats.wardGuard || 0));
      /* ② 临时的护体 buff（护身罡气 / 铁布衫 这类招式）：按点数吸收 */
      dmg = Math.max(1, Math.round(dmg - ch.buffs.ward));
      /* ③ 套装「不坏之身」的受伤减免 */
      dmg = Math.max(1, Math.round(dmg * (ch.stats.dmgTakenMul || 1)));
      ch.hp -= dmg;
      pushLog(`${ch.foeName} 还手，你受到 ${dmg} 点伤害`);
    }
  }

  // 冷却与回复
  Object.keys(ch.cooldowns).forEach(k=>{
    if (ch.cooldowns[k] > 0) ch.cooldowns[k]--;
  });
  ch.qi = Math.min(ch.qiMax, ch.qi + ch.qiRegen);
  /* 护体自然消退。套装「符阵相生」让它不再衰减。 */
  ch.buffs.ward = setBonus().wardHold ? ch.buffs.ward : Math.round(ch.buffs.ward * 0.7);
  if (ch.buffs.evade > 0) ch.buffs.evade = Math.max(0, ch.buffs.evade - 0.1);

  ch.round++;
  checkCombatEnd();
  return ch;
}

function checkCombatEnd(){
  const ch = challenge;
  if (!ch || ch.over) return ch;
  if (ch.foeHp <= 0){ ch.foeHp = 0; ch.over = true; ch.result = 'win'; return ch; }
  if (ch.hp <= 0){ ch.hp = 0; ch.over = true; ch.result = 'lose'; return ch; }
  if (ch.round > ch.maxRounds){ ch.over = true; ch.result = 'lose'; ch.timeout = true; return ch; }
  return ch;
}

/* 兼容旧接口：过一轮（现在等价于「只用普通攻击打一下」） */
function passTurn(){ return basicAttack(); }
function playCard(name){ return useTechnique(name); }

/* ---- 战斗结算 ---- */
function resolveChallenge(){
  const ch = challenge;
  if (!ch) return null;
  const cfg = ch.cfg || {};
  const win = ch.result === 'win';
  const out = { win: win, name: cfg.name, type: ch.type, bossId: ch.bossId || null,
                msgs: [], foeName: ch.foeName, rounds: ch.round, hpLeft: ch.hp, hpMax: ch.hpMax,
                tourney: ch.tourney || null, tianjiaoId: ch.tianjiaoId || null };

  /* 战果：优先用「数据化战果」（可存档），回落到旧的函数回调。
     第 22 轮：因为要支持「打到一半关掉页面再读回来」，
     战果必须是纯数据（见 applyOutcome 的说明）。 */
  const oc = ch.outcome || cfg.outcome || null;
  if (oc){
    applyOutcome(win ? oc.win : oc.lose);
  } else if (win){
    if (cfg.win) cfg.win();
  } else {
    if (cfg.lose) cfg.lose();
  }

  if (win){
    out.msgs.push('你赢了。');
    // 打赢必须有回报
    out.rewards = grantCombatRewards();
  } else {
    out.msgs.push('你倒下了。');
    out.lost = true;
  }

  // Boss 专属结算文本
  if (ch.bossId){
    const key = ch.bossId + (win ? '_win' : '_lose');
    out.bossText = (G.BOSS_OUTCOME && G.BOSS_OUTCOME[key]) || null;
    const boss = G.BOSSES[ch.bossId];

    if (win && boss && boss.kind === 'final'){
      // 渡雷池成功 → 开闸进入筑基（不再是结局——筑基只是第二站）
      const asc = advanceMajor();
      out.majorUp = asc;
      out.end = null;
      challenge = null;
      return out;
    }
    if (win && boss && boss.kind === 'hidden'){
      if (!s.clues.includes('clue_xinmo')) s.clues.push('clue_xinmo');
      const hidden = checkHiddenEnding();
      if (hidden){ out.end = hidden; challenge = null; return out; }
    }
  }

  challenge = null;

  /* 天骄：不论输赢都算「遭遇过」，打赢另记一笔终身成就（第 22 轮） */
  if (ch.tianjiaoId) markTianjiaoMet(ch.tianjiaoId);

  // 失败 → 进入转盘（由界面接手），而不是直接死
  if (!win){
    out.wheel = true;
    if (ch.killer) out.killerWheel = true;   // 天谴：转盘上「身死」扇区大幅增加
  }
  return out;
}

/* ---------------- 失败转盘 ----------------
   扇区大小由属性决定：身法高则脱身扇区大，体魄高则重伤不死，
   属性全低则「身死」会占掉一大块。转盘 = 你的道行替你赌命。  */
function wheelSlices(killerBoost){
  const A = attrs();
  const base = G.WHEEL_SLICES.map(x=>({ id:x.id, name:x.name, tone:x.tone, text:x.text, weight:x.weight }));

  const get = id => base.find(x=>x.id===id);
  // 身法：脱身 / 绝处逢生 ↑，重伤 / 身死 ↓
  const ev = get('escape'), sv = get('save'), hv = get('heavy'), dt = get('death'), rb = get('rob'), lt = get('light');
  const sf = A.shenfa || 0, tp = A.tipo || 0, gs = (A.gengu||0) + (A.lingli||0);

  ev.weight += sf * 1.6;
  sv.weight += Math.round(gs * 0.5);
  lt.weight += sf * 0.6;
  hv.weight -= Math.round(tp * 1.1);
  dt.weight -= Math.round((sf*0.5 + tp*0.5 + gs*0.15));
  rb.weight -= Math.round(sf * 0.3);

  if (killerBoost){ dt.weight += 90; }
  // 元层「逆天改命」：缩小身死扇区
  const wheelUp = (meta.up && meta.up.wheelLuck) || 0;
  if (wheelUp > 0) dt.weight = Math.round(dt.weight * Math.max(0.25, 1 - wheelUp*0.12));

  base.forEach(x=>{ x.weight = Math.max(2, Math.round(x.weight)); });
  return base;
}

/* 按权重抽取一个结果 */
function spinWheel(killerBoost){
  const slices = wheelSlices(killerBoost);
  const total = slices.reduce((a,b)=>a+b.weight,0);
  let r = s.rng() * total;
  let hit = slices[0];
  for (const x of slices){ r -= x.weight; if (r <= 0){ hit = x; break; } }
  return { slices: slices, total: total, hit: hit };
}

/* 应用转盘结果 */
function applyWheelResult(id){
  const out = { effect:'', end:null };
  const up = meta.up || {};

  switch(id){
    case 'escape':
      s.life -= Math.round(s.maxLife * 0.06);
      out.effect = `寿元 −${Math.round(s.maxLife*0.06)}`;
      break;
    case 'light':
      s.life -= Math.round(s.maxLife * 0.14);
      out.effect = `寿元 −${Math.round(s.maxLife*0.14)}`;
      break;
    case 'save':
      s.life -= Math.round(s.maxLife * 0.05);
      gainCult(30 + s.realmIdx*15);
      out.effect = `寿元 −${Math.round(s.maxLife*0.05)}　修为 +${30+s.realmIdx*15}`;
      break;
    case 'heavy':
      s.life -= Math.round(s.maxLife * 0.34);
      gainSectQi(-4);
      out.effect = `寿元 −${Math.round(s.maxLife*0.34)}`;
      break;
    case 'rob': {
      const lostStone = Math.round(s.stone * 0.5);
      s.stone -= lostStone;
      s.life -= Math.round(s.maxLife * 0.12);
      out.effect = `灵石 −${lostStone}　寿元 −${Math.round(s.maxLife*0.12)}`;
      break;
    }
    case 'death':
      // 元层「残念」：每局第一次身死时留住一线生机
      if (up.guard && !s.guardUsed){
        s.guardUsed = true;
        s.life = G.CONFIG.deathGuardHeal;
        out.saved = true;
        out.effect = `你倒下去了。有什么东西托了你一把。\n寿元回到 ${G.CONFIG.deathGuardHeal}。`;
        log('你倒下去了。有什么东西托了你一把。');
        return out;
      }
      out.effect = '你没能再站起来。';
      out.end = endRun('slay');
      return out;
  }
  const d = checkDeath('slay');
  if (d && !d.saved) out.end = d;
  return out;
}

/* ---------------- 碎片结算（第 19 轮重做） ----------------
   旧公式直接把 realmIdx / s.cult / 属性总和这些「原始数值」折算成碎片，
   可这几个量在本作里是指数级膨胀的：跑到渡劫的一局能结算出三百万碎片，
   而把 26 项升级（316 级）全部买满只要 8,530。
   结果就是「一把通关 = 局外成长直接走完」，多周目瞬间失去意义。

   现在每一路来源都先归一化到 0~1，再乘权重：
     · 一次满进度飞升 ≈ 600 碎片
     · 一次筑基期阵亡 ≈ 90 碎片
     · 一次炼气期阵亡 ≈ 30 碎片
   8,530 的总量意味着「把局外点满」大约是十几到几十局的事——
   正好是这款游戏希望的节奏：每一局都有点收获，但不是一局毕业。 */
G.FRAG = {
  base:   8,     // 参与奖：来了就有
  realm:  260,   // 走到哪算哪（渡劫 ≈ 260）
  action: 90,    // 走过多少路（400 次行动封顶）
  clue:   70,    // 线索（20 条封顶）
  cult:   40,    // 当前这一层修到多满
  ascend: 150,   // 筑基
  sanxiu: 60,    // 山中岁月
  hidden: 140,   // 重修（隐藏结局）
  /* 第 21 轮：境界上限锁在元婴之后，「走到上限」就是这一世的主要目标，
     所以它取代了原先「一路修到渡劫」那份境界分。 */
  capstone: 170
};
function fragBreakdown(reason){
  const F = G.FRAG;
  /* ⚠️ 境界分要按「玩家这一世能走多远」归一化，不能按完整 73 档。
     否则上限锁在元婴时，玩家最多只拿得到 26/72 ≈ 36% 的境界分，
     等于把局外成长悄悄砍掉六成 —— 玩家只会觉得「碎片怎么变少了」。 */
  const span = Math.max(1, (G.realmCapIndex ? G.realmCapIndex() : G.REALMS.length - 1));
  const pRealm  = Math.min(1, s.realmIdx / span);
  const pAction = Math.min(1, (s.actions || 0) / 400);
  const pClue   = Math.min(1, s.clues.length / 20);
  const needNow = Math.max(1, (G.REALMS[s.realmIdx] || {need:1}).need);
  const pCult   = Math.min(1, s.cult / needNow);
  const bonus   = reason === 'ascend' ? F.ascend
                : reason === 'sanxiu' ? F.sanxiu
                : reason === 'hidden' ? F.hidden
                : reason === 'capstone' ? (F.capstone || 0) : 0;
  const parts = {
    '参与':   F.base,
    '境界':   Math.round(pRealm  * F.realm),
    '行路':   Math.round(pAction * F.action),
    '线索':   Math.round(pClue   * F.clue),
    '当层修为': Math.round(pCult  * F.cult),
    '结局':   bonus
  };
  const total = Object.keys(parts).reduce((a,k)=>a+parts[k], 0);
  return { parts: parts, total: Math.max(3, total) };
}

function endRun(reason){
  if (!s || s.ended) return null;

  // 散修篇的自然结束：不叫「死」，叫「山中岁月」
  if (reason === 'life' && s.chapter === 'sanxiu'){
    const days = (s.sanxiu && s.sanxiu.days) || 0;
    // 活满 24 天（四季各一轮）就已经是「把日子过成了自己的」
    if (days >= 24) reason = 'sanxiu';
  }

  // 隐藏结局优先：只要集齐全部 7 条线索，无论怎么结束，都会导向「重修」。
  // 例外是「筑基」「山中岁月」「此世圆满」——那是玩家自己走完的路，不该被覆盖。
  if (reason !== 'ascend' && reason !== 'hidden' && reason !== 'sanxiu' && reason !== 'capstone'){
    const CLUE_IDS = ['clue_name','clue_book','clue_master','clue_disciple','clue_page','clue_dream','clue_xinmo'];
    if (CLUE_IDS.every(id=>s.clues.includes(id))) reason = 'hidden';
  }

  s.ended = true;
  challenge = null;

  const e = ENDINGS[reason] || ENDINGS.life;

  // ---- 结算碎片 ----
  const fb = fragBreakdown(reason);
  const frag = fb.total;

  // ---- 写入元层 ----
  meta.frag += frag;
  meta.runs += 1;
  meta.totalActions += s.actions;
  meta.worldActions = (meta.worldActions || 0) + s.actions;
  if (reason==='ascend') meta.wins += 1;
  if (!meta.endings.includes(e.id)) meta.endings.push(e.id);

  const w = meta.worlds.zongmen;
  if (s.realmIdx > (w.bestRealm||0)) w.bestRealm = s.realmIdx;
  if (frag > (w.best||0)) w.best = frag;
  if (reason==='ascend') w.cleared = (w.cleared||0)+1;

  // 线索入档
  s.clues.forEach(id=>{ if (!meta.lore.includes(id)) meta.lore.push(id); });

  // 元层剧情解锁
  let newLore = null;
  const nextLore = G.LORE.meta.find(l=>l.at === meta.runs);
  if (nextLore){ newLore = nextLore.text; }
  saveMeta(meta);

  /* ⚠️ 第 21 轮修复：一局结束后必须把「局内存档」清掉。
     以前这里没有清，于是磁盘上留着一份已经打完的局。
     玩家下次打开网址时 hasSavedRun() 照样返回它 →
     抽签界面下面出现「继续上一局」→ 点进去是一个已经结束的局面。
     更要命的是：这份陈旧存档会**一直留着**，直到玩家再开一局才会被覆盖。
     这正是「玩家进度看起来不对」的来源之一。 */
  clearRun();

  const result = {
    ending: e, sub: END_SUB[e.id],
    frag: frag,
    fragParts: fb.parts,
    stats: {
      realm: G.REALMS[s.realmIdx].name,
      realmIdx: s.realmIdx,
      cult: s.cult,
      stone: s.stone,
      karma: s.karma,
      favor: s.favor,
      actions: s.actions,
      clues: s.clues.length,
      cards: s.deck.length,
      disciples: s.disciples.length
    },
    newLore: newLore
  };
  s.endResult = result;   // 存起来，便于重复查看结算
  return result;
}

/* 主动坐化 */
function sitDown(){
  return endRun('sit');
}

/* 检查宗门是否已散 —— 注意：宗门散了不是结局，而是换一种活法。
   玩家转入「散修篇」，继续以散修的身份活下去。               */
function checkSectCollapse(){
  if (!s.sectCollapsed) return null;
  if (s.chapter === 'sanxiu') return null;
  // 只有「宗门没了 + 什么都没剩下 + 自己也不行了」才是真的走投无路
  if (s.discipleCount === 0 && s.buildings.lingtian === 0 && s.life <= s.maxLife*0.12){
    return endRun('sect');
  }
  return { enterSanxiu: true };
}

/* ---------------- 散修篇 ----------------
   宗门散了不是结局，是换一种活法。
   散修没有 KPI、没有气运倒计时，只有「今天想干什么」。
   休闲活动不设失败惩罚——这是「休闲修仙」的核心。            */
/* ---------------- 散修篇 ----------------
   ⚠️ 重做要点（第 14 轮）：散修最大的问题是「用寿元换零钱」。
   现在每一次行动都会累积三样东西：
     ① 技艺熟练度（同类活动收益越来越高，看得见）
     ② 洞府材料（能盖出持续产出的建筑）
     ③ 目标进度（有方向，不是原地打转）
   而且休闲活动净收益为正——休闲就该是休闲。                    */
function enterSanxiu(reason){
  if (s.chapter === 'sanxiu') return null;
  s.chapter = 'sanxiu';
  s.sanxiu.started = true;
  sx();                      // 初始化散修状态（技艺 / 洞府 / 计数）
  const txt = reason || '你下山了。';
  log(txt + '从今天起，你是一个散修。');
  return txt;
}

/* 散修状态（含老存档兼容） */
function sx(){
  const d = s.sanxiu;
  if (!d.skills) d.skills = {};
  if (!d.home) d.home = {};
  if (d.herbStock == null) d.herbStock = 0;
  if (d.days == null) d.days = 0;
  if (d.beastBond == null) d.beastBond = 0;
  if (d.pillTick == null) d.pillTick = 0;
  if (!d.goalsDone) d.goalsDone = [];
  if (d.beast === undefined) d.beast = null;
  return d;
}

/* 当前季节：每 6 天换一季 */
function season(){
  const d = sx();
  const idx = Math.floor(d.days / G.SEASON_DAYS) % G.SEASONS.length;
  return G.SEASONS[idx];
}

function skillLv(id){ return (sx().skills[id]) || 0; }
function skillMul(id){
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def) return 1;
  return 1 + skillLv(id) * def.per;
}
function homeLv(id){ return (sx().home[id]) || 0; }
function homeTotal(){
  const h = sx().home;
  return Object.keys(h).reduce((n,k)=>n+(h[k]||0),0);
}
function homeBonus(){
  const out = { herb:0, lifePerAction:0, cultMul:0, beastGain:0 };
  G.SANXIU_HOME.forEach(b=>{
    const lv = homeLv(b.id);
    if (!lv) return;
    if (b.per.herb) out.herb += b.per.herb * lv;
    if (b.per.lifePerAction) out.lifePerAction += b.per.lifePerAction * lv;
    if (b.per.cultMul) out.cultMul += b.per.cultMul * lv;
    if (b.per.beastGain) out.beastGain += b.per.beastGain * lv;
  });
  return out;
}
function homeCost(id){
  const b = G.SANXIU_HOME.find(x=>x.id===id);
  if (!b) return null;
  const lv = homeLv(id);
  if (lv >= b.max) return null;
  return b.cost[lv];
}
function buildHome(id){
  const cost = homeCost(id);
  if (cost === null || s.stone < cost) return false;
  s.stone -= cost;
  s.sanxiu.home[id] = homeLv(id) + 1;
  log('洞府建起了 ' + G.SANXIU_HOME.find(x=>x.id===id).name + '（' + homeLv(id) + ' 级）。');
  return true;
}

/* 属性机缘加成 */
function addAttrBonus(obj){
  if (!s.attrBonus) s.attrBonus = {};
  Object.keys(obj).forEach(k=>{ s.attrBonus[k] = (s.attrBonus[k]||0) + obj[k]; });
}

/* 技艺提升：消耗草药与灵石换熟练（也可在活动中自然长） */
function skillUpCost(id){
  const lv = skillLv(id);
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def || lv >= def.max) return null;
  return { herb: 6 + lv*4, stone: 10 + lv*8 };
}
function trainSkill(id){
  const cost = skillUpCost(id);
  const d = sx();
  if (!cost) return { ok:false, msg:'这门技艺已经练到头了' };
  if (d.herbStock < cost.herb) return { ok:false, msg:'草药不够（需 ' + cost.herb + '，有 ' + d.herbStock + '）' };
  if (s.stone < cost.stone) return { ok:false, msg:'灵石不够（需 ' + cost.stone + '）' };
  d.herbStock -= cost.herb;
  s.stone -= cost.stone;
  d.skills[id] = skillLv(id) + 1;
  const attrMap = { caiyao:{wuxing:1}, diaoyu:{shenfa:1}, gengzuo:{tipo:1},
                    yunyou:{shenfa:1}, yushou:{shenshi:1}, shanyuan:{gengu:1} };
  addAttrBonus(attrMap[id] || {wuxing:1});
  log('你的「' + G.SANXIU_SKILLS.find(x=>x.id===id).name + '」更熟练了（' + skillLv(id) + ' 级）。');
  return { ok:true, lv:skillLv(id) };
}

/* 技艺自然熟练 */
function growSkill(id){
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def) return false;
  const lv = skillLv(id);
  if (lv >= def.max) return false;
  sx().skills[id] = lv + 1;
  const attrMap = { caiyao:{wuxing:1}, diaoyu:{shenfa:1}, gengzuo:{tipo:1},
                    yunyou:{shenfa:1}, yushou:{shenshi:1}, shanyuan:{gengu:1} };
  addAttrBonus(attrMap[id] || {wuxing:1});
  return true;
}

/* 散修目标：给这段生活一个方向 */
function checkSanxiuGoals(){
  const d = sx();
  const done = [];
  G.SANXIU_GOALS.forEach(g=>{
    if (d.goalsDone.indexOf(g.id) >= 0) return;
    let hit = false;
    try { hit = g.check(s); } catch(e){ hit = false; }
    if (!hit) return;
    d.goalsDone.push(g.id);
    if (g.id==='g_herb')  s.sanxiu.home.yaopu  = Math.min(5, homeLv('yaopu')+1);
    if (g.id==='g_fish')  s.sanxiu.home.lingxi = Math.min(5, homeLv('lingxi')+1);
    if (g.id==='g_crop')  raiseMaxLife(40);
    if (g.id==='g_home')  addAttrBonus({tipo:5,lingli:5,wuxing:5,shenfa:5,shenshi:5,gengu:5});
    if (g.id==='g_year')  raiseMaxLife(80);
    if (g.id==='g_beast') addAttrBonus({tipo:3,shenfa:3});
    done.push(g);
    log('【散修目标达成】' + g.name + ' — ' + g.reward);
  });
  return done;
}
