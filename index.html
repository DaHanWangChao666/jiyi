/* ---- 突破 ---- */
function doBreakSequence(){
  const r = G.Engine.doBreak();
  if (!r) return;

  /* 第 21 轮：到了本世上限（元婴最后一档），修为已满 → 收束这一世。
     不给「突破」，因为前面那一段还没有被写出来。 */
  if (r.capstone){ capstoneFlow(); return; }

  /* 筑基巅峰 → 金丹前期：第一场天劫，剧本写在 boss_zhuji 里。
     ⚠️ 第 25 轮改动：这个门槛原在「炼气九层 → 筑基」。
     用户要求清掉那段早期草稿，天劫只留在金丹期起的大境界突破上。 */
  if (r.needBoss){
    const boss = G.BOSSES[r.needBoss];
    if (boss){ showBoss(boss); return; }
  }

  toast(`破境！${r.realm}　寿元上限 ${r.maxLife}`,'epic');
  renderRun();
  if (r.tribulation){
    setTimeout(()=>startTribulationFlow(null, r.extreme), 420);
    return;
  }
  // 破境后也可能撞上 Boss（例如青云观主、心魔）
  const boss = G.Engine.pickBoss();
  if (boss) setTimeout(()=>showBoss(boss), 420);
}

/* ---- 此世圆满（境界上限的收束）----
   走到这里，玩家把这一段路走完了。让他自己合上山门，再回桌前。 */
function capstoneFlow(){
  const capName = G.Engine.state() ? G.Engine.state().capName : '';
  const body = el('div');
  body.innerHTML =
    `<div class="ev-text">你修到了**${capName}**的尽头。\n\n` +
    `再往上，是化神、炼虚、合体、大乘、渡劫——\n` +
    `那些名字你都听过，但**那几页还没有被写出来**。\n\n` +
    `风停了。你听见自己身体里有东西在慢慢地转。</div>
     <div class="ev-flavor">这一世到这里就完整了。\n\n` +
    `桌上的拼图还差几块。\n你可以回去，把它们摆上。</div>`;

  const wrap = el('div');
  wrap.style.marginTop = '10px';
  body.appendChild(wrap);

  wrap.appendChild(btn('收 束 这 一 世','btn-main btn-go',()=>{
    closeSheet();
    const r = G.Engine.endRun('capstone');
    if (r) showEnding(r);
  }));
  wrap.appendChild(btn('再 走 走（不结束）','btn-main',()=>{
    closeSheet();
    renderRun();
  }));

  sheet('◆ 此 世 圆 满', body, []);
}

/* ---- 事件 ---- */
function showEvent(ev){
  const body = el('div');

  /* ---- 第 27 轮：事件的演出重做 ----
     玩家反馈「事件的展示还是过于单一」。旧版所有事件长得一模一样：
     标题 + 一整段正文 + 三个按钮，正文一次性砸出来。
     现在改三处（都不改内容，只改呈现）：
       ① 分类角标 + 色调：点开之前就知道这是什么味道的事
       ② **逐段浮现**：正文按空行拆段，一段一段淡入
       ③ 选项在正文落完之后才出现（读完了再选，而不是抢注意力） */
  const cat = ev.cat || '';
  const head = el('div');
  if (cat) head.appendChild(el('div','ev-cat ev-cat-' + cat, cat));
  /* 正文按空行拆段后逐段淡入；只有一段就整体淡入。
     ⚠️ 这里全部用 appendChild 拼节点，不用 innerHTML + querySelector ——
     假 DOM（dev/uidom.js）解析不了选择器，用节点拼两边才都能测。

     第 29 轮：text / flavor 可以是**函数** —— 同一个事件在属性不同的人眼里
     长得不一样（玩家反馈：「事件可能因为玩家属性的变化而变化这个效果
     完全没有做出来」）。求值统一走 G.Engine.evTextOf()：
     只有函数才调用、并且吞掉异常，所以老的字符串事件完全不受影响。 */
  const rawText = G.Engine.evTextOf(ev.text);
  const evFlavor = G.Engine.evTextOf(ev.flavor);
  const paras = rawText.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if (paras.length > 1){
    paras.forEach((p,i)=>{
      const d = el('div','ev-text fade-p');
      d.innerHTML = p.replace(/\n/g,'<br>');
      d.style.animationDelay = (i*170) + 'ms';
      head.appendChild(d);
    });
  } else {
    const d = el('div','ev-text fade-p');
    d.innerHTML = rawText.replace(/\n/g,'<br>');
    head.appendChild(d);
  }
  if (evFlavor) head.appendChild(el('div','ev-flavor', evFlavor.replace(/\n/g,'<br>')));
  body.appendChild(head);

  const wrap = el('div');
  wrap.style.animationDelay = (Math.min(paras.length,6)*170 + 220) + 'ms';
  wrap.classList.add('story-choices');
  body.appendChild(wrap);

  const st = G.Engine.state();

  const foot = [];
  /* ⚠️ 第 29 轮：条件要求值必须包一层 try。
     原来这里直接 `c.when(st.raw)` —— 只要有一个选项的条件写错
     （第 29 轮真踩到过：条件里引用了一个不存在的变量），
     filter 就会把异常抛上来，**整个事件面板渲染不出来**，
     玩家看到的是点开事件一片空白。
     现在的策略：条件抛错就当这条不出现（fail-closed），
     并在记事里留一条，免得它静悄悄地消失。
     dev/verify-eventstruct.js 会遍历所有条件 × 所有境界，
     在测试阶段就把这种错抓出来，不让它走到这一步。 */
  const condOk = c => {
    if (!c.when) return true;
    try { return !!c.when(st.raw); }
    catch(e){ console.warn('事件条件求值失败：', ev.id, c.label, e && e.message); return false; }
  };
  const choices = ev.choices.filter(condOk);
  choices.forEach((c,i)=>{
    const b = el('button','ev-choice');
    b.innerHTML = `<div class="ev-ctext">${i+1}. ${c.label}</div>` +
      (c.hint?`<div class="ev-cmeta">${c.hint}</div>`:'');
    b.addEventListener('click', ()=>{
      const r = c.eff(st.raw, api);
      // 关闭事件，显示结果
      closeSheet();
      /* ⚠️ 第 33 轮：**运行时守卫**。
         「灵石 +undefined」那一族 bug 修过两轮（第 32 轮 22 处、第 33 轮 4 处），
         每一次都是靠人肉对账才发现的，而玩家可能已经看了好几天假数字。
         这里在文案交给玩家之前扫一遍：真出现了就留一条 console 警告 +
         写进记事，而不是静默显示。
         治标不治本 —— 治本的是 dev/verify-bundle-accounting.js（逐选项对账），
         但那一层万一漏了，这一层至少能让它**可见**。 */
      if (typeof r === 'string' && /undefined|NaN|\[object Object\]/.test(r)){
        try {
          console.warn('事件文案里出现假值：', ev.id, c.label, r);
          if (G.Engine && G.Engine.note) G.Engine.note('choice', '（这里有一个数字没算出来：' + ev.id + '）');
        } catch(e){ /* 守卫自己不许把游戏搞崩 */ }
      }
      if (r) toast(r, '');
      renderRun();
      if (api._pendingChallenge){
        /* ⚠️ 顺序很重要：必须**先**把 pendingChallenge 取走，
           再进入战斗流程。startChallengeFlow() 自己会 autoSave，
           而它会存下环境里的 challenge —— 如果此时 _pendingChallenge
           还挂着，存档就会出现「有一场战斗在等，但战斗又没开始」的中间态。 */
        const cfg = api._pendingChallenge; api._pendingChallenge = null;
        setTimeout(()=>startChallengeFlow(cfg), 320);
        if (!st.raw.ended) autoSave();   // 事件对资源的改动仍然要落盘
        return;
      }
      /* 事件里碰上了天骄榜上的人（第 22 轮） */
      if (api._pendingTianjiao){
        const tj = api._pendingTianjiao; api._pendingTianjiao = null;
        if (!st.raw.ended) autoSave();
        setTimeout(()=>showTianjiao(tj), 320);
        return;
      }
      /* 事件把比武请帖直接塞给了你 */
      if (api._pendingTourney){
        const b = api._pendingTourney; api._pendingTourney = null;
        if (!st.raw.ended) autoSave();
        setTimeout(()=>showTourneyInvite(b), 320);
        return;
      }
      /* 第 22 轮：事件会改修为 / 寿元 / 卡牌 / 灵石，
         以前这些改动**不落盘** —— 看完事件直接关页面就白改了。 */
      if (!st.raw.ended) autoSave();
      if (api._ended) return;
      const sc = G.Engine.checkSectCollapse();
      if (sc) showEnding(sc);
      if (pendingDeath) { const d = pendingDeath; pendingDeath=null; afterDeath(d); }
    });
    wrap.appendChild(b);
  });

  sheet(ev.title, body, foot);
}

/* 给事件用的 API——第 19 轮起由引擎提供唯一真源，界面只挂一个「死亡过场」钩子 */
let pendingDeath = null;

const api = G.Engine.makeActions({
  onDeath(d){ pendingDeath = d; }
});

/* ---- 挑战（战斗 / 天劫） ---- */
let activeChallenge = null;

function startTribulationFlow(preText, extreme){
  const ch = G.Engine.startTribulation(extreme);
  ch.cfg.preText = preText || '破境之时，天上有东西在看。';
  if (extreme) ch.cfg.preText = '这一次的天，比平常低。\n它认得你。\n\n' + ch.cfg.preText;
  activeChallenge = ch;
  autoSave();                       // 战斗一旦开始就落盘，避免中途关掉丢局面
  renderChallenge();
}

/* 业障满 → 天谴 */
function startKillerTribulationFlow(){
  const ch = G.Engine.startKillerTribulation();
  activeChallenge = ch;
  autoSave();
  renderChallenge();
}

function startChallengeFlow(cfg){
  const ch = G.Engine.startChallenge(cfg);
  activeChallenge = ch;
  autoSave();                       // 同上：先把「正在战斗」写进存档
  renderChallenge();
}

function renderChallenge(){
  const ch = activeChallenge || G.Engine.challenge;
  if (!ch) return;
  activeChallenge = ch;

  const isTb = ch.type === 'tribulation';
  const body = el('div');

  if (ch.round === 1 && ch.cfg.preText){
    body.appendChild(el('div','ev-flavor', ch.cfg.preText));
  }
  if (ch.round === 1 && ch.cfg.txt){
    body.appendChild(el('div','ev-text', ch.cfg.txt.replace(/\n/g,'<br>')));
  }

  // ---- 双方血条 ----
  const bars = el('div','fight-bars');
  const ri = G.Engine.foeRealmInfo();
  const foeSub = `境界：<b class="${ri.known?'':'unknown'}">${ri.label}</b>` +
    (ri.known ? `　${ri.compare}` : '') +
    `　·　${ri.tierLabel}　攻击 ${ch.foeAtk}`;
  bars.appendChild(barBlock(ch.foeName, ch.foeHp, ch.foeHpMax, 'foe', foeSub));
  bars.appendChild(barBlock('你', ch.hp, ch.hpMax, 'me',
    `普通攻击 ${ch.stats.basicAtk}　真气 ${ch.qi}/${ch.qiMax}`));
  body.appendChild(bars);

  // 一场战斗开始时，给一次「该不该打」的提示
  if (ch.round === 1){
    const warn = el('div','fight-warn ' + (ri.known ? (ri.gap>=3?'risky':'ok') : 'danger'));
    if (!ri.known){
      warn.textContent = '⚠ 此敌境界未知，深不可测。打赢了收获极大，打输了要去转盘。';
    } else if (ri.gap >= 3){
      warn.textContent = '⚠ 它比你强不少。想清楚再动手。';
    } else if (ri.gap <= -2){
      warn.textContent = '它远不如你。这一场很轻松。';
    } else {
      warn.textContent = '势均力敌。放心打。';
    }
    body.appendChild(warn);
  }

  // ---- 真气条 ----
  const qiWrap = el('div','qi-wrap');
  qiWrap.innerHTML = '<div class="qi-bar"><div class="qi-fill" style="width:' +
    Math.round(ch.qi/ch.qiMax*100) + '%"></div></div><div class="qi-label">真 气</div>';
  body.appendChild(qiWrap);

  // ---- 战斗日志 ----
  if (ch.logLines && ch.logLines.length){
    const lg = el('div','fight-log');
    ch.logLines.slice(-4).forEach(function(t){ lg.appendChild(el('div','fight-log-i', t)); });
    body.appendChild(lg);
  }

  // ---- 行动区 ----
  const acts = el('div');
  acts.style.marginTop = '12px';

  const bBasic = el('button','ev-choice fight-basic');
  bBasic.innerHTML =
    '<div class="ev-ctext">普通攻击　<span class="tag-inf">不限次</span></div>' +
    '<div class="ev-cmeta">造成约 ' + ch.stats.basicAtk + ' 点伤害　不消耗真气</div>';
  bBasic.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.basicAttack(); }); });
  acts.appendChild(bBasic);

  // 招式（冷却制，永久保留）
  const techs = Array.from(new Set(G.Engine.state().raw.deck)).filter(function(n){ return G.TECHNIQUES[n]; });
  techs.forEach(function(n){
    const t = G.TECHNIQUES[n];
    const cd = ch.cooldowns[n] || 0;
    const noQi = ch.qi < t.qi;
    // 材料成本（灵石 / 阳寿）——第 20 轮接上，以前卡面写了引擎不认
    let costTxt = '', noCost = false;
    if (t.cost){
      const parts = [];
      if (t.cost.stone){
        parts.push('石' + t.cost.stone);
        if (G.Engine.state().raw.stone < t.cost.stone) noCost = true;
      }
      if (t.cost.life){
        const need = G.Engine.evLifePct(t.cost.life);
        parts.push('寿' + need);
        if (G.Engine.state().raw.life <= need) noCost = true;
      }
      if (parts.length) costTxt = '　需' + parts.join(' ');
    }
    let effect = '';
    if (t.kind==='dmg') effect = '伤害约 ' + Math.round(ch.stats.techPower * (ch.stats.techMul||1) * t.mul);
    else if (t.kind==='heal') effect = '回复约 ' + Math.round(ch.stats.techPower * t.heal) + ' 气血';
    else if (t.kind==='ward') effect = '护体 +' + Math.round(ch.stats.ward * t.ward);
    else if (t.kind==='buff') effect = '闪避大幅提升';
    else if (t.kind==='karma') effect = '业障 ' + t.karma + '，回复气血';
    // 复合招式（例如「万符归阵」= 伤害 + 护体）：两半都要显示出来
    if (t.kind!=='ward' && t.ward) effect += '　护体 +' + Math.round(ch.stats.ward * t.ward);
    if (t.kind!=='heal' && t.heal) effect += '　回复气血';
    if (t.kind!=='dmg' && t.mul) effect += '　伤害约 ' + Math.round(ch.stats.techPower * (ch.stats.techMul||1) * t.mul);
    const stateTxt = cd>0 ? ('冷却 ' + cd) : (noQi ? ('真气不足 需' + t.qi) : ('真气 ' + t.qi));
    const b = el('button','ev-choice');
    /* 第 25 轮：名字后面挂上品质与类型角标。
       战斗是玩家最需要「这张牌值不值得用」的地方，之前却只有光名字。 */
    b.innerHTML =
      '<div class="ev-ctext">' + n + rarityTag(n) + '　<span class="tag-inf ' + (cd>0?'dim':'') + '">' + stateTxt + '</span></div>' +
      '<div class="ev-cmeta">' + effect + '　冷却 ' + t.cd + ' 回合' +
        (costTxt ? '　<span class="' + (noCost?'cost-lack':'cost-ok') + '">' + costTxt + '</span>' : '') + '</div>';
    if (cd>0 || noQi || noCost) b.disabled = true;
    b.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.useTechnique(n); }); });
    acts.appendChild(b);
  });

  // 丹药（一次性）
  const pills = Array.from(new Set(G.Engine.state().raw.deck)).filter(function(n){
    const c = G.CARDS[n]; return c && c.type === '丹药';
  });
  pills.slice(0,3).forEach(function(n){
    const c = G.CARDS[n];
    const b = el('button','ev-choice');
    b.innerHTML = '<div class="ev-ctext">服丹 · ' + n + rarityTag(c) + '</div>' +
      '<div class="ev-cmeta">' + (c.desc||'').slice(0,20) + '　（用掉一枚）</div>';
    b.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.usePill(n); }); });
    acts.appendChild(b);
  });

  body.appendChild(acts);

  const foot = [ el('div','fight-round', '第 ' + ch.round + ' 回合') ];
  sheet(isTb ? '◆ 天 劫' : '◆ 交 手', body, foot);
}

/* 双方血条块 */
function barBlock(name, hp, hpMax, side, sub){
  const pct = Math.max(0, Math.min(100, hp/hpMax*100));
  const cls = pct < 20 ? 'danger' : (pct < 45 ? 'warn' : '');
  const d = el('div','fight-bar-block ' + side);
  d.innerHTML =
    '<div class="fight-name"><span>' + name + '</span><span>' + Math.max(0,hp) + ' / ' + hpMax + '</span></div>' +
    '<div class="life-bar"><div class="life-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '<div class="fight-sub">' + sub + '</div>';
  return d;
}

/* 执行一次战斗行动并刷新界面 */
function doFightAct(fn){
  const r = fn();
  if (r && r.ok === false){ if (r.msg) toast(r.msg,'bad'); return; }
  const ch = G.Engine.challenge;
  activeChallenge = ch;
  /* 第 22 轮：每打一个回合就存一次。
     战斗是「关掉页面最亏」的地方 —— 不存的话整场遭遇凭空消失，
     而进场前的行动已经被扣掉了。 */
  autoSave();
  if (ch && ch.over) finishChallenge();
  else renderChallenge();
}

function finishChallenge(){
  const out = G.Engine.resolveChallenge();
  activeChallenge = null;
  G.Engine.clearBossActive();      // 遭遇结束，解除 Boss 锁定
  closeSheet();
  if (!out) return;
  renderRun();
  autoSave();                      // 第 22 轮：一场仗打完立刻落盘

  /* ---- 天骄榜之战（第 22 轮）------------------------------------------------
     天骄不管输赢都有专属结算文本，而且输了**不进转盘** ——
     设定上他们是「留手」的（你连让他认真的资格都还没有）。
     这样玩家才敢去试，而不是遇到天骄只能躲。 */
  if (out.tianjiaoId){
    const tj = G.TIANJIAO.find(t=>t.id===out.tianjiaoId);
    if (tj){
      autoSave();
      setTimeout(()=>showTianjiaoOutcome(tj, out.win), 320);
      return;
    }
  }

  /* ---- 比武大会（第 22 轮）------------------------------------------------
     比武输了也不进转盘 —— 台下有人拦着，这是规矩。
     输一场就淘汰，但赛果（奖金 / 名号）照给。 */
  if (out.tourney){
    const adv = G.Engine.advanceTourney(out.win);
    autoSave();
    if (adv && adv.next){
      setTimeout(()=>{
        toast(out.win ? '这一场赢了，进下一轮。' : '这一场输了。', out.win?'good':'bad');
        showTourneyRound();
      }, 420);
      return;
    }
    setTimeout(()=>showTourneyResult(), 420);
    return;
  }

  // Boss 结算文本 / 隐藏结局 / 普通结局
  if (afterChallenge(out)) return;
  if (out.end){ afterDeath(out.end); return; }

  // 胜利 → 展示战利品
  if (out.win && out.rewards){
    const r = out.rewards;
    let html = `<div class="ev-text">你胜了 <b>${out.foeName}</b>。\n（${out.rounds} 回合，余气血 ${out.hpLeft} / ${out.hpMax}）</div>`;
    html += `<div class="reward-box">
      <div class="reward-line">灵石 <b>+${r.stone}</b></div>
      <div class="reward-line">修为 <b>+${r.cult}</b></div>
      ${r.card ? `<div class="reward-line gold">获得招式 · <b>${r.card}</b></div>` : ''}
      ${r.extra ? `<div class="reward-line">${r.extra}</div>` : ''}
    </div>`;
    /* 第 29 轮：劫余要单独给一块 —— 它是「多渡一劫」的理由，
       埋在 extra 那一行里没人看得见。 */
    if (r.boon){
      html += `<div class="boon-box">
        <div class="boon-h">劫 余 · ${r.boon.name}</div>
        <div class="boon-t">${r.boon.text.replace(/\n/g,'<br>')}</div>
      </div>`;
    }
    sheet('◆ 战 利 品', html, [ btn('收下','btn-main btn-go', ()=>{
      closeSheet(); renderRun();
      const sc = G.Engine.checkSectCollapse();
      if (sc){ if (sc.enterSanxiu){ enterSanxiuFlow(); return; } showEnding(sc); return; }
      afterActionFlow();
    }) ]);
    return;
  }

  toast(out.win ? `你战胜了 ${out.foeName}（${out.rounds} 回合）`
                : `你败给了 ${out.foeName}`, out.win?'good':'bad');
  // 战斗失败 → 转盘决定后果
  if (out.wheel){
    setTimeout(()=>showWheel(!!out.killerWheel), 400);
    return;
  }
  const sc = G.Engine.checkSectCollapse();
  if (sc){
    if (sc.enterSanxiu){ enterSanxiuFlow(); return; }
    showEnding(sc); return;
  }
  afterActionFlow();
}

/* ---- 储物袋（第 24 轮）----
   玩家反馈：「丹药什么的物品，仅能在战斗中使用，在战斗外无法使用，
   建议新增一个『背包』或储物袋设定」。

   丹药本来就是牌（一张牌 = 一枚），所以这里不需要新数据，
   只是给它们一个**随时能用**的入口。 */
const RARITY_TEXT = { '凡':'#8a8078', '良':'#5fae8f', '玄':'#5b7fa8', '道':'#c9a227' };

function showBag(){
  const st = G.Engine.state();
  if (!st) return;
  const list = G.Engine.inventory();
  const body = el('div');

  const inBattle = !!(G.Engine.challenge && G.Engine.challenge.active);
  const myGrade = G.Engine.myPillGrade();

  body.appendChild(el('div','arc-i',
    `储物袋里有 <b style="color:#c9a227">${G.Engine.pillCount()}</b> 枚丹药。\n` +
    (inBattle
      ? '<span style="color:#f0a99f">你正在战斗中 —— 这里吃丹会消耗一个回合。</span>'
      : '战斗内外都能服用。回血的丹在战斗里补气血，在战斗外补寿元。') +
    '<br><span style="color:#6f6459">（功法、术法、法宝在「牌组」里看）</span>'));

  /* ---- 品级说明（第 25 轮）----
     品级 = 这枚丹是给哪个大境界炼的；你自己的品级就是你的大境界序号。
     越品伤身、低品减效——这两句话必须在吃之前就让玩家看见，
     否则「丹药突然扣我寿元」会像是 bug 而不是规则。 */
  body.appendChild(el('div','pill-grade-head',
    `丹 药 品 级　<span class="pg-mine">你现在是 ${myGrade} 品（${st.realmName}）</span>`));
  body.appendChild(el('div','pill-grade-note',
    `品级 = 这枚丹是给哪个大境界的修士炼的。\n` +
    `· 吃 <b>高于自己</b> 的丹 → 药力过盛：效果打折，还会反噬寿元\n` +
    `· 吃 <b>低于自己</b> 的丹 → 药力过时：每低 1 品，效果 ×0.70（最低 ×0.15）`));

  if (!list.length){
    body.appendChild(el('div','arc-empty','袋子是空的。\n\n丹药来自：探索、机缘、丹房、散修洞府的丹炉。'));
    sheet('储 物 袋', body, []);
    return;
  }

  list.forEach(it=>{
    const row = el('div','bld-item' + (it.rarity==='道'||it.rarity==='玄' ? ' built':''));
    const eff = [];
    if (it.effect.life) eff.push((inBattle?'气血':'寿元') + ' +' + it.effect.life);
    if (it.effect.cult) eff.push('修为 +' + it.effect.cult);
    if (it.effect.lifeMax) eff.push('寿元上限 +' + it.effect.lifeMax);
    if (it.effect.karma) eff.push('业障 ' + (it.effect.karma>0?'+':'') + it.effect.karma);
    /* 永久 / 限时战斗丹：把它们真正的卖点写清楚（第 25 轮） */
    if (it.battle) eff.push(it.battle);
    const nameCls = it.rarity==='道' ? 'var(--gold2)' : (it.rarity==='玄' ? 'var(--blue)' : 'var(--ink)');
    /* 品级角标 + 「此刻吃下去会怎样」的预判。
       越品用红色、低品用灰色——玩家一眼能看出这枚丹现在值不值得吃。 */
    const pgCls = it.outcome.kind === 'danger' ? 'pg-bad'
                : it.outcome.kind === 'warn'   ? 'pg-warn'
                : it.outcome.kind === 'dim'    ? 'pg-dim' : 'pg-ok';
    const shownMul = it.outcome.mul !== 1
      ? `　<span class="pg-mul">实际效果 ×${it.outcome.mul.toFixed(2)}</span>` : '';
    row.innerHTML =
      `<div class="bld-info">
         <div class="bld-name"><span style="color:${nameCls}">${it.name}</span>` +
         `<span class="lv pg-tag ${pgCls}">${it.grade} 品</span>` +
         `<span class="lv" style="color:${RARITY_TEXT[it.rarity]}">${it.rarity}</span>` +
         `<span class="lv">×${it.count}</span></div>
         <div class="bld-desc">${eff.join('　')}${shownMul}</div>
         <div class="bld-desc ${pgCls}" style="font-size:12px">${it.outcome.note}</div>
         <div class="bld-desc" style="color:#5c5349">${it.desc}</div>
       </div>`;
    const bt = el('button','bld-btn', it.card && it.card.consumable && it.card.use && it.card.use.tianjiao ? '点 燃' : '服 用');
    bt.addEventListener('click', ()=>{
      const r = G.Engine.usePill(it.name);
      if (!r || !r.ok){ toast((r&&r.msg)||'用不了','bad'); return; }
      autoSave();
      /* 问影香：它不产生数值，只产生「往哪边走」。交给专门的指路面板。 */
      if (r.tianjiaoCompass){
        closeSheet();
        showTianjiaoCompass(r.tj, r.dir);
        return;
      }
      if (r.outOfBattle){
        toast(r.msg, 'good');
        renderRun();
        showBag();                       // 刷新列表（可能吃完了）
        return;
      }
      /* 战斗内吃丹：交给战斗界面接管 */
      closeSheet();
      const ch = G.Engine.challenge;
      if (ch && ch.over) finishChallenge();
      else { activeChallenge = ch; renderChallenge(); }
    });
    row.appendChild(bt);
    body.appendChild(row);
  });

  sheet('储 物 袋', body, [
    btn('关 上','btn-main',()=>closeSheet())
  ]);
}

/* ---- 榜：比武大会 + 天骄榜（第 25 轮新增） ----
   ------------------------------------------------------------
   玩家反馈：「我还是找不到有关比武大会和天骄榜的任何线索」。

   诊断（dev/dbg-discover.js）：比武请帖其实出现在 94% 的局里，
   天骄也有 64% 的局能遇到——**但界面里没有任何地方能主动查到它们**。
   请帖是一闪而过的弹窗，天骄榜更是只有抽中特定事件才看见一行字。
   信息在，入口不在。这个面板就是那个入口。

   面板分两段：
     ① 比武大会：我的赛道 / 门槛 / 资格 / 下一次开擂还有几次行动 /
        为什么现在上不了台（有答案，不是「坏了」）/ 已夺名号 / 四条赛道图鉴
     ② 天骄榜：八个名字按境界分组，标出「未遇 / 已交手 / 已胜」，
        并且——如果你在山下茶棚见过那张榜——可以**循名去找人**。 */
function showRank(){
  const st = G.Engine.state();
  if (!st) return;
  const T = G.Engine.tourneyStatus();
  const J = G.Engine.tianjiaoStatus();
  const body = el('div');

  /* ==================== ① 比武大会 ==================== */
  body.appendChild(el('div','rank-h','一　比 武 大 会'));
  body.appendChild(el('div','rank-note',
    `宗门设台，**按大境界分赛道**。同一条台上只会遇到同一个大境界的人。\n` +
    `每条赛道每 ${T.period} 次行动开一次，一局只能打一次；共 ${T.rounds} 轮，输一场下台——比武不伤性命。`));

  if (T.mine){
    const b = T.mine;
    const cur = G.REALMS[st.raw.realmIdx];
    const cleared = T.brackets.find(x=>x.id===b.id).cleared;
    /* ⚠️ 第 30 轮：门槛不能写「${needSub} 层」。
       筑基起的小境界改成了（前期/中期/后期/巅峰），needSub=2 对应的
       不是「第 2 层」而是「中期」—— 直接印数字会让玩家去找一个不存在的层。
       统一走 G.gateName()，两处（这里和赛道列表）都用它。 */
    const box = el('div','rank-card' + (T.block ? '' : ' hot'));
    box.innerHTML =
      `<div class="rank-card-h">我的赛道：${b.name}</div>
       <div class="rank-card-d">${b.desc}</div>
       <div class="rank-card-m">门槛：${G.gateName(b)}　` +
        `你现在：${cur.name}　` +
        (T.block ? `<span class="rk-bad">${T.block}</span>`
                 : `<span class="rk-ok">有资格上台</span>`) +
      `</div>
       <div class="rank-card-m">` +
        (cleared ? '这条赛道你已经打过了（一局一次）。'
                 : `下一次开擂：第 <b>${T.nextAt}</b> 次行动（还有 <b>${T.inActions}</b> 次）`) +
      `</div>
       <div class="rank-card-m">四轮难度：` +
        (G.TOURNEY.ladder||[]).map((s,i)=>
          `${s.label} <b>×${(s.mul||1).toFixed(2)}</b>`).join('　→　') +
      `</div>
       <div class="rank-card-m">夺冠奖励：灵石 ${b.champion.stone}　修为 ~${b.champion.cult}　贡献 ${b.champion.contrib}　人情 ${b.champion.favor}</div>`;
    body.appendChild(box);
  } else {
    body.appendChild(el('div','rank-note','你所在的境界还没有设台。'));
  }

  body.appendChild(el('div','rank-sub', '四条赛道（你只能报自己这一条）'));
  T.brackets.forEach(b=>{
    const row = el('div','rank-row' + (b.mine?' me':'') + (b.cleared?' done':''));
    row.innerHTML =
      `<div class="rr-name">${b.name}${b.mine?'　<span class="rk-ok">← 你在这儿</span>':''}</div>
       <div class="rr-desc">${b.desc}</div>
       <div class="rr-meta">门槛 ${G.gateName(b)}　夺冠：灵石 ${b.champion.stone}　名号「${b.champion.title}」` +
        (b.cleared ? '　<span class="rk-ok">已参赛</span>' : '') + `</div>`;
    body.appendChild(row);
  });
  if (T.titles.length){
    body.appendChild(el('div','rank-note','你这一世挣到的名号：<b style="color:#c9a227">' +
      T.titles.join('　') + '</b>'));
  }

  /* ==================== ② 天骄榜 ==================== */
  body.appendChild(el('div','rank-h','二　天 骄 榜'));
  body.appendChild(el('div','rank-note',
    `榜上的人**远超同境界修士**——气血与攻击都是同阶凶物的数倍。\n` +
    `同境界撞上他们，基本没有胜算；只有把数值堆到明显超出同阶（大量元界修复 + 好牌）才有把握。\n` +
    `打赢一次就记进档案柜，是终身成就。一局只会遇到同一个人一次。`));

  /* ---- 第 27 轮：天骄榜改成按大境界分页 ----
     玩家要求：「通过点击不同的『大境界』来展示不同大境界的天骄的排行」。
     旧版是把四个大境界的人**一路排下去**，一屏八条，
     看起来像一张清单而不是一张榜；而且「我现在该关心哪两个」全靠自己找。
     现在：上面一排可点的境界页签（带各自的战绩进度），下面只显示这一页的人。 */
  const byMajor = {};
  J.rows.forEach(r=>{ (byMajor[r.major] = byMajor[r.major] || []).push(r); });
  const majors = Object.keys(byMajor).map(Number).sort((a,b)=>a-b);
  const realmNameOf = m => (G.MAJOR_REALMS && G.MAJOR_REALMS[m-1]) || (m+'');
  const progressOf = m => {
    const rows = byMajor[m] || [];
    const won = rows.filter(r=>r.beatenThisRun || r.beatenEver).length;
    const met = rows.filter(r=>r.metThisRun || r.beatenThisRun).length;
    return { won:won, met:met, all:rows.length };
  };
  /* 默认翻到玩家当前所在的那一页 —— 那是他此刻唯一打得着的 */
  let page = majors.indexOf(J.mine) >= 0 ? J.mine : majors[0];

  const tabs = el('div','tj-tabs');
  const pane = el('div','tj-pane');
  function paintTabs(){
    tabs.innerHTML = '';
    majors.forEach(m=>{
      const p = progressOf(m);
      const b = el('button','tj-tab' + (m===page?' on':'') + (m===J.mine?' mine':''));
      b.innerHTML = `${realmNameOf(m)}` +
        `<em>${p.won}/${p.all}</em>` +
        (m===J.mine ? '<i>你在这儿</i>' : '');
      b.addEventListener('click', ()=>{ page = m; paintTabs(); paintPane(); });
      tabs.appendChild(b);
    });
  }
  function paintPane(){
    pane.innerHTML = '';
    const rows = byMajor[page] || [];
    const p = progressOf(page);
    const head = el('div','tj-pane-h');
    head.innerHTML = `${realmNameOf(page)}　` +
      `<span class="rk-dim">已见 ${p.met}/${p.all}　已胜 ${p.won}/${p.all}</span>` +
      (page===J.mine ? '　<span class="rk-ok">← 你在这儿，现在就能碰上</span>'
                     : '　<span class="rk-dim">（不是你现在这一境，碰不到）</span>');
    pane.appendChild(head);
    rows.forEach(r=>{
      const tag = r.beatenThisRun ? '<span class="rk-ok">这一世赢过</span>'
                : r.metThisRun   ? '<span class="rk-bad">交过手（败）</span>'
                : r.beatenEver   ? '<span class="rk-ok">从前赢过</span>'
                : '<span class="rk-dim">尚未谋面</span>';
      const row = el('div','rank-row' + (r.cur?' me':'') + (r.beatenThisRun?' done':''));
      row.innerHTML =
        `<div class="rr-name">${r.name}　<span class="rr-epi">${r.epithet}</span></div>
         <div class="rr-meta">${realmNameOf(r.major)}${r.sub}层　胜过他的报酬：灵石 ${r.reward.stone}　修为 ~${r.reward.cult}` +
         (r.reward.title ? `　名号「${r.reward.title}」` : '') + `</div>
         <div class="rr-meta">${tag}　<span class="rr-where">${
           r.cur ? (r.metThisRun ? '这一世已经照过面了' : '可能出现在机缘、宗门来客、废墟碑文、溪边伤者之处')
                 : '要走到这一境才会碰上'
         }</span></div>`;
      pane.appendChild(row);
    });
    if (!rows.length) pane.appendChild(el('div','arc-empty','这一境还没有人上榜。'));
  }
  paintTabs(); paintPane();
  body.appendChild(tabs);
  body.appendChild(pane);

  const foot = [];
  if (J.seekable){
    /* 第 25 轮：给天骄一条「可以自己走的路」。
       只在见过茶棚那张榜之后才出现——机缘仍然是入口，
       但它不再是唯一入口。 */
    const b = btn('循 名 去 找 他（寿元 −' + st.cost + '）','btn-main', ()=>{
      const r = G.Engine.seekTianjiao();
      if (!r || !r.ok){ toast((r&&r.msg)||'找不到','bad'); return; }
      closeSheet();
      autoSave();
      startTianjiaoFlow(r);
    });
    foot.push(b);
  } else if (!J.heard){
    body.appendChild(el('div','rank-note',
      '（你还没见过山下茶棚里那张榜。见过之后，这里会多一个「循名去找人」。）'));
  } else {
    body.appendChild(el('div','rank-note',
      '（这个境界上，榜里没有你还没见过的人了。往上走，才碰得到更上面的名字。）'));
  }
  foot.push(btn('关 上','btn-main',()=>closeSheet()));
  sheet('榜', body, foot);
}

/* 循名去找天骄 → 直接开打。
   走的是和机缘事件里完全一样的那条挑战通道（tianjiaoChallenge），
   所以数值、战果、终身成就的记账都不会有第二套实现。 */
function startTianjiaoFlow(r){
  const tj = r.tj;
  const b = el('div');
  b.innerHTML =
    `<div class="ev-text">${(r.intro||'').replace(/\n/g,'<br>')}</div>` +
    `<div class="ev-flavor">你走了很久，最后在一处没有名字的地方见到了他。\n\n` +
    `“你找我？”他说。\n“你知道我要来。”\n“知道。”\n\n` +
    `他没有问你为什么来。他站起来了。</div>`;
  const wrap = el('div');
  wrap.style.marginTop = '10px';
  wrap.appendChild(btn('动 手','btn-main btn-go',()=>{
    closeSheet();
    startChallengeFlow(r.cfg);
  }));
  wrap.appendChild(btn('算 了（已经花掉的寿元不退）','btn-main',()=>{
    closeSheet();
    renderRun();
  }));
  b.appendChild(wrap);

  /* ⚠️ 这里不能像事件那样「先看文本再决定」——
     挑战配置已经生成，所以「算了」= 白白跑一趟。
     这是有意的：找上门这件事本身就该有代价。 */
  sheet(tj.title || tj.name, b, []);
}

/* ---- 牌组 / 宗门 / 记事 ---- */
function showDeck(){
  const raw = G.Engine.state().raw;
  const cs2 = G.Engine.combatStats();   // 第 20 轮：卡面要显示「战斗里真正的数值」
  /* ⚠️ 第 25 轮修：这一句原本写在函数**末尾**（「总计」那一段前面），
     但上面的卡牌循环里已经用到了 a.pillSetMul（丹药的实际效果要乘丹火不熄）。
     于是只要身上有**任意一枚丹药**，打开「牌组」就会抛
     ReferenceError: Cannot access 'a' before initialization —— 整个面板白屏。
     这类 TDZ 错误在浏览器里只表现为「点了没反应」，很难查，所以把声明提到最前面。
     （是 dev/verify-uiclaims.js 渲染面板时抓出来的。） */
  const a = G.Engine.agg();
  const body = el('div');
  const groups = { '功法':[], '术法':[], '法宝':[], '丹药':[] };
  const counted = {};
  raw.deck.forEach(n=>{ counted[n] = (counted[n]||0) + 1; });
  Object.keys(counted).forEach(n=>{
    const c = G.CARDS[n];
    if (c) groups[c.type].push({ n:n, c:c, k:counted[n] });
  });

  // ---- 流派套装状态（第 18 轮）----
  const sets = G.Engine.activeSets();
  const schoolCount = {};
  raw.deck.forEach(n=>{
    const c = G.CARDS[n];
    if (c && c.type==='法宝'){ const sc = c.school||'zhong'; schoolCount[sc]=(schoolCount[sc]||0)+1; }
  });
  if (Object.keys(schoolCount).length){
    body.appendChild(el('div','arc-h','法 宝 流 派'));
    const box = el('div','set-box');
    G.SETS.forEach(st=>{
      const have = schoolCount[st.school] || 0;
      const on = have >= st.need;
      const row = el('div','set-row' + (on?' on':''));
      row.innerHTML =
        `<div class="set-top"><span class="set-name">${st.name}</span>
           <span class="set-prog">${have} / ${st.need}</span></div>
         <div class="set-eff">${st.effect}</div>`;
      box.appendChild(row);
    });
    body.appendChild(box);
  }

  Object.keys(groups).forEach(t=>{
    if (!groups[t].length) return;
    body.appendChild(el('div','arc-h', t + `（${groups[t].reduce((a,b)=>a+b.k,0)}）`));
    groups[t].forEach(g=>{
      const rl = (raw.refine && raw.refine[g.n]) || 0;
      const cm = G.Engine.cardMul(g.n);
      /* 第 20 轮：以前卡面显示的是卡自己的 power/heal/ward 原始值，
         而战斗实际用的是「属性 × 招式倍率 × 常驻战力乘数」。
         两个数字对不上，玩家就觉得「界面在骗我」。现在显示实际值。 */
      const t = G.TECHNIQUES[g.n];
      let powTxt = '';
      if (t){
        if (t.kind==='dmg') powTxt = '伤害约 ' + Math.round(cs2.techPower * cs2.techMul * t.mul);
        else if (t.kind==='heal') powTxt = '回复约 ' + Math.round(cs2.techPower * t.heal);
        else if (t.kind==='ward') powTxt = '护体 +' + Math.round(cs2.ward * t.ward);
        else if (t.kind==='buff') powTxt = '闪避大幅提升';
        else if (t.kind==='karma') powTxt = '业障 ' + t.karma;
        if (t.kind!=='ward' && t.ward) powTxt += '　护体 +' + Math.round(cs2.ward * t.ward);
        if (t.kind!=='dmg' && t.mul) powTxt += '　伤害约 ' + Math.round(cs2.techPower * cs2.techMul * t.mul);
      } else if (g.c.power) {
        powTxt = '常驻战力 ' + Math.round(g.c.power * cm);
      } else if (g.c.eff && g.c.eff.power) {
        powTxt = '常驻战力 ' + Math.round(g.c.eff.power * cm);
      } else if (g.c.ward || (g.c.eff && g.c.eff.ward)) {
        powTxt = '常驻护体 ' + Math.round((g.c.ward||0) + ((g.c.eff&&g.c.eff.ward)||0));
      } else if (g.c.use) {
        const u = g.c.use;
        const pm = 1 + (a.pillSetMul||0);
        /* 第 25 轮：丹药还带品级 —— 牌组里也把「几品」和实际倍率写出来，
           免得玩家在牌组看到的数字和储物袋里的对不上。 */
        const po = (typeof G.Engine.pillOutcome === 'function') ? G.Engine.pillOutcome(g.n) : null;
        const m2 = pm * ((po && po.mul) || 1);
        powTxt = [u.life?('气血 +'+Math.round(u.life*m2)):'', u.cult?('修为 +'+Math.round(u.cult*m2)):'',
                  u.lifeMax?('寿元上限 +'+Math.round(u.lifeMax*m2)):''].filter(Boolean).join('　');
        if (po) powTxt = `${po.grade} 品　` + powTxt +
          (po.mul !== 1 ? `　<span class="pg-mul">×${po.mul.toFixed(2)}</span>` : '');
        if (g.c.battle) powTxt += '　' + g.c.battle;
      }
      const d = el('div','card-item');
      d.innerHTML =
        `<div class="card-top">
           <span class="card-name">${g.n}
             ${rl>0?`<span class="refine-tag">+${rl}</span>`:''}
             <span class="card-tag">${g.c.rarity}</span>
           </span>
           <span class="card-pow">${powTxt}</span>
         </div>
         <div class="card-desc">${g.c.desc||''}</div>`;
      body.appendChild(d);
    });
  });

  /* ---- 总计 ----
     第 20 轮：这里以前显示 agg().power / agg().ward 的原始值，
     而战斗里一分钱都不算——等于在骗玩家。现在**显示战斗真正用的数值**，
     并且把「卡牌对你伤害的乘数」讲清楚。

   实测：六维全部 +500，突破需求一点不变（dev/verify-attrvalue.js 守着这条）。
   这一族错误（界面承诺一个引擎不认识的效果）是本作反复在修的那一种，
   所以这里把每一行都改成**引擎真正读的东西**，并且带上第 34 轮新增的
   地图专属作用 —— 玩家要能一眼看出「堆这一项到底换来什么」。

     悟性  cultMul 里 ×(1 + 悟性×1.2%)；attrSum；书山的读碑与抄录

     神识  critChance；**发现隐藏地点**（血河宗）；荒漠认路

/* ---- 失败转盘 ----
   扇区大小由属性决定：身法高则「脱身」大，体魄高则不易「身死」。
   转盘 = 你的道行替你赌命。                                     */
function showWheel(killerBoost){
  const res = G.Engine.spinWheel(killerBoost);
  const body = el('div');

  body.appendChild(el('div','ev-text','你倒下了。\n接下来的事，不由你决定。'));

  const wheel = el('div','wheel-wrap');
  const disc = el('div','wheel-disc');
  // 按权重画扇区（用 conic-gradient 表现）
  let acc = 0;
  const stops = res.slices.map(s=>{
    const from = acc / res.total * 360;
    acc += s.weight;
    const to = acc / res.total * 360;
    const color = s.tone==='fatal' ? '#7a2f28'
                : s.tone==='bad' ? '#5a3a26'
                : s.tone==='ok' ? '#4a4436' : '#3a5a4a';
    return `${color} ${from}deg ${to}deg`;
  }).join(', ');
  disc.style.background = `conic-gradient(${stops})`;

  const pointer = el('div','wheel-pointer');
  wheel.appendChild(disc);
  wheel.appendChild(pointer);
  body.appendChild(wheel);

  // 图例：让玩家看见自己的属性把哪些扇区变大了
  const legend = el('div','wheel-legend');
  res.slices.forEach(s=>{
    const pct = (s.weight / res.total * 100).toFixed(0);
    legend.appendChild(el('div','wheel-li tone-' + s.tone,
      `${s.name}　<span class="wp">${pct}%</span>`));
  });
  body.appendChild(legend);

  const foot = [];
  const btnSpin = btn('转 动','btn-main btn-go', ()=>{
    btnSpin.disabled = true;
    disc.classList.add('spinning');
    pointer.classList.add('spinning');
    setTimeout(()=>{
      disc.classList.remove('spinning');
      pointer.classList.remove('spinning');
      const out = G.Engine.applyWheelResult(res.hit.id, { killer: killerBoost });
      closeSheet();
      sheet('◆ ' + res.hit.name,
        `<div class="ev-text">${res.hit.text.replace(/\n/g,'<br>')}</div>` +
        (out.effect ? `<div class="ev-flavor">${out.effect}</div>` : ''),
        []);
      renderRun();
      setTimeout(()=>{
        closeSheet();
        if (out.end){ showEnding(out.end); return; }
        afterActionFlow();
      }, 1700);
    }, 1500);
  });
  foot.push(btnSpin);

  sheet('◆ 转 盘', body, foot);
}

function onSanxiuAction(a){
  const kind = a.id.replace('sx_','');

  const line = SANXIU_FLAVOR[a.id] || '';
  toast(line + '　' + res.msg, 'good');

  (res.goals||[]).forEach((g,i)=>{
    setTimeout(()=>toast(`【达成】${g.name} — ${g.reward}`,'epic'), 800 + i*500);
  });
  if (res.dead){ afterDeath(res.dead); return; }
  renderRun();

    setTimeout(()=>showCardPick(res.cards, afterActionFlow), 240);

  afterActionFlow();

    '<span style="color:#6f6459">' + rank.desc + '</span>'));

  /* ---- 宗门主线《三月初七》 ----
     第 29 轮：文案改成和主界面 HUD 同源（storyProgressLine），
     两处说的是同一件事，不会各说各话。
     ⚠️ 指引也从「再做 N 次宗门事务」改掉了：那句话读起来像派活，
     而且把「贡献」说成只有宗门事务才给（其实任务、事件、月俸都会给）。
     现在只说「攒够多少贡献」——怎么攒由玩家自己决定。 */
  const story = st.story;
  const sBox = el('div','sect-story');
  if (story.done >= story.total){
    sBox.innerHTML = '<div class="ss-title">三 月 初 七</div>' +
      '<div class="ss-line">这一条路你已经走到头了。</div>' +
      '<div class="ss-hint">剩下的在别处。</div>';
  } else {
    sBox.innerHTML = '<div class="ss-title">三 月 初 七</div>' +
      '<div class="ss-line">第 ' + (story.done+1) + ' / ' + story.total + ' 页　' +
      (story.next ? story.next.name : '') + '</div>' +
      '<div class="ss-hint">' + (story.need > 0
        ? ('再攒 ' + story.need + ' 点贡献就能往下翻（宗门事务、任务、事件都给）')
        : '你已经可以往下查了') + '</div>' +
      '<div class="ss-opt">这条路不走也行——它不挡任何东西。</div>';
  }
  body.appendChild(sBox);

  /* ---- 宗门任务（攒贡献） ---- */
  body.appendChild(el('div','arc-h','宗 门 事 务'));
  G.SECT_TASKS.forEach(t=>{
    const b = el('button','sect-task');
    b.innerHTML = '<div class="st-name">' + t.name + '</div>' +
      '<div class="st-desc">' + t.desc + '</div>' +
      '<div class="st-gain">贡献 +' + t.contrib + '　灵石 +' + t.stone +
      (t.risk>0 ? '　风险 ' + Math.round(t.risk*100) + '%' : '　无风险') + '</div>';
    b.addEventListener('click', ()=>{
      const r = G.Engine.doSectTask(t.id);
      if (!r) return;
      toast(t.name + '：贡献 +' + r.contrib + '　灵石 +' + r.stone +
        (r.hurt ? '　受伤 寿元 −' + r.hurt : ''), r.hurt ? 'bad' : 'good');
      if (r.dead){ closeSheet(); afterDeath(r.dead); return; }
      autoSave();                     // 第 22 轮：宗门任务也会改状态，落盘
      showSect(); renderRun();
    });
    body.appendChild(b);
  });

  /* ---- 藏经阁：用灵石换功法 ---- */
  body.appendChild(el('div','arc-h','藏 经 阁'));
  body.appendChild(el('div','arc-i',
    '气运越高，请功法越便宜；位份越高，折扣越大。' +
    '<br><span style="color:#6f6459">当前：灵石 ' + raw.stone + '</span>'));
  G.SECT_SHOP.forEach(it=>{
    const know = raw.deck.indexOf(it.card) >= 0;
    const chk = G.Engine.canBuyShop(it.id);
    const pr = G.Engine.shopPrice(it.id);
    const reqRank = G.SECT_RANKS.find(r=>r.id===it.rank);
    const locked = chk.msg && chk.msg.indexOf('位份') >= 0;

    const item = el('div','shop-item' + (know ? ' owned' : '') + (locked ? ' locked' : ''));
    const bt = el('button','shop-buy',
      know ? '已会' : (locked ? reqRank.name + '解锁' : '请功法<br><small>石 ' + pr.price + '</small>'));
    if (know || locked || !chk.ok) bt.disabled = true;
    else bt.addEventListener('click', ()=>{
      const r = G.Engine.buyFromShop(it.id);
      if (!r.ok){ toast(r.msg,'bad'); return; }
      toast('你请到了《' + r.card + '》（灵石 −' + r.price + '）','epic');
      autoSave();                     // 第 22 轮：买功法也要落盘
      showSect(); renderRun();
    });
    item.innerHTML =
      '<div class="shop-info">' +
        '<div class="shop-name">' + it.card +
          (pr.base > pr.price ? '<span class="shop-off">省 ' + (pr.base - pr.price) + '</span>' : '') +
        '</div>' +
        '<div class="shop-desc">' + it.desc + '</div>' +
      '</div>';
    item.appendChild(bt);
    body.appendChild(item);
  });

  /* ---- 建筑 ---- */
  body.appendChild(el('div','arc-h','建 筑'));
  G.BUILDINGS.forEach(b=>{
    const lv = raw.buildings[b.id] || 0;
    const cost = G.Engine.buildCost(b.id);
    const item = el('div','bld-item' + (lv>0?' built':''));
    const can = cost!==null && raw.stone >= cost;
    const bt = el('button','bld-btn', cost===null?'已满':'营造<small style="display:block;font-size:10px;color:#6f6459">石 '+cost+'</small>');
    if (!can) bt.disabled = true;
    else bt.addEventListener('click', ()=>{
      if (G.Engine.doBuild(b.id)){ toast('营造 ' + b.name + ' 成功','good'); autoSave(); showSect(); renderRun(); }
    });
    item.innerHTML =
      '<div class="bld-info"><div class="bld-name">' + b.name +
        '<span class="lv">' + lv + '/' + b.max + '</span></div>' +
        '<div class="bld-desc">' + b.desc + '</div></div>';
    item.appendChild(bt);
    body.appendChild(item);
  });

  /* ---- 弟子 ---- */
  body.appendChild(el('div','arc-h','弟 子'));
  if (!raw.disciples.length){
    body.appendChild(el('div','arc-empty','门下还没有人。'));
    const b = btn('开 门 收 徒（宗门气运 −8）','btn-main',()=>{
      const d = G.Engine.recruitDisciple();
      toast(d.name + ' 入了门（资质 ' + d.quality + '·' + d.trait.n + '）','good');
      autoSave();
      showSect(); renderRun();
    }, raw.sectQi < 8);
    body.appendChild(b);
  } else {
    raw.disciples.forEach(d=>{
      const item = el('div','bld-item');
      const grown = d.grown ? `　出师 ${d.grown} 次` : '';
      /* ⚠️ 门槛必须和 engine 的 growDisciple 用同一个公式（40 + 出师次数×30），
         否则界面显示「距出师 12」而实际还要 42 —— 那就是在骗玩家。 */
      const needQ = 40 + (d.grown||0)*30;
      const prog = Math.min(100, Math.round(((d.cult||0)/needQ)*100));
      item.innerHTML =
        '<div class="bld-info"><div class="bld-name">' + d.name +
          '<span class="lv">资质 ' + d.quality + '　忠诚 ' + Math.round(d.loyalty) + grown + '</span></div>' +
          '<div class="bld-desc">' + d.trait.n + '　' + d.trait.e + '</div>' +
          /* 第 28 轮：让弟子有句话。玩家选的方向是「人和人的关系」，
             而关系的起点是这个人得开口。 */
          (d.line ? '<div class="bld-desc disc-line">' + d.line + '</div>' : '') +
          '<div class="bld-desc"><div class="disc-bar"><div class="disc-fill" style="width:' + prog + '%"></div></div>' +
          '<span class="disc-hint">距出师 ' + Math.max(0, needQ-(d.cult||0)) + '</span></div></div>';
      body.appendChild(item);
      /* 派任务：这是弟子唯一能「上场」的地方 */
      const tasks = el('div','disc-tasks');
      (G.DISCIPLE_TASKS||[]).forEach(t=>{
        const tb = btn(t.name, 'btn-mini', ()=>{
          const r2 = G.Engine.sendDisciple(d.id, t.id);
          if (!r2){ toast('派不出去','bad'); return; }
          if (r2.noqi){ toast('宗门气运不够','bad'); return; }
          if (r2.refused){ toast(r2.name + ' 没理你。','bad'); return; }
          toast((r2.msgs||[]).join('　'), r2.lost ? 'bad' : (r2.hurt ? '' : 'good'));
          autoSave();
          if (r2.end){ closeSheet(); afterDeath(r2.end); return; }
          showSect(); renderRun();
        }, raw.sectQi < t.cost.qi);
        tb.title = t.desc + `（气运 −${t.cost.qi}，风险 ${Math.round(t.risk*100)}%）`;
        tasks.appendChild(tb);
      });
      item.appendChild(tasks);
      body.appendChild(item);
    });
    const b2 = btn('再 收 一 徒（气运 −8）','btn-main',()=>{
      const d = G.Engine.recruitDisciple();
      toast(d.name + ' 入了门（资质 ' + d.quality + '·' + d.trait.n + '）','good');
      autoSave();
      showSect(); renderRun();
    }, raw.sectQi < 8);
    body.appendChild(b2);
    body.appendChild(el('div','arc-i',
      '<span style="color:#6f6459">派弟子出去做事：给灵石与修为，弟子会长（攒够就出师）。\n' +
      '有风险 —— 出事的时候，受伤的可能不只是你，也可能是**他回不来**。\n' +
      '忠诚 ≥70 的弟子，会在你倒下的时候替你挡一次。</span>'));
  }

  sheet('宗 门', body, []);
}

/* ============================================================
   《三月初七》—— 宗门主线
   ------------------------------------------------------------
   第 27 轮重做演出（专属封面 / 逐段浮现 / 结果卡）。
   第 29 轮再来一次，这次解决的是**「模糊」**：

   玩家原话：「当前的主线有些过于模糊了，请想方案进行优化
   （但不能过于强迫玩家一定要走，因为可能会让玩家有厌烦的心理）」。

   「模糊」具体模糊在哪（第 29 轮实测确认）：
     · 它只活在「宗门」面板的一个小盒子里。不点开宗门面板，
       玩家在主界面上完全看不到有这条线存在。
     · 线索面板只列「你还差几条」，从不告诉你这些线索跟主线什么关系。
     · 唯一的指引是一句「再做 N 次宗门事务」——读起来像派活，
       而不是「这条线在往前挪」。

   所以这一轮做三件事，全部是**可见性**，一件都不加限制：
     ① 主界面 HUD 上一行常驻进度（第 N/4 页 · 还差多少）
        —— 只是「看得见」，不弹窗、不打断、不催
     ② 点开它是一个**案卷**：这条线是什么、你查到哪了、
        你手上哪些东西是从它这儿来的
     ③ 明确写出「这条路你不想走也可以」——
        主线永不影响任何数值收益，不走的人一点都不会亏

   ⚠️ 有意**不做**的事：不给主线加独占奖励、不加每日/每局强制、
   不在玩家没准备好时弹窗。用户明确说了「不能过于强迫」。
   ============================================================ */

/* 一条主线进度的短句，主界面 HUD 与宗门面板共用，保证两处说的是同一件事 */
function storyProgressLine(){
  const pr = G.Engine.storyProgress();
  if (!pr) return '';
  /* ⚠️ 第 31 轮：不能写死「四页」了。
     主线从线性四页改成了有岔路的故事图，一共 9 页、每条路走 5 页 ——
     页数要问 storyProgress()，不要写在文案里。
     （第 30 轮刚因为「界面写死档数」修过一批，这里是同一类。） */
  if (pr.done >= pr.total) return `《三月初七》${pr.total} 页都看过了`;
  return `《三月初七》第 ${pr.done+1}/${pr.total} 页` +
         (pr.need > 0 ? `　还差 ${pr.need} 点贡献` : '　可以往下查了');
}

/* 把正文按空行拆成段落，逐段淡入。
   ⚠️ 不能按 \n 拆 —— 正文里的换行大多是「诗行」，
   拆开会让同一段被打成好几块，节奏反而碎了。空行才是段。 */
function storyParagraphs(text){
  return String(text||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
}
function renderStoryText(container, text, baseDelay){
  storyParagraphs(text).forEach((p, i)=>{
    const d = el('div','story-p');
    d.innerHTML = p.replace(/\n/g,'<br>');
    d.style.animationDelay = ((baseDelay||0) + i*170) + 'ms';
    container.appendChild(d);
  });
}

function showSectStory(){
  const st = G.Engine.storyReady();
  if (!st) return;
  const pr = G.Engine.storyProgress();
  const total = G.SECT_STORY.stages.length;
  const pageNo = total - pr.total + pr.done + 1;   // 这一页是第几页

  const body = el('div','story-body');

  /* ① 封面条：章节号 / 页码 / 标题 */
  const cover = el('div','story-cover');
  cover.innerHTML =
    `<div class="story-kicker">宗 门 主 线 · 第 ${pageNo} 页 / 共 ${total} 页</div>` +
    `<div class="story-title">${st.name}</div>`;
  body.appendChild(cover);

  /* ② 正文：逐段浮现 */
  const textBox = el('div','story-text');
  renderStoryText(textBox, st.text, 120);
  body.appendChild(textBox);

  /* ③ 选项（等正文落完再出现，避免抢注意力） */
  const wrap = el('div','story-choices');
  wrap.style.animationDelay = (storyParagraphs(st.text).length*170 + 260) + 'ms';
  body.appendChild(wrap);

  const api2 = api;

  st.choices.forEach((c,i)=>{
    const b = el('button','ev-choice story-choice');
    b.innerHTML = '<div class="ev-ctext">' + (i+1) + '. ' + c.label + '</div>' +
      (c.hint ? '<div class="ev-cmeta">' + c.hint + '</div>' : '');
    b.addEventListener('click', ()=>{
      const beforeClues = (G.Engine.raw.clues||[]).slice();
      /* ⚠️ 第 31 轮：必须把**玩家点的那个选项**传给 advanceStory。
         岔路信息写在选项的 next 上（第三页的三个选项各通向不同的一页），
         只传空的话引擎只能回落到「顺着数组往后」——
         三个选项全都会走到同一条路，分叉静默失效。 */
      const r = c.eff(G.Engine.raw, api2);
      G.Engine.advanceStory(c);
      autoSave();
      /* ④ 结果卡：把「发生了什么」单独演一屏，而不是塞进 toast */
      const gained = (G.Engine.raw.clues||[]).filter(x=>beforeClues.indexOf(x)<0);
      showStoryResult(st, r, gained);
      renderRun();
    });
    wrap.appendChild(b);
  });

  sheet('◆ 三 月 初 七', body, []);
}

/* 结果卡：这一页的收束。
   普通事件给的是 toast（一闪而过），主线给的是一屏 —— 这就是区别。 */
function showStoryResult(st, text, gainedClues){
  const pr = G.Engine.storyProgress();
  const body = el('div','story-body');

  const cover = el('div','story-cover done');
  cover.innerHTML =
    `<div class="story-kicker">第 ${pr.done} 页已完成</div>` +
    `<div class="story-title">${st.name}</div>`;
  body.appendChild(cover);

  const box = el('div','story-text result');
  renderStoryText(box, text || '（你没有说什么。）', 80);
  body.appendChild(box);

  /* 线索：主线最实在的产出，必须单独列出来 */
  if (gainedClues && gainedClues.length){
    const clues = el('div','story-clues');
    clues.style.animationDelay = '420ms';
    clues.innerHTML = '<div class="story-clues-h">这一页你记住了</div>' +
      gainedClues.map(id=>{
        const c = G.clueById ? G.clueById(id) : null;
        return `<div class="story-clue">◈ ${c ? c.title : id}</div>`;
      }).join('');
    body.appendChild(clues);
  }

  /* 下一页的预告：给玩家一个「还差多少」的明确目标 */
  const foot = el('div','story-next');
  foot.style.animationDelay = '560ms';
  foot.innerHTML = pr.next
    ? `下一页：<b>${pr.next.name}</b>　还需累计贡献 <b>${pr.need}</b>（现有 ${pr.have}）`
    : '《三月初七》到这里就写完了。剩下的在别处。';
  body.appendChild(foot);

  const wrap2 = el('div','story-choices');
  wrap2.style.marginTop = '12px';
  const go = btn(pr.next ? '翻 到 下 一 页' : '合 上 册 子','btn-main btn-go',()=>{
    closeSheet();
    setTimeout(()=>showSectStory(), 260);
  });
  wrap2.appendChild(go);
  body.appendChild(wrap2);

  sheet('◆ 三 月 初 七', body, []);
}

function showLog(){
  const raw = G.Engine.state().raw;
  const body = el('div');
  if (!raw.log.length) body.appendChild(el('div','arc-empty','还没有什么值得记的。'));
  raw.log.slice(0,60).forEach(l=>{
    body.appendChild(el('div','log-i', `<span class="t">${l.t}</span>${l.text}`));
  });
  sheet('记 事', body, []);
}

/* 线索 · 案卷（第 29 轮改写）
   ------------------------------------------------------------
   旧版：列一句「你已经注意到了 N / M 处不对」，然后把 LORE 条目
   一条条铺出来，没拿到的写「你还什么都没有注意到」。

   问题（对应玩家说的「主线过于模糊」）：
   玩家在这里看不到**这条线是什么**、**我查到哪了**、
   **我手上哪些东西是这条线给的**。线索和主线是两套各说各话的东西。

   现在它是一份案卷：先给主线的位置，再给手上真的有的东西，
   没拿到的只报数量（本作「隐隐投射」的调子不能丢），
   最后明确写一句「这条路可以不走」——把选择权交回去。 */
function showClue(){
  const st = G.Engine.state();
  const raw = st.raw;
  const prog = G.Engine.clueProgress();
  const pr = G.Engine.storyProgress ? G.Engine.storyProgress() : null;
  const body = el('div');

  /* ---- ① 主线在哪儿 ---- */
  if (pr && st.chapter !== 'sanxiu'){
    const box = el('div','case-main');
    box.innerHTML =
      `<div class="case-h">宗 门 主 线</div>` +
      `<div class="case-t">三 月 初 七</div>` +
      `<div class="case-l">` +
        (pr.done >= pr.total
          ? '这条路你都看过了。剩下的在别处。'
          : `你翻到了第 <b>${pr.done}</b> / ${pr.total} 页` +
            (pr.next ? `　下一页：<b>${pr.next.name}</b>` : '') +
            `<br>` +
            (pr.need > 0
              ? `<span class="case-dim">再攒 <b>${pr.need}</b> 点宗门贡献，就能往下翻。</span>`
              : `<span class="case-ok">已经可以往下翻了。</span>`)) +
      `</div>`;
    body.appendChild(box);

    /* ⚠️ 这一句是刻意写的：用户要求「不能过于强迫玩家一定要走」。 */
    body.appendChild(el('div','case-opt',
      '这条路你可以不走。它不挡任何东西，也不给独一份的好处——' +
      '想查就查，不想查就把它撂在那儿。'));
  }

  /* ---- ② 未了之事（第 31 轮）----
     玩家原话：「我希望很多事件能做到有关联」。
     因果要成立，玩家得先知道**自己身上还挂着什么** ——
     所以这一节把「还没结的账」和「已经有下文的那些选择」列出来。
     只列真的有下文的（G.CAUSE 里登记过的），不倒 74 个标记出来当噪音。 */
  const threads = G.Engine.openThreads ? G.Engine.openThreads() : [];
  if (threads.length){
    body.appendChild(el('div','arc-h','未 了 之 事'));
    threads.forEach(t=>{
      const row = el('div','thread-i' + (t.tone==='bad' ? ' bad' : ''));
      row.innerHTML =
        `<div class="th-n">${t.name}</div>` +
        (t.origin ? `<div class="th-o">起因：${t.origin}</div>` : '') +
        (t.text ? `<div class="th-x">${String(t.text).replace(/\n/g,'<br>')}</div>` : '') +
        (t.when != null ? `<div class="th-w">大概还有 ${t.when} 次行动</div>` : '');
      body.appendChild(row);
    });
  }

  /* ---- ③ 手上真的有的东西 ---- */
  body.appendChild(el('div','arc-h','你 注 意 到 的 地 方'));
  body.appendChild(el('div','arc-i',
    `一共 <b style="color:#c9a227">${prog.got}</b> / ${prog.total} 处。` +
    (prog.got===0 ? '目前一切正常。' : '它们之间，好像有点关系。')));

  const got = G.LORE.zongmen.filter(c=>raw.clues.includes(c.id));
  if (got.length){
    got.forEach(c=>{
      const row = el('div','case-clue');
      row.innerHTML = `<div class="cc-t">${c.title || c.id}</div>` +
                      `<div class="cc-x">${String(c.text||'').replace(/\n/g,'<br>')}</div>`;
      body.appendChild(row);
    });
  } else {
    body.appendChild(el('div','arc-i unk','（你还什么都没有注意到）'));
  }
  if (prog.got < prog.total){
    body.appendChild(el('div','arc-i unk',
      `还有 ${prog.total - prog.got} 处，你见过，但当时没有停下来看。`));
  }

  /* ---- 见闻（第 32 轮补）----
     事件里写着「线索 +1」的地方，有 54 个 id 以前根本没注册，
     案卷里看不见、N/7 也不涨 —— 玩家以为拿到了，其实什么都没有。
     现在它们作为「见闻」列在这里：看得见、记得住，
     但**不计入**上面那个 N/7（那是主线谜题，通向隐藏结局）。 */
  {
    const notes=(G.LORE && G.LORE.notes) || [];
    const myNotes=notes.filter(c=>(raw.clues||[]).includes(c.id));
    if (myNotes.length){
      body.appendChild(el('div','arc-h','你 还 记 得 的 一 些 小 事'));
      body.appendChild(el('div','arc-i',
        `一共 <b style="color:#c9a227">${myNotes.length}</b> 件。` +
        '它们不指向那个答案，但它们是你这一世真的遇见过的东西。'));
      myNotes.forEach(c=>{
        const row = el('div','case-clue');
        row.innerHTML = `<div class="cc-t">${c.title||c.id}</div>` +
                        (c.text?`<div class="cc-x">${String(c.text).replace(/\n/g,'<br>')}</div>`:'');
        body.appendChild(row);
      });
    }
  }

  body.appendChild(el('div','rune','— 集齐全部，会有什么事发生 —'));
  sheet('线 索 · 案 卷', body, []);
}

function showMenu(){
  const body = el('div');
  body.appendChild(el('div','arc-i','这一局还没有结束。你可以随时离开。'));
  sheet('菜 单', body, [
    btn('回到桌前（本局作废）','btn-main',()=>{ closeSheet(); show('screen-meta'); renderMeta(); }),
    btn('主 动 坐 化','btn-go btn-main',()=>{
      closeSheet();
      const r = G.Engine.sitDown();
      if (r) showEnding(r);
    })
  ]);
}

/* ============================================================
   结局
   ============================================================ */
function showEnding(r){
  if (!r) return;
  $('endTitle').textContent = r.ending.title;
  $('endSub').innerHTML = (r.sub||'').replace(/\n/g,'<br>');

  const st = r.stats;
  const body = $('endBody');
  body.innerHTML = '';
  const rows = [
    ['最终境界', st.realm],
    ['所余修为', st.cult],
    ['所余灵石', st.stone],
    ['业 障', st.karma],
    ['人 情', st.favor],
    ['行 动', st.actions + ' 次'],
    ['牌 组', st.cards + ' 张'],
    ['门 下', st.disciples + ' 人'],
    ['线 索', st.clues + ' 条']
  ];
  rows.forEach(([k,v])=>{
    body.appendChild(el('div','end-row', `<span>${k}</span><b>${v}</b>`));
  });

  // 碎片明细：让玩家看得见「这一局的哪一部分换来了拼图」
  let gainHtml = `拼图 +<b>◈ ${r.frag}</b>`;
  if (r.fragParts){
    const detail = Object.keys(r.fragParts)
      .filter(k => r.fragParts[k] > 0)
      .map(k => `${k} ${r.fragParts[k]}`)
      .join('　');
    gainHtml += `<div class="end-frag-parts">${detail}</div>`;
  }
  $('endGain').innerHTML = gainHtml;
  if (r.newLore){
    const c = el('div','clue', r.newLore);
    $('endSub').appendChild(document.createElement('br'));
    $('endGain').appendChild(c);
  }

  /* ---- 道途 · 大事记（第 28 轮） ----
     本作叫《记忆修复局》，主题就是记忆。但在这之前，一世走到结局时
     只给一句结局词 —— 你这一世做过的所有选择全部散掉了。
     这一段就是把它们收回来：先说「你是个什么样的人」，再把编年列出来。 */
  const sum = G.Engine.daotuSummary ? G.Engine.daotuSummary() : null;
  if (sum){
    const wrap = el('div','daotu-wrap');
    wrap.innerHTML =
      `<div class="daotu-title">这 一 世</div>
       <div class="daotu-name" style="color:${sum.dao.color}">${sum.dao.name}</div>
       <div class="daotu-why">${sum.dao.why || ''}</div>`;
    body.appendChild(wrap);

    if (sum.lines.length){
      const chron = el('div','chron');
      sum.lines.forEach(l=>{
        const k = (G.Chron.kinds || {})[l.kind] || { label:'·', color:'#8a8078' };
        const row = el('div','chron-i');
        row.innerHTML =
          `<span class="chron-k" style="color:${k.color}">${k.label}</span>` +
          `<span class="chron-t">${String(l.text).replace(/\*\*/g,'')}</span>`;
        chron.appendChild(row);
      });
      body.appendChild(chron);
    }

    /* 统计：给「称号」一个可以核对的底 */
    const s2 = sum.stats;
    const bits = [];
    if (s2.clues) bits.push(`线索 ${s2.clues}`);
    if (s2.tianjiaoWon) bits.push(`胜过天骄 ${s2.tianjiaoWon}`);
    if (s2.champions) bits.push(`夺魁 ${s2.champions}`);
    /* ⚠️ 第 31 轮：写死的 /4 要改成实际的路线长度。
       主线现在一共 9 页、每条路走 5 页，写死 /4 会让结算页显示「5/4」。 */
    if (s2.storyDone) bits.push(`三月初七 走过 ${s2.storyDone} 页`);
    if (s2.disciplesLost) bits.push(`失去弟子 ${s2.disciplesLost}`);
    if (s2.shielded) bits.push(`被弟子挡过 ${s2.shielded}`);
    if (s2.sectContrib) bits.push(`贡献 ${s2.sectContrib}`);
    if (bits.length) body.appendChild(el('div','daotu-stats', bits.join('　')));
  }

  show('screen-end');
  renderMeta();
}

/* ---- 死亡后处理 ---- */
function afterDeath(dead){
  if (!dead) return;
  if (dead.saved){
    toast('你倒下去了。有什么东西托了你一把。','epic');
    renderRun();
    return;
  }
  showEnding(dead);
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  // 元层 tab
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      $('pane-' + b.dataset.tab).classList.add('active');
    });
  });

  $('btnReset').addEventListener('click', ()=>{
    sheet('抹去全部记忆', '<div class="ev-text">这将删除所有碎片、升级与档案。<br>拼图会重新空掉。<br><br>确定吗？</div>', [
      btn('确 定','btn-main',()=>{ G.Engine.wipe(); closeSheet(); renderMeta(); toast('桌上空了。',''); }),
      btn('再想想','btn-main',()=>closeSheet())
    ]);
  });

  if ($('btnSaveIO')) $('btnSaveIO').addEventListener('click', showSaveIO);

  $('btnReroll').addEventListener('click', ()=>{ currentLots = G.Engine.drawLots(); renderDraw(); });
  $('btnStartRun').addEventListener('click', ()=>{
    G.Engine.clearRun();                 // 开新局，清掉旧存档
    G.Engine.start(currentLots, currentLots.seed);
    show('screen-run');
    renderRun();
    autoSave();
    toast('你入了山门。','' );
  });

  // 继续上一局（若有存档）
  const saved = G.Engine.hasSavedRun();
  if (saved){
    const btnResume = $('btnResume');
    if (btnResume){
      btnResume.classList.remove('hidden');
      const rname = G.REALMS[saved.realmIdx] ? G.REALMS[saved.realmIdx].name : saved.realm;
      btnResume.innerHTML = `继 续 上 一 局<span>${saved.realm}　第 ${saved.actions} 次行动　寿元 ${saved.life} / ${saved.maxLife}${saved.inBattle ? '　·　战斗未结束' : ''}</span>`;
      btnResume.addEventListener('click', ()=>{
        const r = G.Engine.loadRun();
        if (!r){ toast('存档读不出来','bad'); return; }
        show('screen-run');
        renderRun();
        /* 第 22 轮：如果上次是在战斗中关掉页面的，把那一场接回来 ——
           敌人血量、回合数、真气、冷却都在，接着打就行。 */
        const ch = G.Engine.challenge;
        if (ch && ch.active){
          activeChallenge = ch;
          toast('你回到了那一场没打完的架里。','epic');
          setTimeout(()=>renderChallenge(), 320);
          return;
        }
        toast('你回到了山中。','epic');
      });
    }
  }

  $('btnSheetClose').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', e=>{ if (e.target.id==='overlay') closeSheet(); });

  $('btnAttr').addEventListener('click', showAttrs);
  $('btnDeck').addEventListener('click', showDeck);
  $('btnBag').addEventListener('click', showBag);
  $('btnRank').addEventListener('click', showRank);
  if ($('btnMap')) $('btnMap').addEventListener('click', showMap);
  $('btnMijing').addEventListener('click', showMijingBook);
  $('btnSect').addEventListener('click', showSect);
  $('btnClue').addEventListener('click', showClue);
  $('btnLog').addEventListener('click', showLog);
  /* 主界面那行主线进度可点：点开就是案卷。
     ⚠️ 只加「点了有用」，不加「不点会有损失」——用户要求主线不能强迫。 */
  const shBtn = $('storyHud');
  if (shBtn && shBtn.addEventListener) shBtn.addEventListener('click', showClue);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnBackMeta').addEventListener('click', ()=>{ show('screen-meta'); renderMeta(); });

  // 键盘
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape') closeSheet();
    if (!sheetOpen() && $('screen-run').classList.contains('active')){
      const n = parseInt(e.key,10);
      if (n>=1 && n<=9){
        const acts = G.Engine.availableActions().filter(a=>!a.disabled);
        if (acts[n-1]) onAction(acts[n-1]);
      }
    }
  });

  renderMeta();
  show('screen-meta');

  /* 第 21 轮：开局就检查存储能不能用。
     如果不能用（无痕模式 / 禁用网站数据），
     与其让玩家玩一小时后才发现什么都没留下，不如现在就说清楚。 */
  if (!G.Engine.storageAvailable()){
    setTimeout(()=>{
      sheet('⚠ 这个浏览器不让保存进度',
        `<div class="ev-text">游戏需要把进度写进浏览器的**本地存储**。\n` +
        `但这个浏览器现在不允许写入。\n\n` +
        `最常见的原因：你在**无痕 / 隐私模式**下打开的。\n\n` +
        `<b style="color:#c9a227">这意味着：关掉页面，进度就没了。</b>\n\n` +
        `想留下进度，可以：\n` +
        `· 用**普通窗口**重新打开这个网址\n` +
        `· 或者在「存档搬移」里导出一段字符串，自己保管</div>`,
        [ btn('知道了','btn-main',()=>closeSheet()),
          btn('去存档搬移','btn-go btn-main',()=>{ closeSheet(); showSaveIO(); }) ]);
    }, 400);
  }
}

G.UI = { init, toast, show, renderMeta, renderRun, showEnding };

/* 开发期测试钩子（第 25 轮）。
   ------------------------------------------------------------
   这些内部函数挂出来，是为了让**界面的承诺**也能被测到：
   「战斗中显示品质」「榜里能查到天骄和擂台」这类话，
   只有真的渲染一次、去生成的 HTML 里找，才算验证过。
   正式游戏代码不读这个对象，它只服务 dev/ 下的脚本。 */
G.UI.__dev = {
  rarityTag, renderChallenge, showRank, showBag, sheet, closeSheet,
  startTianjiaoFlow, renderRun, showDeck, showAttrs, doNurtureFlow,
  showTianjiaoCompass, showEvent, showSectStory, showStoryResult, renderStoryText,
  showMijingNotice, showMijingEnter, showMijingFloor, resolveMijingPick, showMijingExit,
  showMijingBook, doDivineMijing, renderArchive, showClue, showSect, showBag, startChallengeFlow,
  /* 第 34 轮：舆图与远行 —— 这些必须能被测到（地图要真的渲染出点来） */
  showMap, showPlaceCard, doTravel
};

document.addEventListener('DOMContentLoaded', init);

})();

</script>
