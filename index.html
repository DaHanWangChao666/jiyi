<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="build" content="2026/9/16 12:56:07">
<!-- build: 2026/9/16 12:56:07 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b0a">
<title>记忆修复局</title>
<style>
/* ============================================================
   《记忆修复局》样式表
   原则：竖屏优先、深色、低干扰、手指友好（最小点击区 44px）
   ============================================================ */

:root{
  --bg:#0d0b0a;
  --bg2:#141110;
  --panel:#1b1715;
  --panel2:#221d1a;
  --line:#332b26;
  --line2:#463a32;
  --ink:#e8e0d6;
  --ink2:#a89c8e;
  --ink3:#6f6459;
  --gold:#c9a227;
  --gold2:#e8c95a;
  --jade:#5fae8f;
  --blood:#a83b32;
  --blue:#5b7fa8;
  --purple:#8a6ba8;
  --shadow:0 6px 24px rgba(0,0,0,.55);
  --r:10px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Songti SC","SimSun","Noto Serif SC",Georgia,serif;
  font-size:15px;line-height:1.7;
  overflow:hidden;
}
#app{height:100%;position:relative;overflow:hidden}
.screen{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  max-width:520px;margin:0 auto;
  background:var(--bg);
}
.screen.active{display:flex}
.hidden{display:none !important}

button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.35;cursor:not-allowed}

/* ---------------- 通用按钮 ---------------- */
.btn-main{
  padding:13px 22px;border-radius:var(--r);
  background:var(--panel2);border:1px solid var(--line2);
  color:var(--ink);letter-spacing:.22em;font-size:15px;
  transition:.16s;
}
.btn-main:not(:disabled):active{transform:translateY(1px);background:var(--line)}
.btn-go{border-color:var(--gold);color:var(--gold2)}
.btn-go:not(:disabled):active{background:rgba(201,162,39,.18)}
.btn-ghost{color:var(--ink3);font-size:12px;padding:8px;letter-spacing:.1em}
.btn-icon{
  width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink2)
}
.btn-close{width:34px;height:34px;font-size:22px;color:var(--ink3);line-height:1}

/* ================= 元层 ================= */
#screen-meta{padding:20px 18px 12px;overflow-y:auto}
.meta-head{text-align:center;padding:6px 0 14px}
.meta-title{
  margin:0;font-size:26px;letter-spacing:.4em;font-weight:400;
  color:var(--gold2);text-indent:.4em;
}
.meta-sub{margin:8px 0 0;font-size:12px;color:var(--ink3);letter-spacing:.08em}

.puzzle-wrap{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px;
}
.puzzle-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  aspect-ratio:3/2;
}
.pz{
  border-radius:3px;background:#0a0908;border:1px solid #221d1a;
  transition:.3s;
}
.pz.on{
  background:linear-gradient(135deg,#3a2f1c,#6b5526);
  border-color:var(--gold);
  box-shadow:0 0 8px rgba(201,162,39,.35) inset;
}
.pz.hint{animation:pzPulse 2.4s ease-in-out infinite}
@keyframes pzPulse{0%,100%{opacity:1}50%{opacity:.45}}
.puzzle-count{text-align:center;font-size:12px;color:var(--ink3);margin-top:9px;letter-spacing:.12em}

.frag-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;margin-bottom:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
}
.frag-icon{color:var(--gold);font-size:14px}
.frag-num{font-size:20px;color:var(--gold2);font-weight:700;min-width:2ch;text-align:right}
.frag-label{font-size:12px;color:var(--ink3);letter-spacing:.2em}

.meta-tabs{display:flex;gap:6px;margin-bottom:12px}
.tab-btn{
  flex:1;padding:10px 0;border-radius:8px;font-size:13px;letter-spacing:.16em;
  color:var(--ink3);background:var(--bg2);border:1px solid var(--line);transition:.16s;
}
.tab-btn.active{color:var(--gold2);border-color:var(--gold);background:rgba(201,162,39,.08)}
.meta-body{flex:1;padding-bottom:8px}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 世界观卡片 */
.world-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:11px;transition:.18s;
}
.world-card.locked{opacity:.5}
.world-card:not(.locked):active{transform:scale(.985);border-color:var(--line2)}
.world-name{font-size:17px;color:var(--gold2);letter-spacing:.16em;margin-bottom:5px}
.world-name .wtag{
  font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line2);color:var(--ink3);margin-left:8px;vertical-align:middle;
}
.world-desc{font-size:13px;color:var(--ink2);line-height:1.75}
.world-meta{margin-top:9px;font-size:11px;color:var(--ink3);letter-spacing:.06em}

/* 升级项 */
.up-item{
  display:flex;align-items:center;gap:11px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:9px;
}
.up-info{flex:1;min-width:0}
.up-name{font-size:14px;color:var(--ink)}
.up-lv{font-size:11px;color:var(--gold);margin-left:6px}
.up-desc{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.6}
.up-buy{
  flex:none;padding:9px 13px;border-radius:8px;font-size:12px;
  border:1px solid var(--line2);color:var(--gold2);background:var(--bg2);
  min-width:76px;text-align:center;
}
.up-buy:disabled{border-color:var(--line);color:var(--ink3)}
.up-buy small{display:block;font-size:10px;color:var(--ink3);letter-spacing:.05em}

/* 档案柜 */
.arc-sec{margin-bottom:18px}
.arc-h{font-size:12px;color:var(--gold);letter-spacing:.24em;margin-bottom:9px}
.arc-i{
  font-size:13px;color:var(--ink2);line-height:1.8;
  padding:9px 12px;background:var(--bg2);border-left:2px solid var(--line2);
  border-radius:0 6px 6px 0;margin-bottom:7px;
}
.arc-i.unk{color:var(--ink3);font-style:italic}
.arc-empty{font-size:12px;color:var(--ink3);text-align:center;padding:22px 0;line-height:2}
.meta-foot{text-align:center;padding:10px 0 6px}

/* ================= 抽签 ================= */
#screen-draw{padding:20px 18px 14px;overflow-y:auto}
.draw-head{text-align:center;padding:8px 0 16px}
.draw-head h2{margin:0;font-size:21px;letter-spacing:.5em;font-weight:400;color:var(--gold2);text-indent:.5em}
.draw-sub{margin:8px 0 0;font-size:12px;color:var(--ink3)}
.draw-list{flex:1}
.draw-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:10px;
  animation:drawIn .4s backwards;
}
@keyframes drawIn{from{opacity:0;transform:translateY(14px) rotateX(28deg)}to{opacity:1;transform:none}}
.draw-kind{font-size:11px;color:var(--ink3);letter-spacing:.3em}
.draw-name{font-size:16px;color:var(--gold2);margin:3px 0 5px;letter-spacing:.1em}
.draw-desc{font-size:12.5px;color:var(--ink2);line-height:1.7}
.draw-eff{margin-top:6px;font-size:12px;color:var(--jade);letter-spacing:.03em}

/* 个人气运提示条 */
.luck-bar{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#1c1710,#221c12);
  border:1px solid #4a3a1c;border-radius:9px;
  padding:10px 13px;margin-bottom:11px;
}
.lb-icon{color:var(--gold);font-size:13px}
.lb-txt{font-size:12px;color:var(--ink2);line-height:1.6}
.lb-txt b{color:var(--gold2);font-size:14px}

/* 重抽按钮 */
.reroll-btn{
  display:block;width:100%;margin-top:10px;padding:9px;
  border-radius:7px;font-size:12.5px;letter-spacing:.1em;
  background:rgba(201,162,39,.10);border:1px solid var(--gold);
  color:var(--gold2);transition:.14s;
}
.reroll-btn:active{background:rgba(201,162,39,.22);transform:scale(.985)}
.draw-actions{display:flex;gap:10px;padding:12px 0 4px}
.draw-actions .btn-main{flex:1}

/* ================= 局内 HUD ================= */
#screen-run{background:var(--bg)}
.hud{
  padding:13px 15px 11px;
  background:linear-gradient(180deg,#191512,#121010);
  border-bottom:1px solid var(--line);
}
.hud-row{display:flex;align-items:center;justify-content:space-between}
.hud-realm{font-size:16px;color:var(--gold2);letter-spacing:.14em}
.hud-role{
  font-size:10px;color:var(--ink3);letter-spacing:.1em;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:8px;
  vertical-align:middle;
}
.hud-life{margin:11px 0 9px}
.life-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:5px}
.life-label span:first-child{letter-spacing:.24em;color:var(--ink3)}
.life-bar{height:9px;background:#0a0908;border-radius:5px;overflow:hidden;border:1px solid #2a2320}
.life-fill{
  height:100%;width:100%;border-radius:5px;
  background:linear-gradient(90deg,#7a2f28,#c05a48);
  transition:width .4s ease;
}
.life-fill.warn{background:linear-gradient(90deg,#8a6a1e,#d9a72e);animation:lifePulse 1.1s infinite}
.life-fill.danger{background:linear-gradient(90deg,#6a1f1a,#e04a3a);animation:lifePulse .6s infinite}
@keyframes lifePulse{0%,100%{opacity:1}50%{opacity:.55}}
.life-cost{font-size:11px;color:var(--ink3);text-align:right;margin-top:4px}
.life-cost span{color:var(--blood)}

.hud-res{display:flex;gap:7px;margin-bottom:9px}
.res{
  flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
  background:#100e0d;border:1px solid var(--line);border-radius:7px;padding:6px 2px;
  font-size:13px;
}
.res i{
  font-style:normal;font-size:10px;color:var(--ink3);
  border:1px solid var(--line2);border-radius:3px;padding:0 3px;line-height:1.4;
}
.res span{color:var(--ink);font-weight:700;font-size:14px}
.res.up span{color:var(--jade)}
.res.down span{color:var(--blood)}

.hud-prog{font-size:11px}
.prog-bar{height:4px;background:#0a0908;border-radius:3px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;background:linear-gradient(90deg,#4a6d5c,#7fc9a5);transition:width .4s}
.prog-text{color:var(--ink3);text-align:right}
.prog-text > span{color:var(--jade)}
.prog-text .pow{color:var(--gold);margin-right:10px}
.prog-text .pow.strong{color:var(--gold2);font-weight:700}

/* ================= 行动区 ================= */
.run-main{flex:1;overflow-y:auto;padding:14px 15px 8px}
.act-hint{font-size:12px;color:var(--ink3);letter-spacing:.14em;margin-bottom:10px}
.act{
  display:block;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:9px;transition:.14s;
  animation:fade .3s backwards;
}
.act:not(:disabled):active{transform:scale(.985);border-color:var(--line2);background:var(--panel2)}
.act.primary{border-color:var(--gold);background:linear-gradient(135deg,#221c10,#1b1715)}
.act.danger{border-color:#5a2a24}
.act-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.act-name{font-size:15px;color:var(--ink);letter-spacing:.1em}
.act.primary .act-name{color:var(--gold2)}
.act-cost{font-size:11.5px;color:var(--blood);flex:none}
.act-desc{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.65}
.act-meta{font-size:11px;color:var(--jade);margin-top:5px}

.run-foot{
  display:flex;gap:8px;padding:9px 15px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg2);
}
.foot-btn{
  flex:1;padding:10px 0;border-radius:8px;font-size:12.5px;
  color:var(--ink2);background:var(--panel);border:1px solid var(--line);letter-spacing:.1em;
}
.foot-btn:active{background:var(--panel2)}
.foot-btn em{font-style:normal;color:var(--gold);font-size:11px;margin-left:3px}

/* ================= 结算 ================= */
#screen-end{padding:0;overflow-y:auto}
.end-wrap{padding:52px 24px 30px;text-align:center;max-width:460px;margin:0 auto}
.end-title{
  font-size:27px;letter-spacing:.4em;color:var(--gold2);
  text-indent:.4em;margin-bottom:14px;
  animation:fade 1s;
}
.end-sub{font-size:13px;color:var(--ink2);line-height:2;margin-bottom:26px;font-style:italic}
.end-body{
  text-align:left;font-size:12.5px;color:var(--ink2);line-height:2;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:16px;
}
.end-row{display:flex;justify-content:space-between;border-bottom:1px dashed #241f1c;padding:4px 0}
.end-row:last-child{border:none}
.end-row b{color:var(--ink);font-weight:400}
.end-gain{
  font-size:14px;color:var(--gold);letter-spacing:.14em;margin-bottom:28px;
}
.end-gain b{font-size:22px;color:var(--gold2)}
.end-frag-parts{
  margin-top:8px;font-size:11.5px;letter-spacing:.06em;
  color:var(--ink2);line-height:1.9;
}
.end-wrap .btn-main{width:100%}

/* ================= 弹层 ================= */
.overlay{
  position:fixed;inset:0;background:rgba(4,3,3,.82);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:50;backdrop-filter:blur(2px);
  animation:fade .18s;
}
.sheet{
  width:100%;max-width:520px;max-height:86vh;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  animation:sheetUp .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 11px;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--gold2);letter-spacing:.18em;
}
.sheet-body{flex:1;overflow-y:auto;padding:15px 16px}
.sheet-foot{padding:11px 16px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-foot:empty{display:none}
.sheet-foot .btn-main{flex:1;padding:11px}

/* 事件文本 */
.ev-text{font-size:14px;line-height:2.05;color:var(--ink);white-space:pre-wrap}
.ev-flavor{font-size:12.5px;color:var(--ink3);font-style:italic;margin-top:10px;line-height:1.9}
.ev-choice{
  display:block;width:100%;text-align:left;
  background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;margin-top:9px;transition:.14s;
}
.ev-choice:not(:disabled):active{background:var(--panel2);border-color:var(--gold)}
.ev-choice:disabled{opacity:.4}
.ev-ctext{font-size:13.5px;color:var(--ink);line-height:1.7}
.ev-cmeta{font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:.04em}

/* 牌组/宗门列表 */
.card-item{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:7px;
}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-name{font-size:13.5px;color:var(--ink)}
.card-pow{font-size:12px;color:var(--jade);flex:none}
.card-tag{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:0 4px;margin-left:6px}
.card-desc{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.65}
.bld-item{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;margin-bottom:8px;
}
.bld-item.built{border-color:var(--jade);background:rgba(95,174,143,.07)}
.bld-info{flex:1;min-width:0}
.bld-name{font-size:13.5px;color:var(--ink)}
.bld-name .lv{font-size:10px;color:var(--gold);margin-left:5px}
.bld-desc{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.bld-btn{
  flex:none;padding:8px 11px;border-radius:7px;font-size:11.5px;
  border:1px solid var(--line2);color:var(--gold2);background:var(--panel);
  min-width:66px;text-align:center;
}
.bld-btn:disabled{color:var(--ink3);border-color:var(--line)}

.log-i{font-size:12px;color:var(--ink2);line-height:1.9;padding:5px 0;border-bottom:1px dashed #221d1a}
.log-i b{color:var(--gold2);font-weight:400}
.log-i .t{color:var(--ink3);font-size:10.5px;margin-right:6px}

/* Toast */
.toast-wrap{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:99;display:flex;flex-direction:column;gap:7px;align-items:center;
  pointer-events:none;width:100%;max-width:420px;padding:0 14px;
}
.toast{
  background:rgba(28,23,20,.97);border:1px solid var(--line2);
  border-radius:9px;padding:10px 16px;font-size:13px;
  box-shadow:var(--shadow);animation:toastIn .28s;
  max-width:100%;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.toast.good{border-color:var(--jade);color:#a9e0c8}
.toast.bad{border-color:#7a2f28;color:#f0a99f}
.toast.epic{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 22px rgba(201,162,39,.28)}
.toast.fade{opacity:0;transition:opacity .4s}

/* 线索提示 */
.clue{
  background:linear-gradient(135deg,#1a1512,#241c11);
  border:1px solid #4a3a1c;border-radius:9px;padding:12px 14px;margin-top:10px;
  font-size:12.5px;color:#d9c48a;line-height:1.9;font-style:italic;
  animation:fade .5s;
}
.clue::before{content:"◈ ";color:var(--gold)}

.rune{
  font-size:11px;color:var(--ink3);letter-spacing:.3em;text-align:center;
  padding:12px 0 2px;
}

/* ================= 战斗界面 ================= */
.fight-bars{margin-top:14px}
.fight-bar-block{margin-bottom:11px;padding:10px 12px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.fight-bar-block.foe{border-color:#5a3a30;background:linear-gradient(135deg,#1d1512,#231a16)}
.fight-bar-block.me{border-color:#2f4a40;background:linear-gradient(135deg,#121a17,#16201c)}
.fight-name{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.fight-name span:first-child{color:var(--ink);letter-spacing:.1em}
.fight-name span:last-child{color:var(--ink2);font-size:12px}
.fight-sub{font-size:11px;color:var(--ink3);margin-top:5px;letter-spacing:.04em}

.qi-wrap{margin:2px 0 4px;display:flex;align-items:center;gap:8px}
.qi-bar{flex:1;height:5px;background:#0a0908;border-radius:3px;overflow:hidden;border:1px solid #2a2320}
.qi-fill{height:100%;background:linear-gradient(90deg,#3d5a7a,#6fa8d9);transition:width .3s}
.qi-label{font-size:10px;color:var(--ink3);letter-spacing:.24em}

.fight-log{margin-top:10px;padding:9px 11px;background:#0e0c0b;border-left:2px solid var(--line2);border-radius:0 7px 7px 0}
.fight-log-i{font-size:12px;color:var(--ink2);line-height:1.85}
.fight-log-i:last-child{color:var(--ink)}

.fight-round{font-size:11px;color:var(--ink3);letter-spacing:.2em;text-align:center;flex:1;align-self:center}

.tag-inf{font-size:10px;color:var(--jade);border:1px solid var(--jade);border-radius:3px;padding:0 4px;margin-left:4px;letter-spacing:.04em}
.tag-inf.dim{color:var(--ink3);border-color:var(--line2)}
/* 招式的材料成本（灵石 / 阳寿）——付得起是青的，付不起是红的 */
.cost-ok{color:var(--jade)}
.cost-lack{color:#f0a99f}
.fight-basic{border-color:var(--jade) !important;background:rgba(95,174,143,.07) !important}

/* ================= 失败转盘 ================= */
.wheel-wrap{position:relative;width:210px;height:210px;margin:20px auto 14px}
.wheel-disc{
  width:100%;height:100%;border-radius:50%;
  border:3px solid var(--line2);
  box-shadow:0 0 26px rgba(0,0,0,.6) inset, 0 6px 20px rgba(0,0,0,.5);
  transition:transform 1.5s cubic-bezier(.15,.9,.2,1);
}
.wheel-disc.spinning{transform:rotate(1440deg)}
.wheel-pointer{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:16px solid var(--gold2);filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));
  transition:transform 1.5s cubic-bezier(.15,.9,.2,1);
}
.wheel-pointer.spinning{transform:translateX(-50%) rotate(1080deg)}
.wheel-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.wheel-li{
  font-size:12px;padding:7px 9px;border-radius:7px;background:var(--bg2);
  border:1px solid var(--line);color:var(--ink2);display:flex;justify-content:space-between;
}
.wheel-li .wp{color:var(--ink3);font-size:11px}
.wheel-li.tone-good{border-color:#2f4a40;color:#9ed3ba}
.wheel-li.tone-ok{border-color:#4a4436;color:#c9bd95}
.wheel-li.tone-bad{border-color:#5a3a26;color:#d9a583}
.wheel-li.tone-fatal{border-color:#7a2f28;color:#f0a99f}

/* ================= 属性面板 ================= */
.attr-row{margin-bottom:11px}
.attr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.attr-name{font-size:13.5px;color:var(--ink);letter-spacing:.14em}
.attr-val{font-size:15px;color:var(--gold2);font-weight:700}
.attr-bar{height:5px;background:#0a0908;border-radius:3px;overflow:hidden;border:1px solid #2a2320}
.attr-fill{height:100%;background:linear-gradient(90deg,#6a5526,#c9a227);transition:width .4s}
.attr-desc{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.6}

/* ================= 散修篇 ================= */
.sx-stat{
  background:linear-gradient(135deg,#141c17,#1a2019);
  border:1px solid #2f4a40;border-radius:9px;padding:12px 14px;margin-bottom:12px;
}
.sx-line{font-size:13px;color:var(--ink);letter-spacing:.08em;line-height:1.8}
.sx-line b{color:var(--jade);font-weight:400;letter-spacing:.2em}
.sx-line.dim{font-size:11.5px;color:var(--ink3)}

/* 家底面板：让玩家一眼看见自己攒下了什么 */
.sx-home{
  background:linear-gradient(135deg,#141c17,#182018);
  border:1px solid #2f4a40;border-radius:10px;padding:13px;margin-bottom:12px;
}
.sx-season{
  display:flex;align-items:baseline;gap:9px;padding-bottom:10px;margin-bottom:11px;
  border-bottom:1px solid #24352c;
}
.sx-season-name{font-size:20px;color:var(--jade);letter-spacing:.1em}
.sx-season-bonus{font-size:11.5px;color:#9ed3ba;flex:1}
.sx-day{font-size:11px;color:var(--ink3);letter-spacing:.08em}
.sx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sx-cell{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#0f1512;border:1px solid #24352c;border-radius:7px;padding:7px 2px;
}
.sx-cell i{
  font-style:normal;font-size:10px;color:var(--ink3);
  border:1px solid #2f4a40;border-radius:3px;padding:0 3px;line-height:1.4;
}
.sx-cell b{font-size:16px;color:#a9e0c8}
.sx-cell span{font-size:10px;color:var(--ink3)}
.sx-beast{font-size:11.5px;color:var(--ink3);margin-top:9px;text-align:center;font-style:italic}

/* 散修目标 */
.sx-goals{margin-bottom:6px}
.sx-goal{
  font-size:12px;color:var(--ink2);line-height:1.7;
  background:var(--bg2);border-left:2px solid #4a6d5c;border-radius:0 6px 6px 0;
  padding:8px 10px;margin-bottom:6px;
}
.sx-goal b{color:var(--jade);font-weight:400}
.sx-reward{display:block;font-size:11px;color:var(--gold);margin-top:2px}

.sx-lv{
  font-size:10px;color:var(--jade);border:1px solid #2f4a40;
  border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:middle;
}

.sx-two{display:flex;gap:8px;margin-bottom:6px}
.sx-btn{
  flex:1;padding:13px 10px;border-radius:var(--r);text-align:center;
  background:linear-gradient(135deg,#16201a,#1b2620);
  border:1px solid #2f4a40;color:#a9e0c8;font-size:13.5px;letter-spacing:.14em;
  transition:.14s;
}
.sx-btn:active{transform:scale(.98);border-color:var(--jade)}
.sx-btn span{display:block;font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:.06em}

/* ================= 战斗提示与战利品 ================= */
.fight-warn{
  margin-top:10px;padding:9px 12px;border-radius:8px;font-size:12px;line-height:1.75;
  border:1px solid var(--line2);background:var(--bg2);color:var(--ink2);
}
.fight-warn.ok{border-color:#2f4a40;color:#9ed3ba;background:rgba(95,174,143,.06)}
.fight-warn.risky{border-color:#7a5a26;color:#e3c07a;background:rgba(201,162,39,.07)}
.fight-warn.danger{border-color:#7a2f28;color:#f0a99f;background:rgba(168,59,50,.09)}
.fight-sub b{color:var(--gold2)}
.fight-sub b.unknown{color:#e0705f;letter-spacing:.1em}

.reward-box{
  margin-top:14px;padding:14px;border-radius:9px;
  background:linear-gradient(135deg,#1a1610,#221c12);border:1px solid #4a3a1c;
}
.reward-line{font-size:13.5px;color:var(--ink2);line-height:2.1}
.reward-line b{color:var(--gold2);font-size:15px}
.reward-line.gold b{color:#ffe08a}

/* ================= 比武大会 / 天骄榜（第 22 轮） ================= */
.tourney-info{
  margin-top:14px;padding:12px 14px;border-radius:9px;
  background:linear-gradient(135deg,#141310,#1c1a13);border:1px solid #3d3524;
}
.ti-row{
  display:flex;justify-content:space-between;gap:12px;
  font-size:12.5px;color:var(--ink3);line-height:2.05;
}
.ti-row span{flex:none;color:#6f6459;letter-spacing:.06em}
.ti-row b{color:var(--ink2);font-weight:500;text-align:right}

/* ================= 元层升级分组 ================= */
.up-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 14px;margin-bottom:12px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);
}
.up-frag{font-size:14px;color:var(--ink2)}
.up-frag b{font-size:20px;color:var(--gold2)}
.up-total{font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.up-cat{margin-bottom:18px}
.cat-lv{color:var(--ink3);font-size:11px;letter-spacing:.06em}
.up-bar{height:3px;background:#0a0908;border-radius:2px;overflow:hidden;margin:5px 0 4px}
.up-fill{height:100%;background:linear-gradient(90deg,#6a5526,#c9a227);transition:width .35s}
.up-cur{color:var(--gold);font-weight:400}
.up-item.maxed{border-color:#4a3a1c;background:rgba(201,162,39,.05)}

/* ================= 世界线（飞升之阵） ================= */
.world-clock{
  background:linear-gradient(135deg,#1a1210,#221a14);
  border:1px solid #4a3020;border-radius:var(--r);
  padding:12px 14px;margin-bottom:12px;
}
.wc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.wc-title{font-size:15px;color:#e0a878;letter-spacing:.24em}
.wc-sub{font-size:11px;color:var(--ink3);letter-spacing:.06em}
.wc-bar{height:5px;background:#0a0908;border-radius:3px;overflow:hidden;border:1px solid #2a2018}
.wc-fill{height:100%;background:linear-gradient(90deg,#5a3a26,#c98a4a);transition:width .6s}
.wc-fill.late{background:linear-gradient(90deg,#7a2f28,#e0603a);animation:lifePulse 2.2s infinite}
.wc-reveal{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.8;font-style:italic}

/* ================= 宗门（第 15 轮重做） ================= */
.sect-bless{
  background:linear-gradient(135deg,#1a1710,#201c12);
  border:1px solid #4a3a1c;border-radius:10px;padding:13px;margin-bottom:14px;
}
.sb-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sb-tier{font-size:16px;letter-spacing:.18em}
.sb-qi{font-size:11.5px;color:var(--ink3)}
.sb-bar{height:6px;background:#0a0908;border-radius:3px;overflow:hidden;border:1px solid #2a2320}
.sb-fill{height:100%;transition:width .5s}
.sb-gain{
  font-size:13.5px;color:var(--gold2);margin-top:9px;letter-spacing:.06em;
}
.sb-desc{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.7;font-style:italic}

.sect-story{
  background:linear-gradient(135deg,#191216,#1e161a);
  border:1px solid #4a2a3a;border-radius:10px;padding:13px;margin-bottom:14px;
}
.ss-title{font-size:15px;color:#d99ab8;letter-spacing:.34em;margin-bottom:7px}
.ss-line{font-size:12.5px;color:var(--ink2);line-height:1.8}
.ss-hint{font-size:11.5px;color:var(--ink3);margin-top:6px;font-style:italic}

.sect-task{
  display:block;width:100%;text-align:left;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;margin-bottom:8px;transition:.14s;
}
.sect-task:active{background:var(--panel2);border-color:var(--gold)}
.st-name{font-size:13.5px;color:var(--ink);letter-spacing:.1em}
.st-desc{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.st-gain{font-size:11.5px;color:var(--jade);margin-top:5px}

.shop-item{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:11px 12px;margin-bottom:8px;
}
.shop-item.owned{border-color:#2f4a40;background:rgba(95,174,143,.06);opacity:.75}
.shop-item.locked{opacity:.5}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:13.5px;color:var(--ink)}
.shop-off{
  font-size:10px;color:var(--gold);border:1px solid #4a3a1c;
  border-radius:3px;padding:0 4px;margin-left:6px;
}
.shop-desc{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.shop-buy{
  flex:none;padding:8px 11px;border-radius:7px;font-size:11.5px;
  border:1px solid var(--line2);color:var(--gold2);background:var(--panel);
  min-width:72px;text-align:center;
}
.shop-buy:disabled{color:var(--ink3);border-color:var(--line)}

/* 继续上一局 */
.resume-btn{
  display:block;width:100%;margin-top:12px;padding:14px;
  border-radius:var(--r);text-align:center;
  background:linear-gradient(135deg,#16201a,#1b2620);
  border:1px solid var(--jade);color:#a9e0c8;
  font-size:14px;letter-spacing:.16em;transition:.14s;
}
.resume-btn:active{transform:scale(.985);background:rgba(95,174,143,.12)}
.resume-btn span{
  display:block;font-size:11.5px;color:var(--ink3);
  margin-top:5px;letter-spacing:.06em;
}

/* ================= 精炼与流派套装 ================= */
.refine-tag{
  font-size:10px;color:var(--gold2);background:rgba(201,162,39,.16);
  border:1px solid var(--gold);border-radius:3px;
  padding:0 4px;margin-left:5px;vertical-align:middle;letter-spacing:.04em;
}
.set-box{
  background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:11px;margin-bottom:14px;
}
.set-row{padding:8px 0;border-bottom:1px dashed #221d1a}
.set-row:last-child{border:none}
.set-top{display:flex;justify-content:space-between;align-items:baseline}
.set-name{font-size:13px;color:var(--ink3);letter-spacing:.1em}
.set-prog{font-size:11.5px;color:var(--ink3)}
.set-row.on .set-name{color:var(--gold2)}
.set-row.on .set-prog{color:var(--gold)}
.set-eff{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.set-row.on .set-eff{color:#a9e0c8}

@media (max-height:640px){
  .hud{padding:9px 15px 8px}
  .hud-life{margin:8px 0 7px}
  .run-main{padding:11px 15px 6px}
  .act{padding:11px 14px;margin-bottom:8px}
  .wheel-wrap{width:170px;height:170px;margin:12px auto 10px}
}

/* ================= 存档导出 / 导入 ================= */
.io-box{
  display:block;width:100%;min-height:76px;margin-bottom:9px;
  background:#0a0908;border:1px solid var(--line2);border-radius:8px;
  color:var(--ink2);font-family:ui-monospace,Consolas,monospace;font-size:11px;
  padding:9px;line-height:1.5;resize:vertical;word-break:break-all;
}
.io-box:focus{outline:none;border-color:var(--gold)}

</style>
<style>
/* 移动端兜底：防止双击缩放、适配刘海屏 */
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior:none;}
button{touch-action:manipulation;}
</style>
</head>
<body>

<div id="app">
  <!-- ============ 元层：记忆修复局 ============ -->
  <section id="screen-meta" class="screen">
    <header class="meta-head">
      <h1 class="meta-title">记忆修复局</h1>
      <p class="meta-sub" id="metaSub">桌上摊着一副拼图。还差很多块。</p>
    </header>

    <div class="puzzle-wrap">
      <div class="puzzle-grid" id="puzzleGrid"></div>
      <div class="puzzle-count"><span id="puzzleDone">0</span> / <span id="puzzleTotal">24</span> 块</div>
    </div>

    <div class="world-clock" id="worldClock"></div>

    <div class="frag-bar">
      <span class="frag-icon">◈</span>
      <span class="frag-num" id="metaFrag">0</span>
      <span class="frag-label">碎片</span>
    </div>

    <nav class="meta-tabs">
      <button class="tab-btn active" data-tab="worlds">世界</button>
      <button class="tab-btn" data-tab="upgrade">修复</button>
      <button class="tab-btn" data-tab="archive">档案柜</button>
    </nav>

    <div class="meta-body">
      <div class="tab-pane active" id="pane-worlds"></div>
      <div class="tab-pane" id="pane-upgrade"></div>
      <div class="tab-pane" id="pane-archive"></div>
    </div>

    <div class="meta-foot">
      <button class="btn-ghost" id="btnSaveIO">存档搬移</button>
      <button class="btn-ghost" id="btnReset">抹去全部记忆</button>
    </div>
  </section>

  <!-- ============ 抽签开局 ============ -->
  <section id="screen-draw" class="screen">
    <header class="draw-head">
      <h2>开 局 抽 签</h2>
      <p class="draw-sub">六支签，决定你这一世从哪里开始。</p>
    </header>
    <div class="draw-list" id="drawList"></div>
    <div class="draw-actions">
      <button class="btn-main" id="btnReroll">重 抽</button>
      <button class="btn-main btn-go" id="btnStartRun" disabled>入 宗</button>
    </div>
    <button class="resume-btn hidden" id="btnResume"></button>
  </section>

  <!-- ============ 局内：宗门 ============ -->
  <section id="screen-run" class="screen">
    <header class="hud">
      <div class="hud-row">
        <div class="hud-realm">
          <span id="hudRealm">炼气一层</span>
          <span class="hud-role" id="hudRole"></span>
        </div>
        <button class="btn-icon" id="btnMenu">≡</button>
      </div>
      <div class="hud-life">
        <div class="life-label">
          <span>寿 元</span>
          <span id="lifeText">100 / 100</span>
        </div>
        <div class="life-bar"><div class="life-fill" id="lifeFill"></div></div>
        <div class="life-cost">每次行动 <span id="lifeCost">−3</span></div>
      </div>
      <div class="hud-res">
        <div class="res" title="灵石"><i>石</i><span id="resStone">0</span></div>
        <div class="res" title="修为"><i>修</i><span id="resCult">0</span></div>
        <div class="res" title="业障"><i>业</i><span id="resKarma">0</span></div>
        <div class="res" title="人情"><i>情</i><span id="resFavor">0</span></div>
        <div class="res" title="宗门气运"><i>运</i><span id="resSect">0</span></div>
      </div>
      <div class="hud-prog">
        <div class="prog-bar"><div class="prog-fill" id="cultFill"></div></div>
        <div class="prog-text">
          <span class="pow" id="powText">战力 0 · 手无寸铁</span>
          距突破还需 <span id="cultNeed">100</span> 修为
        </div>
      </div>
    </header>

    <main class="run-main" id="runMain"></main>

    <footer class="run-foot">
      <button class="foot-btn" id="btnAttr">属性</button>
      <button class="foot-btn" id="btnDeck">牌组 <em id="deckCount">0</em></button>
      <button class="foot-btn" id="btnBag">储物袋 <em id="bagCount">0</em></button>
      <button class="foot-btn" id="btnSect">宗门</button>
      <button class="foot-btn" id="btnClue">线索 <em id="clueCount">0</em></button>
      <button class="foot-btn" id="btnLog">记事</button>
    </footer>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="screen-end" class="screen">
    <div class="end-wrap">
      <div class="end-title" id="endTitle"></div>
      <div class="end-sub" id="endSub"></div>
      <div class="end-body" id="endBody"></div>
      <div class="end-gain" id="endGain"></div>
      <button class="btn-main btn-go" id="btnBackMeta">回 到 桌 前</button>
    </div>
  </section>
</div>

<!-- ============ 弹层 ============ -->
<div id="overlay" class="overlay hidden">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <span id="sheetTitle">标题</span>
      <button class="btn-close" id="btnSheetClose">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<div id="toast" class="toast-wrap"></div>

<script>
/* ===== realms.js ===== */
﻿/* ============================================================
   境界表生成器（第 17 轮）
   ------------------------------------------------------------
   从「炼气 ~ 渡劫」共 8 个大境界，每大境界 9 小层。
   ⚠️ 关键字段说明：
     major : 大境界序号（1=炼气, 2=筑基, 3=金丹 …）——由它判断突破
     tier  : 【不要在这里用】战斗系统的敌人难度阶梯用的是同名键
   数值曲线：寿元随大境界激增，但行动消耗也同步涨，
   保证「每个境界的可用行动次数」保持在 20 上下（一局总长可控）。
   ============================================================ */

window.G = window.G || {};


G.MAJOR_DEFS = [
  { name:'炼气', maxLife:100,  cost:3,  need:180,  gain:12,
    desc:'引气入体。你连门都还没进。' },
  { name:'筑基', maxLife:320,  cost:5,  need:520,  gain:20,
    desc:'铸造道基。宗门开始正眼看你了。' },
  { name:'金丹', maxLife:900,  cost:8,  need:1600, gain:34,
    desc:'结丹。你有了自己的「道」，别人开始叫你一声前辈。' },
  { name:'元婴', maxLife:2600, cost:12, need:4600, gain:58,
    desc:'元婴出窍。你可以离开宗门，去任何地方。' },
  { name:'化神', maxLife:7000, cost:18, need:13000, gain:96,
    desc:'神识覆盖百里。你能感觉到有大东西在运转。' },
  { name:'炼虚', maxLife:18000, cost:26, need:36000, gain:158,
    desc:'触碰规则。你能看见阵眼了。' },
  { name:'合体', maxLife:45000, cost:36, need:96000, gain:255,
    desc:'与天地共鸣。阵开始注意到你了。' },
  { name:'大乘', maxLife:110000, cost:50, need:250000, gain:410,
    desc:'此界之巅。你成了阵的候选——或者它的对手。' }
];

/* 小层名：一~九层 + 一个「圆满」 */
G.SUB_NAMES = ['一层','二层','三层','四层','五层','六层','七层','八层','九层'];

/* 每大境界突破时给的属性点（境界越高给得越多） */
G.REALM_ATTR_GAIN = [];

/* ============================================================
   曲线参数（第 23 轮重做：把「修炼速度」变成一等公民）
   ------------------------------------------------------------
   玩家给出的定义：

     **修炼速度 = 每正常修炼消耗 1 寿元得到的修为量**

   于是单次修炼的修为就是：
       修为 = (修炼速度 x 消耗寿元 + 加法增益) x 乘法增益
   （实现见 engine.js 的 doAction('cultivate')；加法来自 cultFlat，
     乘法来自 cultMul —— 也就是功法、法宝、宗门气运那一类。）

   ⚠️ 第 23 轮之前的问题（实测数据见 dev/dbg-cultspeed.js）：
     · 修炼速度**恒等于 1.00**（收益 = 寿元/160、消耗 = 寿元/40，
       两者永远差 4 倍）—— 玩家根本看不到它在涨，只看到消耗在涨
     · 跨大境界时消耗 x2.75 ~ x3.00，而修炼速度 x1.00
       → **突破的那一刻，每点寿元换到的修为掉到三分之一**
     · 结果是修行在后半程彻底失去意义：
       纯修炼占该层需求的比重  炼气 81% → 元婴 **4%**

   现在的模型（四个量各自只负责一件事）：

     cost   行动消耗   = 当层寿元池 / actsPerPool
     speed  修炼速度   = baseSpeed x speedCross^(大境界-1) x speedWithin^(小层-1)
     gain   修行收益   = speed x cost        <- 玩家给的公式（无增益时）
     need   突破需求   = 由「一层允许烧掉寿元池的百分之几」反推

   这样保证：**每一层烧掉的寿元占比是同一个数**，
   不会出现「越练越亏」，也不会出现「一层吃掉整条命」。          */
G.CURVE = {
  tierMulLife: 3,        // 跨大境界的寿元上限倍率（大境界真的是道坎）

  /* ---- 行动预算 ---- */
  actsPerPool: 52,       // 一个寿元池能支撑多少次行动
                         // ⚠️ 它**不决定一局长度**：池子与消耗同比例涨，
                         //    所以每次突破后「还能行动几次」是恒定的。

  /* ============================================================
     修炼速度（第 23 轮重做后的最终模型）
     ------------------------------------------------------------
     定义（玩家给的）：修炼速度 = 每正常修炼消耗 1 寿元得到的修为量
                       = gain / cost
     单次修为 = (修炼速度 x 消耗寿元 + 加法增益) x 乘法增益
     （加法 = cultFlat，乘法 = cultMul / 体质 / 悟性 / 气运；
       实现见 engine.js 的 doAction('cultivate')）

     四条不变量（dev/verify-cultspeed.js 会逐条守）：
       ① 段内：修炼速度严格单调递增 —— 同一个大境界里越练越快
       ② 跨段：突破时修炼速度跳一截（speedCross 3.0 > 消耗倍率 2.66）
       ③ 每层修炼次数落在 4~10 —— 既不秒破，也不磨
       ④ 一个中档事件 = 固定次数的修行 —— 份量不随境界漂

     ⚠️ 一条**主动放弃**的不变量：全 73 档 speed 严格单调。
        段内 speed 与寿元池同比例涨（1.5 倍），而跨段寿元池跳 2.66 倍，
        所以「跨段还要再涨」会让 gain 按 cost² 复合增长 ——
        元婴一层要 46 万修为才能突破，数字直接失控。
        玩家真正感觉得到的是 ① ③，所以守住它们。
     ============================================================ */
  baseSpeed: 1.5,        // 炼气一层的修炼速度（修为 / 寿元）
  /* 段内每小层 x1.59 —— 这个数**必须等于寿元池自己的段内涨幅**
     （一层到九层 = 1 + 8/9x0.6 = 1.533，再叠上 cost 取整约 1.59）。
     为什么必须相等：段内 speed 若涨得比 cost 快，到段末 speed 会冲到
     很高（1.5^8 = 38 倍），而跨段的 jump 只有 2.66 倍 ——
     于是每次突破 speed 都会**掉回谷底**，玩家感觉「越突破越慢」。
     相等时 speed/cost 段内恒定、跨段递增，正好是要的形状。 */
  speedWithin: 1.10,
  /* 跨大境界 x6.3 —— 它同时要满足两件事：
       比「段末 speed / 段首 cost」大，否则突破会掉速度；
       又不能太大，否则 gain 涨得比寿元池快太多、need 会失控。
     6.3 是 21.4（段末 speed）/ 3.0（段首 cost）= 7.1 往下留余量取的，
     实测跨段 speed x1.19、每层修炼次数 5.6~6.0。 */
  speedCross: 3.0,

  /* ---- 突破需求 ---- */
  cultsBase: 12,         // 炼气期一层要几次修行
                         // ⚠️ 这才是**一局长度**的旋钮：调大 = 每层要更多修行 = 一局更长。
                         //    10 时一局约 200~240 次行动（玩家选定 200~260）。
  cultsDecay: 0.88       // 每个大境界下调（境界越高练得越快）
};

(function buildRealms(){
  const C = G.CURVE;
  const list = [];
  let prevTopLife = 0;

  G.MAJOR_DEFS.forEach(function(m, mi){
    const major = mi + 1;
    const life0 = mi === 0
      ? m.maxLife
      : Math.round(prevTopLife * C.tierMulLife);
    /* 本段的修炼速度基准（跨段的跳变在这里） */
    const sp0 = C.baseSpeed * Math.pow(C.speedCross, mi);
    /* 本段的「每层修炼次数」（逐段下调，让高境界练得更快） */
    const K = C.cultsBase * Math.pow(C.cultsDecay, mi);

    for (let s = 0; s < 9; s++){
      const life = Math.round(life0 * (1 + (s / 9) * 0.6));
      const cost = Math.max(1, Math.round(life / C.actsPerPool));
      const speed = sp0 * Math.pow(C.speedWithin, s);
      const gain  = Math.max(1, Math.round(speed * cost));
      const need  = Math.max(10, Math.round(gain * K));
      list.push({
        name: m.name + G.SUB_NAMES[s],
        major: major,
        sub: s + 1,
        maxLife: life,
        cost: cost,
        speed: Number((gain / cost).toFixed(3)),   // 定义式：gain / cost
        gain: gain,
        need: need,
        reward: Math.round(life * 0.03),
        desc: m.desc
      });
    }
    prevTopLife = list[list.length-1].maxLife;
  });

  /* 渡劫：最后一档 */
  const lastR = list[list.length-1];
  const dLife = Math.round(lastR.maxLife * 1.6);
  const dCost = Math.max(1, Math.round(dLife / C.actsPerPool));
  const dSpeed = lastR.speed * C.speedCross;
  const dGain = Math.max(1, Math.round(dSpeed * dCost));
  list.push({
    name:'渡劫', major:9, sub:0,
    maxLife: dLife,
    cost: dCost,
    speed: Number((dGain / dCost).toFixed(3)),
    gain: dGain,
    need: Math.max(10, Math.round(dGain * C.cultsBase * 0.5)),
    reward: 0,
    desc:'要么被献祭，要么去献祭别人。'
  });
  G.REALMS = list;

  /* 属性成长表：按大境界给点，越往后越多 */
  G.REALM_ATTR_GAIN = [];
  list.forEach(function(r, i){
    if (i === 0) return;                 // 第一层是开局，不给成长
    const m = r.major;
    const base = 1 + (m - 1) * 1.6;      // 大境界越高，基数越大
    G.REALM_ATTR_GAIN.push({
      tipo:   Math.round(2 * base),
      lingli: Math.round(2 * base),
      wuxing: Math.round(1 * base),
      shenfa: Math.round(1 * base),
      shenshi:Math.round(1 * base),
      gengu:  Math.round(1 * base)
    });
  });
})();

/* 大境界名（用于敌人境界显示与位份判断） */
G.MAJOR_REALMS = G.MAJOR_DEFS.map(function(m){ return m.name; }).concat(['渡劫']);

/* ============================================================
   境界上限（第 21 轮新增）
   ------------------------------------------------------------
   完整表有 73 档（炼气 → 渡劫）。但内容只铺到元婴：
   后四个大境界各只有 5 个专属事件，硬跑过去会一路重复。
   所以**保留完整表**（敌人曲线要靠它算，见下面 foePowerAt），
   但把「玩家能走到哪」单独拎出来当开关 —— 一个数字就能开合。

     G.CONFIG.realmCap = 4   → 玩家最高到「元婴九层」，此世圆满
     G.CONFIG.realmCap = 0   → 不设上限（完整 73 档）

   为什么保留完整表而不是直接砍掉：
     ① 敌人强度曲线是「按境界序数」算的，砍掉尾巴会让计算基准变化；
     ② 以后内容补齐了，把 realmCap 改大就能放开，不用重算数值。
   取名对齐 MAJOR_DEFS[cap-1]：「元婴」正好是第 4 个大境界。 */
G.REALMS_TOTAL = G.REALMS.length;

function capIndex(){
  const cap = (window.G && G.CONFIG && G.CONFIG.realmCap) || 0;
  if (!cap || cap <= 0) return G.REALMS.length - 1;      // 不设上限
  /* 找到该大境界的最后一层 */
  let last = -1;
  for (let i=0;i<G.REALMS.length;i++) if (G.REALMS[i].major <= cap) last = i;
  return last < 0 ? G.REALMS.length - 1 : last;
}

/* 玩家可走到的最高档（含） */
G.realmCapIndex = capIndex;
/* 玩家可见/可达的境界表长度 */
G.playableRealmCount = function(){ return capIndex() + 1; };
/* 是否已经走到本世上限 */
G.isRealmCapped = function(realmIdx){ return realmIdx >= capIndex(); };
/* 上限那一档的境界名（用于结局文案） */
G.realmCapName = function(){
  const r = G.REALMS[capIndex()];
  return r ? r.name.replace(/[一二三四五六七八九]层$/, '') : '';
};

/* 修为基础收益：随境界指数增长 */

/* 敌人基准强度：只按大境界分段，段内平缓。
   ⚠️ 第 21 轮起这个函数**不再单独决定敌人强度**——强度统一由
   G.foePowerAt() 给（它含跨大境界跳变与段内成长两层）。
   保留它只是为了向后兼容（少数显示/测试会用到），
   所以这里只返回「大境界之间的跳变」。 */
G.foeBase = function(realmIdx){
  const r = G.REALMS[Math.min(realmIdx, G.REALMS.length-1)];
  const seg = (r ? r.major : 1) - 1;

/* ---------------- 玩家伤害公式的镜像（第 21 轮） ----------------
   与 engine.js 的 combatStats() **同源**：
     basicAtk = (4 + 属性总和 × 0.20) × (1 + realmIdx × 0.16)
   改 combatStats() 里那三个常数时，务必同步改这里，
   否则敌人曲线会和玩家实际强度脱节。                              */
G.POWER_FORMULA = {
  atkBase: 4,
  atkPerAttr: 0.20,
  realmMulPerIdx: 0.16,
  /* 基准开局属性总和：无签运时的典型开局（六维合计约 19） */
  seedAttrSum: 19
};

/* ============================================================
   敌人强度的唯一来源：G.foePowerAt（第 21 轮）
   ------------------------------------------------------------
   问题：玩家在**同一个大境界内**从一层长到九层，伤害会涨
   1.4 ~ 6 倍（越早期涨得越猛）；而旧的敌人公式只有一个线性常数
   （1 + 境界序数 × 0.72），完全追不上这条曲线 ——
   于是「同一个大境界里越往后越无敌」，中期开始一路横扫。

   修法：**让敌人按玩家自己的伤害曲线走**。
   取「基准开局属性的玩家」在每一层的代表伤害
      伤害 = (4 + 属性总和 × 0.20) × (1 + 境界序数 × 0.16)
   （常量与 engine.js 的 combatStats() 同源），
   再除以第一层的值，得到一条从 1.0 一路涨到渡劫的乘数。
   敌人血量与攻击都乘这条曲线，两边的相对强弱就被锁死了。

   为什么用「基准开局属性」而不是玩家实时属性：
     · 属性点表是常数，敌人强度因此**可预测、可测试**，
       不会因为某个玩家抽签运气特别好就变得特别难
     · 也不会因为玩家多吃了两张卡，就让下一场战斗凭空变难

   跨大境界的「这道坎」体感从哪来？
     曲线本身在跨段时是**连续**的（不会归零），但每一层的属性点
     会跳一档（炼气 8 → 筑基 22），所以曲线在段首会明显抬头。
     额外的 ×2.4/大境界加成已经去掉 —— 避免和曲线重复计数。    */
G.REALM_GROWTH = (function(){
  const F = G.POWER_FORMULA;
  /* ① 每一层「到达时新增的属性点总和」
     对齐关系（已用 dev/dbg-attrcheck.js 核对）：
       G.REALM_ATTR_GAIN[i-1] 就是「突破到 G.REALMS[i]」那一次给的点数
       （第 0 层是开局，不给成长）。 */
  const per = {};
  G.REALMS.forEach(function(r, i){
    if (i === 0){ per[i] = 0; return; }
    const g = G.REALM_ATTR_GAIN[i-1];
    per[i] = g ? (g.tipo + g.lingli + g.wuxing + g.shenfa + g.shenshi + g.gengu) : 0;
  });
  /* ② 每一层的代表伤害（全局累计，不重置） */
  const dmg = [];
  let cum = 0;
  G.REALMS.forEach(function(r, i){
    cum += (per[i] || 0);
    const attrSum  = F.seedAttrSum + cum;
    const realmMul = 1 + i * F.realmMulPerIdx;
    dmg.push((F.atkBase + attrSum * F.atkPerAttr) * realmMul);
  });
  /* ③ 归一化成「相对第一层」的乘数曲线 */
  G.foeCurve = dmg.map(function(v){ return Math.max(1, v / (dmg[0] || 1)); });
  /* ④ 另存一份「段内相对段首」的倍率，给显示与诊断用 */
  const out = {};
  G.MAJOR_REALMS.forEach(function(name, mi){
    const major = mi + 1;
    const idxs = [];
    for (let i=0;i<G.REALMS.length;i++) if (G.REALMS[i].major === major) idxs.push(i);
    if (!idxs.length) return;
    const base = dmg[idxs[0]] || 1;
    out[major] = idxs.map(function(i){ return Math.max(1, dmg[i] / base); });
  });
  return out;
})();

/* 敌人强度的全局成长乘数：炼气一层 = 1.0 → 渡劫 ≈ 1232 */
G.foeGrowthAt = function(realmIdx){
  if (!G.foeCurve || !G.foeCurve.length) return 1;
  const i = Math.min(Math.max(0, realmIdx), G.foeCurve.length - 1);
  return G.foeCurve[i];
};

/* 敌人强度总乘数 = 曲线。保留这个名字作为唯一入口，方便以后调整。 */
G.foePowerAt = function(realmIdx){
  return G.foeGrowthAt(realmIdx);
};

/* 段内相对倍率（诊断用：同一个大境界里从一层到九层涨了多少） */
G.foeWithinRealm = function(realmIdx){
  const r = G.REALMS[Math.min(realmIdx, G.REALMS.length-1)];
  if (!r) return 1;
  const L = G.REALM_GROWTH[r.major];
  if (!L || !L.length) return 1;
  const i = Math.min(Math.max(0, (r.sub || 1) - 1), L.length - 1);
  return L[i];
};

/* ---------------- 战斗调参（第 21 轮重做） ----------------
   ⚠️ 旧的四个常数（foeHpBase 170 / foeHpPerRealm 0.72 / foeAtkBase 6 /
   foeAtkPerRealm 2.2）是在属性表还只有 41 个值时调的。属性表扩到 72 个值、
   每层给的点数变了之后，其中那个「每层线性成长」的项就彻底失准：
   同一个大境界内玩家伤害涨 6 倍、敌人只涨 1.3 倍 → 中期开始一路横扫。

   新模型把「敌人该多强」从「拍两个基数」改成「写清设计意图，由引擎换算」：

     ① 敌血：让一场寻常仗打 N 个回合
            敌血 = N × 每回合平均输出
     ② 敌攻：让一场仗掉掉玩家多少比例气血
            敌攻 = 掉血比例 × 玩家气血 ÷ N

   两个都再乘上 G.foePowerAt()（那条跟着玩家伤害走的曲线）。
   好处：以后想调难度，改的是「打几回合」「掉多少血」这两个**人话**，
   而不是去猜一个魔法数字；并且无论属性表怎么扩，都不会再失准。 */
G.TUNE = {
  /* 想让一场「寻常」仗打几个回合 */
  fightRounds: 8,
  /* 玩家每回合平均打出「普攻的几倍」。
     ⚠️ 这个值必须**实测**来定，不能靠猜：
     第一版拍了个 1.8，实测 4~6 回合就打完了；
     第二版 1.4，实测 3~5 回合。
     原因是玩家同时吃到了「招式倍率 + 重击 + 属性加成 + 卡牌战力乘数」，
     叠起来远高于单纯的招式倍率。用 dev/dbg-diff2.js 反复校准后取 2.4。 */
  avgTechMul: 2.4,
  /* 一场仗下来，玩家大概掉多少比例的气血。
     ⚠️ 这个值直接决定「压力感」：
     0.65 时实测打完还剩 46~84% 气血（偏松）；
     调到 0.80 后落在 35~70%，中途真的会开始担心血线。 */
  hpLossPerFight: 0.80,
  /* 敌人是否跟随玩家的成长曲线：1.0 = 完全跟随 */
  curveHp:  1.0,
  curveAtk: 1.0
};

/* 由上面的意图值反推出两个基数。
   ⚠️ 必须在 realms.js 算完 G.foeCurve 之后才能调用，所以放在文件末尾。 */
G.foeHpBase = 170;
G.foeAtkBase = 5.6;
G.calibrateFoe = function(refRealmIdx, refAtk, refHp){
  const T = G.TUNE;
  const power = (typeof G.foePowerAt === 'function') ? G.foePowerAt(refRealmIdx) : 1;
  G.foeHpBase  = (T.fightRounds * T.avgTechMul * refAtk) / (power || 1);
  G.foeAtkBase = (T.hpLossPerFight * refHp / Math.max(1, T.fightRounds)) / (power || 1);
  return { foeHpBase:G.foeHpBase, foeAtkBase:G.foeAtkBase, power:power };
};

/* ============================================================
   比武大会（第 22 轮新增）
   ------------------------------------------------------------
   设计意图：
     · **按大境界分赛道**。炼气期的擂台只收炼气期的人，
       筑基期的擂台只收筑基期的人 —— 你不可能在炼气的擂台上
       遇到一个金丹修士（那是另一条赛道的事）。
     · 赛道门槛 = 该大境界的**第五层**。刚进门的新人没资格上台，
       得先在门里练出点样子。
     · 一共 4 轮：初赛 → 复赛 → 半决赛 → 决赛。
       对手一轮比一轮硬（寻常 → 好手 → 强敌 → 凶物）。

{

{
  id:'l6_peer', title:'还有别人在修', cat:'世界', tier:6,

{

{
  id:'sx_wildman', chapter:'sanxiu', tier:0, title:'山里还有别人', cat:'散修', once:true,
  text:'你在山脊上看见一缕烟。\n走过去，是一间塌了半边的屋子，烟从灶里出来的。\n\n屋前坐着一个很老的人。他看见你，点了点头，像早就知道你要来。',
  choices:[
    { label:'坐下来陪他一会儿',
      eff:(s,a)=>{ a.life(0.04); a.cult(30);
        return '你们一句话都没说，坐了半个时辰。\n\n走的时候他说：“往东边那片林子，别去。”\n你没问为什么。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(30); } },
    { label:'问他为什么住在这儿',
      eff:(s,a)=>{ a.cult(20); a.clue('clue_dream');
        return '“我原来也住山下。”他说。\n“后来有一天，我回去，我老婆不认识我了。”\n\n“她不是装的。”他说，“她是真的不认识。”\n修为 +' + a.gain(20); } },
    { label:'帮他修屋顶',
      eff:(s,a)=>{ a.life(-0.03); a.karma(-3); a.favor(2); a.flag('oldman_roof');
        return '你上房把塌的那半边重新搭了一遍。\n他一直在下面看着，没说话。\n\n弄完他递给你一碗水。碗是缺口的。\n业障 −3　人情 +2　寿元 −' + a.lifePct(0.03); } }
  ]
},

{
  id:'sx_grave', chapter:'sanxiu', tier:0, title:'一座无名的坟', cat:'散修', once:true,
  text:'你在林子深处看见一座坟。碑上没有字，只刻着一把剑。\n坟前摆着新鲜的果子——有人来过，而且常常来。',
  choices:[
    { label:'把果子摆正',
      eff:(s,a)=>{ a.karma(-2); a.life(0.02);
        return '你把倒下的果子摆正了，又拔了拔碑前的草。\n做完这些，你在旁边站了一会儿。\n业障 −2　寿元 +' + a.lifePct(0.02); } },
    { label:'在碑前坐一会儿',
      eff:(s,a)=>{ a.cult(35); a.clue('clue_erased');
        return '你坐下来，什么也没想。\n\n坐了很久之后你才反应过来一件事：\n这个碑**太干净了**。干净得像有人天天擦。\n\n可是这附近没有人家。\n修为 +' + a.gain(35); } },
    { label:'走开',
      eff:(s,a)=>{ a.cult(10);
        return '你从坟前绕过去了。\n走出去很远，你回头看了一眼——果子还是新鲜的。\n修为 +' + a.gain(10); } }
  ]
},

{
  id:'sx_night_sound', chapter:'sanxiu', tier:0, title:'夜里的声音', cat:'散修',
  text:'半夜，外面有声音。\n不是很响。像是有什么东西在绕着你的屋子走，一圈，又一圈。\n\n你没有害怕。你只是醒了。',
  choices:[
    { label:'推门看看',
      eff:(s,a)=>{ if(a.chance(0.55)){
          return '你推开门。\n\n门口放着一只死兔子。\n它蹲在远处看着你，然后转身进了林子。\n\n你把兔子收了。明天有肉吃。'; }
        a.life(-0.02);
        return '你推开门。外面什么都没有。\n风把门吹得咣当响了一整夜。\n寿元 −' + a.lifePct(0.02); } },
    { label:'继续躺着',
      eff:(s,a)=>{ a.life(0.03); a.cult(15);
        return '你翻了个身，继续睡。\n声音到后半夜就没了。\n\n早上起来，门口的地上有一圈脚印。绕着你屋子走了一整圈。\n寿元 +' + a.lifePct(0.03) + '　修为 +' + a.gain(15); } },
    { label:'点灯，坐到天亮',
      eff:(s,a)=>{ a.life(-0.04); a.cult(28); a.clue('clue_mirror');
        return '你点了灯，坐到天亮。\n\n灯亮着的时候，声音一直没停。\n天亮之后你去数脚印——**每一圈都比上一圈小一点**。\n\n最后一圈只有巴掌大，就在你窗下。\n修为 +' + a.gain(28) + '　寿元 −' + a.lifePct(0.04); } }
  ]
},

{
  id:'sx_market', chapter:'sanxiu', tier:0, title:'赶集', cat:'散修',
  text:'山下逢五有集。\n你背着山货下去，走到一半就想起来：你不认得价。\n\n上回你卖便宜了一半。',
  choices:[
    { label:'在集上蹲一天，先看别人怎么卖',
      eff:(s,a)=>{ a.life(-0.03); a.stone(45); a.cult(10);
        return '你蹲了一天，什么都没卖。\n第二天你把价报出来的时候，收山货的愣了一下。\n\n“你昨天没白蹲。”他说。\n灵石 +45　修为 +' + a.gain(10) + '　寿元 −' + a.lifePct(0.03); } },
    { label:'直接卖，早卖完早回山',
      eff:(s,a)=>{ a.stone(22); a.life(0.02);
        return '你按上次的价卖了，收摊就走。\n\n回去的路上你算了算账，觉得也还行。\n少赚的那些，就当是买了一天工夫。\n灵石 +22　寿元 +' + a.lifePct(0.02); } },
    { label:'跟旁边摆摊的老头换点东西',
      eff:(s,a)=>{ a.stone(12); a.favor(2); a.addCard('养元丹');
        return '你用两把草药换了他一瓶药，还倒赚了点零头。\n\n“山里人，”他说，“备着点好。”\n灵石 +12　人情 +2　得【养元丹】'; } }
  ]
},

{
  id:'sx_other_sanxiu', chapter:'sanxiu', tier:0, title:'另一个散修', cat:'散修', once:true,
  text:'溪边有个年轻人在洗药。\n药很多，堆了一地。他洗得很慢，看起来很累。\n\n他看见你，戒备地站了起来。',
  choices:[
    { label:'帮他洗',
      eff:(s,a)=>{ a.life(-0.03); a.favor(3); a.karma(-2); a.cult(20);
        return '你蹲下去，什么都没说，帮他把剩下的洗完了。\n\n洗完他递给你一小把。\n“拿着。”他说，“这片山不是谁的。”\n人情 +3　业障 −2　修为 +' + a.gain(20); } },
    { label:'问他这片山还有谁在',
      eff:(s,a)=>{ a.cult(25); a.clue('clue_world');
        return '“多着呢。”他说。\n“往北还有两个，往南那个去年就没出来了。”\n\n“我们这些人啊，”他想了想，\n“谁都记不住谁。”\n修为 +' + a.gain(25); } },
    { label:'各走各的',
      eff:(s,a)=>{ a.stone(15); a.life(0.02);
        return '你从上游取了自己的水，走了。\n\n回山路上你采到几株他没看见的药。\n灵石 +15　寿元 +' + a.lifePct(0.02); } }
  ]
},

/* ==================== 四季与天气 ==================== */

{
  id:'sx_flood', chapter:'sanxiu', tier:0, title:'春汛', cat:'散修',
  text:'开春下了半个月的雨。\n溪水漫上来了，你门前那块地泡在水里。\n\n溪边你搭的那个取水的小台子，冲没了。',
  choices:[
    { label:'把地重新整一遍',
      eff:(s,a)=>{ a.life(-0.05); a.cult(20); a.stone(10);
        return '你干了两天，把土翻出来重新垒好。\n\n垒到最后你发现，泡过的地其实更肥。\n寿元 −' + a.lifePct(0.05) + '　修为 +' + a.gain(20) + '　灵石 +10'; } },
    { label:'趁着水大，去下游捞一捞',
      eff:(s,a)=>{ if(a.chance(0.5)){ a.stone(55); a.life(-0.03);
          return '你在下游的弯道里捞上来不少东西：木头、一只没主的桶、还有一柄锈得看不清的刀。\n\n刀你留下了。铁是好铁。\n灵石 +55　寿元 −' + a.lifePct(0.03); }
        a.life(-0.06);
        return '水太急了。你被冲出去很远，抱住一棵树才停下来。\n\n上岸的时候，鞋没了。\n寿元 −' + a.lifePct(0.06); } },
    { label:'待在屋里，等它退',
      eff:(s,a)=>{ a.life(0.04); a.cult(30);
        return '你哪也没去。\n\n雨打在屋顶上，一整天都没停。你把三本翻烂的书又翻了一遍。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(30); } }
  ]
},

{
  id:'sx_snow', chapter:'sanxiu', tier:0, title:'雪把门堵了', cat:'散修',
  text:'一夜的雪。\n早上你推门，推不开。\n\n你从窗户翻出去，发现雪已经齐腰了。',
  choices:[
    { label:'挖一条路出来',
      eff:(s,a)=>{ a.life(-0.04); a.cult(25);
        return '你挖了半天，从门口一直挖到溪边。\n\n挖完回头看，那条路在雪地里显得特别直。\n你站了一会儿，觉得挺好看。\n寿元 −' + a.lifePct(0.04) + '　修为 +' + a.gain(25); } },
    { label:'不挖了，回去烧火',
      eff:(s,a)=>{ a.life(0.05); a.cult(18);
        return '你把门从里面堵死，烧了一整天的火。\n\n雪在外面，你在里面。\n这一整天你没有做任何有用的事。\n寿元 +' + a.lifePct(0.05) + '　修为 +' + a.gain(18); } },
    { label:'去林子里看看有没有压塌的树',
      eff:(s,a)=>{ a.stone(35); a.life(-0.05); a.flag('snow_wood');
        return '你踩着雪进了林子。压塌的树有七棵。\n\n你拖回来两棵，劈了一个冬天都烧不完的柴。\n灵石 +35（剩下的卖给山下）　寿元 −' + a.lifePct(0.05); } }
  ]
},

{
  id:'sx_summer_night', chapter:'sanxiu', tier:0, title:'夏夜', cat:'散修',
  text:'屋里太热了，你搬了张竹席睡到院子里。\n\n躺下来才发现，头顶上全是星星。\n你以前从来没躺着看过。',
  choices:[
    { label:'数星星',
      eff:(s,a)=>{ a.life(0.04); a.cult(25);
        return '你数到三百多就数不清了。\n\n不是数不清——是有几颗的位置，你觉得刚才不在那儿。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(25); } },
    { label:'就这么躺着，什么都不数',
      eff:(s,a)=>{ a.life(0.05); a.cult(15);
        return '你什么都没想，就那么躺着。\n\n不知道什么时候睡着的。早上是被鸟吵醒的。\n寿元 +' + a.lifePct(0.05) + '　修为 +' + a.gain(15); } },
    { label:'回屋拿纸笔，把星图画下来',
      eff:(s,a)=>{ a.cult(35); a.clue('clue_world'); a.life(-0.02);
        return '你画了半宿。\n\n第二天摊开看，你画的那些星星连起来，是一个圈。\n你不记得自己为什么这么连。\n修为 +' + a.gain(35) + '　寿元 −' + a.lifePct(0.02); } }
  ]
},

{
  id:'sx_autumn_leaf', chapter:'sanxiu', tier:0, title:'秋', cat:'散修',
  text:'一夜之间，山黄了。\n你站在门口，看着叶子一片一片往下掉。\n\n你想起来，你是春天上山的。',
  choices:[
    { label:'扫一扫院子',
      eff:(s,a)=>{ a.life(0.03); a.cult(20);
        return '你扫了半天，堆了一小堆。\n\n扫到一半你就不想扫了，坐在叶堆上，把它们抓起来往天上扔。\n寿元 +' + a.lifePct(0.03) + '　修为 +' + a.gain(20); } },
    { label:'下山一趟，看看山下的秋天',
      eff:(s,a)=>{ a.stone(30); a.favor(2); a.life(-0.03);
        return '山下的秋天和山上不一样：田里是黄的，路上有人在推车。\n\n你在一户人家讨了碗水。他们问你从哪来。\n你想了想，说：“山上。”\n灵石 +30　人情 +2　寿元 −' + a.lifePct(0.03); } },
    { label:'什么都不做，看它掉完',
      eff:(s,a)=>{ a.life(0.04); a.cult(28);
        return '你在门口站了一炷香，又坐下来接着看。\n\n叶子掉了一天才掉完。\n你一片都没漏。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(28); } }
  ]
},

/* ==================== 山下的人 ==================== */

{
  id:'sx_village_sick', chapter:'sanxiu', tier:0, title:'山下有人病了', cat:'散修',
  text:'山下那户人家的小孩病了。\n老太太半夜来敲门，走了半宿的山路。\n\n“你会不会看病？”她问。\n你其实不会。',
  choices:[
    { label:'把存着的草药都带上，跟她下山',
      eff:(s,a)=>{ const d=s.sanxiu||{}; const cost=Math.min(d.herbStock||0, 20);
        a.life(-0.05); a.karma(-4); a.favor(5);
        s.sanxiu.herbStock = Math.max(0, (d.herbStock||0) - cost);
        return '你把药都带上了，虽然你只知道其中几味是干什么的。\n\n到了之后你煮了一锅，让小孩喝下去。\n你守了一夜。第二天早上，烧退了。\n\n老太太要给你钱。你没要。\n业障 −4　人情 +5　存药 −' + cost + '　寿元 −' + a.lifePct(0.05); } },
    { label:'只给她能治伤风的那几味',
      eff:(s,a)=>{ const d=s.sanxiu||{}; const cost=Math.min(d.herbStock||0, 8);
        a.karma(-2); a.favor(2); a.life(-0.01);
        s.sanxiu.herbStock = Math.max(0, (d.herbStock||0) - cost);
        return '你挑了几味最稳的给她，又写了个方子。\n\n“要是明天还烧，再来找我。”你说。\n她收下了，没再多要。\n业障 −2　人情 +2　存药 −' + cost; } },
    { label:'“我不会看病。”',
      eff:(s,a)=>{ a.cult(15);
        return '你说了实话。\n\n她愣了一下，说了声“打扰了”，转身走了。\n你在门口站着，看她打着灯笼一点点下山。\n\n第二天你下山打听了一次。小孩好了，是山下的大夫看的。\n修为 +' + a.gain(15); } }
  ]
},

{
  id:'sx_village_build', chapter:'sanxiu', tier:0, title:'村里修桥', cat:'散修',
  text:'山下那条河上的木桥塌了。村里凑钱重修，人手不够。\n\n管事的看见你，眼睛亮了一下：\n“山上那位，能不能来搭把手？”',
  choices:[
    { label:'去干三天',
      eff:(s,a)=>{ a.life(-0.08); a.karma(-5); a.favor(6); a.stone(-20); a.flag('built_bridge');
        return '你干了三天。搬石头、抬木头、下水打桩。\n\n第三天傍晚，桥合上了。有人放了一挂炮。\n晚上他们拉你喝酒，你没喝多少，但坐到最后。\n\n走的时候，管事的塞给你一个布包，你没打开看，回去才发现是钱。\n业障 −5　人情 +6　灵石 −20（你垫的料钱）　寿元 −' + a.lifePct(0.08); } },
    { label:'只出钱不出力',
      eff:(s,a)=>{ a.stone(-45); a.karma(-2); a.favor(2);
        return '你把灵石给了管事的，说自己有别的要紧事。\n\n他谢了几句，态度客气了很多。\n你回去的路上觉得，那几句客气有点扎人。\n灵石 −45　业障 −2　人情 +2'; } },
    { label:'“我不住山下。”',
      eff:(s,a)=>{ a.life(0.03); a.cult(20);
        return '“我不住山下。”你说。\n\n他“哦”了一声，也没多劝。\n\n桥后来修好了。你从上面走过一次，很稳。\n寿元 +' + a.lifePct(0.03) + '　修为 +' + a.gain(20); } }
  ]
},

{
  id:'sx_letter_from_sect', chapter:'sanxiu', tier:0, title:'一封信', cat:'散修', once:true,
  text:'山下捎上来一封信。\n信封上写的门派名，你认得。\n\n里面只有一张纸，纸上四个字：\n\n「尚在否？」',
  choices:[
    { label:'回信：在',
      eff:(s,a)=>{ a.life(0.02); a.cult(25); a.flag('replied_yes');
        return '你回了一个字：“在。”\n\n写完你想了想，又添了一句：“山上挺好的。”\n\n信捎走了。此后再没有回音。\n寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(25); } },
    { label:'不回',
      eff:(s,a)=>{ a.life(0.04); a.cult(35); a.karma(1);
        return '你把信收进箱底，没回。\n\n当天晚上你睡得不太好，第二天就好了。\n再往后你就没想起过这件事。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(35) + '　业障 +1'; } },
    { label:'把信烧了',
      eff:(s,a)=>{ a.karma(2); a.cult(50); a.flag('burned_letter');
        return '你把信丢进了灶里。\n\n火苗跳了一下就没了。\n你盯着灶看了一会儿，然后去劈柴，劈到天黑。\n修为 +' + a.gain(50) + '　业障 +2'; } }
  ]
},

{
  id:'sx_disciple_passing', chapter:'sanxiu', tier:0, title:'过路的弟子', cat:'散修',
  text:'两个年轻弟子从山道上下来，背着剑，一路在说话。\n经过你门口的时候，其中一个停下来，看了你一眼。\n\n“前辈。”他拱了拱手，\n“您也是修行的？”',
  choices:[
    { label:'点头',
      eff:(s,a)=>{ a.favor(1); a.cult(22);
        return '你点了点头。\n\n他等着你多说点什么，你什么都没说。\n他有点尴尬，又拱了拱手，追上同伴走了。\n\n走远了之后，你听见他跟同伴说：“那位前辈好深。”\n人情 +1　修为 +' + a.gain(22); } },
    { label:'请他们喝水',
      eff:(s,a)=>{ a.favor(3); a.life(0.02); a.cult(15);
        return '你打了两碗水给他们。\n\n他们坐下来歇了一刻，说了很多宗门里的事：\n谁升了执事，谁下山了，哪块灵田今年收成不好。\n\n你听着，像听别人家的事。\n人情 +3　寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(15); } },
    { label:'“不是。”',
      eff:(s,a)=>{ a.cult(30); a.karma(-1);
        return '“不是。”你说。\n\n他愣了一下，然后笑了笑，走了。\n\n你回屋继续干你的活。那天你干得特别顺。\n修为 +' + a.gain(30) + '　业障 −1'; } }
  ]
},

/* ==================== 灵兽与草木 ==================== */

{
  id:'sx_beast_injured', chapter:'sanxiu', tier:0, title:'它受伤了', cat:'散修',
  when:s=>s.sanxiu && s.sanxiu.beast,
  text:'它今天回来的时候，前腿是跛的。\n它不让你碰，自己趴在墙角舔。\n\n你蹲在旁边看了很久。',
  choices:[
    { label:'强行给它上药',
      eff:(s,a)=>{ if(a.chance(0.6)){ a.life(-0.03);
