  // 用 tier 折算「相当于玩家第几层」
  const tierOffset = { weak:-2, normal:0, elite:2, boss:4, terror:6, tribulation:5 }[ch.tier] || 0;
  let foeIdx = myIdx + tierOffset + (ch.cfg.realmOffset || 0);
  if (foeIdx < 0) foeIdx = 0;

  const gap = foeIdx - myIdx;
  // 超出玩家 5 层以上 → 境界未知
  const known = gap <= 5;

  let label;
  if (!known){
    label = '境界未知';
  } else {
    label = G.REALMS[Math.min(foeIdx, G.REALMS.length-1)].name;
  }

  let compare = '';
  if (known){
    if (gap <= -2) compare = '远不如你';
    else if (gap <= 0) compare = '与你相当';
    else if (gap <= 2) compare = '略强于你';
    else compare = '强你不少';
  } else {
    compare = '深不可测';
  }
  return { label:label, known:known, compare:compare, gap:gap, tierLabel:t.label };
}

/* ---------------- 战斗胜利奖励 ----------------
   打赢必须有回报——否则「打斗」就只是风险，不是选择。
   奖励随敌人强度与你当前境界缩放。                              */
function grantCombatRewards(){
  const ch = challenge;
  if (!ch) return null;
  const t = G.ENEMY_TIERS[ch.tier] || G.ENEMY_TIERS.normal;
  const scale = G.foeBase(s.realmIdx) * t.mul;

  const stone = Math.round((14 + s.realmIdx*5) * scale);
  const cult  = Math.round((10 + G.cultBase(s.realmIdx)*0.35) * scale);
  gainStone(stone);
  gainCult(cult);

  const out = { stone:stone, cult:cult, card:null, extra:'' };

  // 强敌有额外掉落
  if (ch.tier === 'boss' || ch.tier === 'terror'){
    if (s.rng() < 0.55){
      const name = randCardName({ bonus:2 });
      if (name){ addCard(name); out.card = name; }
    }
    const fav = 1 + Math.floor(s.rng()*2);
    gainFavor(fav);
    out.extra = `人情 +${fav}`;
  } else if (ch.tier === 'elite'){
    if (s.rng() < 0.25){
      const name = randCardName({ bonus:1 });
      if (name){ addCard(name); out.card = name; }
    }
  }

  // 打赢天劫：额外的修为与寿元 + **劫余**（第 29 轮）
  if (ch.type === 'tribulation'){
    gainCult(Math.round(G.cultBase(s.realmIdx)*0.8));
    gainLife(Math.round(s.maxLife*0.06));
    /* 天谴用 KILLER_BOON，普通天劫用它自己那一劫的 boon。
       ⚠️ 用 cfg.tbName 取名字：challenge 上原本没存 tbName，
       第 29 轮顺手补上了（ch.tbName），免得以后再猜。 */
    const tb = G.TRIBULATIONS[ch.tbName] || null;
    const b = ch.killer ? G.KILLER_BOON
            : (tb && tb.boon) ? tb.boon : null;
    if (b){
      const got = addBoon(b);
      out.boon = { name:b.name, text:b.text, gained:got };
      out.extra = (out.extra?out.extra+'　':'') + `劫余 · ${b.name}`;
    } else {
      out.extra = (out.extra?out.extra+'　':'') + '渡过一劫，心境更稳';
    }
  }
  log(`你胜了 ${ch.foeName}。灵石 +${stone}，修为 +${cult}。`);
  return out;
}

/* ---------------- 劫余（第 29 轮） ----------------
   渡劫 / 天谴留下的本局永久加成。返回一句给玩家看的话，
   说明「到底加了什么、加了多少」—— 数值承诺必须看得见。 */
function addBoon(b){
  if (!b) return '';
  if (!s.boons) s.boons = { hpPct:0, atkPct:0, qiPct:0, wardPct:0, list:[] };
  const bits = [];
  if (b.hpPct){ s.boons.hpPct += b.hpPct; bits.push(`气血上限 +${Math.round(b.hpPct*100)}%`); }
  if (b.atkPct){ s.boons.atkPct += b.atkPct; bits.push(`伤害 +${Math.round(b.atkPct*100)}%`); }
  if (b.qiPct){ s.boons.qiPct += b.qiPct; bits.push(`真气上限 +${Math.round(b.qiPct*100)}%`); }
  if (b.wardPct){ s.boons.wardPct += b.wardPct; bits.push(`护体 +${Math.round(b.wardPct*100)}%`); }
  if (b.attr){
    addAttrBonus(b.attr);
    Object.keys(b.attr).forEach(k=>{
      const cn = (G.ATTRS.find(x=>x.id===k)||{}).name || k;
      bits.push(`${cn} +${b.attr[k]}`);
    });
  }
  if (b.name) s.boons.list.push({ name:b.name, what:bits.join('　') });
  return bits.join('　');
}

/* 计算一次攻击的伤害 */
function calcDamage(base, mul, opts){
  opts = opts || {};
  const ch = challenge;
  const cs = ch.stats;
  let dmg = base * (mul||1);
  let crit = false;
  if (!opts.noCrit && s.rng() < cs.critChance){ crit = true; dmg *= 1.8; }
  dmg *= 0.9 + s.rng()*0.2;               // ±10% 浮动
  if (ch.buffs.dmgMul) dmg *= ch.buffs.dmgMul;
  return { dmg: Math.max(1, Math.round(dmg)), crit: crit };
}

/* ---- 玩家行动：普通攻击（不限次、不耗真气） ---- */
function basicAttack(){
  const ch = challenge;
  if (!ch || ch.over) return { ok:false, msg:'战斗已结束' };
  const r = calcDamage(ch.stats.basicAtk, 1);
  ch.foeHp -= r.dmg;
  pushLog(`你挥出一击，造成 ${r.dmg} 点伤害${r.crit?'（重击！）':''}`);
  const after = advanceRound();
  return { ok:true, dmg:r.dmg, crit:r.crit,
           over:!!(after && after.over), result:after ? after.result : null };
}

/* ---- 招式的「材料成本」（灵石 / 阳寿） ----
   ⚠️ 第 20 轮接上：卡面上一直写着 cost:{stone:40, life:5}，
   但引擎从来没有读过它 —— 又一个「界面承诺了、引擎不认」的空头支票。
   现在招式除了真气，还要付这笔材料。
   life 写的是**寿元上限的百分比**（跟事件一致），因为高境界寿元是百万级，
   写死数字会在后期变成噪音。                                          */
function techCostOf(name){
  const t = G.TECHNIQUES[name];
  return (t && t.cost) || null;
}
/* 这种材料付不付得起？（返回 null 表示付得起，否则返回缺什么的说明） */
function techCostBlock(name){
  const c = techCostOf(name);
  if (!c) return null;
  if (c.stone && s.stone < c.stone) return `灵石不足（需 ${c.stone}，有 ${s.stone}）`;
  if (c.life){
    const need = evLifePct(c.life);
    if (need >= s.life) return `阳寿不足（这一招要 ${need}，你只剩 ${Math.round(s.life)}）`;
  }
  return null;
}
/* 真的扣掉（调用前必须已经过 techCostBlock） */
function payTechCost(name){
  const c = techCostOf(name);
  if (!c) return '';
  const paid = [];
  if (c.stone){ gainStone(-c.stone); paid.push(`灵石 −${c.stone}`); }
  if (c.life){
    const need = evLifePct(c.life);
    s.life -= need;
    paid.push(`寿元 −${need}`);
    const d = checkDeath('slay');
    if (d && !d.saved) return paid.join('　') + '　（你把自己烧完了）';
  }
  return paid.join('　');
}

/* ---- 处理一件「招式附带的效果」（护体 / 治疗 / 业障 / 闪避） ----
   ⚠️ 第 20 轮抽出：以前只有 kind 对应的那一种效果会生效，
   于是『万符归阵』（伤害 + 护体）这种复合招式，护体那一半会被静默丢弃。 */
function applyTechEffect(name, t){
  const ch = challenge;
  const msgs = [];
  if (t.ward){
    const v = Math.round(ch.stats.ward * t.ward);
    ch.buffs.ward += v;
    msgs.push(`护体 +${v}`);
  }
  if (t.heal){
    const before = ch.hp;
    ch.hp = Math.min(ch.hpMax, ch.hp + Math.round(ch.stats.techPower * t.heal));
    msgs.push(`回复 ${ch.hp - before} 点气血`);
  }
  if (t.karma){ gainKarma(t.karma); msgs.push(`业障 ${t.karma > 0 ? '+' : ''}${t.karma}`); }
  if (t.evade){
    ch.buffs.evade = Math.min(0.6, ch.buffs.evade + t.evade);
    msgs.push('身形隐没，闪避提升');
  }
  return msgs;
}

/* ---- 玩家行动：使用招式 ---- */
function useTechnique(name){
  const ch = challenge;
  if (!ch || ch.over) return { ok:false };
  const t = G.TECHNIQUES[name];
  const c = G.CARDS[name];
  if (!t || !c) return { ok:false, msg:'没有这门招式' };
  if ((ch.cooldowns[name]||0) > 0) return { ok:false, msg:`${name} 还在冷却（剩 ${ch.cooldowns[name]} 回合）` };
  if (ch.qi < t.qi) return { ok:false, msg:`真气不足（需要 ${t.qi}，现有 ${ch.qi}）` };
  const blocked = techCostBlock(name);
  if (blocked) return { ok:false, msg:blocked };

  ch.qi -= t.qi;
  ch.cooldowns[name] = t.cd + 1;   // +1 因为本回合末会统一减 1
  const costTxt = payTechCost(name);

  /* 第 20 轮的招式威力 = 属性驱动的基础 × 招式倍率 × 卡牌常驻战力加成 */
  const dmgBase = ch.stats.techPower * (ch.stats.powerMul || 1);
  let msg = '';
  if (t.kind === 'dmg'){
    const r = calcDamage(dmgBase, t.mul);
    ch.foeHp -= r.dmg;
    msg = `【${name}】造成 ${r.dmg} 点伤害${r.crit?'（重击！）':''}`;
  } else if (t.kind === 'heal'){
    msg = `【${name}】`;
  } else if (t.kind === 'ward'){
    msg = `【${name}】`;
  } else if (t.kind === 'buff'){
    msg = `【${name}】`;
  } else if (t.kind === 'karma'){
    msg = `【${name}】心念一净`;
  } else {
    const r = calcDamage(dmgBase, 1);
    ch.foeHp -= r.dmg;
    msg = `【${name}】造成 ${r.dmg} 点伤害`;
  }
  /* 招式自带的附加效果（护体 / 回血 / 减业障 / 闪避） */
  const extras = applyTechEffect(name, t);
  if (extras.length) msg += '　' + extras.join('　');
  if (costTxt) msg += `　(${costTxt})`;
  pushLog(msg);
  const after = advanceRound();
  return { ok:true, msg:msg, over:!!(after && after.over), result:after ? after.result : null };
}

/* ---------------- 丹药品级（第 25 轮） ----------------   品级 = G.CARDS[name].grade（1~9），含义是「这枚丹是给哪个大境界炼的」。
   玩家自己的品级就是他的大境界序号 —— 两套刻度故意用同一个数，
   玩家不需要记第二张表。

   这里只做**一件事**：算出一枚丹此刻吃下去会发生什么。
   usePill() 拿它去执行，储物袋面板拿它去提前告诉玩家。
   ⚠️ 两边必须共用这一个函数，否则界面承诺和实际效果会走散。 */
function pillGradeOfRealm(realmIdx){
  const r = G.REALMS[Math.min(Math.max(0, realmIdx), G.REALMS.length-1)];
  return r ? r.major : 1;
}
function myPillGrade(){
  return pillGradeOfRealm(s ? s.realmIdx : 0);
}

/* 当前境界能炼出 / 采到的丹药池。
   ⚠️ 第 25 轮新增：以前三处产丹点（宗门丹房、散修丹炉、套装「丹火不熄」）
   直接取「全部丹药」——于是炼气期就能炼出 4 品丹。
   现在统一按 minMajor 过滤，和抽卡（randCardName）用同一套规则。
   约定：品级 N 的丹从「大境界 N-1」起可见，也就是最多比你高 1 品。
   高 1 品吃下去只是「药力偏盛」（效果 75% + 5% 反噬），那是可以赌的；
   再高就该是传闻里的东西，不该从自家丹炉里滚出来。 */
function pillPool(){
  const my = myPillGrade();
  const pool = Object.keys(G.CARDS).filter(function(k){
    const c = G.CARDS[k];
    if (!c || c.type !== '丹药' || c.hidden) return false;
    if (c.minMajor && c.minMajor > my) return false;
    return true;
  });
  return pool.length ? pool : ['聚气丹'];
}
function pillOutcome(name){
  const c = G.CARDS[name];
  const P = G.CONFIG.pill;
  const grade = (c && c.grade) || 1;
  const mine  = myPillGrade();
  const d = grade - mine;                       // >0 越品，<0 低品
  let mul = 1, kind = 'ok', bleed = 0, note = '';

  if (d > 0){
    /* 越品：药力过盛。效果打折，同时反噬寿元。 */
    mul = P.overMul[Math.min(d, P.overMul.length - 1)] || P.overMul[P.overMul.length-1];
    bleed = Math.min(P.overBleedMax, P.overBleed * d);
    kind = d >= 2 ? 'danger' : 'warn';
    note = d >= 2
      ? `越品 ${d} 级——药力过盛，效果仅存 ${Math.round(mul*100)}%，反噬 ${Math.round(bleed*100)}% 寿元上限`
      : `越品 1 级——药力偏盛，效果 ${Math.round(mul*100)}%，反噬 ${Math.round(bleed*100)}% 寿元上限`;
  } else if (d < 0){
    /* 低品：药力过时。 */
    mul = Math.max(P.underMin, Math.pow(P.underMul, -d));
    kind = 'dim';
    note = `低于你 ${-d} 品——药力过时，效果仅存 ${Math.round(mul*100)}%`;
  } else {
    note = '正合你的境界';
  }
  return { name, grade, mine, diff:d, mul, bleed, kind, note };
}

/* ---- 使用丹药 ----
   ⚠️ 第 24 轮：丹药以前**只能在战斗里吃**（`if (!ch || ch.over) return`），
   于是玩家攒了一堆回血丹、破障丹，打完架就只能看着。
   玩家反馈：「丹药什么的物品，仅能在战斗中使用，在战斗外无法使用」。

   现在战斗内外都能用：
     · 战斗内：u.life 补的是**战斗气血**（ch.hp）
     · 战斗外：u.life 补的是**寿元**（s.life）—— 这才是它在局外的对应物
   其余效果（修为 / 寿元上限 / 业障）两边完全一致。

   第 20 轮还接过套装「丹火不熄」的「丹药效果翻倍」。

   ⚠️ 第 25 轮：加入**品级**。见 pillOutcome()——
   越品伤身、低品减效，两种惩罚都在这里执行。 */
/* 是否是「可以吃/可以用掉的一次性东西」。
   第 27 轮：「问影香」是法宝但也是一次性消耗品，
   所以判据从「type==='丹药'」放宽到「丹药 或 标了 consumable」。 */
function isConsumable(c){ return !!c && (c.type === '丹药' || c.consumable === true); }

function usePill(name){
  const c = G.CARDS[name];
  if (!isConsumable(c)) return { ok:false, msg:'这个东西不是一次性的' };
  if (!s || s.ended) return { ok:false, msg:'这一局已经结束了' };
  const idx = s.deck.indexOf(name);
  if (idx < 0) return { ok:false, msg:`你身上没有【${name}】` };

  const ch = (challenge && !challenge.over) ? challenge : null;
  s.deck.splice(idx, 1);

  /* pillMul = 套装「丹火不熄」× 品级倍率（越品打折 / 低品打折） */
  const po = pillOutcome(name);
  const pillMul = (1 + (agg().pillSetMul || 0)) * po.mul;
  const u = c.use || {};
  const parts = [];

  if (u.life){
    const v = Math.round(u.life * pillMul);
    if (ch){
      const b = ch.hp;
      ch.hp = Math.min(ch.hpMax, ch.hp + v);
      parts.push(`气血 +${ch.hp - b}`);
    } else {
      const b = s.life;
      gainLife(v);
      parts.push(`寿元 +${s.life - b}`);
    }
  }
  if (u.cult){ const v = Math.round(u.cult * pillMul); gainCult(v); parts.push(`修为 +${v}`); }
  if (u.lifeMax){
    const v = Math.round(u.lifeMax * pillMul);
    raiseMaxLife(v);                       // raiseMaxLife 会同时补上当前值
    if (ch){ ch.hpMax += v; ch.hp += v; }
    parts.push(`寿元上限 +${v}`);
  }
  if (u.karma){ gainKarma(u.karma); parts.push(`业障 ${u.karma > 0 ? '+' : ''}${u.karma}`); }

  /* ---- 问影香：把「当前大境界某位还没见过的天骄」指给你看（第 27 轮） ----
     它不产生任何数值效果，只产生**信息**与**一个选择**。
     所以这里把目标放进返回值，由界面接手弹「去 / 不去」。
     ⚠️ 不在这里就开打 —— 玩家得先看见那是谁、在哪儿，再决定。
     这也是玩家的原话：「向你展示……并让你选择要不要去找那位天骄」。 */
  if (u.tianjiao){
    const tj = tianjiaoForRealm();
    if (!tj){
      /* 这一境已经见完了。香还是要烧掉的（它是一次性道具），
         但要把话说清楚，不能让玩家觉得东西白没了。 */
      const major = (G.REALMS[s.realmIdx]||{major:1}).major;
      s.deck.push(name);                    // 退还：这不是玩家的错
      return { ok:false, outOfBattle:true,
               msg:`烟直着往上走了，没有偏向任何一边。\n\n这一境榜上的人，你已经都见过了。\n（【${name}】没有烧掉）` };
    }
    const dir = HAUNT_DIRS[Math.floor((s.rng ? s.rng() : Math.random()) * HAUNT_DIRS.length)];
    log(`你点着了${name}。烟往${dir}飘。`);
    saveRun();                              // 香已经烧了，先落盘
    return { ok:true, outOfBattle:true, tianjiaoCompass:true, tj:tj, dir:dir,
             msg:`烟从香头上起来，没有往上走。它往${dir}飘。` };
  }

  /* ---- 永久战斗丹：本局内永久累加 ---- */
  if (u.perm){
    if (!s.pillPerm) s.pillPerm = { hpPct:0, atkPct:0, qiPct:0, wardPct:0 };
    const label = { hpPct:'气血上限', atkPct:'伤害', qiPct:'真气上限', wardPct:'护体' };
    Object.keys(u.perm).forEach(k=>{
      const v = u.perm[k] * po.mul;
      s.pillPerm[k] = (s.pillPerm[k] || 0) + v;
      parts.push(`${label[k]||k} 永久 +${Math.round(v*100)}%`);
    });
    /* 永久丹改的是战斗属性，正在打的话要立刻重算，否则本场看不到效果 */
    if (ch) refreshChallengeStats();
  }
  /* ---- 限时战斗丹：接下来 N 场 ---- */
  if (u.temp){
    if (!s.pillTemp) s.pillTemp = { fights:0, atkPct:0, dmgCut:0, evade:0 };
    const t = s.pillTemp;
    /* ⚠️ 同类效果不叠加，只取更强的那一份，并把场次刷新为更长的那个。
       否则囤十颗爆元丹就是无脑通关（这是第 25 轮特意挡掉的）。 */
    t.fights = Math.max(t.fights || 0, u.temp.fights || 1);
    if (u.temp.atkPct) t.atkPct = Math.max(t.atkPct || 0, u.temp.atkPct * po.mul);
    if (u.temp.dmgCut) t.dmgCut = Math.max(t.dmgCut || 0, u.temp.dmgCut * po.mul);
    if (u.temp.evade)  t.evade  = Math.max(t.evade  || 0, u.temp.evade  * po.mul);
    const bits = [];
    if (t.atkPct) bits.push(`伤害 +${Math.round(t.atkPct*100)}%`);
    if (t.dmgCut) bits.push(`受伤 −${Math.round(t.dmgCut*100)}%`);
    if (t.evade)  bits.push(`闪避 +${Math.round(t.evade*100)}%`);
    parts.push(`接下来 ${t.fights} 场：${bits.join('　')}`);
    if (ch) refreshChallengeStats();
  }

  /* ---- 越品反噬：药力过盛，扣自己的底子 ---- */
  let backlash = '';
  if (po.bleed > 0){
    const P = G.CONFIG.pill;
    let amt = Math.round((s.maxLife || 100) * po.bleed);
    if (ch){
      /* 战斗中：扣的是**战斗气血**，而且不会把你直接打倒（保底 1 点） */
      amt = Math.min(amt, Math.max(0, ch.hp - 1));
      ch.hp -= amt;
      backlash = `药力过盛，气血 −${amt}`;
    } else {
      amt = Math.min(amt, Math.max(0, s.life - P.overBleedFloor));
      gainLife(-amt);
      backlash = `药力过盛，寿元 −${amt}`;
    }
    parts.push(backlash);
    ch ? pushLog(`【${name}】${po.note}`) : log(`【${name}】${po.note}`);
  } else if (po.diff < 0){
    ch ? pushLog(`【${name}】${po.note}`) : log(`【${name}】${po.note}`);
  }
  if (pillMul > 1 + (agg().pillSetMul || 0)) parts.push(`品级 ×${po.mul.toFixed(2)}`);
  if ((agg().pillSetMul || 0) > 0) parts.push(`丹火不熄 ×${(1+(agg().pillSetMul||0)).toFixed(1)}`);

  const msg = `服下【${name}】（${po.grade} 品）` + (parts.length ? '：' + parts.join('　') : '');
  if (ch) pushLog(msg);
  else log(msg);
  saveRun();                               // 吃药也落盘（第 22 轮的规矩）
  // 战斗内吃完要过一回合；战斗外没有回合这回事
  return ch ? advanceRound() : { ok:true, msg, outOfBattle:true, grade:po };
}

/* 限时战斗丹：一场仗打完扣一场，扣到 0 就整组散掉。
   注意「boss_zhuji 那场」也在 resolveChallenge 的提前 return 路径里——
   所以这个函数在那边也要调一次（见 resolveChallenge 的 majorUp 分支）。 */
function tickTempPills(){
  const t = s && s.pillTemp;
  if (!t || !t.fights) return null;
  t.fights -= 1;
  if (t.fights <= 0){
    t.fights = 0; t.atkPct = 0; t.dmgCut = 0; t.evade = 0;
    log('限时丹药的药力散了。');
  } else {
    log(`限时丹药还剩 ${t.fights} 场。`);
  }
  return t.fights;
}

/* 身上还有哪些丹药（给「储物袋」面板用）。
   数据全部来自牌组 —— 丹药是「一张牌 = 一枚」，用完就没了。
   ⚠️ 第 25 轮：每一条都带上**品级**与「此刻吃下去会怎样」，
   界面直接拿 outcome 去显示，不再自己算一遍。 */
function inventory(){
  if (!s || !s.deck) return [];
  const count = {};
  s.deck.forEach(n=>{ count[n] = (count[n]||0) + 1; });
  const out = [];
  Object.keys(count).forEach(n=>{
    const c = G.CARDS[n];
    if (!isConsumable(c)) return;
    const u = c.use || {};
    out.push({
      name: n, card: c, count: count[n],
      grade: c.grade || 1,
      outcome: pillOutcome(n),
      battle: c.battle || '',
      kind: u.perm ? 'perm' : (u.temp ? 'temp' : 'use'),
      effect: {
        life: u.life || 0, cult: u.cult || 0,
        lifeMax: u.lifeMax || 0, karma: u.karma || 0,
        perm: u.perm || null, temp: u.temp || null
      },
      desc: c.desc || '',
      rarity: c.rarity
    });
  });
  /* 品级高的排前面，同档按名字稳定排序 */
  out.sort((a,b)=> (b.grade - a.grade) || a.name.localeCompare(b.name));
  return out;
}
/* 丹药总数（给底栏角标用） */
function pillCount(){
  if (!s || !s.deck) return 0;
  return s.deck.filter(n=>isConsumable(G.CARDS[n])).length;
}

function pushLog(t){
  if (!challenge) return;
  challenge.logLines.push(t);
  if (challenge.logLines.length > 6) challenge.logLines.shift();
}

/* ---- 推进一个回合：敌人行动 → 冷却递减 → 判定 ---- */
function advanceRound(){
  const ch = challenge;
  if (!ch || ch.over) return ch;

  // 敌人反击
  if (ch.foeHp > 0){
    const totalEvade = Math.min(0.65, ch.stats.evade + ch.buffs.evade);
    if (s.rng() < totalEvade){
      pushLog(`${ch.foeName} 扑了个空`);
    } else {
      let dmg = ch.foeAtk * (0.9 + s.rng()*0.2);
      /* ① 常驻护体（卡牌 ward）：按百分比减免，上限 35% */
      dmg *= (1 - (ch.stats.wardGuard || 0));
      /* ② 临时的护体 buff（护身罡气 / 铁布衫 这类招式）：按点数吸收 */
      dmg = Math.max(1, Math.round(dmg - ch.buffs.ward));
      /* ③ 套装「不坏之身」的受伤减免 */
      dmg = Math.max(1, Math.round(dmg * (ch.stats.dmgTakenMul || 1)));
      ch.hp -= dmg;
      pushLog(`${ch.foeName} 还手，你受到 ${dmg} 点伤害`);
    }
  }

  // 冷却与回复
  Object.keys(ch.cooldowns).forEach(k=>{
    if (ch.cooldowns[k] > 0) ch.cooldowns[k]--;
  });
  ch.qi = Math.min(ch.qiMax, ch.qi + ch.qiRegen);
  /* 护体自然消退。套装「符阵相生」让它不再衰减。 */
  ch.buffs.ward = setBonus().wardHold ? ch.buffs.ward : Math.round(ch.buffs.ward * 0.7);
  if (ch.buffs.evade > 0) ch.buffs.evade = Math.max(0, ch.buffs.evade - 0.1);

  ch.round++;
  checkCombatEnd();
  return ch;
}

function checkCombatEnd(){
  const ch = challenge;
  if (!ch || ch.over) return ch;
  if (ch.foeHp <= 0){ ch.foeHp = 0; ch.over = true; ch.result = 'win'; return ch; }
  if (ch.hp <= 0){ ch.hp = 0; ch.over = true; ch.result = 'lose'; return ch; }
  if (ch.round > ch.maxRounds){ ch.over = true; ch.result = 'lose'; ch.timeout = true; return ch; }
  return ch;
}

/* 兼容旧接口：过一轮（现在等价于「只用普通攻击打一下」） */
function passTurn(){ return basicAttack(); }
function playCard(name){ return useTechnique(name); }

/* ---- 战斗结算 ---- */
function resolveChallenge(){
  const ch = challenge;
  if (!ch) return null;
  const cfg = ch.cfg || {};
  const win = ch.result === 'win';
  const out = { win: win, name: cfg.name, type: ch.type, bossId: ch.bossId || null,
                msgs: [], foeName: ch.foeName, rounds: ch.round, hpLeft: ch.hp, hpMax: ch.hpMax,
                tourney: ch.tourney || null, tianjiaoId: ch.tianjiaoId || null };

  /* 战果：优先用「数据化战果」（可存档），回落到旧的函数回调。
     第 22 轮：因为要支持「打到一半关掉页面再读回来」，
     战果必须是纯数据（见 applyOutcome 的说明）。 */
  const oc = ch.outcome || cfg.outcome || null;
  if (oc){
    applyOutcome(win ? oc.win : oc.lose);
  } else if (win){
    if (cfg.win) cfg.win();
  } else {
    if (cfg.lose) cfg.lose();
  }

  if (win){
    out.msgs.push('你赢了。');
    // 打赢必须有回报
    out.rewards = grantCombatRewards();
  } else {
    out.msgs.push('你倒下了。');
    out.lost = true;
  }

  // Boss 专属结算文本
  if (ch.bossId){
    const key = ch.bossId + (win ? '_win' : '_lose');
    out.bossText = (G.BOSS_OUTCOME && G.BOSS_OUTCOME[key]) || null;
    const boss = G.BOSSES[ch.bossId];

    if (win && boss && boss.kind === 'final'){
      // 结丹天劫成功 → 开闸进入金丹（不再是结局——金丹只是第三站）
      note('realm', '渡过结丹之劫。丹田里多了一颗会转的东西。');
      tickTempPills();                    // 这一场也算「用掉一场限时丹」
      const asc = advanceMajor();
      out.majorUp = asc;
      out.end = null;
      challenge = null;
      return out;
    }
    if (win && boss && boss.kind === 'hidden'){
      if (!s.clues.includes('clue_xinmo')) s.clues.push('clue_xinmo');
      const hidden = checkHiddenEnding();
      if (hidden){ out.end = hidden; challenge = null; return out; }
    }
  }

  challenge = null;

  /* 限时战斗丹的场次在这里消耗（第 25 轮）。
     ⚠️ 必须在战斗**结算之后**扣：combatStats() 是在开场时冻结的，
     先扣的话最后一场就吃不到加成了。输赢都算用掉一场。 */
  tickTempPills();

  /* 天骄：不论输赢都算「遭遇过」，打赢另记一笔终身成就（第 22 轮） */
  if (ch.tianjiaoId){
    const tj = (G.TIANJIAO||[]).find(x=>x.id===ch.tianjiaoId);
    if (tj) note('fight', win ? `赢了榜上的${tj.name}。` : `输给了榜上的${tj.name}。他没有杀你。`);
    markTianjiaoMet(ch.tianjiaoId);
  }

  // 失败 → 进入转盘（由界面接手），而不是直接死
  if (!win){
    out.wheel = true;
    if (ch.killer) out.killerWheel = true;   // 天谴：转盘上「身死」扇区大幅增加
  }
  /* 天谴洗业（第 29 轮）：输了也照洗 —— 挨过这一顿，账就销掉一部分。
     这正是让「业障」不再变成死循环的那一步：
     收走一半之后，人必须重新作恶才会再招来下一次。 */
  if (ch.killer){
    const burned = burnKarma();
    out.extra = (out.extra ? out.extra + '　' : '') + `业障 −${burned}（现有 ${s.karma}）`;
    note('fight', win ? `挨过了一次天谴。业障销掉 ${burned}。`
                      : `天谴把你按在地上。业障销掉 ${burned}，但你还得爬起来。`);
  }
  return out;
}

/* ---------------- 失败转盘 ----------------
   扇区大小由属性决定：身法高则脱身扇区大，体魄高则重伤不死，
   属性全低则「身死」会占掉一大块。转盘 = 你的道行替你赌命。  */
function wheelSlices(killerBoost){
  const A = attrs();
  const base = G.WHEEL_SLICES.map(x=>({ id:x.id, name:x.name, tone:x.tone, text:x.text, weight:x.weight }));

  const get = id => base.find(x=>x.id===id);
  // 身法：脱身 / 绝处逢生 ↑，重伤 / 身死 ↓
  const ev = get('escape'), sv = get('save'), hv = get('heavy'), dt = get('death'), rb = get('rob'), lt = get('light');
  const sf = A.shenfa || 0, tp = A.tipo || 0, gs = (A.gengu||0) + (A.lingli||0);

  ev.weight += sf * 1.6;
  sv.weight += Math.round(gs * 0.5);
  lt.weight += sf * 0.6;
  hv.weight -= Math.round(tp * 1.1);
  dt.weight -= Math.round((sf*0.5 + tp*0.5 + gs*0.15));
  rb.weight -= Math.round(sf * 0.3);

  if (killerBoost){ dt.weight += 90; }
  // 元层「逆天改命」：缩小身死扇区
  const wheelUp = upLevel('wheelLuck');
  if (wheelUp > 0) dt.weight = Math.round(dt.weight * Math.max(0.25, 1 - wheelUp*0.12));

  base.forEach(x=>{ x.weight = Math.max(2, Math.round(x.weight)); });
  return base;
}

/* 按权重抽取一个结果 */
function spinWheel(killerBoost){
  const slices = wheelSlices(killerBoost);
  const total = slices.reduce((a,b)=>a+b.weight,0);
  let r = s.rng() * total;
  let hit = slices[0];
  for (const x of slices){ r -= x.weight; if (r <= 0){ hit = x; break; } }
  return { slices: slices, total: total, hit: hit };
}

/* 应用转盘结果 */
/* ⚠️ 第 29 轮：多了一个 opts.killer。
   以前不管是被谁打死的，转盘上「身死」一律走 endRun('slay')，
   于是 ENDINGS 里的 'karma'（天 谴）**永远拿不到** ——
   档案柜因此常年显示「还有 N 个结局，你没有见过」，
   玩家会一直找一个根本不存在的结局（这就是用户说的「文本细节 bug」）。
   现在被天谴打死就是天谴结局，那个结局也终于有了主人。 */
function applyWheelResult(id, opts){
  const killer = !!(opts && opts.killer);
  const deathReason = killer ? 'karma' : 'slay';
  const out = { effect:'', end:null };
  /* ⚠️ 第 33 轮：改走 upLevel()（本局快照）—— 转盘里的「逆天改命」
     和免死都要在本局内稳定，不能因为局外同时降了级就变。 */
  const wheelUpNow = upLevel('wheelLuck');

  switch(id){
    case 'escape':
      s.life -= Math.round(s.maxLife * 0.06);
      out.effect = `寿元 −${Math.round(s.maxLife*0.06)}`;
      break;
    case 'light':
      s.life -= Math.round(s.maxLife * 0.14);
      out.effect = `寿元 −${Math.round(s.maxLife*0.14)}`;
      break;
    case 'save':
      s.life -= Math.round(s.maxLife * 0.05);
      gainCult(30 + s.realmIdx*15);
      out.effect = `寿元 −${Math.round(s.maxLife*0.05)}　修为 +${30+s.realmIdx*15}`;
      break;
    case 'heavy':
      s.life -= Math.round(s.maxLife * 0.34);
      gainSectQi(-4);
      out.effect = `寿元 −${Math.round(s.maxLife*0.34)}`;
      break;
    case 'rob': {
      const lostStone = Math.round(s.stone * 0.5);
      s.stone -= lostStone;
      s.life -= Math.round(s.maxLife * 0.12);
      out.effect = `灵石 −${lostStone}　寿元 −${Math.round(s.maxLife*0.12)}`;
      break;
    }
    case 'death':
      // 元层「残念」：每局第一次身死时留住一线生机
      if (upLevel('guard') && !s.guardUsed){
        s.guardUsed = true;
        s.life = G.CONFIG.deathGuardHeal;
        out.saved = true;
        out.effect = `你倒下去了。有什么东西托了你一把。\n寿元回到 ${G.CONFIG.deathGuardHeal}。`;
        log('你倒下去了。有什么东西托了你一把。');
        return out;
      }
      out.effect = killer ? '天上那东西没有再给你一次机会。' : '你没能再站起来。';
      out.end = endRun(deathReason);
      return out;
  }
  const d = checkDeath(deathReason);
  if (d && !d.saved) out.end = d;
  return out;
}

/* ---------------- 隐藏结局判定 ----------------
   条件：集齐全部 7 条线索（含心魔线索）→ 「重修」。
   这是整个元层母题的收束点：你以为你在修仙，其实有人在重修这段历史。 */
/* 世界线真相结局：击败隐藏 Boss「镇阵人」并且已经知道阵的存在。
   这是与「重修」并列的第二个隐藏结局。 */
function checkWorldEnding(){
  if (!s) return null;
  if (s.flags.includes('boss_zhenzhen_done') && s.clues.includes('clue_world')){
    return endRun('world');
  }
  return null;

/* 当前世界线阶段（用于档案与征兆提示） */
function worldStage(){
  const acts = (meta.worldActions || 0) + (s ? s.actions : 0);
  let cur = G.WORLD.stages[0], idx = 0;
  G.WORLD.stages.forEach((st,i)=>{ if (acts >= st.at){ cur = st; idx = i; } });
  return { idx:idx, stage:cur, actions:acts,
           next: G.WORLD.stages[idx+1] || null };
}

function checkHiddenEnding(){

/* ---------------- 结局 ---------------- */
/* ⚠️ 第 29 轮：删掉了 'ascend'（筑 基）。
   第 25 轮把「炼气九层 → 筑基」从结局改成普通突破之后，endRun('ascend')
   就再没有任何调用点了 —— 但这一项还留在表里，于是：
     · 档案柜的「还有 N 个结局，你没有见过」永久 +1，玩家永远凑不齐
     · END_SUB.ascend / FRAG.ascend 变成两份没人读的文案
   一个拿不到的结局比没有这个结局更糟：它在骗玩家去刷。
   现在表里每一项都必须是**真的能走到**的（dev/verify-endings.js 守着）。 */
const ENDINGS = {

  hidden:    { title:'重 修',       id:'hidden' },
  capstone:  { title:'此 世 圆 满', id:'capstone' }
};

const END_SUB = {

  karma: '你做过的事，一件一件回来了。\n它们排着队，很有耐心。',

  sanxiu:'你在一处向阳的山坡上搭了间屋子。\n门前有一小块地，屋后有一条溪。\n\n没有人再给你派活，也没有人再管你修到第几层。\n你早上起来看云，下午钓鱼，晚上打坐。\n\n日子很长。\n你终于把日子过成了自己的。',

     它不写成「胜利」——按本作的调子，走到这里只是一段路走完了，
     而「有件大事」还没解决。比「寿元耗尽」暖，比「飞升」冷。 */

/* ---------------- 碎片结算（第 19 轮重做） ----------------
   旧公式直接把 realmIdx / s.cult / 属性总和这些「原始数值」折算成碎片，
   可这几个量在本作里是指数级膨胀的：跑到渡劫的一局能结算出三百万碎片，
   而把 26 项升级（316 级）全部买满只要 8,530。
   结果就是「一把通关 = 局外成长直接走完」，多周目瞬间失去意义。

   现在每一路来源都先归一化到 0~1，再乘权重：
     · 一次满进度飞升 ≈ 600 碎片
     · 一次筑基期阵亡 ≈ 90 碎片
     · 一次炼气期阵亡 ≈ 30 碎片
   8,530 的总量意味着「把局外点满」大约是十几到几十局的事——
   正好是这款游戏希望的节奏：每一局都有点收获，但不是一局毕业。 */
G.FRAG = {
  base:   8,     // 参与奖：来了就有
  realm:  260,   // 走到哪算哪（渡劫 ≈ 260）
  action: 90,    // 走过多少路（400 次行动封顶）
  clue:   70,    // 线索（20 条封顶）
  cult:   40,    // 当前这一层修到多满
  /* ⚠️ 第 29 轮：删掉了 ascend:150（筑基）。
     它挂在已经删掉的 'ascend' 结局上，是一份永远发不出去的碎片。
     走到上限那一份现在是 capstone:170。 */
  sanxiu: 60,    // 山中岁月
  hidden: 140,   // 重修（隐藏结局）
  /* 第 21 轮：境界上限锁在元婴之后，「走到上限」就是这一世的主要目标，
     所以它取代了原先「一路修到渡劫」那份境界分。 */
  capstone: 170
};
function fragBreakdown(reason){
  const F = G.FRAG;
  /* ⚠️ 境界分要按「玩家这一世能走多远」归一化，不能按完整 38 档。
     否则上限锁在元婴时，玩家最多只拿得到 26/72 ≈ 36% 的境界分，
     等于把局外成长悄悄砍掉六成 —— 玩家只会觉得「碎片怎么变少了」。 */
  const span = Math.max(1, (G.realmCapIndex ? G.realmCapIndex() : G.REALMS.length - 1));
  const pRealm  = Math.min(1, s.realmIdx / span);
  const pAction = Math.min(1, (s.actions || 0) / 400);
  const pClue   = Math.min(1, s.clues.length / 20);
  const needNow = Math.max(1, (G.REALMS[s.realmIdx] || {need:1}).need);
  const pCult   = Math.min(1, s.cult / needNow);
  const bonus   = reason === 'sanxiu' ? F.sanxiu
                : reason === 'hidden' ? F.hidden
                : reason === 'capstone' ? (F.capstone || 0) : 0;
  const parts = {
    '参与':   F.base,
    '境界':   Math.round(pRealm  * F.realm),
    '行路':   Math.round(pAction * F.action),
    '线索':   Math.round(pClue   * F.clue),
    '当层修为': Math.round(pCult  * F.cult),
    '结局':   bonus
  };
  const total = Object.keys(parts).reduce((a,k)=>a+parts[k], 0);
  return { parts: parts, total: Math.max(3, total) };
}

function endRun(reason){
  if (!s || s.ended) return null;

  // 散修篇的自然结束：不叫「死」，叫「山中岁月」
  if (reason === 'life' && s.chapter === 'sanxiu'){
    const days = (s.sanxiu && s.sanxiu.days) || 0;
    // 活满 24 天（四季各一轮）就已经是「把日子过成了自己的」
    if (days >= 24) reason = 'sanxiu';
  }

  // 隐藏结局优先：只要集齐全部 7 条线索，无论怎么结束，都会导向「重修」。
  // 例外是「山中岁月」「此世圆满」——那是玩家自己走完的路，不该被覆盖。
  // ⚠️ 第 29 轮：这里的 'ascend' 跟着那个结局一起删了。
  // 注意「天谴」（karma）**不在**豁免名单里，这是有意的：
  // 七条线索是玩家自己一条条攒出来的，不能因为死法不同就被没收。
  // 被天谴劈死的人只要线索齐，照样导向「重修」。
  if (reason !== 'hidden' && reason !== 'sanxiu' && reason !== 'capstone'){
    const CLUE_IDS = ['clue_name','clue_book','clue_master','clue_disciple','clue_page','clue_dream','clue_xinmo'];
    if (CLUE_IDS.every(id=>s.clues.includes(id))) reason = 'hidden';
  }

  s.ended = true;
  challenge = null;

  const e = ENDINGS[reason] || ENDINGS.life;

  // ---- 结算碎片 ----
  const fb = fragBreakdown(reason);
  const frag = fb.total;

  // ---- 写入元层 ----
  meta.frag += frag;
  meta.runs += 1;
  meta.totalActions += s.actions;
  meta.worldActions = (meta.worldActions || 0) + s.actions;
  /* ⚠️ 第 28 轮修复：这两个计数器原本都挂在 reason==='ascend' 上。
     第 25 轮把「炼气九层 → 筑基」从「终极一战结局」改成普通突破之后，
     endRun('ascend') 就再也没有任何地方调用了 ——
     于是档案柜上的统计和宗门卡片上的「通关 N 次」永远是 0。
     修法：不再看「以什么结局收场」，改看「这一世真的走到了哪里」。

     ⚠️ 第 29 轮补充：光把数字修对还不够，**标签本身也过时了**。
     玩家原话：「目前都更新这么多轮了文本还停留在最开始的筑基」。
     游戏早就跑到元婴了，档案柜还在数「突破筑基」——
     那是第 25 轮之前「筑基就是通关」时期的说法。
     现在改成三个玩家真正会关心的里程碑，一起数：
        · 走出炼气  —— 迈过第一道门槛（筑基前期）
        · 结丹      —— 走进了金丹期
        · 此世圆满  —— 走到元婴最后一档收束（= 宗门卡片上的「通关」）

     ⚠️ 第 30 轮：判断从「硬编码下标」改成「看大境界」。
     原来写的是 realmIdx>=9 / >=18，那是炼气 9 档、每大境界 9 档时代的数字。
     境界表改成「筑基起 4 段」之后，下标 18 从「金丹一层」变成了「元婴中期」，
     这两行会静默地数错（不报错，只是数字不对 —— 最难发现的那一类）。 */
  const m = meta;
  if (!m.mile) m.mile = { zhuji:0, jiedan:0, capstone:0 };
  const endMajor = (G.REALMS[s.realmIdx] || { major:1 }).major;
  if (endMajor >= 2) { m.wins += 1;  m.mile.zhuji += 1; }
  if (endMajor >= 3) m.mile.jiedan += 1;
  if (reason === 'capstone') m.mile.capstone += 1;
  if (!m.endings.includes(e.id)) m.endings.push(e.id);

  const w = meta.worlds.zongmen;
  if (s.realmIdx > (w.bestRealm||0)) w.bestRealm = s.realmIdx;
  if (frag > (w.best||0)) w.best = frag;
  if (reason === 'capstone') w.cleared = (w.cleared||0)+1;

  // 线索入档
  s.clues.forEach(id=>{ if (!meta.lore.includes(id)) meta.lore.push(id); });

  // 元层剧情解锁
  let newLore = null;
  const nextLore = G.LORE.meta.find(l=>l.at === meta.runs);
  if (nextLore){ newLore = nextLore.text; }
  saveMeta(meta);

  /* ⚠️ 第 21 轮修复：一局结束后必须把「局内存档」清掉。
     以前这里没有清，于是磁盘上留着一份已经打完的局。
     玩家下次打开网址时 hasSavedRun() 照样返回它 →
     抽签界面下面出现「继续上一局」→ 点进去是一个已经结束的局面。
     更要命的是：这份陈旧存档会**一直留着**，直到玩家再开一局才会被覆盖。
     这正是「玩家进度看起来不对」的来源之一。 */
  clearRun();

  const result = {
    ending: e, sub: END_SUB[e.id],
    frag: frag,
    fragParts: fb.parts,
    stats: {
      realm: G.REALMS[s.realmIdx].name,
      realmIdx: s.realmIdx,
      cult: s.cult,
      stone: s.stone,
      karma: s.karma,
      favor: s.favor,
      actions: s.actions,
      clues: s.clues.length,
      cards: s.deck.length,
      disciples: s.disciples.length
    },
    newLore: newLore
  };
  s.endResult = result;   // 存起来，便于重复查看结算
  return result;
}

/* 主动坐化 */
function sitDown(){
  return endRun('sit');
}

/* 检查宗门是否已散 —— 注意：宗门散了不是结局，而是换一种活法。
   玩家转入「散修篇」，继续以散修的身份活下去。               */
function checkSectCollapse(){
  if (!s.sectCollapsed) return null;
  if (s.chapter === 'sanxiu') return null;
  // 只有「宗门没了 + 什么都没剩下 + 自己也不行了」才是真的走投无路
  if (s.discipleCount === 0 && s.buildings.lingtian === 0 && s.life <= s.maxLife*0.12){
    return endRun('sect');
  }
  return { enterSanxiu: true };
}

/* ---------------- 散修篇 ----------------
   宗门散了不是结局，是换一种活法。
   散修没有 KPI、没有气运倒计时，只有「今天想干什么」。
   休闲活动不设失败惩罚——这是「休闲修仙」的核心。            */
/* ---------------- 散修篇 ----------------
   ⚠️ 重做要点（第 14 轮）：散修最大的问题是「用寿元换零钱」。
   现在每一次行动都会累积三样东西：
     ① 技艺熟练度（同类活动收益越来越高，看得见）
     ② 洞府材料（能盖出持续产出的建筑）
     ③ 目标进度（有方向，不是原地打转）
   而且休闲活动净收益为正——休闲就该是休闲。                    */
function enterSanxiu(reason){
  note('choice', '下了山，从此是个散修。');
  if (s.chapter === 'sanxiu') return null;
  s.chapter = 'sanxiu';
  s.sanxiu.started = true;
  sx();                      // 初始化散修状态（技艺 / 洞府 / 计数）
  const txt = reason || '你下山了。';
  log(txt + '从今天起，你是一个散修。');
  return txt;
}

/* 散修状态（含老存档兼容） */
function sx(){
  const d = s.sanxiu;
  if (!d.skills) d.skills = {};
  if (!d.home) d.home = {};
  if (d.herbStock == null) d.herbStock = 0;
  if (d.days == null) d.days = 0;
  if (d.beastBond == null) d.beastBond = 0;
  if (d.pillTick == null) d.pillTick = 0;
  if (!d.goalsDone) d.goalsDone = [];
  if (d.beast === undefined) d.beast = null;
  return d;
}

/* 当前季节：每 6 天换一季 */
function season(){
  const d = sx();
  const idx = Math.floor(d.days / G.SEASON_DAYS) % G.SEASONS.length;
  return G.SEASONS[idx];
}

function skillLv(id){ return (sx().skills[id]) || 0; }
function skillMul(id){
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def) return 1;
  return 1 + skillLv(id) * def.per;
}
function homeLv(id){ return (sx().home[id]) || 0; }
function homeTotal(){
  const h = sx().home;
  return Object.keys(h).reduce((n,k)=>n+(h[k]||0),0);
}
function homeBonus(){
  const out = { herb:0, lifePerAction:0, cultMul:0, beastGain:0 };
  G.SANXIU_HOME.forEach(b=>{
    const lv = homeLv(b.id);
    if (!lv) return;
    if (b.per.herb) out.herb += b.per.herb * lv;
    if (b.per.lifePerAction) out.lifePerAction += b.per.lifePerAction * lv;
    if (b.per.cultMul) out.cultMul += b.per.cultMul * lv;
    if (b.per.beastGain) out.beastGain += b.per.beastGain * lv;
  });
  return out;
}
function homeCost(id){
  const b = G.SANXIU_HOME.find(x=>x.id===id);
  if (!b) return null;
  const lv = homeLv(id);
  if (lv >= b.max) return null;
  return b.cost[lv];
}
function buildHome(id){
  const cost = homeCost(id);
  if (cost === null || s.stone < cost) return false;
  s.stone -= cost;
  s.sanxiu.home[id] = homeLv(id) + 1;
  log('洞府建起了 ' + G.SANXIU_HOME.find(x=>x.id===id).name + '（' + homeLv(id) + ' 级）。');
  return true;
}

/* 属性机缘加成 */
function addAttrBonus(obj){
  if (!s.attrBonus) s.attrBonus = {};
  Object.keys(obj).forEach(k=>{ s.attrBonus[k] = (s.attrBonus[k]||0) + obj[k]; });
}

/* 技艺提升：消耗草药与灵石换熟练（也可在活动中自然长） */
function skillUpCost(id){
  const lv = skillLv(id);
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def || lv >= def.max) return null;
  return { herb: 6 + lv*4, stone: 10 + lv*8 };
}
function trainSkill(id){
  const cost = skillUpCost(id);
  const d = sx();
  if (!cost) return { ok:false, msg:'这门技艺已经练到头了' };
  if (d.herbStock < cost.herb) return { ok:false, msg:'草药不够（需 ' + cost.herb + '，有 ' + d.herbStock + '）' };
  if (s.stone < cost.stone) return { ok:false, msg:'灵石不够（需 ' + cost.stone + '）' };
  d.herbStock -= cost.herb;
  s.stone -= cost.stone;
  d.skills[id] = skillLv(id) + 1;
  const attrMap = { caiyao:{wuxing:1}, diaoyu:{shenfa:1}, gengzuo:{tipo:1},
                    yunyou:{shenfa:1}, yushou:{shenshi:1}, shanyuan:{gengu:1} };
  addAttrBonus(attrMap[id] || {wuxing:1});
  log('你的「' + G.SANXIU_SKILLS.find(x=>x.id===id).name + '」更熟练了（' + skillLv(id) + ' 级）。');
  return { ok:true, lv:skillLv(id) };
}

/* 技艺自然熟练 */
function growSkill(id){
  const def = G.SANXIU_SKILLS.find(x=>x.id===id);
  if (!def) return false;
  const lv = skillLv(id);
  if (lv >= def.max) return false;
  sx().skills[id] = lv + 1;
  const attrMap = { caiyao:{wuxing:1}, diaoyu:{shenfa:1}, gengzuo:{tipo:1},
                    yunyou:{shenfa:1}, yushou:{shenshi:1}, shanyuan:{gengu:1} };
  addAttrBonus(attrMap[id] || {wuxing:1});
  return true;
}

/* 散修目标：给这段生活一个方向 */
function checkSanxiuGoals(){
  const d = sx();
  const done = [];
  G.SANXIU_GOALS.forEach(g=>{
    if (d.goalsDone.indexOf(g.id) >= 0) return;
    let hit = false;
    try { hit = g.check(s); } catch(e){ hit = false; }
    if (!hit) return;
    d.goalsDone.push(g.id);
    if (g.id==='g_herb')  s.sanxiu.home.yaopu  = Math.min(5, homeLv('yaopu')+1);
    if (g.id==='g_fish')  s.sanxiu.home.lingxi = Math.min(5, homeLv('lingxi')+1);
    if (g.id==='g_crop')  raiseMaxLife(40);
    if (g.id==='g_home')  addAttrBonus({tipo:5,lingli:5,wuxing:5,shenfa:5,shenshi:5,gengu:5});
    if (g.id==='g_year')  raiseMaxLife(80);
    if (g.id==='g_beast') addAttrBonus({tipo:3,shenfa:3});
    done.push(g);
    log('【散修目标达成】' + g.name + ' — ' + g.reward);
  });
  return done;
}

function sanxiuActions(){
  return Object.keys(SANXIU_ACTS).map(function(k){
    return {
      id: 'sx_' + k,
      name: SANXIU_ACTS[k].name,
      cost: SANXIU_ACTS[k].cost,
      desc: SANXIU_ACTS[k].desc,
      lv: skillLv(k),
      meta: '技艺 ' + skillLv(k) + ' 级　收益 ×' + skillMul(k).toFixed(2)
    };
  });
}

function doSanxiuAction(kind){
  const act = SANXIU_ACTS[kind];
  if (!act) return null;
  const d = sx();
  const hb = homeBonus();
  s._sxNote = null;
  /* 散修活动只花「这件事本身的功夫」，不再按境界收时间税——
     这是「休闲」的数值保障：在放松的时候不该还在赔命。
     想要寿元上限与境界，仍然得去修行/突破。 */
  const cost = Math.max(1, act.cost - Math.floor(homeLv('lingxi')/2));
  s.life -= cost;
  s.actions++;
  d.days++;

  const msg = act.run();

  /* 洞府持续产出：每次行动都结算 */
  if (hb.herb > 0){ d.herbStock += hb.herb; d.herbs += hb.herb; }
  /* ⚠️ 关键限制：洞府回复不能让散修「永动」。
     回复量硬性封顶在活动消耗以内，保证寿元依然是硬约束——
     否则散修篇会变成无限循环，故事永远结束不了。 */
  const cap = cost + 1 + Math.floor(homeLv('lingxi')/2);
  if (hb.lifePerAction > 0) gainLife(Math.min(hb.lifePerAction, cap));

  /* 丹炉自动炼丹 */
  if (homeLv('danlu') > 0){
    d.pillTick++;
    if (d.pillTick >= Math.max(3, 8 - homeLv('danlu'))){
      d.pillTick = 0;
      const pool = pillPool();
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      s._sxNote = '丹炉炼成了【' + pick + '】';
    }
  }

  const goals = checkSanxiuGoals();

  /* 活满四季（一年）→ 这一世就有了一个完整的交代。
     散修篇不该拖到寿元耗尽才结束，那样太冷。 */
  if (d.days >= 24 && !s.ended){
    return { ok:true, cost:cost, msg:msg, cards:s._pendingCards||null,
             kind:kind, goals:goals, note:s._sxNote||null,
             season:season().name, end:sanxiuYearEnd() };
  }

  const dead = checkDeath();
  return { ok:true, cost:cost, msg:msg, dead:dead,
           cards:s._pendingCards||null, kind:kind,
           goals:goals, note:s._sxNote||null, season:season().name };
}

/* 散修一年期满：给一个温暖的收束 */
function sanxiuYearEnd(){
  return endRun('sanxiu');
}
/* ---------------- 局内存档（第 17 轮） ----------------
   玩家要求：一局可以硬跑到渡劫，但**中途关掉浏览器不能丢进度**。
   方案：每次行动后自动存档到 localStorage；下次打开可直接继续。
   注意：rng 是函数，不能序列化——恢复时用种子重建。              */
const RUN_KEY = 'jiyi_xiufu_ju_run_v1';

/* 存档失败的最近一次原因（给界面提示用）。
   第 21 轮新增：以前 saveRun/saveMeta 都是「try 一下，失败就算了」，
   玩家的进度**静默消失**却什么提示都没有——
   无痕模式、浏览器禁用存储、配额满，都会走到这条路。
   静默丢档是最伤玩家信任的一类问题，所以这里把失败记下来并报给界面。 */
let _saveError = null;
function saveError(){ return _saveError; }
function clearSaveError(){ _saveError = null; }

/* localStorage 到底能不能用？（无痕模式 / 禁用 Cookie 时会抛错） */
function storageAvailable(){
  try{
    const k = '__jiyi_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

function saveRun(){
  if (!s || s.ended) return false;
  try{
    const copy = {};
    Object.keys(s).forEach(k=>{ if (k !== 'rng') copy[k] = s[k]; });
    copy.__savedAt = Date.now();
    /* ⚠️ 第 30 轮：记下「这份存档是按哪一版境界表写的」。
       局内存档里存的是 realmIdx —— 一个**下标**。
       第 30 轮把筑基起的小境界从 9 档改成 4 档，同一个下标
       指向的境界完全变了（新表 12 = 筑基巅峰，旧表 12 = 筑基四层；
       新表 17 = 元婴前期，旧表 17 = 筑基九层）。
       老存档直接读回来，玩家会凭空出现在别的境界上，
       而且 maxLife / need / cost 全是旧值 —— 那是一个改不回来的坏局面。 */
    copy.__realmTable = G.REALM_TABLE_VERSION;
    /* ⚠️ 第 22 轮：把「正在进行的战斗」一起存下来。
       以前只存 s，于是玩家打到一半关掉页面，重开后战斗凭空消失，
       而战斗之前的行动已经被扣掉了 —— 净亏损。
       现在把挑战的机械状态一并写盘（stats 与 win/lose 回调会被剔除，
       读档时重算 / 用数据化战果替代）。 */
    copy.__challenge = serializableChallenge();
    localStorage.setItem(RUN_KEY, JSON.stringify(copy));
    _saveError = null;
    return true;
  }catch(e){
    _saveError = { where:'局内', msg:(e && e.message) || '写不进去' };
    return false;
  }
}

/* 存档是不是按**当前这一版**境界表写的。
   undefined（第 30 轮之前的档）一律算作废。 */
function runSaveTableOk(d){
  return !!d && d.__realmTable === G.REALM_TABLE_VERSION;
}

/* 作废一份境界表版本对不上的局内存档。
   只清局内那一个键 —— 元层（碎片、升级、档案柜）一个字都不动。 */
function dropStaleRun(){
  try{ localStorage.removeItem(RUN_KEY); }catch(e){}
  log('境界表改版了，上一局没法接着打（进度已重新开始，桌上的东西都还在）。');
}

function hasSavedRun(){
  try{
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.deck) return null;
    /* 已经结束的局不算「可继续的存档」（第 21 轮加的两道防线之一） */
    if (d.ended) return null;
    /* ⚠️ 第 30 轮：境界表版本对不上的档不能拿出来给玩家「继续」——
       否则会读出一个境界错乱的局面。这里就丢掉，别让它留在磁盘上
       （第 21 轮的教训：一份陈旧的局内存档会一直留着，直到玩家再开一局）。 */
    if (!runSaveTableOk(d)){ dropStaleRun(); return null; }
    // 用存档里的行动步数做扰动，让恢复后的随机数不会完全重复
    return { realm: (G.REALMS[d.realmIdx]||{}).name || '?',
             chapter: d.chapter, actions: d.actions||0,
             life: d.life, maxLife: d.maxLife,
             inBattle: !!d.__challenge,          // 存档时正在战斗中？
             savedAt: d.__savedAt };
  }catch(e){ return null; }
}

function loadRun(){
  try{
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.deck) return null;
    if (d.ended) return null;          // 打完的局不允许读回来（第 21 轮）
    /* ⚠️ 第 30 轮：同上，版本对不上直接作废（并清掉那个键）。 */
    if (!runSaveTableOk(d)){ dropStaleRun(); return null; }
    delete d.__savedAt;
    delete d.__realmTable;
    const savedChallenge = d.__challenge || null;
    delete d.__challenge;
    d.rng = makeRng((d.seed||'x') + '#' + (d.actions||0));
    s = d;
    challenge = null;
    /* 第 26 轮：老存档里没有内景字段（它是这一轮才有的）。
       对齐一次，免得玩家读回旧档之后看到「元婴期挂着气海」。 */
    normalizeDaoJi();
    /* 第 32 轮：s.deeds 是这一轮才有的字段，老存档里没有。
       不补的话 deedHas/flagAge 那一套会在 undefined 上取属性。
       与 s.flagAt（第 31 轮）同一套做法：缺就补空，不做表版本作废。 */
    if (!s.deeds) s.deeds = {};
    /* 第 33 轮：s.upSnap 也是这一轮才有的。老存档没有它 →
       用**当前** meta 补一张，行为与旧版完全一致
       （旧版就是实时读 meta），不会让老档的升级凭空失效。
       注意：补的时机是读档那一刻，所以「这一局读档时元层是什么等级」
       就固定下来了 —— 与「新开一局的快照」是同一条规则。 */
    if (!s.upSnap) s.upSnap = upSnapshot();
    /* 第 34 轮：s.place / s.visited 也是这一轮才有的。
       老存档没有 → 补回「家里」，行为与旧版完全一致
       （旧版没有位置概念，等价于一直在宗门）。 */
    if (!s.place || !G.placeById(s.place)) s.place = 'home';
    if (!Array.isArray(s.visited) || !s.visited.length) s.visited = [s.place];
    if (s.visited.indexOf(s.place) < 0) s.visited.push(s.place);
    s.travelled = false;                  // 读档后不处在「刚赶完路」那一步
    if (!s.flagAt) s.flagAt = {};
    /* 把没打完的那场战斗接回来。
       stats 不存盘（它由 attrs/agg 派生），这里按当前局面重算，
       所以读档后的战斗数值永远和当前 build 一致。 */
    if (savedChallenge && savedChallenge.active){
      savedChallenge.stats = combatStats();
      /* 一个「被打断过」的标记：界面会告诉玩家那场战斗还没打完 */
      savedChallenge.interrupted = true;
      challenge = savedChallenge;
    }
    return s;
  }catch(e){ return null; }
}

function clearRun(){
  try{ localStorage.removeItem(RUN_KEY); }catch(e){}
}

/* ============================================================
   秘境（第 27 轮）
   ------------------------------------------------------------
   见 src/mijing.js 的设计说明。这里只做状态机：

     s.mijing = {
       shards : 已捡到的秘境图残片数
       known  : 已推演出来的残片型秘境 id
       done   : 一局里已经探索过的秘境 id
       run    : 正在探索的那一次 { id, floor, deepest, cost } —— 可存档
       nextAt : 大众型下一次开启的行动数
       openId / openUntil : 当前开着的大众型秘境与它的关门时刻
     }

   规则要点：
     · **进入要花一次行动**（扣寿元），层内的选择不额外扣寿元
     · 层内随时可以退出，已经拿到的东西带走
     · 一处秘境一局只能探索一次（残片型靠再推演，大众型靠下一次开）
     · 境界不够进不去 —— 这是玩家点名要的「限制境界进入」
   ============================================================ */

function miJing(){ return (s && s.mijing) || null; }
function miJingEnsure(){
  if (!s) return null;
  if (!s.mijing || typeof s.mijing !== 'object'){
    s.mijing = { shards:0, known:[], done:[], run:null,
                 nextAt:(G.MIJING_PUBLIC.firstAt||40), openId:null, openUntil:0 };
  }
  const m = s.mijing;
  m.shards = m.shards||0; m.known = m.known||[]; m.done = m.done||[];
  if (m.run === undefined) m.run = null;
  if (!m.nextAt) m.nextAt = (G.MIJING_PUBLIC.firstAt||40);
  if (m.openId === undefined) m.openId = null;
  if (!m.openUntil) m.openUntil = 0;
  return m;
}
function myMajorIdx(){ return (G.REALMS[s.realmIdx] || {major:1}).major; }

/* 现在能进哪些秘境 */
function miJingOpenList(){
  const m = miJingEnsure();
  if (!m || !s || s.ended) return [];
  const out = [];
  const maj = myMajorIdx();
  (m.known||[]).forEach(id=>{
    if (m.done.indexOf(id) >= 0) return;
    const def = G.mijingById(id);
    if (!def) return;
    if (maj < (def.minMajor||1) || (def.maxMajor && maj > def.maxMajor)) return;
    out.push({ def:def, via:'shard' });
  });
  if (m.openId && (s.actions||0) < (m.openUntil||0)){
    const def = G.mijingById(m.openId);
    if (def && m.done.indexOf(def.id) < 0
        && maj >= (def.minMajor||1) && !(def.maxMajor && maj > def.maxMajor)){
      out.push({ def:def, via:'public', left: m.openUntil - (s.actions||0) });
    }
  }
  return out;
}

/* 能不能推演入口（残片够了 && 有可推演的目标） */
function miJingCanDivine(){
  const m = miJingEnsure();
  if (!m || !s || s.ended) return null;
  if (m.shards < (G.MIJING_SHARD.need||3)) return null;
  const maj = myMajorIdx();
  const pool = G.mijingFor(maj, 'shard').filter(d=>
    m.known.indexOf(d.id) < 0 && m.done.indexOf(d.id) < 0);
  return pool.length ? { pool:pool, shards:m.shards, need:G.MIJING_SHARD.need } : null;
}

/* 推演入口：消耗残片，得到一处属于你的秘境 */
function divineMijing(){
  const st = miJingCanDivine();
  if (!st) return { ok:false, msg:'残片还不够，或者这一境已经没有可推演的地方了' };
  const m = miJingEnsure();
  const pick = st.pool[Math.floor((s.rng?s.rng():Math.random()) * st.pool.length)];
  m.shards -= (G.MIJING_SHARD.need||3);
  m.known.push(pick.id);
  log(`你把残片拼了起来。它们指向「${pick.name}」。`);
  saveRun();
  return { ok:true, def:pick, shards:m.shards };
}

/* 捡到一片残片（探索时调） */
function gainMijingShard(n){
  const m = miJingEnsure();
  if (!m) return false;
  m.shards = (m.shards||0) + (n||1);
  return true;
}

/* 大众型的时钟：每次行动后调一次。
   到点了就开一处，并返回它 —— 界面拿去做「天地异动」的公告。 */
function tickMijingClock(){
  const m = miJingEnsure();
  if (!m || !s || s.ended) return null;
  if (m.openId && (s.actions||0) >= (m.openUntil||0)){
    const closed = G.mijingById(m.openId);
    m.openId = null; m.openUntil = 0;
    if (closed) log(`「${closed.name}」的口子合上了。`);
  }
  if (!m.openId && (s.actions||0) >= (m.nextAt||0)){
    const maj = myMajorIdx();
    const pool = G.mijingFor(maj, 'public').filter(d=>m.done.indexOf(d.id) < 0);
    m.nextAt = (s.actions||0) + (G.MIJING_PUBLIC.period||58);
    if (!pool.length) return null;
    const pick = pool[Math.floor((s.rng?s.rng():Math.random()) * pool.length)];
    m.openId = pick.id;
    m.openUntil = (s.actions||0) + (G.MIJING_PUBLIC.window||14);
    log(`天地异动：「${pick.name}」开了。`);
    saveRun();
    return { def:pick, until:m.openUntil, left:m.openUntil-(s.actions||0) };
  }
  return null;
}

/* 进入一处秘境。花一次行动（扣寿元），开始分层探索。 */
function enterMijing(id){
  const m = miJingEnsure();
  if (!m || !s || s.ended) return { ok:false, msg:'现在进不去' };
  if (m.run) return { ok:false, msg:'你已经在里面了' };
  const open = miJingOpenList().find(x=>x.def.id===id);
  if (!open) return { ok:false, msg:'这处秘境现在进不去（境界不合，或者已经探索过了）' };
  const cost = actionCost();
  if (s.life - cost <= 0) return { ok:false, msg:'寿元不足' };
  gainLife(-cost);
  s.actions++;
  s.worldActions = (s.worldActions||0)+1;
  m.run = { id:id, floor:0, deepest:0, cost:cost };
  log(`你进了「${open.def.name}」。`);
  note('place', `进了${open.def.name}（${open.def.epithet}）。`);
  saveRun();
  return { ok:true, def:open.def, via:open.via, cost:cost, floor:0 };
}

/* 当前这一层的数据 */
function miJingFloor(){
  const m = miJing();
  if (!m || !m.run) return null;
  const def = G.mijingById(m.run.id);
  if (!def) return null;
  const plan = def.plan[m.run.floor];
  if (!plan) return null;
  return { def:def, floor:m.run.floor, total:def.plan.length, text:plan.text,
           choices:plan.choices, deepest:m.run.deepest };
}

/* 在第 floor 层做出选择 */
function miJingPick(idx){
  const m = miJing();
  if (!m || !m.run) return { ok:false, msg:'你不在秘境里' };
  const cur = miJingFloor();
  if (!cur) return { ok:false, msg:'这一层没有路了' };
  const c = cur.choices[idx];
  if (!c) return { ok:false, msg:'没有这个选项' };
  const api = makeActions({ onDeath:function(d){ if (s.mijing) s.mijing.run = null; } });
  let text = '';
  try { text = c.eff(s, api) || ''; }catch(e){ text = '（这里什么也没发生。）'; }
  m.run.floor++;
  m.run.deepest = Math.max(m.run.deepest, m.run.floor);
  const def = G.mijingById(m.run.id);
  const finished = m.run.floor >= def.plan.length;
  const pending = { challenge: api._pendingChallenge, tianjiao: api._pendingTianjiao,
                    tourney: api._pendingTourney, ended: api._ended };
  saveRun();
  return { ok:true, text:text, floor:m.run.floor, finished:finished,
           pending:pending, def:def };
}

/* 退出：拿到的东西带走，秘境标记为已探索 */
function leaveMijing(){
  const m = miJing();
  if (!m || !m.run) return null;
  const def = G.mijingById(m.run.id);
  const deepest = m.run.deepest;
  const finished = def ? (m.run.floor >= def.plan.length) : false;
  if (m.done.indexOf(m.run.id) < 0) m.done.push(m.run.id);
  if (finished) note('place', `从${def ? def.name : '秘境'}最深处活着出来了。`);
  /* 第 32 轮：秘境里走过的**岔路**也要留下痕迹。
     审计发现 mijing.js 写了 10 个标记（mj_hanquan_circle 之类）却没人读 ——
     而 dev/verify-linkage.js §8 的「断头标记」棘轮只扫 G.EVENTS 与主线，
     扫不到秘境，所以它一直显示 0，README 里那句「一个新断头都不许有」
     因此是**说过头了**。现在把这些岔路记进「这一世」的编年：
     玩家至少能看见「那一趟我走过哪条路」，标记也就有了真正的读者。
     表见 src/mijing.js 末尾的 G.MIJING_PATH_NOTES。 */
  (function(){
    const notes = G.MIJING_PATH_NOTES || {};
    Object.keys(notes).forEach(function(f){
      if ((s.flags||[]).indexOf(f) >= 0) note('place', notes[f]);
    });
  })();
  m.run = null;
  log(`你从「${def ? def.name : '秘境'}」里出来了（走到第 ${deepest} 层）。`);
  saveRun();
  return { def:def, deepest:deepest, finished:finished };
}

/* 给界面用的一整块状态 */
function miJingStatus(){
  const m = miJingEnsure();
  if (!m) return null;
  const maj = myMajorIdx();
  const open = miJingOpenList();
  const div = miJingCanDivine();
  const runDef = m.run ? G.mijingById(m.run.id) : null;
  return {
    shards: m.shards, need: (G.MIJING_SHARD.need||3),
    canDivine: !!div,
    divinePool: div ? div.pool.map(d=>d.name) : [],
    open: open.map(x=>({ id:x.def.id, name:x.def.name, epithet:x.def.epithet,
                         via:x.via, left:x.left||0, floors:x.def.plan.length,
                         minMajor:x.def.minMajor, maxMajor:x.def.maxMajor })),
    run: m.run ? { id:m.run.id, name:runDef?runDef.name:'?', floor:m.run.floor,
                   total:runDef?runDef.plan.length:0, deepest:m.run.deepest } : null,
    publicAt: m.nextAt, publicLeft: Math.max(0, (m.nextAt||0) - (s?s.actions:0)),
    publicOpen: m.openId ? (G.mijingById(m.openId)||{}).name : null,
    done: (m.done||[]).slice(),
    all: G.MIJING.map(d=>({
      id:d.id, name:d.name, epithet:d.epithet, kind:d.kind,
      minMajor:d.minMajor, maxMajor:d.maxMajor, floors:d.plan.length,
      entered: (m.done||[]).indexOf(d.id)>=0,
      known: (m.known||[]).indexOf(d.id)>=0,
      allowed: maj >= (d.minMajor||1) && !(d.maxMajor && maj > d.maxMajor)
    }))
  };
}

/* ---------------- 线索 ---------------- */
function addClue(id){
  if (!s.clues.includes(id)) s.clues.push(id);
}

/* ============================================================
   比武大会（第 22 轮）
   ------------------------------------------------------------
   · 按大境界分赛道，门槛是该大境界的第 5 层
   · 每 G.TOURNEY.period 次行动开一次
   · 一局内每条赛道只能打一次（记在 s.tourneyDone）
   · 输一场淘汰，但**不会死**（比武不是生死斗）
   ============================================================ */

/* 当前玩家能报名的赛道（未打过、境界够、身体撑得住） */
function tourneyBracket(){
  if (!s || s.chapter !== 'zongmen' || s.ended) return null;
  const cur = G.REALMS[s.realmIdx];
  if (!cur) return null;
  /* 第 22 轮：身上太虚的时候不发请帖。
     理由有两个 ——
       ① 设计上：宗门不会把一个只剩半条命的人推上台（那叫送死，不叫比武）
       ② 体感上：比武要连打 4 场，如果请帖在你寿元见底时弹出来，
          玩家会陷入「为了比武把自己耗死」的陷阱。这是设计的锅，不该怪玩家。
     低于这个比例时请帖**推迟**（不是作废）—— 下一次窗口还会来。 */
  const lifeRatio = (s.maxLife > 0) ? s.life / s.maxLife : 1;
  if (lifeRatio < 0.45) return null;
  const done = s.tourneyDone || [];
  for (const b of G.TOURNEY_BRACKETS){
    /* 只报「自己当前大境界」的赛道 —— 赛道按境界划分，不越级 */
    if (b.major !== cur.major) continue;
    if (done.indexOf(b.id) >= 0) continue;
    /* 门槛：该大境界的第 needSub 层 */
    if ((cur.sub || 0) < b.needSub) continue;
    return b;
  }
  return null;
}

/* 现在是不是「比武大会开了」？界面在每个行动后问一次 */
function tourneyReady(){
  if (!tourneyBracket()) return null;
  if ((s.actions || 0) < G.TOURNEY.firstAt) return null;
  const period = G.TOURNEY.period || 28;
  /* 每 period 次行动开一次：落在窗口里就算「正在开」 */
  if ((s.actions || 0) % period !== 0) return null;
  return tourneyBracket();
}

/* 开一场：标记这条赛道已参加，返回赛事状态 */
function startTourney(bracketId){
  const b = G.TOURNEY_BRACKETS.find(x=>x.id===bracketId) || tourneyBracket();
  if (!b) return null;
  if (!s.tourneyDone) s.tourneyDone = [];
  if (s.tourneyDone.indexOf(b.id) >= 0) return null;
  s.tourneyDone.push(b.id);
  s.tourney = { id:b.id, round:0, total:G.TOURNEY.rounds, wins:0, alive:true };
  log(`你报名了「${b.name}」。`);
  return s.tourney;
}

/* 下一位对手的配置（交给 startChallenge） */
function tourneyNextOpponent(){
  const t = s.tourney;
  if (!t || !t.alive) return null;
  const b = G.TOURNEY_BRACKETS.find(x=>x.id===t.id);
  if (!b) return null;
  const step = G.TOURNEY.ladder[t.round];
  if (!step) return null;
  const maj = G.REALMS[s.realmIdx].major;
  /* 第 26 轮：决赛换一套专用的名字池，让「顶级高手」有人样。
     前几轮仍然从大众池里抽。 */
  const finalPool = G.TOURNEY_FINAL_NAMES && G.TOURNEY_FINAL_NAMES[maj];
  const pool = (step.tier === 'boss' && finalPool && finalPool.length)
             ? finalPool
             : (G.TOURNEY_NAMES[maj] || G.TOURNEY_NAMES[1] || ['无名散修']);
  const name = pool[Math.floor(s.rng()*pool.length)];
  return {
    name: name,
    tier: step.tier,
    type: 'tourney',
    rounds: 40,
    /* 第 26 轮：每一轮的额外难度（决赛最重）。
       走 ±% 微调通道 —— startChallenge 会把它同时乘到敌人的血和攻上。 */
    power: Math.round(((step.mul || 1) - 1) * 100),
    tourney: { bracket:b.id, round:t.round, total:t.total, label:step.label,
               note: step.note || '', mul: step.mul || 1 },
    /* 比武输了不死：只淘汰，战果只是面子与灵石。
       注：战斗本身不额外扣寿元（寿元只在「行动」和「战败转盘」上扣），
       所以参加比武的代价是「占用了行动预算」，不是「额外赔命」。 */
    outcome: {
      win:  { stone: Math.round(b.reward.stone * (1 + t.round*0.35)),
              cult:  Math.round(b.reward.cult  * (1 + t.round*0.35)) },
      lose: { stone: -Math.round(b.reward.stone * 0.15) }
    }
  };
}

/* 一场比武打完之后推进赛程。win = 这一场赢了没有。 */
function advanceTourney(win){
  const t = s.tourney;
  if (!t) return null;
  if (win){
    t.wins++;
    t.round++;
    if (t.round >= t.total){
      t.alive = false; t.champion = true;
      const b = G.TOURNEY_BRACKETS.find(x=>x.id===t.id);
      if (b){
        note('fight', `夺了${b.name}的魁。台下的人喊了你的名字。`);
        gainStone(b.champion.stone);
        gainContrib(b.champion.contrib);
        gainFavor(b.champion.favor);
        /* 夺魁的修为按大境界缩放，直接给绝对数不合理 */
        s.cult += evGain(b.champion.cult, 'high');
        if (!s.titles) s.titles = [];
        if (b.champion.title && s.titles.indexOf(b.champion.title) < 0)
          s.titles.push(b.champion.title);
        log(`你在「${b.name}」夺魁，得了「${b.champion.title}」的名号。`);
      }
      return { champion:true, bracket:b, tourney:t };
    }
    return { next:true, tourney:t };
  }
  t.alive = false; t.eliminated = true;
  return { eliminated:true, tourney:t };
}

/* 赛事结束后收尾（界面在弹层关掉时调） */
function clearTourney(){ if (s) s.tourney = null; }

/* ============================================================
   天骄榜（第 22 轮）
   ============================================================ */

/* 「问影香」的烟往哪边飘（第 27 轮）。纯风味，没有机制意义，
   但它让「指路」这件事有画面。 */
const HAUNT_DIRS = ['东南','正东','东北','正南','西南','西北'];

/* 这一局里、当前境界能碰上的天骄（同大境界，且没打过） */
function tianjiaoForRealm(){
  if (!s) return null;
  const major = (G.REALMS[s.realmIdx] || {major:1}).major;
  const met = s.tianjiaoMet || [];
  const pool = G.TIANJIAO.filter(t=>t.major===major && met.indexOf(t.id) < 0);
  if (!pool.length) return null;
  return pool[Math.floor(s.rng()*pool.length)];
}

/* 把天骄变成一场挑战的配置。
   数值刻意压到「同境界基本打不过」——见 G.TIANJIAO_MUL 的说明。 */
function tianjiaoChallenge(tj){
  if (!tj) return null;
  return {
    name: tj.name,
    tier: 'terror',                    // 起步就是凶物级
    type: 'tianjiao',
    bossId: null,
    tianjiaoId: tj.id,
    rounds: 60,
    /* 天骄额外机制：更高的重击、每轮回气、减伤 —— 由 startChallenge 读取 */
    tianjiao: true,
    outcome: {
      win:  { stone: tj.reward.stone, cult: tj.reward.cult,
              favor: tj.reward.favor||0, lifeMax: tj.reward.lifeMax||0,
              karma: tj.reward.karma||0,
              clue: tj.reward.clue||null,
              flag: 'tj_beaten_' + tj.id },
      lose: { flag: 'tj_lost_' + tj.id, lifePct: -0.08 }
    }
  };
}

/* 记录「这位天骄已经遭遇过」（不论输赢，一局只遇一次） */
function markTianjiaoMet(id){
  if (!s) return;
  if (!s.tianjiaoMet) s.tianjiaoMet = [];
  if (s.tianjiaoMet.indexOf(id) < 0) s.tianjiaoMet.push(id);
  const tj = G.TIANJIAO.find(t=>t.id===id);
  if (!tj) return;
  /* 打赢了就记进元层档案柜（终身成就） */
  if (s.flags.indexOf('tj_beaten_' + id) >= 0){
    if (!meta.tianjiao) meta.tianjiao = [];
    if (meta.tianjiao.indexOf(id) < 0){
      meta.tianjiao.push(id);
      if (!meta.lore.includes(id)) meta.lore.push(id);
      saveMeta(meta);
    }
  }
}

/* 元层：已击败的天骄 */
function tianjiaoDefeated(){ return (meta && meta.tianjiao) || []; }
/* 玩家在这一局里的名号（比武夺魁等） */
function titles(){ return (s && s.titles) || []; }

/* ---------------- 「榜」面板要用的查询（第 25 轮） ----------------
   玩家反馈：「我还是找不到有关比武大会和天骄榜的任何线索」。
   之前的实现里，这两套系统**只存在于事件与引擎内部**：
   比武的请帖是一闪而过的弹窗，天骄榜更是只有抽到特定事件才能看见一行字。
   界面里没有任何地方能随时查「擂台什么时候开」「榜上都有谁」。
   下面这几个函数就是给那个面板供数的——规则与 tourneyReady() 同源，
   面板不会承诺一个不会到来的窗口。 */

/* 下一次「开擂」是第几次行动（已开过的那个窗口不算） */
function tourneyNextAt(){
  const period = G.TOURNEY.period || 40;
  const a = s ? (s.actions || 0) : 0;
  let next = Math.ceil((a + 1) / period) * period;
  if (next < (G.TOURNEY.firstAt || 0)) next = G.TOURNEY.firstAt || 0;
  return next;
}

/* 你现在为什么上不了台（空字符串 = 随时可以上台）。
   这段文字直接显示在「榜」面板上——「为什么没请帖」必须是有答案的，
   否则玩家只会觉得这个系统坏了。 */
function tourneyBlockReason(){
  if (!s || s.ended) return '这一局已经结束了';
  if (s.chapter !== 'zongmen') return '散修篇没有擂台。山里不设台。';
  const cur = G.REALMS[s.realmIdx];
  if (!cur) return '境界未知';
  const b = G.TOURNEY_BRACKETS.find(x=>x.major===cur.major);
  if (!b) return '你所在的境界还没有设台';
  if ((s.tourneyDone || []).indexOf(b.id) >= 0) return '这条赛道你已经打过了（一局一次）';
  if ((cur.sub || 0) < b.needSub) return `还差 ${b.needSub - (cur.sub || 0)} 层才够资格上台`;
  const ratio = s.maxLife > 0 ? s.life / s.maxLife : 1;
  if (ratio < 0.45) return '寿元不足四成半——宗门不会在这时候推你上台（会顺延，不作废）';
  return '';
}

/* 比武大会的完整状态（面板用） */
function tourneyStatus(){
  const cur = s ? G.REALMS[s.realmIdx] : null;
  const mine = cur ? (G.TOURNEY_BRACKETS.find(x=>x.major===cur.major) || null) : null;
  const done = (s && s.tourneyDone) || [];
  return {
    period: G.TOURNEY.period,
    rounds: G.TOURNEY.rounds,
    brackets: G.TOURNEY_BRACKETS.map(b=>({
      id:b.id, major:b.major, name:b.name, desc:b.desc, needSub:b.needSub,
      reward:b.reward, champion:b.champion,
      mine: !!mine && b.id === mine.id,
      cleared: done.indexOf(b.id) >= 0,
      cur: !!cur && b.major === cur.major
    })),
    mine: mine,
    nextAt: tourneyNextAt(),
    inActions: Math.max(0, tourneyNextAt() - ((s && s.actions) || 0)),
    block: tourneyBlockReason(),
    titles: titles()
  };
}

/* 天骄榜的完整状态（面板用）：按大境界分组，附「我见过 / 我赢过」 */
function tianjiaoStatus(){
  const cur = s ? G.REALMS[s.realmIdx] : null;
  const met = (s && s.tianjiaoMet) || [];
  const beaten = tianjiaoDefeated();
  const mine = cur ? cur.major : 1;
  return {
    mine: mine,
    heard: !!(s && s.flags && s.flags.indexOf('heard_tianjiao') >= 0),
    /* 能不能现在就循名去找人 */
    seekable: !!(s && !s.ended && s.flags && s.flags.indexOf('heard_tianjiao') >= 0 && tianjiaoForRealm()),
    rows: G.TIANJIAO.map(t=>({
      id:t.id, name:t.name, major:t.major, epithet:t.epithet, sub:t.sub,
      cur: t.major === mine,
      metThisRun: met.indexOf(t.id) >= 0,
      beatenThisRun: !!(s && s.flags && s.flags.indexOf('tj_beaten_' + t.id) >= 0),
      beatenEver: beaten.indexOf(t.id) >= 0,
      reward: t.reward
    }))
  };
}

/* 循着传闻去找当前境界的天骄（第 25 轮）。
   ------------------------------------------------------------
   天骄原本只在机缘 / 宗门事件里以 22~28% 的小概率出现，
   一局下来很可能一次都碰不上（实测：只有 64% 的局能遇到）。
   玩家反馈「找不到任何线索」——问题不在概率，在于**没有第二条路**。

   现在：只要你在茶棚那张榜上记住了名字（flag: heard_tianjiao），
   就可以花一次行动主动去找当前境界的那一位。
   ⚠️ 找到之后就直接开打——这不是「找到人聊两句」，
   天骄的设定就是「除非数值远超同境界，否则不可能战胜」。
   所以这个按钮是一次**自愿踏入的险境**，不是福利。
   代价也只有一次行动的寿元；打输的后果走挑战自己的 outcome。 */
function seekTianjiao(){
  if (!s || s.ended) return { ok:false, msg:'这一局已经结束了' };
  if (!s.flags || s.flags.indexOf('heard_tianjiao') < 0)
    return { ok:false, msg:'你还不知道榜上有谁。先在山下茶棚里见过那张榜。' };
  const tj = tianjiaoForRealm();
  if (!tj) return { ok:false, msg:'这个境界上，榜里没有你还没见过的人。' };
  const cost = actionCost();
  if (s.life - cost <= 0) return { ok:false, msg:'寿元不足' };
  gainLife(-cost);
  s.actions = (s.actions || 0) + 1;
  s.worldActions = (s.worldActions || 0) + 1;
  log(`你循着传闻去找${tj.name}。`);
  return { ok:true, cost:cost, tj:tj, cfg: tianjiaoChallenge(tj), intro: tj.intro };
}

/* ---------------- 宗门：贡献 · 职衔 · 藏经阁 · 月俸 · 主线 ---------------- */
function sectContrib(){ return s.sectContrib || 0; }
function sectRank(){
  const c = sectContrib();
  let cur = G.SECT_RANKS[0];
  for (const r of G.SECT_RANKS){ if (c >= r.need) cur = r; }
  return cur;
}
function gainContrib(n){
  s.sectContrib = Math.max(0, (s.sectContrib||0) + n);
  /* 第 27 轮：另外记一份**累计贡献**（只增不减）。
     为什么需要它：原来的《三月初七》用「累计宗门行动次数」当进度门槛，
     而那个数字只能靠一遍遍点宗门事务堆上去 —— 一局 213 次行动里要堆到 230。
     现在主线改看累计贡献，而贡献是「做事就有」的正反馈，
     不再要求玩家专门去做某一件重复劳动。
     注意它和 sectContrib 的区别：sectContrib 会被剧情/藏经阁扣掉（是余额），
     sectContribTotal 只增不减（是履历）。 */
  if (n > 0) s.sectContribTotal = (s.sectContribTotal||0) + n;
  const before = s._lastRank || 'waimen';
  const r = sectRank().id;
  if (r !== before && s._lastRank){
    log('你在宗门里的位份变了：' + sectRank().name);
    s._rankUp = sectRank();
  }
  s._lastRank = r;
}
/* 累计贡献（老存档没有这个字段时，用当前余额兜底） */
function sectContribTotal(){
  if (!s) return 0;
  return Math.max(s.sectContribTotal||0, s.sectContrib||0);
}

/* 藏经阁价格：气运越高越便宜，职衔越高折扣越大 */
function shopPrice(itemId){
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  if (!it) return null;
  const rank = sectRank();
  const qiMul = 1.25 - (s.sectQi / 100) * 0.4;    // 气运 100 → ×0.85，气运 0 → ×1.25
  const price = Math.round(it.price * qiMul * (1 - rank.discount));
  return { price:price, base:it.price, qiMul:qiMul, discount:rank.discount };
}
function canBuyShop(itemId){
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  if (!it) return { ok:false, msg:'没有这本功法' };
  const ranks = G.SECT_RANKS.map(r=>r.id);
  if (ranks.indexOf(sectRank().id) < ranks.indexOf(it.rank))
    return { ok:false, msg:'你的位份还不够（需要 ' + (G.SECT_RANKS.find(r=>r.id===it.rank)||{}).name + '）' };
  if (s.deck.indexOf(it.card) >= 0) return { ok:false, msg:'这门功法你已经会了' };
  const p = shopPrice(itemId);
  if (s.stone < p.price) return { ok:false, msg:'灵石不够（需 ' + p.price + '）' };
  return { ok:true, price:p.price };
}
function buyFromShop(itemId){
  const chk = canBuyShop(itemId);
  if (!chk.ok) return chk;
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  s.stone -= chk.price;
  addCard(it.card);
  gainContrib(8);
  log('你在藏经阁请了《' + it.card + '》。');
  return { ok:true, card:it.card, price:chk.price };
}

/* 宗门任务 */
function doSectTask(taskId){
  const t = G.SECT_TASKS.find(x=>x.id===taskId);
  if (!t) return null;
  const cost = actionCost();
  s.life -= cost;
  s.actions++;
  s.sectActions = (s.sectActions||0) + 1;
  gainContrib(t.contrib);
  gainStone(t.stone);
  gainSectQi(1);
  let hurt = 0;
  if (t.risk > 0 && s.rng() < t.risk){
    hurt = Math.round(s.maxLife * 0.10);
    s.life -= hurt;
  }
  const dead = checkDeath();
  return { ok:true, task:t, cost:cost, contrib:t.contrib, stone:t.stone, hurt:hurt, dead:dead };
}

/* 月俸：每 10 次宗门行动发一次 */
function paySalary(){
  const rank = sectRank();
  const bless = sectBlessing();
  const amount = Math.round(rank.salary * bless.salary);
  gainStone(amount);
  gainSectQi(2);
  return { amount:amount, rank:rank.name };
}

/* 宗门主线《三月初七》的「讲完了」哨兵（第 31 轮）。
   ⚠️ 不能用 null —— 那个值同时表示「还没开始」。见 storyStage()。 */
G.STORY_DONE = '__story_done__';

/* ---------------- 宗门主线《三月初七》 ----------------
   ⚠️ 第 27 轮：进度门槛从「累计宗门行动次数」改成「累计宗门贡献」。
   旧版四页要 25 / 70 / 140 / **230** 次宗门行动 ——
   而一局总共才约 213 次行动，第四页**永远看不到**
   （实测：正常玩只有 34% 的局能翻到第四页，而且那是靠模拟器硬刷出来的）。
   同时主页面的「宗门事务」现在自动给贡献，所以这条线不再要求
   「进宗门面板反复点任务」这种多此一举的操作。

   ⚠️ 第 31 轮：从**线性四页**改成**有岔路的故事图**。
   玩家原话：「哪怕是三月初七也一样，本质上内容量过少了」，
   而且它当时确实是 `storyStage + 1` 一条直线：4 页、472 字、12 个选项，
   选什么都只影响收益，不影响下一页是什么。

   现在的结构：
     · s.storyStage 存的是**页面的 id**（字符串），不再是下标
     · 每页可以声明 next(s) → 下一页的 id（不写就顺着数组往后走）
     · 于是「你查下去」和「你合上册子」会走到**不同的第 4、第 5 页**，
       两条路线最后收在同一个尾声，但读到的东西不一样
     · 门槛：12 / 35 / 70 / 100 / 135
       实测一局「累计宗门贡献」中位 171、25% 分位 145 ——
       135 这一步约 78% 的局能翻到，不会重演第 27 轮「最后一页看不到」。
     · 老存档的 storyStage 是**数字**（下标），这里做一次兼容；
       顺便按「读过的页数」记进 s.storyDone，给界面显示进度用。 */
function storyStage(){
  const stages = G.SECT_STORY.stages;
  const cur = s.storyStage;
  /* 老存档：数字下标 */
  if (typeof cur === 'number'){
    return stages[Math.min(cur, stages.length-1)] || null;
  }
  /* ⚠️ 「讲完了」必须用一个**独立的哨兵值**，不能就用 null/undefined。
     因为 null 同时是「还没开始」的意思（下面那行 `cur || start`），
     于是走完最后一条路线之后 storyStage() 会重新返回第一页 ——
     **主线无限循环**，而且 HUD 永远显示「第 1/N 页」。
     被 dev/verify-story.js 的 while 循环挂死抓到（它跑了 120 秒没停）。 */
  if (cur === G.STORY_DONE) return null;
  const id = cur || G.SECT_STORY.start || (stages[0] && stages[0].id);
  if (!id) return null;
  for (let i=0;i<stages.length;i++) if (stages[i].id === id) return stages[i];
  return null;
}
function storyReady(){
  const st = storyStage();
  if (!st) return null;
  if (s.chapter !== 'zongmen') return null;      // 散了宗就没这条线了
  if (sectContribTotal() < storyNeed(st)) return null;
  return st;
}
/* 一页需要多少累计贡献。老字段是 at（宗门行动次数），
   为了不让老存档/老测试直接崩，这里做一次兼容读取。 */
function storyNeed(st){
  if (typeof st.contrib === 'number') return st.contrib;
  return st.at || 0;
}
/* 翻到下一页。返回值是**刚读完的那一页**（界面拿它渲染结果卡）。
   ⚠️ 第 31 轮：这里不再 `+1`，而是问「下一页是谁」，优先级三档：
        ① 玩家这一页选的**那个选项**上的 next（岔路就写在这里）
        ② 这一页自己的 next（整页固定走向）
        ③ 都没有 → 顺着数组往后（普通线性页）
   ⚠️⚠️ 一定要把**选中的那个选项**传进来。
   第一版只看了 `st.next`，而岔路是写在选项上的（st3 的三个选项各有 next），
   于是 advanceStory 找不到 st.next，直接回落到「顺着数组往后」——
   三个选项全都走到 st4a。**分叉等于没做**，而且它不报错。
   被 dev/verify-linkage.js 第 7 节的「路线走查」抓到
   （它发现从起点只能走出一条直线）。 */
function advanceStory(choice){
  const st = storyStage();
  if (!st) return null;
  const stages = G.SECT_STORY.stages;
  const resolve = fn => { try { return fn(s) || null; } catch(e){ return null; } };
  /* ⚠️ 必须区分「没写 next」和「写了 next 但它返回 null」：
       后者是**这条路到此为止**（路线 A 的最后一页就靠它收束）。
     第一版用 `if (!nextId)` 连着判三次，于是 `next:()=>null`
     被当成了「没写」，回落到数组顺序 —— 路线 A 会接着往下走到
     路线 B 的第一页，三条路串成一条。测试里表现为
     「st5a → st4b → st5b → st4c → st5c」这样一条 9 页的长链。 */
  let nextId = null, decided = false;
  if (choice && typeof choice.next === 'function'){ nextId = resolve(choice.next); decided = true; }
  if (!decided && typeof st.next === 'function'){ nextId = resolve(st.next); decided = true; }
  if (!decided){
    const i = stages.indexOf(st);
    nextId = (i >= 0 && i+1 < stages.length) ? stages[i+1].id : null;
  }
  /* ⚠️ 走到头要写**哨兵值**，不能写 null —— 见 storyStage() 的说明：
     null 会被当成「还没开始」，主线会从头再来一遍（无限循环）。 */
  s.storyStage = nextId || G.STORY_DONE;
  /* 读过的页数：界面用它显示「已看几页」。
     ⚠️ 不能用 storyStage 的下标来数 —— 岔路之后两条路线页数不一样。 */
  s.storyDone = (s.storyDone||0) + 1;
  gainContrib(10);
  note('story', `《三月初七》翻过一页：${st.name}`);
  return st;
}
/* 从某一页出发、沿着 next 走到头，一共有多少页。
   给「第 N / 共 M 页」用 —— 岔路之后两条路线的 M 可能不同，
   所以按当前这条路算，而不是按整个数组的长度。 */
function storyLenFrom(st){
  const stages = G.SECT_STORY.stages;
  if (!st) return 0;
  let n = 1, cur = st, guard = 0;
  while (guard++ < 32){
    let nx = null;
    if (typeof cur.next === 'function'){ try{ nx = cur.next(s); }catch(e){ nx = null; } }
    else { const i = stages.indexOf(cur); nx = (i>=0 && i+1<stages.length) ? stages[i+1].id : null; }
    if (!nx) break;
    const f = stages.filter(x=>x.id===nx)[0];
    if (!f) break;
    n++; cur = f;
  }
  return n;
}
function storyProgress(){
  const next = storyStage();
  const done = s.storyDone || 0;
  const total = done + storyLenFrom(next);
  const have = sectContribTotal();
  return { done:done, total:total, next:next,
           have: have,
           need: next ? Math.max(0, storyNeed(next) - have) : 0,
           needAll: next ? storyNeed(next) : 0,
           /* 第 31 轮：还给出「这一页的 id」，界面与测试用它判断走到哪条岔路上 */
           stageId: next ? next.id : null };
}

/* ---------------- 弟子 ---------------- */
/* ---------------- 弟子 ----------------
   第 28 轮加深。玩家选的方向是「多一层『人和人』的关系」，
   而弟子原本只是一个「花气运换产出」的按钮：
   没有成长、没有对白、不会出事、也不会替你死。

   现在它有四件事：
     ① **会成长**：每次派任务攒 cult，攒够 40 出师一次（资质 +1）
     ② **会出事**：任务风险不只是扣你的寿元 —— 弟子可能受伤、可能回不来
     ③ **会替你挡一刀**：濒死时，忠诚 ≥70 的弟子会替你死一次
     ④ **会说话**：每个弟子按抽到的性格有一句自己的台词
   ============================================================ */
function recruitDisciple(){
  const jl = s.buildings.jiangjing;
  const q = 1 + jl + Math.floor(s.rng()*3) + upLevel('discipleQ');
  const names = ['阿石','小满','青禾','无咎','子规','拾一','闻笛','长安','守拙','半山','知白','砚秋'];
  const traits = [
    { n:'勤勉', e:'采药收益 +30%' },
    { n:'聪慧', e:'修行时额外 +2 修为' },
    { n:'忠厚', e:'忠诚下降更慢' },
    { n:'寡言', e:'不容易惹事' },
    { n:'倔',   e:'偶尔拒绝任务' },
    { n:'命薄', e:'受伤概率更高' }
  ];
  const used = {};
  (s.disciples||[]).forEach(x=>{ used[x.name]=true; });
  const free = names.filter(n=>!used[n]);
  const pool = free.length ? free : names;
  const d = {
    id: 'd'+Math.floor(s.rng()*1e9),
    name: pool[Math.floor(s.rng()*pool.length)],
    quality: q,
    trait: traits[Math.floor(s.rng()*traits.length)],
    loyalty: clamp(50 + jl*8 + Math.floor(s.rng()*20), 0, 100),
    cult: 0,
    joined: s.actions||0,
    grown: 0,
    /* 第 28 轮：每个弟子抽一句自己的话，一局不变 */
    line: (function(){
      const L = G.DISCIPLE_LINES || [''];
      return L[Math.floor(s.rng()*L.length)];
    })()
  };
  s.disciples.push(d);
  s.discipleCount = s.disciples.length;
  gainSectQi(4 + q);
  note('people', `${d.name}入了门（${d.trait.n}，资质 ${q}）。`);
  return d;
}

/* 成长：派任务时攒，攒够就出师一次。
   ------------------------------------------------------------
   ⚠️ 第一版写死了「攒够 40 出师、每次 +1 资质」，而任务收益又按
   `1 + 资质×0.2` 放大 —— 两个正反馈叠在一起会失控：
   实测派 60 次采药，资质从 3 涨到 **48**，任务收益变成 ×10.6。
   现在两道闸：
     · 资质封顶 G.DISCIPLE_MAX_Q（9）—— 一个弟子能走多远是有上限的
     · 出师门槛随出师次数抬高（40 → 70 → 100 …）—— 越到后面越难
   两刀下去，一个弟子的成长曲线是「前期快、后期平」，而不是指数。 */
function growDisciple(d, amount){
  if (!d) return null;
  const CAP = G.DISCIPLE_MAX_Q || 9;
  d.cult = (d.cult||0) + (amount||0);
  const need = 40 + (d.grown||0) * 30;
  if (d.cult >= need && d.quality < CAP){
    d.cult -= need;
    d.quality = Math.min(CAP, d.quality + 1);
    d.loyalty = clamp(d.loyalty + 10, 0, 100);
    d.grown = (d.grown||0) + 1;
    s._disciplesGrown = (s._disciplesGrown||0) + 1;
    log(`${d.name}出师了（资质 ${d.quality}）。`);
    note('people', `${d.name}出师了。他的手艺里有你的份。`);
    return { grown:true, name:d.name, quality:d.quality };
  }
  return null;
}

/* 弟子替你挡一刀（濒死时调用）。
   只找忠诚 ≥70 的；挡过就没了。
   这是「关系」这条线上最重的一笔，所以写得很短 —— 短才记得住。 */
function discipleShield(){
  if (!s || !s.disciples || !s.disciples.length) return null;
  const c = s.disciples.filter(d=>d.loyalty >= 70).sort((a,b)=>b.loyalty-a.loyalty)[0];
  if (!c) return null;
  s.disciples.splice(s.disciples.indexOf(c), 1);
  s.discipleCount = s.disciples.length;
  s._discipleShield = (s._discipleShield||0) + 1;
  s._disciplesLost = (s._disciplesLost||0) + 1;
  note('people', `${c.name}替你挡了一下。他没站起来。`);
  log(`${c.name}替你挡了一下。`);
  return c;
}

function sendDisciple(discId, taskId){
  const d = s.disciples.find(x=>x.id===discId);
  const t = G.DISCIPLE_TASKS.find(x=>x.id===taskId);
  if (!d || !t) return null;
  if (d.loyalty < 25 && s.rng()<0.4) return { refused:true, name:d.name };

  const out = { name:d.name, task:t.name, msgs:[] };
  if (s.sectQi < t.cost.qi) return { noqi:true };

  gainSectQi(-t.cost.qi);
  const q = 1 + d.quality*0.2;
  if (t.gain.stone){ const v = Math.round(t.gain.stone*q); gainStone(v); out.msgs.push(`灵石 +${v}`); }
  if (t.gain.cult){ const v = Math.round(t.gain.cult*q); gainCult(v); out.msgs.push(`修为 +${v}`); }
  if (t.gain.qi){ gainSectQi(t.gain.qi); out.msgs.push(`宗门气运 +${t.gain.qi}`); }
  if (t.gain.favor){ gainFavor(t.gain.favor); out.msgs.push(`人情 +${t.gain.favor}`); }

  // 风险
  const risk = t.risk * (d.trait.n==='命薄'?1.5:1) * (d.trait.n==='寡言'?0.6:1);
  if (s.rng() < risk){
    out.hurt = true;
    d.loyalty -= 12;
    const h = Math.round(10 + s.rng()*20);
    s.life -= h;
    /* 第 28 轮：出事的不只是你 —— 弟子也可能回不来。
       用一次**独立的**掷骰（而不是复用同一个）分开「你受伤」与「弟子出事」，
       这样两件事的概率都是可解释的，测试也好钉。

       概率：先过任务自己的风险门槛，再乘 0.15。
        采药 12%×15% = 1.8%　护山 16%×15% = 2.4%　历练 22%×15% = 3.3%
      命薄 ×1.5 之后最高约 5%。
      ⚠️ 第一版拍的是 0.25，实测「派 6 次就折了一个」——太密了。
      弟子的死要有分量，就得稀有；一局丢一两个是故事，丢五个是流水账。 */
    if (s.rng() < 0.15){
      s.disciples.splice(s.disciples.indexOf(d), 1);
      s.discipleCount = s.disciples.length;
      s._disciplesLost = (s._disciplesLost||0) + 1;
      out.lost = true;
      note('people', `${d.name}出去${t.name}，没回来。`);
      out.msgs.push(`出了事：${t.riskTxt} 寿元 −${h}　**${d.name}没回来。**`);
      const dead1 = checkDeath('slay');
      if (dead1) out.end = dead1;
      return out;
    }
    out.msgs.push(`出了事：${t.riskTxt} 寿元 −${h}`);
  } else {
    d.loyalty = clamp(d.loyalty + 4, 0, 100);
    const g = growDisciple(d, 8 + d.quality*2);
    if (g) out.msgs.push(`${g.name}出师了（资质 ${g.quality}）`);
  }
  const dead = checkDeath('slay');
  if (dead) out.end = dead;
  return out;
}
