/* ---------------- 天劫 ----------------
   第 25 轮重做。旧版把强度写成 `t.basePower * (1 + 境界序数*0.16)`，
   而 basePower 是 36~48 —— 那是属性表还只有 41 个值时拍的魔法数字。
   现在玩家伤害走 G.foePowerAt() 那条曲线，金丹期已经是几千点，
   217 点的「天劫」连挠痒都算不上。

   新版沿用敌人强度的**唯一来源**（G.foePowerAt × 难度阶梯），
   只是梯级换成 G.ENEMY_TIERS.tribulation（×2.6，比同阶凶物略轻）。
   三种劫（雷/风/火）的差别改走 cfg.power 的 ±% 微调通道：
   这样「火劫比风劫狠」这件事仍然成立，而且含义是可解释的。 */
function tribulationScale(extreme){
  const T = G.CONFIG.tribulation;
  return extreme ? (T.extremeMul || 1) : 1;
}

/* 把「劫的种类差」与「逆天加成」折算成一个 ±% 微调值，交给 startChallenge。
   两种加成在这里是加法关系（1+f+e），而不是连乘 ——
   连乘会让「火劫 + 逆天」叠到 ×2.1，那是另一场 Boss 的强度，不是门槛。 */
function tribulationFineTune(t, extreme){
  const flavor    = ((t.mul || 1) - 1) * 100;          // 风 −15 / 雷 0 / 火 +10
  const extremePct = (tribulationScale(extreme) - 1) * 100;  // 逆天 +50
  return Math.round(flavor + extremePct);
}

function startTribulation(extreme){
  const names = Object.keys(G.TRIBULATIONS);
  const key = names[Math.floor(s.rng()*names.length)];
  const t = G.TRIBULATIONS[key];
  return startChallenge({
    type:'tribulation',
    tbName:key,
    name:key,
    tier:'tribulation',
    power: tribulationFineTune(t, extreme),
    extreme: !!extreme,
    rounds: t.rounds,
    txt: t.txt
  });
}

/* ---------------- 业障满：天谴 ----------------
   这是唯一「打输可能真的死」的战斗，也是业障唯一的用处。
   ⚠️ 天谴不是「天劫」——它和境界无关，什么时候业障满了什么时候来。
   所以它不受 CONFIG.tribulation 那套大境界门槛的约束。

   ⚠️ 第 29 轮：天谴从「一次判决」改成「循环的代价」，见 data.js 里的长注释。
   规则全部收在引擎里（以前散在 ui.js 的一句 if 里，测不到也改不动）。 */
function karmaOverflow(){
  return s.karma >= G.CONFIG.tribulation.killerKarma;
}

/* 现在轮不轮得到天谴：业障满 **且** 不在冷却里 */
function karmaTribulationReady(){
  if (!karmaOverflow()) return false;
  return (s.actions || 0) >= (s.karmaCool || 0);
}

/* 距离下一次天谴还有几步（界面用来说清楚「现在安不安全」） */
function karmaCooldownLeft(){
  return Math.max(0, (s.karmaCool || 0) - (s.actions || 0));
}

/* 天谴洗业：收走当前业障的一部分，人必须重新作恶才会再招来一次 */
function burnKarma(){
  const p = G.CONFIG.tribulation.karmaBurn;
  const before = s.karma;
  s.karma = Math.max(0, Math.floor(s.karma * (1 - p)));
  return before - s.karma;
}

function startKillerTribulation(){
  const names = Object.keys(G.TRIBULATIONS);
  const key = names[Math.floor(s.rng()*names.length)];
  const t = G.TRIBULATIONS[key];
  /* 冷却在这里盖章：无论打输打赢，天谴都算「已经来过一次」。
     盖章放在开打之前，是为了让「战斗中途关掉页面再读档」也不会白刷一次。 */
  s.karmaCool = (s.actions || 0) + G.CONFIG.tribulation.karmaCooldown;
  return startChallenge({
    type:'tribulation', killer:true, tbName:key,
    name:'天谴 · ' + key,
    tier:'terror',
    /* 天谴比天劫狠一档：阶梯 terror(2.8) + 额外 +50% */
    power: 50,
    rounds: t.rounds,
    txt: '云不是从天上来的。\n是从你自己身上长出来的。\n\n' + t.txt
  });
}

/* ---------------- 元层操作 ---------------- */
/* ⚠️ upLevel / upLevelLive 已经搬到文件上方了（第 33 轮：本局要读快照，
   所以必须在任何调用点之前定义 —— 旧版是函数声明提升所以放在这里也能用，
   现在它是普通函数，位置就必须在前面）。 */
function upCost(id){
  const u = G.UPGRADES.find(x=>x.id===id);
  if (!u) return 0;
  const lv = upLevelLive(id);
  if (lv >= u.max) return null;
  return u.cost(lv);
}
function buyUpgrade(id){
  const cost = upCost(id);
  if (cost===null || meta.frag < cost) return false;
  meta.frag -= cost;
  meta.up[id] = upLevelLive(id)+1;      // 实时值 —— 买升级改的永远是 meta，本局不受影响
  saveMeta(meta);
  return true;
}

/* 降一级，并全额退还「这一级当时花掉的碎片」（第 33 轮 · 玩家要求）
   ------------------------------------------------------------
   玩家原话：「我希望在碎片提升那里增加一个『降级』选项：
   玩家可选择在已经升级的属性提升中点击『-』来选择取消这次升级并返还碎片。」

   为什么退 cost(lv-1) 而不是别的数：
     升级的定义就是「付 cost(当前等级) 换一级」，所以第 N 级的价格
     永远等于 cost(N-1)。逐级往回剥，累计退还 **恒等于** 累计投入 ——
     既不会赚也不会亏，数学上不可能刷碎片。

   ★ 前置条件已经逐项验证过：G.UPGRADES 里 26 项的成本函数**全部严格递增**
     （例如攻伐 22 → 36 → 50 … → 288）。成本若不递增，「从任意级往下剥」
     虽然仍然恒等，但「先点高再降」会变成套利 —— 所以 dev/verify-upgrade-down.js
     把「严格递增」也当成一条断言守着。

   ⚠️ 只动 meta.frag 与 meta.up 两个字段，**不改存档结构**：
     所以不需要动 G.REALM_TABLE_VERSION，老存档照常读。
     正在进行的局不受影响 —— meta 只在 newRun 时被读一次。 */
function downUpgrade(id){
  const u = G.UPGRADES.find(x=>x.id===id);
  if (!u) return null;
  const lv = upLevelLive(id);                   // 实时值：降的是 meta 里那一级
  if (lv <= 0) return null;                     // 已经是 0 级，没得降
  const refund = u.cost(lv-1);                  // 这一级当时的价格
  if (typeof refund !== 'number' || !isFinite(refund) || refund < 0) return null;  // 成本函数写坏了就拒绝服务
  meta.up[id] = lv-1;
  meta.frag += refund;
  saveMeta(meta);
  return { id:id, name:u.name, from:lv, to:lv-1, refund:refund, frag:meta.frag };
}

/* ---------------- 个人气运（元层「气运」升级） ----------------
   与「宗门气运」是两回事：
     · 宗门气运 = 集体，影响你的属性加持
     · 个人气运 = 你自己攒的运气，影响**开局抽签**
   效果：① 体质可以重抽 N 次  ② 「变数」签更容易抽到吉签        */
function luckLevel(){
  /* ⚠️ 个人气运只在**开局抽签**用（重抽体质、吉签权重），那时还没有局在跑，
     所以这里读实时值是**对的** —— 玩家在桌前刚买的等级应该立刻影响下一次抽签。
     这也是 upLevel() 在没有 s.upSnap 时退化成实时值的意义。 */
  return (meta.up && meta.up.luck) || 0;
}
function luckRerolls(){ return luckLevel(); }

/* 变数签的好坏权重：气运越高，吉签越容易出 */
function luckyWeight(tag){
  const L = luckLevel();
  if (tag === 'lucky') return 1 + L * 0.10;      // 吉签权重提升
  if (tag === 'bad')   return Math.max(0.35, 1 - L * 0.06);  // 凶签权重下降
  return 1;
}

/* 按权重从一张签表里抽一条 */
function pickWeighted(list, rng){
  const ws = list.map(t => luckyWeight(t.tag));
  const total = ws.reduce((a,b)=>a+b, 0);
  let r = rng() * total;
  for (let i=0;i<list.length;i++){
    r -= ws[i];
    if (r <= 0) return list[i];
  }
  return list[list.length-1];
}

/* ---------------- 抽签 ---------------- */
function drawLots(forceSeed){
  const seed = forceSeed || (Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36));
  const rng = makeRng(seed);
  const result = { seed: seed, bonus: { startCards:[], flags:[], attrs:{} }, entries: [] };

  G.LOTS.forEach(lot=>{
    if (lot.pick==='constitution'){
      const c = G.CONSTITUTIONS[Math.floor(rng()*G.CONSTITUTIONS.length)];
      result.constitution = c.id;
      result.entries.push({ key:lot.key, label:lot.label, hint:lot.hint,
        name:c.name, desc:c.desc,
        eff:`行动消耗 ×${c.costMul.toFixed(2)}　寿元上限 ×${c.lifeMul.toFixed(2)}` });
      return;
    }
    // 「变数」签吃个人气运：吉签更容易出，凶签更难出
    const t = (lot.key === 'bianshu')
      ? pickWeighted(lot.table, rng)
      : lot.table[Math.floor(rng()*lot.table.length)];    result.entries.push({ key:lot.key, label:lot.label, hint:lot.hint,
      name:t.name, desc:t.desc, eff: describeLot(t) });

    // 合并加成
    if (t.stone) result.bonus.stone = (result.bonus.stone||0)+t.stone;
    if (t.life) result.bonus.lifeMax = (result.bonus.lifeMax||0)+t.life;
    if (t.favor) result.bonus.favor = (result.bonus.favor||0)+t.favor;
    if (t.karmaStart) result.bonus.karmaStart = (result.bonus.karmaStart||0)+t.karmaStart;
    if (t.sectQi) result.bonus.sectQi = (result.bonus.sectQi||0)+t.sectQi;
    if (t.cultStart) result.bonus.cultStart = (result.bonus.cultStart||0)+t.cultStart;
    if (t.cultMul) result.bonus.cultMul = (result.bonus.cultMul||0)+t.cultMul;
    if (t.lifeMul) result.bonus.lifeMul = (result.bonus.lifeMul||0)*(t.lifeMul||1);
    if (t.startCards) result.bonus.startCards = result.bonus.startCards.concat(t.startCards);
    if (t.flag) result.bonus.flags.push(t.flag);
    if (t.flags) result.bonus.flags = result.bonus.flags.concat(t.flags);
    // 六维属性：逐签累加
    if (t.attrs){
      Object.keys(t.attrs).forEach(k=>{
        result.bonus.attrs[k] = (result.bonus.attrs[k]||0) + t.attrs[k];
      });
    }
    if (t.name) result.bonus.flags.push('lot_'+lot.key+'_'+t.name);
  });

  // 身份
  const role = G.ROLES[Math.floor(rng()*G.ROLES.length)];
  result.role = role.id;
  result.entries.push({ key:'shenfen', label:'身 份', hint:'你在宗门里的位置',
    name:role.name, desc:role.desc, eff:`灵石 +${role.mods.stone}　修为效率 ×${role.mods.cultMul}` });

  // 应用身份修正
  result.bonus.stone = (result.bonus.stone||0) + role.mods.stone;
  result.bonus.cultMul = (result.bonus.cultMul||0) * (role.mods.cultMul||1);
  if (role.mods.karmaStart) result.bonus.karmaStart = (result.bonus.karmaStart||0)+role.mods.karmaStart;
  if (role.mods.sectQi) result.bonus.sectQi = (result.bonus.sectQi||0)+role.mods.sectQi;

  // 个人气运：还能重抽几次体质
  result.rerolls = luckRerolls();
  result.rerollsLeft = luckRerolls();

  return result;
}

/* 重抽体质（消耗一次个人气运） */
function rerollConstitution(lots){
  if (!lots || lots.rerollsLeft <= 0) return null;
  const rng = makeRng(lots.seed + '#' + lots.rerollsLeft + '#' + Date.now());
  const c = G.CONSTITUTIONS[Math.floor(rng()*G.CONSTITUTIONS.length)];
  lots.constitution = c.id;
  lots.rerollsLeft--;
  // 更新展示条目
  const entry = lots.entries.find(e=>e.key === 'tizhi');
  if (entry){
    entry.name = c.name;
    entry.desc = c.desc;
    entry.eff = `行动消耗 ×${c.costMul.toFixed(2)}　寿元上限 ×${c.lifeMul.toFixed(2)}`;
  }
  return c;
}

function describeLot(t){
  const parts = [];
  if (t.attrs){
    const seg = G.ATTRS.filter(a=>t.attrs[a.id])
      .map(a=>`${a.name} +${t.attrs[a.id]}`).join('　');
    if (seg) parts.push(seg);
  }
  if (t.stone) parts.push(`灵石 ${t.stone>0?'+':''}${t.stone}`);
  if (t.life) parts.push(`寿元 ${t.life>0?'+':''}${t.life}`);
  if (t.favor) parts.push(`人情 ${t.favor>0?'+':''}${t.favor}`);
  if (t.karmaStart) parts.push(`业障 ${t.karmaStart>0?'+':''}${t.karmaStart}`);
  if (t.sectQi) parts.push(`宗门气运 ${t.sectQi>0?'+':''}${t.sectQi}`);
  if (t.cultStart) parts.push(`修为 +${t.cultStart}`);
  if (t.cultMul) parts.push(`修为效率 +${Math.round(t.cultMul*100)}%`);
  if (t.lifeMul) parts.push(`寿元 ×${t.lifeMul}`);
  if (t.startCards) parts.push(`起始功法：${t.startCards.join('、')}`);
  return parts.join('　');
}

                 ? `天地异动 · 全天下都看得见　<b style="color:#d9a24a">还剩 ${o.left} 次行动就关</b>　`
                 : `只有你知道它在哪　`) +
                `共 ${o.floors} 层　境界 ${G.MAJOR_REALMS[o.minMajor-1]}` +
                (o.maxMajor && o.maxMajor!==o.minMajor ? `~${G.MAJOR_REALMS[o.maxMajor-1]}` : ''),
          primary:true, special:'mijingEnter', mijingId:o.id
        });
      });
      /* 没开也没得推的时候，给一行「还差多少」的提示 ——
         否则玩家根本不知道有这么个系统（第 25 轮的教训）。 */
      if (!mj.canDivine && !mj.open.length && (mj.shards>0 || mj.publicLeft<=8)){
        const bits = [];
        if (mj.shards > 0) bits.push(`秘境图残片 ${mj.shards}/${mj.need}`);
        if (mj.publicLeft <= 8) bits.push(`下一次天地异动还有 ${mj.publicLeft} 次行动`);
        list.push({
          id:'mijingInfo', name:'秘境 · 尚无入口', cost:0, disabled:true,
          desc:'秘境有两种开法：捡齐秘境图残片自己推演，或者等天地异动。',
          meta: bits.join('　') || '探索时有机会捡到秘境图残片',
          special:'mijingInfo'
        });
      }
    }
  }
  /* ---------------- 远行（第 34 轮） ----------------
     放在行动列表最上面，和「推演秘境入口」同级 ——
     它是**出门**这件事，比「今天做什么」高一层。
     cost:0：打开地图本身不花寿元，走路才花（走路那次单独收）。
     顺带把「你现在在哪儿」和「这里在耗你多少」写在按钮上，
     否则玩家不会意识到环境代价这件事（第 25 轮的教训：藏起来的系统等于不存在）。 */
  {
    const p = currentPlace();
    const ec = placeEnvCost();
    const region = G.regionById(p.region);
    const bits = [`${region ? region.name : ''}·${p.name}`];
    if (ec.amount > 0){
      const envName = (G.PLACE_ENV[ec.env] || {}).name || '环境';
      bits.push(`${envName} 每步 −${ec.amount}`);
      if (ec.discount > 0.005) bits.push(`已减免 ${Math.round(ec.discount*100)}%`);
    } else {
      bits.push('此地无额外损耗');
    }
    list.unshift({
      id:'map', name:'★ 舆图 · 远行', cost:0,
      desc:'摊开舆图，看看自己在哪儿，以及还能往哪儿走。\n' +
           '（赶路要花寿元，远近不同；有些地方你现在还去不了。）',
      meta: bits.join('　'),
      primary:true, special:'map'
    });
  }

  /* 修行按钮上的预估值 —— 必须和 doAction('cultivate') 用同一个公式，
     否则界面又在骗玩家（第 20 轮的教训）。 */
  const R = G.REALMS[s.realmIdx] || { speed:1, gain:1 };
  const speed = R.speed || 1;
  const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
  const cultPreview = Math.max(1, Math.round(
    (speed * st.cost + (st.a.cultFlat || 0))
    * (1 + (st.a.cultMul || 0))
    * (consti.cultMul || 1)
    * (s.lots.bonus.cultMul || 1)
    * (1 + (st.attrs.wuxing||0) * 0.012)
    * (1 + st.sectBless.cult)
  ));

  list.push({
    id:'cultivate', name:'修行', cost:st.cost,
    desc:'打坐、吐纳、把那一口气往下压。稳定获得修为。',
    meta:`修为 +${cultPreview}　修炼速度 ${speed.toFixed(2)} / 寿元`,
    primary: st.canBreak ? false : true
  });

  list.push({
    id:'explore', name:'探索', cost:st.cost,
    desc:'下山、入林、翻废墟。有灵石、有修为、有机缘，也可能受伤。',
    meta:'灵石 + 修为 + 几率得卡'
  });

  const sectContribNow = 3 + Math.floor(s.realmIdx / 9);
  list.push({
    id:'sectwork', name:'宗门事务', cost:st.cost,
    /* 第 27 轮：这里必须写明「贡献 +N」。
       以前它不给贡献，玩家想做宗门的事只能进宗门面板点任务 —— 多此一举。
       现在主页面这一下就给，而且主线《三月初七》看的就是累计贡献。 */
    desc:'处理执事、采买、巡山、调解纠纷。赚灵石与宗门贡献，稳住宗门气运。',
    meta:`灵石 +　贡献 +${sectContribNow}　宗门气运 +　人情 +`
  });

  const restLeft = Math.max(0, G.CONFIG.restPerRealm - (s.restUsed||0));
  /* 第 29 轮：走魔道的人必须能在按钮上看见「静养能压业障」，
     否则这条活路等于不存在。 */
  const atoneNow = Math.min(s.karma, G.CONFIG.tribulation.karmaAtonement);
  list.push({
    id:'rest', name:'静养', cost:st.cost, disabled: restLeft<=0,
    desc:'什么都不做，睡一觉。回复寿元，但宗门会少一个人手。\n（静下来也算一种交代：会把业障压下去一点。）',
    /* ⚠️ 这里的数字必须与 doAction('rest') 真正用的公式一致
       （dev/verify-uiclaims.js 会去核对「按钮上的数字 = 实际回复量」） */
    meta: restLeft>0
      ? `寿元回复约 ${Math.round(st.maxLife*0.14*(1+restBonus()))}　本境界还可 ${restLeft} 次`
        + (atoneNow > 0 ? `　业障 −${atoneNow}` : '')
      : '本境界的静养次数已经用完了。突破后方可再养。'
  });

  /* ⚠️ 第 30 轮：上限从写死的 2 改成 CONFIG.nourishPerRealm。
     理由和 restPerRealm 一样：它是**按境界数**累加的，
     境界表从 36 档变 21 档之后，终生可养的次数会跟着砍半。
     写死在两处（这里和按钮文案）很容易只改一边，所以收进 CONFIG。 */
  const nourishLeft = Math.max(0, (G.CONFIG.nourishPerRealm || 2) - (s.nourishUsed||0));
  list.push({
    id:'nourish', name:'养身', cost:st.cost, disabled: nourishLeft<=0,
    desc:'用灵气缓缓滋养身体。永久提升寿元上限，净收益很薄。',
    meta: nourishLeft>0
      ? `寿元上限 +${Math.round(16*(1+s.realmIdx*0.16)*(1+lifeCapBonus()))}　本境界还可 ${nourishLeft} 次`
      : '本境界已经养过了。'
  });

  /* ---------------- 内景（第 26 轮） ----------------
     玩家原话：「修士在体内养成一个金丹，通过消耗修为来培养金丹，
     通过金丹的成长来反哺给玩家数值上的成长」。
     ⚠️ 它**不消耗行动、不消耗寿元**，只花修为 ——
     寿元已经在「修行」那一步付过了。
     放在这里是为了让玩家在做「修行 / 探索 / 破境」的决定时，
     一眼看见「修为还有第二个用法」。 */
  {
    const dj = daoJiStatus();
    const costTxt = dj.maxed ? '已圆满' : `需修为 ${dj.cost}`;
    list.push({
      id:'daoji',
      name: `★ ${dj.name} · 第 ${dj.lv + (dj.maxed?0:1)} 层`,
      cost: 0,                       // 不花寿元
      desc: dj.maxed
        ? `${dj.name}已经养成圆满。${dj.desc}`
        : `${dj.desc}\n（养它花的是**修为**，而修为同时是突破的门票——两者互抢。）`,
      meta: dj.maxed
        ? `已圆满　共 ${dj.lv}/${dj.max} 层　全属性 +${dj.have}`
        : `${costTxt}　现有 ${st.cult}　` +
          `养成后全属性 +${dj.have + dj.per}（每层 +${dj.per}）　${dj.lv}/${dj.max} 层`,
      disabled: dj.maxed || !dj.affordable,
      primary: !dj.maxed && dj.affordable,
      special: 'daoji'
    });
  }

  /* ============================================================
     第 32 轮修：**雷池边上「坐下」之后的死路**
     ------------------------------------------------------------
     玩家在结丹之劫选「在池边坐下」会打上 boss_zhuji_rest，
     从那一刻起 doBreak() 永远返回 null（这是**设计如此** ——
     选择坐下的代价就是「这一世就停在筑基」）。

     但界面不知道这件事：availableActions 里 canBreak() 一直是 true，
     于是主界面上**一直亮着**一个「★ 突破 · 金丹前期」按钮，
     点下去什么都不会发生 —— 修为够、按钮亮着、点了没反应。

     实测：筑基巅峰 + 11325 修为（需求 3775），连点三次 doBreak()
     全部返回 null，境界不动、修为不扣，只有寿元在烧。
     玩家看到的就是「这个按钮坏了」，而不是「我当初做了那个选择」。

     修法：把它显式报出来，并且让按钮**如实**说明原因。
     这一条必须排在 canBreak 之前 —— 否则它永远轮不到。
     ============================================================ */
  {
    const restHere = (s.flags||[]).indexOf('boss_zhuji_rest') >= 0
                  && (G.REALMS[s.realmIdx]||{}).major === 2;
    if (restHere){
      /* ⚠️ 顺序：这一条必须在 canBreak / canAscend / canCapstone **之前**。
         它们三个在「坐过雷池」之后仍然会返回 true（境界确实够了），
         所以先问「还能不能走这条路」——不能的话，后面三个都不必问。 */
      if (st.canBreak){ st.canBreak = false; }
      if (st.canAscend){ st.canAscend = false; }
      list.unshift({
        id:'zhuji_rested', name:'已 在 池 边 坐 下', cost:0, disabled:true,
        desc:'那一世你没有走进雷池。气早就散了，前面没有路了。\n'
           + '剩下的日子还在——去做别的事，或者自己选个时辰收束。',
        meta:'这一世不会再结丹（这是你当初的选择）',
        special:'zhujiRested'
      });
    }
  }

  if (st.canBreak){
    const nextRealm = G.REALMS[st.realmIdx+1];
    /* 第 25 轮：这里必须**如实**告诉玩家会不会挨雷。
       天劫的规则是「跨大境界 且 目标大境界 >= 金丹」，
       所以 canBreak 这一档（小境界）永远不降劫，文案里就不要提天劫。 */
    const tb = shouldTribulate(G.REALMS[st.realmIdx], nextRealm);
    list.unshift({
      id:'break',
      name:'★ 突破 · ' + (nextRealm?nextRealm.name:'—'),
      cost:0,
      desc: tb.yes
        ? '修为已足。这一破要跨大境界——天上会有东西来看你。'
        : '修为已足。破境，寿元上限与当前寿元都将提升。',
      meta:`需修为 ${st.breakNeed}　现有 ${st.cult}` +
           (tb.yes ? '　⚡ 会降天劫' : ''),
      primary:true, special:'break'
    });
  } else if (st.canAscend){
    /* 筑基巅峰 → 金丹前期：第一场天劫，写成剧本（「雷池之影」）。
       ⚠️ 第 25 轮改动：这里原本写的是「炼气九层 → 筑基」和
       「已是此界之巅」——那是早期草稿把筑基当结局时留下的。 */
    list.unshift({
      id:'break',
      name:'★ 结 丹 之 劫 · 金丹',
      cost:0,
      /* ⚠️ 第 30 轮：这里原本写死「筑基九层」。
         筑基起的小境界改成 4 段之后，那一档叫「筑基巅峰」——
         按钮上写着「筑基九层」而玩家站在「筑基巅峰」，界面在撒谎。 */
      desc:'筑基巅峰，气已经满了。结丹要在一瞬间把那口气收回去——收不回去的，就在这里散掉。',
      meta:`需修为 ${st.breakNeed}　现有 ${st.cult}　⚡ 天劫`,
      primary:true, special:'break'
    });
  } else if (st.canCapstone){
    /* 第 21 轮：修为已足，但已到本世上限（元婴九层）。
       这里不再给「突破」，而是给一个收束 —— 让玩家自己合上山门。 */
    list.unshift({
      id:'capstone',
      name:'★ 此 世 圆 满 · 收 束',
      cost:0,
      desc:'修为已满，前面没有路了。把这一世收好——回桌前，拼图还在等。',
      meta:`${G.realmCapName ? G.realmCapName() : ''}已至圆满　需修为 ${st.breakNeed}　现有 ${st.cult}`,
      primary:true, special:'capstone'
    });
  } else if (!st.isMaxRealm){
    list.push({
      id:'break', name:'突破 · ' + (G.REALMS[st.realmIdx+1]?G.REALMS[st.realmIdx+1].name:'—'),
      cost:0, disabled:true,
      desc:'修为不足，破境无门。',
      meta:`还需修为 ${Math.max(0, st.breakNeed - st.cult)}`
    });
  } else if (st.atEnd){
    list.unshift({
      id:'break', name:'此 世 已 满', cost:0, disabled:true,
      desc:'你走到这一段路的尽头了。',
      meta:'这一世到此为止——主动坐化，或者继续活下去。'
    });
  }

  // 下山：经历了一些之后，谁都可以选择离开宗门去做散修。
  // 这不是失败，是另一种活法——「休闲修仙」的正门。
  if (s.chapter === 'zongmen' && s.actions >= 25){
    list.push({
      id:'leavesect', name:'下 山', cost:0, special:'leavesect',
      desc:'把东西收拾好，离开宗门，去做一个散修。山野很大，没人管你。',
      meta:'转 入 散 修 篇 · 不是结局，是换一种活法'
    });
  }

  return list;
}

/* ============================================================
   事件作者用的全局助手（第 29 轮）
   ------------------------------------------------------------
   ⚠️ 为什么必须挂到 window 上：engine.js 整体包在一个 IIFE 里，
   里面的 evAttr / evTextOf 是私有的。而事件数据写在 src/events*.js，
   是**另一个文件里的普通对象字面量**，它在运行时求值时只看得到全局作用域。
   所以给事件作者用的东西必须显式发布出来，否则
   `when:()=>evAttr('shenshi')>=40` 会直接 ReferenceError。

   （a_hasAnyCard 就是同类东西，它一直住在 events.js 的全局作用域里。）
   ============================================================ */
window.evAttr     = evAttr;
window.evAttrSum  = evAttrSum;
window.evAttrRank = evAttrRank;
window.evTextOf   = evTextOf;
/* 第 29 轮：写「属性影响事件」真正要用的三个东西 ——
   evPeer 让门槛与境界无关，evBonus / evMainAttr 让门槛认得出 build。 */
window.evPeer     = evPeer;
window.evBonus    = evBonus;
window.evBonusTotal = evBonusTotal;
window.evBonusShare = evBonusShare;
window.evMainAttr = evMainAttr;
/* 第 31 轮：因果链要用到的两个 —— 事件里写
   when:s=>flagAge('node_broken')>=15 与 flavor:()=>causeLine('node_broken')。
   ⚠️ 又是那个坑：engine.js 整体包在 IIFE 里，事件文件看不到私有函数。
   第 29 轮写 evAttr 时踩过一次，第 31 轮写 flagAge 时**又踩了一次** ——
   表现是 when 一求值就 ReferenceError，整个事件面板渲染不出来。
   凡是给事件作者用的东西，都必须在这里显式发布。 */
window.flagAge    = flagAge;

/* ===== saveio.js ===== */
/* ============================================================
   存档导出 / 导入（第 19 轮）
   ------------------------------------------------------------
   为什么需要：
     浏览器按「源」隔离 localStorage。本地 file:// 与公网网址
     是两个不同的源，进度互不可见。要搬过去只能靠导出字符串。
   包含：
     ① 元层存档（碎片、升级、档案、世界刻度）
     ② 局内存档（当前这一局的进度，如果有）
   ============================================================ */

(function(){
'use strict';

/* 收集本游戏用到的所有 localStorage 键 */
function saveKeys(){
  return [G.CONFIG.saveKey, 'jiyi_xiufu_ju_run_v1'];
}

/* 导出成一个可复制的字符串 */
function exportSave(){
  const pack = { v: 1, at: Date.now(), data: {} };
  saveKeys().forEach(function(k){
    try{
      const v = localStorage.getItem(k);
      if (v) pack.data[k] = v;
    }catch(e){}
  });
  const json = JSON.stringify(pack);
  /* 用 encodeURIComponent + unescape 处理中文，避免 btoa 报错 */
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64;
}

/* 从字符串导入 */
function importSave(str){
  if (!str || typeof str !== 'string') return { ok:false, msg:'内容是空的' };
  const s = str.trim().replace(/\s+/g, '');
  let pack;
  try{
    const json = decodeURIComponent(escape(atob(s)));
    pack = JSON.parse(json);
  }catch(e){
    return { ok:false, msg:'这段内容看不懂，可能复制时少了一段' };
  }
  if (!pack || !pack.data) return { ok:false, msg:'内容格式不对' };

  let n = 0;
  Object.keys(pack.data).forEach(function(k){
    try{ localStorage.setItem(k, pack.data[k]); n++; }catch(e){}
  });
  if (!n) return { ok:false, msg:'里面没有可用的存档' };

  /* 重新读入内存 */
  try{
    if (typeof G.Engine.reload === 'function') G.Engine.reload();
  }catch(e){}

  return { ok:true, count:n,
           meta: !!pack.data[G.CONFIG.saveKey],
           run:  !!pack.data['jiyi_xiufu_ju_run_v1'] };
}

/* 给界面看的摘要 */
function saveSummary(){
  const out = { meta:null, run:null };
  try{
    const m = localStorage.getItem(G.CONFIG.saveKey);
    if (m){
      const d = JSON.parse(m);
      out.meta = { frag:d.frag||0, runs:d.runs||0, wins:d.wins||0,
                   ups:Object.keys(d.up||{}).length,
                   lore:(d.lore||[]).length,
                   endings:(d.endings||[]).length };
    }
    const r = localStorage.getItem('jiyi_xiufu_ju_run_v1');
    if (r){
      const d = JSON.parse(r);
      out.run = { realm:(G.REALMS[d.realmIdx]||{}).name||'?',
                  actions:d.actions||0, life:d.life, maxLife:d.maxLife };
    }
  }catch(e){}
  return out;
}

G.Engine.exportSave = exportSave;
G.Engine.importSave = importSave;
G.Engine.saveSummary = saveSummary;

})();

'use strict';

const $  = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};

/* ---------------- 屏幕切换 ---------------- */
function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  const target = $(id);
  target.classList.add('active');
  target.scrollTop = 0;
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(text, kind){
  const wrap = $('toast');
  const t = el('div', 'toast ' + (kind||''), text);
  wrap.appendChild(t);
  while (wrap.children.length > 4) wrap.removeChild(wrap.firstChild);
  setTimeout(()=>{ t.classList.add('fade'); setTimeout(()=>t.remove(), 420); }, 2200);
}

/* ---------------- 弹层 ---------------- */
function sheet(title, bodyNode, footNodes){
  $('sheetTitle').textContent = title;
  const body = $('sheetBody');
  body.innerHTML = '';
  if (typeof bodyNode === 'string') body.innerHTML = bodyNode;
  else if (bodyNode) body.appendChild(bodyNode);
  const foot = $('sheetFoot');
  foot.innerHTML = '';
  (footNodes||[]).forEach(n=>foot.appendChild(n));
  $('overlay').classList.remove('hidden');
  body.scrollTop = 0;
}
function closeSheet(){ $('overlay').classList.add('hidden'); }
function sheetOpen(){ return !$('overlay').classList.contains('hidden'); }

function btn(label, cls, fn, disabled){
  const b = el('button', cls||'btn-main', label);
  if (disabled) b.disabled = true;
  else b.addEventListener('click', fn);
  return b;
}

/* 「带符号的百分比」不能把零印成 −0% 或 +0%。
   ------------------------------------------------------------
   第 32 轮修：审计把 11 个面板 × 4 种境界全渲染了一遍，
   抓到属性面板与牌组面板会印出「受到伤害 −0%」，
   牌组面板还会印出「招式加成 +0%　修为效率 +0%」。
   数字都是对的（那些量确实是 0），**符号是错的** ——
   玩家看到「−0%」「+0%」不会当成零，会觉得这游戏算错了。

   两个方向各一个函数（down = 越小越好的减伤，up = 越大越好的加成），
   零一概印成朴素的「0%」，正数才补符号。 */
function signedDown(pct){
  const v = Math.round(pct);
  return v > 0 ? ('−' + v + '%') : '0%';
}
function signedUp(pct){
  const v = Math.round(pct);
  if (v === 0) return '0%';
  return (v > 0 ? '+' : '−') + Math.abs(v) + '%';
}

/* ---- 永久升级（按类别分组） ---- */
function renderUpgrades(){
  const pane = $('pane-upgrade');
  pane.innerHTML = '';
  const m = G.Engine.meta;

  // 汇总：总等级 / 总项数
  let totalLv = 0, totalMax = 0;
  /* ⚠️ 第 33 轮：元层面板一律读 **实时** 等级（upLevelLive），
     因为 upLevel 在本局进行中返回的是「本局快照」——
     用它渲染面板的话，玩家刚买的那一级在面板上不会出现，刚降的也降不下去。 */
  G.UPGRADES.forEach(u=>{ totalLv += G.Engine.upLevelLive(u.id); totalMax += u.max; });

  const head = el('div','up-head');
  head.innerHTML =
    `<div class="up-frag"><span class="frag-icon">◈</span> <b>${m.frag}</b> 碎片</div>
     <div class="up-total">已修复 ${totalLv} / ${totalMax} 级</div>`;
  pane.appendChild(head);

  // 按类别分组
  const cats = [];
  G.UPGRADES.forEach(u=>{ if (cats.indexOf(u.cat||'其他')<0) cats.push(u.cat||'其他'); });

  cats.forEach(cat=>{
    const sec = el('div','up-cat');
    const items = G.UPGRADES.filter(u=>(u.cat||'其他')===cat);
    const lvSum = items.reduce((n,u)=>n+G.Engine.upLevelLive(u.id),0);
    const maxSum = items.reduce((n,u)=>n+u.max,0);
    sec.appendChild(el('div','arc-h', `${cat}　<span class="cat-lv">${lvSum}/${maxSum}</span>`));

    items.forEach(u=>{
      const lv = G.Engine.upLevelLive(u.id);
      const cost = G.Engine.upCost(u.id);
      const maxed = cost===null;
      const can = !maxed && m.frag >= cost;

      const item = el('div','up-item' + (maxed?' maxed':''));
      const b = el('button','up-buy', maxed ? '已满' : `修复<small>◈ ${cost}</small>`);
      if (!can) b.disabled = true;
      else b.addEventListener('click', ()=>{
        if (G.Engine.buyUpgrade(u.id)){ toast(`${u.name} → ${G.Engine.upLevelLive(u.id)} 级`,'good'); renderMeta(); }
      });

      /* ---- 降级「−」（第 33 轮 · 玩家要求）----
         逐级降，退还这一级当时花的碎片（cost(lv-1)），所以不会赚也不会亏。
         ⚠️ 确认层里必须写清两件事：
           ① 退多少、效果会变成什么样（用 u.fmt 前后对比）
           ② **只影响下一局** —— 玩家最怕的是「我一降，正在玩的这局也变弱了」 */
      const dn = el('button','up-down','−');
      if (lv <= 0) dn.disabled = true;
      else dn.addEventListener('click', ()=>{
        const refund = u.cost(lv-1);
        const willFrag = m.frag + refund;
        const body = el('div');
        body.innerHTML =
          `<div class="ev-text">把【${u.name}】从 <b>${lv}</b> 级降回 <b>${lv-1}</b> 级。\n\n` +
          `会退还 <b style="color:#c9a227">◈ ${refund}</b> 碎片` +
          `（这一级当时就是这个价）。\n` +
          `退还后你一共有 <b>◈ ${willFrag}</b>。\n\n` +
          `当前效果：<b>${u.fmt(lv)}</b>\n` +
          `降级之后：<b>${u.fmt(lv-1)}</b></div>` +
          `<div class="ev-flavor">这是永久升级：**已经打完的局不受影响**，\n` +
          `改动从下一局开始生效。\n\n` +
          `退回来的碎片可以重新花在别处；想变回来，再点一次「修复」就行。</div>`;
        const foot = [
          btn('确 认 降 级','btn-main',()=>{
            const r = G.Engine.downUpgrade(u.id);
            closeSheet();
            if (!r){ toast('降级失败','bad'); renderMeta(); return; }
            toast(`${r.name} → ${r.to} 级　退回 ◈ ${r.refund}`,'good');
            renderMeta();
          }),
          btn('再 想 想','btn-main',()=>closeSheet())
        ];
        sheet('降 一 级 · ' + u.name, body, foot);
      });

      // 等级进度条
      const pct = Math.round(lv/u.max*100);
      item.innerHTML =
        `<div class="up-info">
           <div class="up-name">${u.name}<span class="up-lv">${lv}/${u.max}</span></div>
           <div class="up-bar"><div class="up-fill" style="width:${pct}%"></div></div>
           <div class="up-desc">${u.desc}${lv>0?'　<b class="up-cur">当前 '+u.fmt(lv)+'</b>':''}</div>
         </div>`;
      item.appendChild(dn);
      item.appendChild(b);
      sec.appendChild(item);
    });
    pane.appendChild(sec);
  });
}

  const left = all.length - beaten.length;
  if (left > 0){
    sec5.appendChild(el('div','arc-i unk',
      `榜上还有 ${left} 个人，你没有赢过。\n（他们只在机缘与宗门事件里偶尔露面。）`));
  }
  sec5.appendChild(el('div','rune','— 打赢一个，才会记下一个名字 —'));
  pane.appendChild(sec5);
}

       ${e.eff?`<div class="draw-eff">${e.eff}</div>`:''}`;
    if (canReroll){
      const b = el('button','reroll-btn', `重 抽 体 质（剩 ${currentLots.rerollsLeft} 次）`);
      b.addEventListener('click', (ev)=>{ ev.stopPropagation(); rerollBody(); });
      c.appendChild(b);
    }
    list.appendChild(c);
  });
  $('btnStartRun').disabled = false;
}

let prevRes = {};

const ACT_FLAVOR = {
  cultivate:['你盘膝坐下。','风停了。','你数着自己的呼吸。','窗外的月亮挪了一寸。','你听见自己的血在走。'],
  explore:['你出了山门。','山道上没有人。','你走进了一片没来过的林子。','你翻过一道矮墙。','有鸟叫了一声，然后不叫了。'],
  sectwork:['你去了一趟执事堂。','有人在院子里吵。','你对了一天的账。','你巡了一趟山。','你替人写了三封信。'],
  rest:['你躺下了。','你睡了一觉，没有做梦。','你闭着眼，什么都不想。'],
  nourish:['你用灵气缓缓走过四肢。','你试着把那一口气留在身体里。','很慢。但确实在变好。']
};

function renderRun(){
  const st = G.Engine.state();
  if (!st) return;
  const raw = st.raw;

  // HUD
  $('hudRealm').textContent = st.realmName;
  $('hudRole').textContent = raw.roleName + ' · ' + raw.constName +
    (st.chapter === 'sanxiu' ? ' · 散修' : '');

  const pct = Math.max(0, Math.min(100, st.life / st.maxLife * 100));
  const fill = $('lifeFill');
  fill.style.width = pct + '%';
  fill.className = 'life-fill' + (pct<15?' danger':(pct<35?' warn':''));
  $('lifeText').textContent = `${st.life} / ${st.maxLife}`;
  $('lifeCost').textContent = '−' + st.cost;

  setRes('resStone', st.stone);
  setRes('resCult', st.cult);
  setRes('resKarma', st.karma);
  setRes('resFavor', st.favor);
  setRes('resSect', st.sectQi);

  const need = st.breakNeed || 1;
  $('cultFill').style.width = Math.min(100, st.cult/need*100) + '%';
  $('cultNeed').textContent = st.isMaxRealm ? '此界之巅' : Math.max(0, need - st.cult);
  $('deckCount').textContent = raw.deck.length;
  $('bagCount').textContent = G.Engine.pillCount();
  $('clueCount').textContent = st.clue ? st.clue.got : raw.clues.length;

  // 战力：改用战斗派生数值，让玩家看得懂自己「能不能打」
  const powEl = $('powText');
  const cs = st.combat;
  powEl.textContent = `气血 ${cs.maxHp}　攻 ${cs.basicAtk} · ${fightHint(cs)}`;
  powEl.className = 'pow' + (cs.maxHp >= 400 ? ' strong' : '');

  /* ---- 丹药加成条（第 25 轮）----
     永久丹是本局永久的成长，限时丹只剩几场就要散——
     这两件事玩家必须随时看得见，否则「我明明吃过丹」会变成疑问。 */
  const boost = $('pillBoost');
  if (boost){
    const perm = G.Engine.pillPerm || {};
    const temp = G.Engine.pillTemp || {};
    const bits = [];
    if (perm.hpPct)   bits.push(`<span class="pb-perm">气血 +${Math.round(perm.hpPct*100)}%</span>`);
    if (perm.atkPct)  bits.push(`<span class="pb-perm">伤害 +${Math.round(perm.atkPct*100)}%</span>`);
    if (perm.qiPct)   bits.push(`<span class="pb-perm">真气 +${Math.round(perm.qiPct*100)}%</span>`);
    if (perm.wardPct) bits.push(`<span class="pb-perm">护体 +${Math.round(perm.wardPct*100)}%</span>`);
    if (temp.fights > 0){
      const tb = [];
      if (temp.atkPct) tb.push(`伤害 +${Math.round(temp.atkPct*100)}%`);
      if (temp.dmgCut) tb.push(`受伤 −${Math.round(temp.dmgCut*100)}%`);
      if (temp.evade)  tb.push(`闪避 +${Math.round(temp.evade*100)}%`);
      bits.push(`<span class="pb-temp">限时 ${temp.fights} 场：${tb.join('　')}</span>`);
    }
    boost.innerHTML = bits.length ? '丹力 ' + bits.join('　') : '';
    boost.style.display = bits.length ? '' : 'none';
  }

  /* ---- 内景（第 26 轮）----
     它是「修为的第二种用法」，所以必须和修为进度条挨着放，
     否则玩家不会意识到「这 800 修为可以拿去养丹，也可以留着突破」。 */
  const djEl = $('daoJiText');
  if (djEl){
    const dj = st.daoJi;
    if (dj){
      djEl.innerHTML = dj.maxed
        ? `<b>${dj.name}</b> ${dj.lv}/${dj.max} · 圆满　<span class="dj-gain">全属性 +${dj.have}</span>`
        : `<b>${dj.name}</b> ${dj.lv}/${dj.max} · 全属性 +${dj.have}` +
          `<span class="dj-cost">　下一层 ${dj.cost} 修为（+${dj.per}）</span>`;
      djEl.className = 'daoji-text' + (dj.maxed ? ' maxed' : (dj.affordable ? ' ready' : ''));
    } else {
      djEl.innerHTML = '';
    }
  }

  /* ---- 主线进度（第 29 轮）----
     玩家反馈「主线过于模糊」。实测确认：它以前只活在「宗门」面板里，
     不点开那个面板，主界面上完全看不出有这条线。
     这一行只做一件事：**让它看得见**。
     ⚠️ 刻意不做成弹窗、不做成红点、不催——用户明确说了
     「不能过于强迫玩家一定要走，因为可能会让玩家产生厌烦的心理」。
     点了才展开，不点就当它不存在，走不走都不影响任何数值收益。 */
  const shEl = $('storyHud');
  if (shEl){
    const pr = G.Engine.storyProgress ? G.Engine.storyProgress() : null;
    /* 散修篇没有宗门主线，整行隐藏 */
    if (!pr || st.chapter === 'sanxiu'){
      shEl.style.display = 'none';
      shEl.innerHTML = '';
    } else if (pr.done >= pr.total){
      shEl.style.display = '';
      shEl.className = 'story-hud done';
      shEl.innerHTML = `<span class="sh-k">三月初七</span>` +
        `<span class="sh-v">这条路走完了</span>`;
    } else {
      const ready = pr.need <= 0;
      shEl.style.display = '';
      shEl.className = 'story-hud' + (ready ? ' ready' : '');
      shEl.innerHTML =
        `<span class="sh-k">三月初七</span>` +
        `<span class="sh-v">第 ${pr.done+1}/${pr.total} 页` +
        (pr.next ? `　<b>${pr.next.name}</b>` : '') + `</span>` +
        `<span class="sh-n">` +
        (ready ? '可以往下查了' : `还差 ${pr.need} 点贡献`) +
        `</span>`;
    }
  }

  // 行动列表
  const main = $('runMain');
  main.innerHTML = '';

  // 散修篇：换一套更松弛的行动表
  if (st.chapter === 'sanxiu'){ renderSanxiu(); return; }

  const hint = el('div','act-hint', st.canBreak ? '修为已足。该破境了。' : '你还能做什么？');
  main.appendChild(hint);

  G.Engine.availableActions().forEach((a,i)=>{
    const b = el('button','act' + (a.primary?' primary':''));
    b.style.animationDelay = (i*45)+'ms';
    if (a.disabled) b.disabled = true;
    b.innerHTML =
      `<div class="act-top">
         <span class="act-name">${a.name}</span>
         <span class="act-cost">${a.cost>0?'寿元 −'+a.cost:'不耗寿元'}</span>
       </div>
       <div class="act-desc">${a.desc}</div>
       ${a.meta?`<div class="act-meta">${a.meta}</div>`:''}`;
    if (!a.disabled){
      b.addEventListener('click', ()=>onAction(a));
    }
    main.appendChild(b);
  });
}

function setRes(id, val){
  const e = $(id);
  const old = prevRes[id];
  e.textContent = val;
  const parent = e.parentElement;
  parent.classList.remove('up','down');
  if (old!==undefined && old!==val){
    parent.classList.add(val>old?'up':'down');
    setTimeout(()=>parent.classList.remove('up','down'), 700);
  }
  prevRes[id] = val;
}

/* ---- 战力求值（用于展示「你有多能打」）----
   第 21 轮：删掉了旧的 powerHint()。它算的是 agg().power 的档位，
   而那个数值在战斗里不直接使用（见 combatStats 的说明），
   于是它从来没被调用过 —— 一段死代码，留着只会误导后来的人。 */
function fightHint(cs){
  const hp = cs.maxHp, atk = cs.basicAtk;
  if (hp < 120) return '身子单薄';
  if (atk < 15) return '还不太会打';
  if (hp < 300) return '能应付一般的';
  if (hp < 600) return '不好惹';
  return '少有对手';
}

const RARITY_COLOR = { '凡':'#8a8078', '良':'#5fae8f', '玄':'#5b7fa8', '道':'#c9a227' };

/* 品质 / 类型角标（第 25 轮抽成函数）
   ------------------------------------------------------------
   玩家反馈：战斗里的招式按钮只有光秃秃一个名字，看不出这张牌
   是凡品还是道品，也看不出它是功法、术法还是法宝。
   抽卡界面（showCardPick）一直有这两个角标，战斗界面却没有。
   现在两边共用同一个函数，以后不会再走散。 */
function rarityTag(nameOrCard){
  const c = (typeof nameOrCard === 'string') ? G.CARDS[nameOrCard] : nameOrCard;
  if (!c) return '';
  const col = RARITY_COLOR[c.rarity] || '#8a8078';
  const kind = c.type || '';
  return `<span class="card-tag" style="color:${col};border-color:${col}">${c.rarity || '凡'}</span>` +
         (kind ? `<span class="card-tag">${kind}</span>` : '');
}

/* ---- 三选一：机缘 ---- */
let cardChooserOpen = false;

function showCardPick(cards, onDone){
  if (!cards || !cards.length){ if (onDone) onDone(null); return; }
  cardChooserOpen = true;

  const body = el('div');
  body.appendChild(el('div','arc-i','你在这一趟里摸到了几样东西。只能带走一样。'));

  const csPick = G.Engine.combatStats();   // 第 20 轮：卡面要显示「实际会变成什么」
  cards.forEach(name=>{
    const c = G.CARDS[name];
    if (!c) return;
    const b = el('button','ev-choice');
    const t = G.TECHNIQUES[name];
    /* 第 20 轮：这里以前显示卡自己的 power/heal/ward 原始值，
       而战斗实际用的是「属性 × 招式倍率 × 常驻战力乘数」。
       现在按引擎真正会算的方式显示，玩家选卡时看到的就是拿到的。 */
    const stat = t
      ? (t.kind==='dmg' ? `招式伤害约 ${Math.round(csPick.techPower * csPick.techMul * t.mul)}`
        : t.kind==='heal' ? `回复约 ${Math.round(csPick.techPower * t.heal)} 气血`
        : t.kind==='ward' ? `护体 +${Math.round(csPick.ward * t.ward)}`
        : t.kind==='buff' ? `闪避大幅提升`
        : t.kind==='karma' ? `业障 ${t.karma}`
        : `招式` + (t.mul ? `　伤害约 ${Math.round(csPick.techPower * csPick.techMul * t.mul)}` : ''))
      : c.type === '丹药' && c.use
        ? [c.use.life?`气血 +${c.use.life}`:'', c.use.cult?`修为 +${c.use.cult}`:'',
           c.use.lifeMax?`寿元上限 +${c.use.lifeMax}`:''].filter(Boolean).join('　')
      : (c.power || (c.eff && c.eff.power)) ? `常驻战力 +${c.power || c.eff.power}`
      : (c.ward || (c.eff && c.eff.ward)) ? `常驻护体 +${c.ward || c.eff.ward}`
      : c.eff && c.eff.attr ? Object.keys(c.eff.attr).map(k=>{
          const at = G.ATTRS.find(x=>x.id===k); return `${at?at.name:k} +${c.eff.attr[k]}`; }).join('　')
      : c.eff && c.eff.cultFlat ? `修行 +${c.eff.cultFlat}`
      : c.eff && c.eff.costReduce ? `行动减耗 ${c.eff.costReduce}`
      : c.eff && c.eff.lifeMax ? `寿元上限 +${c.eff.lifeMax}`
      : c.eff && c.eff.lifePerAction ? `每次行动回复寿元`
      : c.eff && c.eff.stonePerAction ? `每次行动得灵石`
      : c.eff && c.eff.cultMul ? `修为效率 +${Math.round(c.eff.cultMul*100)}%`
      : c.eff && c.eff.karmaPer ? `此物损阴德（每次行动积业障）`
      : '——';
    b.innerHTML =
      `<div class="ev-ctext">${name}
         ${rarityTag(c)}
       </div>
       <div class="ev-cmeta">${stat}　${c.desc||''}</div>`;
    b.addEventListener('click', ()=>{
      G.Engine.addCard(name);
      cardChooserOpen = false;
      closeSheet();
      toast(`你带走了【${name}】`,'good');
      if (onDone) onDone(name);
    });
    body.appendChild(b);
  });

  const foot = [];
  foot.push(btn('都不要','btn-main',()=>{
    cardChooserOpen = false;
    closeSheet();
    if (onDone) onDone(null);
  }));

  sheet('机 缘', body, foot);
}

/* 每次行动后自动存档——玩家要求「中途不能丢进度」 */
let _saveWarned = false;
function autoSave(){
  const st = G.Engine.state();
  if (!st || st.raw.ended){ G.Engine.clearRun(); return; }
  const okSave = G.Engine.saveRun();
  /* 第 21 轮：存档失败必须让玩家知道。
     无痕模式 / 禁用存储 / 配额满 都会走到这里——
     以前是静默失败，玩家玩一小时才发现什么都没留下。 */
  if (!okSave && !_saveWarned){
    _saveWarned = true;
    const err = G.Engine.saveError();
    toast('⚠ 进度存不下来：' + ((err && err.msg) || '浏览器不允许写入存储'), 'bad');
    setTimeout(()=>{
      sheet('⚠ 进度没有被保存',
        `<div class="ev-text">这一局的进度**没能写进浏览器存储**。\n\n` +
        `常见原因：\n` +
        `· 你在**无痕 / 隐私模式**下打开（这种模式不允许长期保存）\n` +
        `· 浏览器设置里**禁用了网站数据 / Cookie**\n` +
        `· 存储空间已满\n\n` +
        `**关掉页面后，这一段进度就会丢。**\n\n` +
        `你可以在「菜单 → 存档搬移」里导出一段字符串手动保存，\n` +
        `下次粘回来就能接着玩。</div>`,
        [ btn('知道了','btn-main',()=>closeSheet()),
          btn('去导出存档','btn-go btn-main',()=>{ closeSheet(); showSaveIO(); }) ]);
    }, 600);
  }
}

/* ---- 执行行动 ---- */
function onAction(a){
  if (a.special==='break'){ doBreakSequence(); return; }
  if (a.special==='capstone'){ capstoneFlow(); return; }
  if (a.special==='leavesect'){ leaveSectFlow(); return; }
  if (a.special==='daoji'){ doNurtureFlow(); return; }
  /* 秘境（第 27 轮）：推演入口不花寿元，进入要花一次行动 */
  if (a.special==='mijingDivine'){ doDivineMijing(); return; }
  if (a.special==='mijingEnter'){ showMijingEnter(a.mijingId); return; }
  if (a.special==='mijingInfo'){ showMijingBook(); return; }
  /* 舆图（第 34 轮）：打开地图本身不花寿元，走路才花 */
  if (a.special==='map'){ showMap(); return; }

  const res = G.Engine.doAction(a.id);
  if (!res.ok) return;

  // 行动旁白
  const fl = ACT_FLAVOR[a.id] || [''];
  const line = fl[Math.floor(Math.random()*fl.length)];
  const parts = [line].concat(res.msgs||[]);
  toast(parts.join('　'), a.id==='rest'||a.id==='nourish' ? 'good' : '');

  if (res.dead){ afterDeath(res.dead); return; }

  renderRun();
  autoSave();                       // 每次行动后存档

  /* ⚠️ 第 31 轮：以前这里直接往下走，res.debts 被整个丢掉 ——
     于是「长期因果」这个系统在引擎里跑了一整轮却一个字都没露过面。
     现在它是一屏专属的演出：先说来龙去脉，再给结算数字。 */
  if (res.debts && res.debts.length){
    setTimeout(()=>showDebtPayoff(res.debts, afterActionFlow), 240);
    return;
  }

  // 三选一机缘
  if (res.cards && res.cards.length){
    setTimeout(()=>showCardPick(res.cards, afterActionFlow), 240);
    return;
  }
  afterActionFlow();
}

/* ============================================================
   舆图 · 远行（第 34 轮）
   ------------------------------------------------------------
   玩家要求：「让玩家通过地图来看自己处于地图中的哪里，
   并且可以选择消耗寿元来前往地图上的其他地方」。

   做法：内嵌 SVG 手绘的古地图（无外部图片、无建模、单文件只涨几 KB）。
   七个寰画成不规则的墨线多边形，九个宗门各一个点。
   点一个地方 → 该地的卡片 → 确认 → 赶路。

   ⚠️ 三条规矩：
     · 赶路消耗**必须调 G.Engine.travelCost()**，界面不许自己算一遍
       （第 20 轮的教训：界面自己算 = 界面会说谎）
     · 走不了的点要在卡面上**写清为什么**，而不是点了没反应
       （第 33 轮雷池那条死路就是这么来的）
     · 没发现的地方（血河宗）**不画**，这是神识的专属回报
   ============================================================ */
function mapDotTone(p){
  if (p.here) return 'here';
  if (!p.open) return 'shut';
  if (!p.reach) return 'far';
  return p.visited ? 'been' : 'new';
}
function showMap(){
  const places = G.Engine.visiblePlaces();
  const cur = G.Engine.currentPlace();
  const curRegion = G.regionById(cur.region);
  const S = G.MAP_SVG;

  const wrap = el('div','map-wrap');
  /* SVG 用字符串拼 —— 假 DOM 里也能测（verify-panelscan 会扫这段 HTML） */
  const dots = places.map(p => {
    const r = G.regionById(p.region);
    if (!r) return '';
    const x = r.pos[0], y = r.pos[1];
    const tone = mapDotTone(p);
    return `<g class="map-dot ${tone}" data-place="${p.id}">
      <circle cx="${x}" cy="${y}" r="${p.kind==='home'?2.6:2.0}" class="map-halo"/>
      <circle cx="${x}" cy="${y}" r="${p.kind==='home'?1.5:1.1}" class="map-core"/>
      <text x="${x}" y="${y + 5.4}" class="map-label">${p.name}</text>
    </g>`;
  }).join('');

  const regions = S.regions.map(rg => {
    const r = G.regionById(rg.id);
    const on = rg.id === cur.region;
    return `<path d="${rg.d}" class="map-region${on?' on':''}"/>
      <text x="${r.pos[0]}" y="${r.pos[1] - 7}" class="map-region-label">${r.name}</text>`;
  }).join('');

  wrap.innerHTML =
    `<div class="map-head">
       <div class="map-here">你在 <b>${curRegion?curRegion.name:''}·${cur.name}</b></div>
       <div class="map-sub">${cur.you.replace(/\n/g,'<br>')}</div>
     </div>
     <div class="map-canvas">
       <svg viewBox="${S.viewBox}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="舆图">
         ${regions}
         ${dots}
       </svg>
     </div>
     <div class="map-legend">
       <span><i class="lg here"></i>你在这儿</span>
       <span><i class="lg been"></i>去过</span>
       <span><i class="lg new"></i>还没去过</span>
       <span><i class="lg far"></i>境界不够</span>
       <span><i class="lg shut"></i>路还没通</span>
     </div>
     <div class="map-list"></div>`;

  /* 底部再来一份列表 —— SVG 上的字小，手指也难点准；
     列表是给手指用的，地图是给眼睛用的。两边点哪个都一样。 */
  const list = wrap.querySelector ? wrap.querySelector('.map-list') : null;
  const holder = list || el('div');
  places.forEach(p => {
    const region = G.regionById(p.region);
    const b = el('button','map-row' + (p.here?' here':'') + (p.can?'':' off'));
    if (!p.here && !p.can) b.disabled = true;
    const bits = [];
    bits.push(region ? region.name : '');
    if (p.here) bits.push('你现在在这儿');
    else if (!p.open) bits.push(p.openNote || '路还没通');
    else if (!p.reach) bits.push(`要到第 ${(G.placeById(p.id).gate||{}).major} 个大境界`);
    else bits.push(`${p.dist} 天　寿元 −${p.cost}`);
    if (p.env) bits.push((G.PLACE_ENV[p.env]||{}).name || '');
    b.innerHTML =
      `<div class="map-row-top"><span class="map-row-name">${p.name}</span>
         <span class="map-row-cost">${p.here?'（在此地）':(p.can?`寿元 −${p.cost}`:(p.reach?'走不了':'未通'))}</span>
       </div>
       <div class="map-row-meta">${bits.join('　')}</div>`;
    if (!b.disabled) b.addEventListener('click', ()=>showPlaceCard(p.id));
    holder.appendChild(b);
  });
  if (!list) wrap.appendChild(holder);

  sheet('舆 图', wrap, [ btn('合 上','btn-main',()=>closeSheet()) ]);
}

/* 一个地方的卡片：去不去，先看清楚 */
function showPlaceCard(id){
  const p0 = G.placeById(id);
  if (!p0) return;
  const all = G.Engine.visiblePlaces();
  const p = all.find(x => x.id === id);
  if (!p) return;
  const region = G.regionById(p.region);
  const cost = p.here ? 0 : G.Engine.travelCost(id);
  const chk = p.here ? { ok:false, msg:'你已经在这儿了' } : G.Engine.canTravelTo(id);

  const body = el('div','place-card');
  const env = p.env ? G.PLACE_ENV[p.env] : null;
  const attrs = (p.attrs||[]).map(a => {
    const def = G.ATTRS.find(x => x.id === a);
    return def ? def.name : a;
  });
  const tj = p.tianjiao ? [].concat(p.tianjiao).map(tid => {
    const t = (G.TIANJIAO||[]).find(x => x.id === tid);
    return t ? `${t.name}（${t.epithet}）` : null;
  }).filter(Boolean) : [];

  let extra = '';
  if (env){
    /* 环境与减免都要**算出来再显示**，不能写死 —— 玩家的属性在变 */
    const ec = G.Engine.placeEnvCost(id);
    extra += `<div class="place-line"><span class="pk">环境</span>` +
             `<span class="pv">${env.name}　每步额外 寿元 −${ec.amount}` +
             (ec.discount > 0.005 ? `　（${G.ATTRS.find(a=>a.id===env.resist).name}已减免 ${Math.round(ec.discount*100)}%）` : '') +
             `</span></div>`;
    extra += `<div class="place-flavor">${env.text}</div>`;
  } else {
    extra += `<div class="place-line"><span class="pk">环境</span><span class="pv">无额外损耗</span></div>`;
  }
  if (p.kind !== 'home'){
    extra += `<div class="place-line"><span class="pk">探索</span><span class="pv">` +
             `灵石 ×${(G.placeById(id).explore.stone||1).toFixed(1)}　` +
             `修为 ×${(G.placeById(id).explore.cult||1).toFixed(1)}</span></div>`;
  }
  if (attrs.length){
    extra += `<div class="place-line"><span class="pk">这里认</span><span class="pv">${attrs.join('　')}</span></div>`;
  }
  if (tj.length){
    extra += `<div class="place-line"><span class="pk">此处有人</span><span class="pv">${tj.join('、')}</span></div>`;
  }

  body.innerHTML =
    `<div class="place-title">${region?region.name+'·':''}${p.name}</div>
     <div class="place-you">${p.you.replace(/\n/g,'<br>')}</div>
     ${extra}
     <div class="place-line"><span class="pk">赶路</span><span class="pv">` +
       (p.here ? '你已经在这儿了'
               : `路 ${p.dist} 天　寿元 −${cost}${p.visited?'　（去过）':'　（第一次去）'}`) +
     `</span></div>
     ${(!p.open && !p.here) ? `<div class="place-warn">${p.openNote||'这条路还没有被写出来。'}</div>` : ''}
     ${(!p.reach && !p.here) ? `<div class="place-warn">境界不够：要走到第 ${(G.placeById(id).gate||{}).major} 个大境界才上得去。这一步先记着。</div>` : ''}
     ${(!chk.ok && p.reach && p.open && !p.here) ? `<div class="place-warn">${chk.msg}</div>` : ''}`;

  const foot = [];
  if (chk.ok){
    foot.push(btn(`前 往（寿元 −${cost}）`,'btn-go btn-main',()=>doTravel(id)));
  }
  foot.push(btn('再 看 看','btn-main',()=>showMap()));
  sheet('去 哪 儿', body, foot);
}

/* 真的走过去 */
function doTravel(id){
  const r = G.Engine.travelTo(id);
  closeSheet();
  if (!r.ok){ toast(r.msg || '走不了','bad'); return; }
  const p = r.place;
  const region = G.regionById(p.region);
  toast(`走了 ${G.travelDist(r.from, id)} 天，到了${region?region.name+'·':''}${p.name}　寿元 −${r.cost}`, 'good');
  if (r.dead){ afterDeath(r.dead); return; }
  /* ⚠️ 这里**不要**再写一行记事 —— engine 的 travelTo() 已经写了
     （`log(...)` + `note('place', ...)`）。第一版在这里又写了一次，
     而 ui.js 里根本没有 log() 这个函数（它是 engine IIFE 私有的），
     于是「真的走一趟」直接 ReferenceError。
     是 dev 的舆图探测脚本抓到的 —— 界面层的调用只有真跑一遍才测得出来。 */
  renderRun();
  autoSave();
  /* 到了之后走一遍正常的「行动之后」流程 ——
     路上碰到什么事就在这里发生（地域分层里的 *travel 事件）。 */
  setTimeout(afterActionFlow, 300);
}

/* ============================================================

/* 分层探索：这是秘境的主体 */
function showMijingFloor(){
  const cur = G.Engine.miJingFloor();
  if (!cur){
    // 没有下一层了 → 走完
    showMijingExit(G.Engine.leaveMijing());
    return;
  }
  const body = el('div','story-body');

  const cover = el('div','story-cover');
  cover.innerHTML =
    `<div class="story-kicker">${cur.def.name}　第 ${cur.floor+1} 层 / 共 ${cur.total} 层</div>` +
    `<div class="story-title">${cur.def.epithet}</div>`;
  body.appendChild(cover);

  /* 深度条：让玩家一眼看到自己走了多深 */
  const prog = el('div','mj-prog');
  for (let i=0;i<cur.total;i++){
    const seg = el('div','mj-seg' + (i<cur.floor?' done':'') + (i===cur.floor?' now':''));
    prog.appendChild(seg);
  }
  body.appendChild(prog);

  const txt = el('div','story-text');
  renderStoryText(txt, cur.text, 80);
  body.appendChild(txt);

  const wrap = el('div','story-choices');
  wrap.style.animationDelay = (storyParagraphs(cur.text).length*170 + 220) + 'ms';
  body.appendChild(wrap);

  cur.choices.forEach((c,i)=>{
    const b = el('button','ev-choice story-choice');
    b.innerHTML = `<div class="ev-ctext">${i+1}. ${c.label}</div>` +
      (c.hint?`<div class="ev-cmeta">${c.hint}</div>`:'');
    b.addEventListener('click', ()=>resolveMijingPick(i));
    wrap.appendChild(b);
  });

  /* 随时可以退出 —— 这是玩家选的「分层探索 + 中途退出」的另一半。
     放在页脚而不是正文里，避免和正文的选项混在一起。 */
  const foot = [ btn('带 着 东 西 出 去','btn-main',()=>{
    const r = G.Engine.leaveMijing();
    closeSheet();
    showMijingExit(r);
  }) ];
  sheet('◆ ' + cur.def.name, body, foot);
}

/* 一次选择的结算：先演结果，再问「继续 / 出去」 */
function resolveMijingPick(idx){
  const r = G.Engine.miJingPick(idx);
  if (!r || !r.ok){ toast((r&&r.msg)||'走不通','bad'); return; }
  closeSheet();
  autoSave();
  renderRun();

  const body = el('div','story-body');
  const cover = el('div','story-cover done');
  cover.innerHTML =
    `<div class="story-kicker">${r.def.name}　第 ${r.floor} 层走完</div>` +
    `<div class="story-title">${r.finished ? '到了最深处' : '再往下'}</div>`;
  body.appendChild(cover);

  const txt = el('div','story-text result');
  renderStoryText(txt, r.text || '（什么也没有发生。）', 80);
  body.appendChild(txt);

  const wrap = el('div','story-choices');
  wrap.style.marginTop = '12px';
  body.appendChild(wrap);

  const pend = r.pending || {};

  function proceed(){
    /* 战斗 / 天骄 / 请帖：和事件走同一条通道，
       保证这类副作用只有一套实现（第 22 / 25 轮的教训）。 */
    if (pend.challenge){ startChallengeFlow(pend.challenge); return; }
    if (pend.tianjiao){ showTianjiao(pend.tianjiao); return; }
    if (pend.tourney){ showTourneyInvite(pend.tourney); return; }
    if (r.finished){
      const out = G.Engine.leaveMijing();
      showMijingExit(out);
      return;
    }

/* 每次行动之后要检查的一串东西（Boss / 天谴 / 宗门 / 事件） */
function afterActionFlow(){
  const st = G.Engine.state();
  if (!st || st.raw.ended) return;

  // Boss 遭遇（优先级最高）
  const boss = G.Engine.pickBoss();
  if (boss){ setTimeout(()=>showBoss(boss), 260); return; }

  /* 业障满 → 天谴（输了直接死）
     ⚠️ 第 29 轮修复：这一段以前是
          if (G.Engine.karmaOverflow() && Math.random()<0.5) startKillerTribulationFlow();
        没有冷却、也没有洗业 —— 业障到 20 之后每一步都有 50% 概率挨一次
        terror 级必死战，实测一局 43~69 次。玩家看到的就是「每走一步就一次天劫」。
        现在判定收在引擎的 karmaTribulationReady() 里（业障满 + 不在冷却），
        概率仍然保留一点点随机，但冷却把它压成「几十步一次」。 */
  if (G.Engine.karmaTribulationReady() && Math.random()<0.5){
    startKillerTribulationFlow();
    return;
  }

  // 宗门散了 → 转入散修篇（不是结局！）
  const sc = G.Engine.checkSectCollapse();
  if (sc){
    if (sc.enterSanxiu){ enterSanxiuFlow(); return; }
    showEnding(sc); return;
  }

  // 《三月初七》：宗门贡献攒够了，就翻到下一页
  const story = G.Engine.storyReady();
  if (story){ setTimeout(()=>showSectStory(), 320); return; }

  /* ---- 秘境：大众型的时钟（第 27 轮）----
     「到了时间秘境自动会开启，到时候会引发广大修士的注意」。
     所以它排在这里：天地异动的公告比随机事件重要，
     也比比武请帖重要（它是限时的，过时不候）。 */
  const mjOpen = G.Engine.tickMijingClock();
  if (mjOpen){ setTimeout(()=>showMijingNotice(mjOpen), 340); return; }

  /* ---- 比武大会（第 22 轮）----
     按境界分赛道，每隔一段行动开一次。
     优先级放在剧情之后、随机事件之前：
     因为它是「有请帖送到手上」的事，不该被随机事件挤掉。 */
  const bracket = G.Engine.tourneyReady();
  if (bracket){ setTimeout(()=>showTourneyInvite(bracket), 340); return; }

  // 随机事件
  const evChance = 0.30;
  if (Math.random() < evChance){
    const ev = G.Engine.pickEvent();
    if (ev) showEvent(ev);
  }
  renderRun();
}

/* ---- Boss 遭遇 ---- */
function showBoss(boss){
  G.Engine.markBossActive(boss.id);   // 锁住，避免处理过程中被重复触发
  const body = el('div');
  body.innerHTML = `<div class="ev-text">${boss.intro.replace(/\n/g,'<br>')}</div>`;

  const wrap = el('div');
  wrap.style.marginTop = '4px';
  body.appendChild(wrap);

  const st = G.Engine.state();
  boss.choices.forEach((c,i)=>{
    const b = el('button','ev-choice');
    b.innerHTML = `<div class="ev-ctext">${i+1}. ${c.label}</div>` +
      (c.hint?`<div class="ev-cmeta">${c.hint}</div>`:'');
    b.addEventListener('click', ()=>{
      const r = c.eff(st.raw, api);
      closeSheet();
      if (r) toast(r, '');
      renderRun();
      if (api._pendingChallenge){
        /* 先取走 pendingChallenge，再进战斗流程 ——
           startChallengeFlow() 自己会 autoSave，见 showEvent 里的说明 */
        const cfg = api._pendingChallenge; api._pendingChallenge = null;
        setTimeout(()=>startChallengeFlow(cfg), 320);
        return;
      }
      // 没有进入战斗（选了非战斗选项）→ 解除锁定
      G.Engine.clearBossActive();
      autoSave();                        // 第 22 轮：Boss 的非战斗选项也会改状态
      if (pendingDeath){ const d = pendingDeath; pendingDeath = null; afterDeath(d); }
      else afterActionFlow();
    });
    wrap.appendChild(b);
  });

  sheet('◆ ' + boss.title, body, []);
}

  if (out.end){ setTimeout(()=>showEnding(out.end), out.bossText?700:200); return true; }
  return false;
