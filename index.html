    });
  });
  return acc;
}

/* ---------------- 卡牌聚合效果 ---------------- */
function agg(){
  const o = { power:0, ward:0, cultFlat:0, cultMul:0, costReduce:0, costReducePct:0,
              lifeFlat:0, lifePerAction:0, pillGain:0, karmaPer:0, stonePerAction:0,
              findBonus:0, breakReduce:0, tribulationDmgMul:1, flags:[],
              evade:0, lotBonus:0, attrBonus:{}, techMul:0, critSet:0,
              hpMul:0, dmgTakenSet:0, pillSetMul:0, pillSetChance:0,
              setKarma:0, setAttr:0, wardPerRound:0, wardHold:false };
  if (!s) return o;
  const SB = setBonus();
  s.deck.forEach(name=>{
    const c = G.CARDS[name];
    if (!c) return;
    const cm = cardMul(name);          // 精炼 + 品阶
    /* ⚠️ 术法牌不算进「常驻战力」。
       术法牌的 power 是「这一招有多重」的展示值，实战威力由
       techPower × G.TECHNIQUES.mul 决定。两套数值体系不能相加，
       否则一张术法牌会被算两次，战力显示也会虚高。            */
    const isTech = !!G.TECHNIQUES[name];
    if (typeof c.power==='number' && !isTech) o.power += c.power * cm;
    if (typeof c.ward==='number' && !isTech) o.ward += c.ward;
    if (c.flags) o.flags = o.flags.concat(c.flags);
    const e = c.eff; if (!e) return;
    if (e.power) o.power += e.power * cm;
    if (e.ward) o.ward += e.ward * cm;
    // 法宝的六维属性加成（第 18 轮新增的 attr 字段）
    if (e.attr){
      Object.keys(e.attr).forEach(function(k){ o.attrBonus[k] = (o.attrBonus[k]||0) + e.attr[k]; });
    }
    if (e.cultFlat) o.cultFlat += e.cultFlat;
    if (e.cultMul) o.cultMul += e.cultMul;
    if (e.costReduce) o.costReduce += e.costReduce;
    if (e.costReducePct) o.costReducePct += e.costReducePct;
    if (e.lifePerAction) o.lifePerAction += e.lifePerAction;
    if (e.pillGain) o.pillGain += e.pillGain;
    if (e.karmaPer) o.karmaPer += e.karmaPer;
    if (e.stonePerAction) o.stonePerAction += e.stonePerAction;
    if (e.findBonus) o.findBonus += e.findBonus;
    if (e.breakReduce) o.breakReduce += e.breakReduce;
    if (e.hpMul) o.hpMul += e.hpMul;      // 第 20 轮：以前这个字段也是死的
    if (e.tribulationDmgMul) o.tribulationDmgMul *= e.tribulationDmgMul;
    if (e.evade) o.evade = Math.max(o.evade, e.evade);
    if (e.lotBonus) o.lotBonus += e.lotBonus;
    if (e.flag) o.flags.push(e.flag);
  });
  // 建筑加成
  const b = s.buildings;
  o.stonePerAction += b.lingtian * 1;
  o.findBonus += b.cangjing;
  o.cultFlat += b.cangjing;
  o.ward += b.dazhen * 10;
  o.tribulationDmgMul *= Math.max(0.4, 1 - b.dazhen*0.12);
  o.cultMul += b.zushi * 0.04;
  // 元层加成（⚠️ 第 33 轮：改走 upLevel()，读本局快照）
  o.cultMul += upLevel('cultGain') * 0.08;
  o.findBonus += Math.floor(upLevel('findGain') * 0.5);
  /* ---- 流派套装加成（第 20 轮：这些以前收集完就扔了，从未被读取）----
     现在每一个都有明确的去处：
       techMul      → combatStats().powerMul 之外的招式额外加成（见下）
       crit        → combatStats().critChance
       hpMul       → combatStats().maxHp
       dmgTaken    → combatStats().dmgTakenMul
       pillMul     → usePill() 的丹药效果
       pillChance  → doAction() 的自动产丹
       karmaPerAction → doAction() 的业障累积
       attr        → attrs()（这一个本来就通的）
       wardPerRound / wardHold → advanceRound() 的护体                      */
  o.cultMul += SB.cultMul;
  o.techMul = (o.techMul||0) + SB.techMul;
  o.critSet = SB.crit;
  o.dmgTakenSet = SB.dmgTaken;
  o.pillSetMul = SB.pillMul;
  o.pillSetChance = SB.pillChance;
  o.setKarma = SB.karmaPerAction;
  o.setAttr = SB.attr;
  o.wardPerRound = SB.wardPerRound;
  o.wardHold = SB.wardHold;
  return o;
}

/* ---------------- 行动消耗 ----------------
   ⚠️ 第 25 轮：元层「养身(costCut)」从「−0.5 寿元/行动」改成「−2%/级」。
   旧版是平减，而行动消耗本身随境界涨（cost = 寿元上限/52）：
   在炼气一层，−5 寿元 直接把消耗砍成 0（要夹到 1）；
   到了元婴期，−5 只是零头。百分比才在任何境界都成立。
   上限封在 −60%，不然寿元这条唯一的硬约束会被买掉。            */
function actionCost(){
  const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
  const base = G.REALMS[s.realmIdx].cost;
  let cost = base * consti.costMul;
  const a = agg();
  cost = (cost - a.costReduce) * (1 - a.costReducePct);
  cost *= 1 - Math.min(0.60, upLevel('costCut') * 0.02);
  return Math.max(1, Math.round(cost));
}

/* ---------------- 资源变更 ---------------- */
function log(text){ if (s) s.log.unshift({ t: s.actions, text: text }); if (s && s.log.length>200) s.log.pop(); }

/* 灵石进出的**唯一漏斗**。
   ⚠️ 第 25 轮：「积蓄」从「开局多带 12 灵石/级」改成「灵石收入 +6%/级」。
   为什么不是「开局灵石 ×(1+N%)」：签面的开局灵石中位数是 0（有的签甚至是 −10），
   乘一个百分比会原地不动 —— 那种「百分比」是假的。
   而**收入**是真的随境界涨的（探索 = 6 + 境界序数×3、宗门事务、战斗奖励都带境界项），
   所以百分比在这里才落得到实处。
   注意：只放大**进账**，不放大花钱 —— 建造与购物的扣款原样传负数进来。 */
function gainStone(n){
  if (n > 0) n = Math.round(n * (1 + stoneBonus()));
  s.stone = Math.max(0, s.stone + n);
}
function gainCult(n){ s.cult = Math.max(0, s.cult + Math.round(n)); }
function gainKarma(n){
  const a = agg();
  s.karma = clamp(s.karma + n + (n>0 ? a.karmaPer : 0), 0, 30);
}
function gainFavor(n){ s.favor = s.favor + n; }
function gainSectQi(n){ s.sectQi = clamp(s.sectQi + n, 0, s.sectQiMax); }
function gainLife(n){
  s.life = Math.min(s.maxLife, s.life + n);
}

/* 寿元上限永久提升（同时补满差额） */
function raiseMaxLife(n){
  s.maxLife += n;
  s.life += n;
}

/* ---------------- 核心：执行一次行动 ---------------- */
/* 返回 {ok, cost, msgs[]} */
function doAction(kind){
  if (!s || s.ended) return { ok:false };

  const cost = actionCost();
  const msgs = [];

  // 1. 扣寿元
  s.life -= cost;
  s.actions++;
  /* ⚠️ 第 34 轮：赶路那一步已经按距离收过钱了，这里要把标记清掉 ——
     否则「刚赶完路」会被后面的东西再读一次（地域分层里的 *travel 事件
     是给「这一步刚赶完路」用的，只能生效一次）。 */
  s.travelled = false;

  /* 1b. 环境代价（第 34 轮）：你待的这个地方本身就在耗你。
     冰原的严寒、荒漠的烈日、地底的无光、云上的罡风、药洲的药毒、
     太玄门的威压 —— 每一项都由一个属性来抗（见 G.PLACE_ENV）。
     这是「属性有专属舞台」最直接的落点：同一片冰原，
     体魄高的人走起来是散步，体魄低的人走起来是掉命。
     ⚠️ 只在「做事」的时候收，赶路那一步不收（否则跨一次冰原要付两份钱）。 */
  {
    const ec = placeEnvCost();
    if (ec.amount > 0){
      s.life -= ec.amount;
      const envName = (G.PLACE_ENV[ec.env] || {}).name || '这里';
      msgs.push(`${envName}　寿元 −${ec.amount}` +
                (ec.discount > 0.005 ? `（已减免 ${Math.round(ec.discount*100)}%）` : ''));
      if (s.life <= 0){
        const d = checkDeath('life');
        if (d && !d.saved) return { ok:false, cost:cost, msgs:msgs, dead:d, envCost:ec.amount };
      }
    }
  }

  // 2. 行动产出
  const a = agg();
  let extra = '';

  if (kind==='cultivate'){
    /* ============================================================
       修行的收益公式（第 23 轮按玩家给的定义重写）
       ------------------------------------------------------------
       玩家给出的定义：

         单次修炼修为 = (修炼速度 × 消耗寿元 + 加法增益) × 乘法增益

       · 修炼速度：每消耗 1 寿元得到的修为量，写在境界表里（G.REALMS[i].speed）
       · 加法增益：功法/法宝的 cultFlat（如「吐纳诀 +1」）
       · 乘法增益：所有乘算来源相乘 —— 功法 cultMul、体质、悟性、
                   抽签加成、宗门气运加持
       ============================================================ */
    const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
    const R = G.REALMS[s.realmIdx] || { speed:1, gain:1 };
    const speed = R.speed || 1;                 // 修炼速度（修为 / 寿元）

    /* 加法部分：基础（修炼速度 × 这一手实际烧掉的寿元）+ 功法法宝的固定加成 */
    const baseAdd = speed * cost + (a.cultFlat || 0);
    /* 乘法部分：把所有乘算来源统一收进来，方便界面逐项展示 */
    const mulParts = [
      ['功法',  1 + (a.cultMul || 0)],
      ['体质',  consti.cultMul || 1],
      ['出身',  s.lots.bonus.cultMul || 1],
      ['悟性',  1 + (attrs().wuxing||0) * 0.012],
      ['气运',  1 + sectBlessing().cult]
    ];
    const mul = mulParts.reduce((n,p)=>n*p[1], 1);
    const gain = Math.max(1, Math.round(baseAdd * mul));
    gainCult(gain);

    /* 提示文案：只说「哪几项在起作用」，不铺满整屏 */
    const active = mulParts.filter(p=>Math.abs(p[1]-1) > 0.005)
                           .map(p=>`${p[0]} ×${p[1].toFixed(2)}`);
    msgs.push(`修为 +${gain}　（修炼速度 ${speed.toFixed(2)}/寿元` +
      (a.cultFlat ? `　增益 +${a.cultFlat}` : '') +
      (active.length ? `　${active.join('　')}` : '') + '）');
  }
  else if (kind==='explore'){
    /* ⚠️ 第 27 轮：这一分支以前**根本不存在** —— explore() 是死代码。
       现在接回来：灵石 + 修为 + 可能受伤 + 可能捡到秘境图残片。
       得卡不在这里做，走第 8 步的统一入口（见 explore() 的说明）。 */
    const ex = explore();
    if (ex.stone) msgs.push(`灵石 +${ex.stone}`);
    if (ex.cult)  msgs.push(`修为 +${ex.cult}`);
    if (ex.hurt)  msgs.push(`受了点伤　寿元 −${ex.hurt}`);
    (ex.msgs || []).forEach(m=>msgs.push(m));
    if (s.life <= 0){
      const d = checkDeath('life');
      if (d && !d.saved) return { ok:false, cost:cost, msgs:msgs, dead:d };
    }
  }
  else if (kind==='sectwork'){
    const gain = 8 + Math.round(6 * (1 + a.cultMul*0.4));
    gainStone(gain);
    gainSectQi(2 + s.buildings.jiangjing);
    gainFavor(1);
    /* ⚠️ 第 27 轮：主页面的「宗门事务」现在**自动给贡献**。
       以前只有「进宗门面板 → 点宗门任务」才给贡献，于是：
         · 主线《三月初七》的进度全靠宗门行动次数，逼玩家反复点同一件事
         · 藏经阁折扣、职衔、剧情选项的门槛也都挂在贡献上
         · 结果就是「想在宗门里做点事」必须绕一层界面
       现在主页面这一下就给。宗门面板里的任务仍在，给得**更多**，
       但它变成了「我今天想专门赚贡献」的选项，而不是必经之路。 */
    const contrib = 3 + Math.floor(s.realmIdx / 9);   // 炼气 3 → 元婴 6
    gainContrib(contrib);
    msgs.push(`灵石 +${gain}　宗门气运 +${2+s.buildings.jiangjing}　人情 +1　贡献 +${contrib}`);
    // 宗门事务也沾一点修行（修行不必是唯一出路）
    const cg = Math.round(G.cultBase(s.realmIdx) * 0.5);
    gainCult(cg);
    msgs.push(`修为 +${cg}`);
  }
  else if (kind==='rest'){
    /* ⚠️ 第 33 轮：up 不再从 meta 取，改走 upLevel()（本局快照）——
       见文件上方 upSnapshot 的说明。原来的 const up 已删。 */
    /* 恢复量刻意低于行动消耗的两倍，确保「刷恢复」不是最优解。
       ⚠️ 第 25 轮：「静养」从固定 +5/级 改成「回复量 ×（1+8%/级）」。
       基础回复量本来就是 maxLife×14%（随境界涨），所以百分比才是对的基。 */
    const heal = Math.round(s.maxLife * 0.14 * (1 + restBonus())) + a.lifePerAction*3;
    const before = s.life;
    gainLife(heal);
    gainSectQi(-3);
    gainCult(Math.round(G.cultBase(s.realmIdx)*0.25));
    s.restUsed = (s.restUsed||0) + 1;
    /* 第 29 轮：静养也压业障。
       走魔道的人因此有一条**有限**的活路（每境界 restPerRealm 次），
       于是「静养」变成了一个真取舍：回寿元，还是把账压下去。 */
    const atone = Math.min(s.karma, G.CONFIG.tribulation.karmaAtonement);
    if (atone > 0) gainKarma(-atone);
    msgs.push(`寿元 +${Math.max(0, s.life - before)}　宗门气运 −3`
      + (atone > 0 ? `　业障 −${atone}（现有 ${s.karma}）` : ''));
  }
  else if (kind==='nourish'){
    /* 永久提升寿元上限，但净收益很薄，且每境界次数有限。
       ⚠️ 第 25 轮：跟「根基」一起改成百分比 ——
       基础值先随境界放大（否则到了元婴期，+16 点是噪音），
       再乘「根基」的倍率。 */
    const gain = Math.round(16 * (1 + s.realmIdx*0.16) * (1 + lifeCapBonus()));
    raiseMaxLife(gain);
    s.nourishUsed = (s.nourishUsed||0) + 1;
    msgs.push(`寿元上限 +${gain}　净收益 ${gain - cost >= 0 ? '+' : ''}${gain - cost}`);
  }

  // 3. 持续产出（建筑 / 法宝）
  if (a.stonePerAction > 0){ gainStone(a.stonePerAction); }
  if (a.lifePerAction > 0){ gainLife(a.lifePerAction); }

  // 丹房产丹
  const dfLv = s.buildings.danfang;
  if (dfLv>0){
    s.pillCounter++;
    const need = Math.max(3, 8 - dfLv) - (a.pillGain>0?1:0);
    if (s.pillCounter >= Math.max(3,need)){
      s.pillCounter = 0;
      const pool = pillPool();
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      msgs.push(`丹房产出【${pick}】`);
    }
  }

  /* 套装「丹火不熄」：每次行动有几率自动产丹（第 20 轮接上，以前是死效果） */
  if (a.pillSetChance > 0 && s.rng() < a.pillSetChance){
    const pool = pillPool();
    if (pool.length){
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      msgs.push(`丹火不熄，炉中自成【${pick}】`);
    }
  }

  // 4. 宗门气运流失
  if (!s.sectCollapsed){
    const zushiCut = s.buildings.zushi;
    /* ⚠️ 第 33 轮：改走 upLevel()（本局快照） */
    let drain = Math.max(0, G.CONFIG.sectQiDrain - Math.floor(zushiCut/2) - upLevel('sectDrain'));
    /* ⭐ 气运阈值（第 17 轮）：气运高于阈值时，宗门开始给「阵」供能，
       所以额外流失更快。低于阈值时有安全区，玩家可以安心经营宗门。 */
    const qiTh = (G.WORLD && G.WORLD.qiThreshold) || 75;
    if (s.sectQi > qiTh){
      drain += 1 + Math.floor((s.sectQi - qiTh) / 12);
      s.arrayCharge = (s.arrayCharge||0) + 1;   // 阵的充能计数（隐藏）
    }
    gainSectQi(-drain);
    if (s.sectQi <= 0){
      s.sectCollapsed = true;
      msgs.push('宗门气运见底了。');
      log('宗门气运见底。山门上的灯笼，灭了一盏。');
    }
  }

  // 5. 业障累积（夺道流等）
  /* ⚠️ 第 20 轮修复：这里以前是一段**空操作**——
       const kp = a.karmaPer;
       if (kp>0 && ...) s.karma = clamp(s.karma + 0, 0, 30);   // ← +0
     于是「业障」这个资源在整局里根本不会涨，
     夺道流「涨得最快、代价是业障翻倍」的代价部分完全是假的。
     设计文档说业障满会引来天谴（必死难度），而它永远涨不上去。

     现在：只要身上带着任何「损阴德」的东西，行动就积业障。
     刻意的两处收敛，避免一局直接暴死：
       · 按「件数」算，不按 karmaPer 的点数叠加 —— 点数差别只体现在
         渡劫判定（shouldTribulate 看 karmaPer>=5）与招式自带的业障上
       · 只在修行 / 探索 / 宗门事务上积，静养养身不积                */
  const actsWithKarma = (kind === 'cultivate' || kind === 'explore' || kind === 'sectwork');
  if (actsWithKarma){
    const perAction = ((a.karmaPer > 0) ? 1 : 0) + (a.setKarma || 0);
    if (perAction > 0){
      s.karma = clamp(s.karma + perAction, 0, 30);
      if (s.karma >= G.CONFIG.tribulation.killerKarma){
        msgs.push('业障满了。天上有东西开始找你。');
      }
    }
  }

  // 6. 死亡检查（行动是「耗尽」，不是「被打死」）
  const dead = checkDeath();

  // 7. 挑战重置
  if (challenge){ challenge.usesLeft = challenge.usesPerTurn; }

  // 8. 机缘：修行 / 探索 / 事务 都可能摸到新东西（三选一）
  let cardOffer = null;
  const cc = rollCardChance(kind);
  if (cc > 0 && s.rng() < cc){
    cardOffer = offerCards(3, { bonus: cardBonus() });
    if (!cardOffer.length) cardOffer = null;
  }

  // 9. 宗门：累计宗门行动 → 月俸 & 主线推进（第 15 轮）
  let salary = null;
  if (s.chapter === 'zongmen'){
    if (kind === 'sectwork' || kind === 'cultivate' || kind === 'explore'){
      s.sectActions = (s.sectActions||0) + 1;
      if (s.sectActions % 10 === 0){
        salary = paySalary();
        msgs.push(`月俸 +${salary.amount} 灵石（${salary.rank}）`);
      }
    }
  }

  // 10. 长期因果：以前的选择回来找你
  /* ⚠️ 第 31 轮：这里以前只调 checkDebts()（把到期的账取出来），
     但**取出来之后没人管** —— 界面不读 res.debts，eff 也从没执行过。
     现在换成 settleDebts()：账真的结算，并返回可以渲染的记录。 */
  const debts = settleDebts();

  return { ok:true, cost:cost, msgs:msgs, dead:dead, extra:extra,
           cards:cardOffer, salary:salary, debts:debts };
}

/* ---------------- 死亡判定 ----------------
   · 被外力打死（战斗 / 天劫）→ 身死道消（slay）
   · 寿元自然耗尽            → 寿元耗尽（life）
   两者是不同的结局，情绪也完全不同：一个是「被打断」，一个是「走完了」。
   reason 由调用方给出，因为「扣成负数」既可能来自行动，也可能来自战斗。 */
function checkDeath(reason){
  if (s.life > 0) return null;
  /* ⚠️ 第 33 轮：改走 upLevel()（本局快照）—— 元层「残念」免死要在本局内稳定 */
  if (upLevel('guard') && !s.guardUsed){
    s.guardUsed = true;
    s.life = G.CONFIG.deathGuardHeal;
    log('你倒下去了。有什么东西托了你一把。');
    return { saved:true, by:'guard' };
  }
  /* 第 28 轮：元层的「残念」用掉之后，还有一次机会 ——
     你门下忠诚够高的弟子会替你挡。
     ⚠️ 放在 guard 之后：元层买的东西必须先兑现，那是玩家花碎片买的。
     弟子这条是「人和人的关系」，不该压过付费内容。 */
  const sh = discipleShield();
  if (sh){
    s.life = G.CONFIG.deathGuardHeal;
    return { saved:true, by:'disciple', disciple:sh.name };
  }
  return endRun(reason === 'slay' ? 'slay' : 'life');
}

/* ---------------- 突破 ---------------- */
function breakNeed(){
  const a = agg();
  /* ⚠️ 第 33 轮：改走 upLevel()（本局快照） */
  const raw = G.REALMS[s.realmIdx].need;
  return Math.round(raw * (1 - a.breakReduce - upLevel('breakCut')*0.07));
}

/* 是否可以突破到下一层。
   ⚠️ 第 21 轮：境界上限由 G.realmCapIndex() 决定（默认锁在元婴），
   不是 G.REALMS.length。完整表仍然保留（敌人曲线要用），
   但玩家这一世走不到那么远。 */
function canBreak(){
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return false;
  if (s.realmIdx >= G.REALMS.length-1) return false;
  return s.cult >= breakNeed();
}

/* 筑基圆满 + 修为已足 → 可以挑战「结丹之劫」进入金丹
   ⚠️ 用 major 判断大境界，不要用 tier（tier 是敌人难度阶梯的键）
   ⚠️ 第 25 轮：这个门槛原本挂在「炼气九层 → 筑基」上，
   那是早期草稿把筑基当成结局时留下的。现在筑基只是第二站，
   天劫也统一挪到「金丹期起的大境界突破」——第一劫就是结丹。 */
function canAscend(){
  const cur = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return false;
  return !!cur && !!next && cur.major === 2 && next.major === 3
      && s.cult >= breakNeed()
      && !s.flags.includes('boss_zhuji_done')
      /* 第 28 轮：「在池边坐下」= 放弃结丹。
         以前这个选项也会打上 boss_zhuji_done，于是「坐下」和「打赢」
         在机制上完全等价 —— 文案上写着「你没有结丹」，
         玩家下一步却照样破境成金丹。现在坐下真的关门。 */
      && !s.flags.includes('boss_zhuji_rest');
}

/* 下一次突破是不是「跨大境界」？（第 25 轮）
   天劫判定的唯一前置条件——小境界突破永远不降劫。 */
function isMajorCrossing(){
  const cur = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];
  return !!cur && !!next && next.major > cur.major;
}

/* 是否已经无路可走（已到本世上限） */
function isAtEnd(){
  if (G.isRealmCapped && G.isRealmCapped(s.realmIdx)) return true;
  return s.realmIdx >= G.REALMS.length-1;
}

/* 到了上限、且修为已经攒够 → 该收束这一世了。
   上限那一层走到修为满，就走「此世圆满」的结局，
   而不是让玩家继续点到寿元耗尽。 */
function canCapstone(){
  if (!(G.isRealmCapped && G.isRealmCapped(s.realmIdx))) return false;
  if (s.realmIdx >= G.REALMS.length-1) return false;   // 完整表的最后一档另说
  return s.cult >= breakNeed();
}

function doBreak(){
  /* ⚠️ 必须在这里就把「从哪来 / 到哪去」抓下来。
     下面 s.realmIdx++ 之后，G.REALMS[s.realmIdx+1] 指的是**再下一层**，
     天劫判定会整整晚一步（实测：金丹八层→九层降劫、九层→元婴一层反而平静）。
     第 25 轮就是因为这个 off-by-one，才有了「天劫出现在小境界上」的假象。 */
  const fromRealm = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];

  // 到了本世上限：修为已足 → 交回界面走收束结局
  if (canCapstone()){
    return { realm: G.REALMS[s.realmIdx].name, capstone: true,
             capName: G.realmCapName ? G.realmCapName() : '' };
  }

  /* 筑基圆满 → 金丹：第一场天劫，写成剧本（「雷池之影」）。
     这是全篇唯一一场手写的大境界天劫——它负责把「天劫」这个概念
     立起来。金丹之后的跨大境界走通用的 startTribulation()。
     ⚠️ 第 25 轮改动：这里原本是「炼气圆满 → 筑基」。
     用户要求清掉那段早期草稿把筑基当结局的「终极一战」框架，
     所以筑基→金丹 接管了这个 Boss，炼气→筑基 变回一次普通突破。 */
  if (next && next.major === 3 && !s.flags.includes('boss_zhuji_done')){
    /* 「在池边坐下」之后这条路就是关着的 ——
       ⚠️ 必须在这里显式挡掉，不能靠 canAscend() 返回 false 就算了：
       下面就是 canBreak() 那条普通突破通道，它会直接把玩家送进金丹。 */
    if (s.flags.includes('boss_zhuji_rest')) return null;
    if (!canAscend()) return null;
    return { realm: next.name, needBoss:'boss_zhuji' };
  }

  if (!canBreak()) return null;
  const cur = G.REALMS[s.realmIdx];

  s.cult -= breakNeed();
  s.realmIdx++;
  // 境界成长：属性点（境界越高加成越大）
  /* ⚠️ 第 25 轮：这里原来是 +1+extraAttr，也就是「根骨每级多算一行属性表」。
     属性表只有 72 行 —— 点满 10 级后 7 次突破就吃光，之后再也拿不到境界属性。
     现在「根骨」改成在 attrs() 里对属性点整体乘（1+8%/级），这里只 +1。 */
  s.attrGain = Math.min(G.REALM_ATTR_GAIN.length, (s.attrGain||0) + 1);
  // 恢复类行动的次数上限随境界重置
  s.restUsed = 0;
  s.nourishUsed = 0;
  /* 第 26 轮：跨大境界时内景跟着蜕变（金丹 → 元婴）。
     ⚠️ 必须在 realmIdx++ 之后立刻调 —— 这一步返回的 realm 名字
     和「内景还挂在旧大境界上」会打架。 */
  const djShift = syncDaoJi();

  // 寿元上限提升 + 奖励寿元
  const reward = cur.reward || 40;
  const oldMax = s.maxLife;
  /* ⚠️ 第 25 轮：突破时的上限也要乘「根基」的百分比，
     否则元层买的上限会在第一次突破时被抹掉。 */
  s.maxLife = Math.round(next.maxLife * (1 + lifeCapBonus())
              * (G.CONSTITUTIONS.find(c=>c.id===s.constId).lifeMul));
  const diff = s.maxLife - oldMax;
  s.life += Math.max(0, diff) + reward;

  log(`你突破到了 ${next.name}。寿元上限 ${s.maxLife}。`);
  if (next.sub === 1) note('realm', `破境，成了${next.name}。`);

  /* 天劫判定（见 G.CONFIG.tribulation）：
     ⚠️ 第 25 轮重写。旧版是「境界序数 >= 20 就降劫」，于是
     金丹期内部的**小境界**突破也会被雷劈；而炼气→筑基 走的是
     另一个写死的 Boss。用户要求：天劫只能出现在金丹期起的
     **大境界**突破上，小境界与金丹以下一次都不能有。

     新规则只有一句：
         跨大境界 且 目标大境界 >= 金丹  →  必定降劫
     逆天条件（业障 / 属性 / 禁忌功法）不再决定「有没有劫」，
     只决定「这一劫有多狠」——门槛是确定的，难度是可经营的。 */
  const judge = shouldTribulate(fromRealm, next);
  if (judge.yes){
    return { realm: next.name, tribulation: true, reward: reward,
             maxLife: s.maxLife, tribReason: judge.reason, extreme: judge.extreme,
             daoJi: djShift };
  }
  return { realm: next.name, tribulation: false, reward: reward, maxLife: s.maxLife,
           daoJi: djShift };
}

/* ---------------- 天劫门槛判定 ----------------
   shouldTribulate(fromRealm, toRealm) → { yes, reason, extreme }

   ⚠️ 必须**显式传入**「从哪来 / 到哪去」。
   不传的话会退回「以当前状态看下一次突破」，那是给界面问
   「我下次破境会不会挨雷」用的——doBreak 内部绝不能依赖它，
   因为调用点在 s.realmIdx++ 之后（第 25 轮踩过这个坑）。

   规则（第 25 轮）：
     ① 不是跨大境界 → 一律不降劫（小境界永远安全）
     ② 目标大境界低于金丹（炼气/筑基）→ 一律不降劫
     ③ 其余 → 必定降劫
   然后单独判断这一劫是不是「逆天劫」（更狠）：
     业障滔天 / 属性碾压同阶 / 修了禁忌功法                        */
function shouldTribulate(fromRealm, toRealm){
  const T = G.CONFIG.tribulation;
  const cur  = fromRealm || G.REALMS[s.realmIdx];
  const next = toRealm   || G.REALMS[s.realmIdx+1];

  // ①② 唯一的门槛：跨大境界，且目标大境界达到金丹
  if (!next) return { yes:false, reason:'noNext', extreme:false };
  if (T.majorOnly !== false && !(cur && next.major > cur.major)){
    return { yes:false, reason:'subRealm', extreme:false };
  }
  if (next.major < T.fromMajor){
    return { yes:false, reason:'below', extreme:false };
  }

  // ③ 降劫。下面只是判断「狠不狠」，不再影响「有没有」
  const A = attrs();
  const sum = G.ATTRS.reduce((n,a)=>n + (A[a.id]||0), 0);
  const maxPossible = maxAttrPossible();
  const ratio = maxPossible > 0 ? sum / maxPossible : 0;
  if (ratio >= T.extremeAttrRatio){
    return { yes:true, reason:'attr', extreme:true };
  }

  // ③ 业障滔天？
  if (s.karma >= T.extremeKarma){
    return { yes:true, reason:'karma', extreme:true };
  }

  // ④ 修了禁忌功法？（吞天魔功 / 化功大法 这类）
  const taboo = s.deck.some(n=>{
    const c = G.CARDS[n];
    return c && c.eff && (c.eff.karmaPer||0) >= 5;
  });
  if (taboo && s.karma >= 10){
    return { yes:true, reason:'taboo', extreme:true };
  }

  return { yes:true, reason:'major', extreme:false };
}

/* 属性「理论上限」：抽签可能拿到的最高初始属性 + 全部境界成长
   ------------------------------------------------------------
   ⚠️ 第 32 轮：这里原来有**两个模块级缓存**（一个存总和、一个存分项表），
   **从不清除**。而这个上限里有一项 daoJiPerAttrMax() 是跟着**当前大境界**变的
   （气海 1 / 道基 3 / 金丹 6 / 元婴 10 ……），于是它被永久冻结在
   「第一次调用时那个大境界」上。实测：开局在炼气调一次得 4160，
   同一局修到元婴再算还是 4160，而正确值是 4430。

   影响面目前是**潜伏**的：这个数只被逆天门槛用（ratio vs extremeAttrRatio=0.92），
   而元婴期实测 ratio 只有 0.25 —— 差值翻不动结论。
   但它会随 per 一起长大（劫身 per 是 39），且 attrGainBonus()（元层的「根骨」）
   也被一起冻住了：在同一页面里买完升级再开一局，上限不会跟着动。

   故意**删掉缓存**而不是给它做失效标记：它不是热路径
   （只有逆天判定与 evAttrRank 用它），而任何"记得去清缓存"的方案
   都会在下一次有人加新的依赖项时再次失准。 */
function maxAttrBest(){
  // 每支签里各项属性的最大值之和
  const best = {};
  G.ATTRS.forEach(a=>{ best[a.id] = 0; });
  G.LOTS.forEach(lot=>{
    if (!lot.table) return;
    const per = {};
    G.ATTRS.forEach(a=>{ per[a.id] = 0; });
    lot.table.forEach(t=>{
      if (!t.attrs) return;
      G.ATTRS.forEach(a=>{ per[a.id] = Math.max(per[a.id], t.attrs[a.id]||0); });
    });
    G.ATTRS.forEach(a=>{ best[a.id] += per[a.id]; });
  });
  // 加上全部境界成长（含「根骨」的百分比加成 —— 与 attrs() 同源）
  const agMul = 1 + attrGainBonus();
  G.REALM_ATTR_GAIN.forEach(g=>{
    G.ATTRS.forEach(a=>{ best[a.id] += Math.round((g[a.id]||0) * agMul); });
  });
  /* 第 26 轮：内景也要算进「理论上限」。
     这个上限是给「逆天招劫」用的（属性达到上限的 92% → 这一劫更狠）。
     内景是一条人人都能走的养成线，不算进去的话，
     练满内景反而会被系统当成「异常」而招来更狠的天劫。
     另外六个大境界各养一遍是不可能的（内景会蜕变），
     所以这里只取**当前大境界**练满的量，与 attrs() 的实际算法一致。
     ⚠️ 正因为这一项跟着当前大境界变，整个上限**不能缓存**。 */
  const djFull = daoJiPerAttrMax();
  if (djFull > 0) G.ATTRS.forEach(a=>{ best[a.id] += djFull; });
  return best;
}
function maxAttrPossible(){
  const best = maxAttrBest();
  return G.ATTRS.reduce((n,a)=>n + best[a.id], 0);
}

/* 单个属性的理论上限（第 29 轮）。
   ⚠️ maxAttrPossible() 返回的是**六维总和**，不是每个属性的上限。
   第 29 轮写事件助手时第一版把它当成单项上限用了（evAttrRank 全错），
   所以单项上限单独给一个取法。 */
function maxAttrFor(id){
  return maxAttrBest()[id] || 0;
}

/* ============================================================
   道途 · 大事记（第 28 轮）
   ------------------------------------------------------------
   见 src/daotu.js 的设计说明。

   `note(kind, text)` 是唯一的写入点 —— 只在「值得一提但不体现在数值上」
   的事上调用。能从现有状态推出来的东西（线索/名号/天骄/秘境/主线）
   一律**不**记，结算时现算 —— 那样才不用给 196 个事件逐个加埋点。
   ============================================================ */
function note(kind, text){
  if (!s) return null;
  if (!s.chronicle) s.chronicle = [];
  /* 同一句话不重复记（有些钩子会被反复触发） */
  if (s.chronicle.some(c=>c.text===text)) return null;
  const rec = { at: s.actions||0, kind: kind||'choice', text: text,
                realm: (G.REALMS[s.realmIdx]||{}).name || '?' };
  s.chronicle.push(rec);
  if (s.chronicle.length > 60) s.chronicle.shift();
  return rec;
}

/* ---------------- 标记的唯一写入口（第 32 轮补） ----------------
   ⚠️ 这一轮挖出的最严重的一类 bug 就在这儿，值得写清楚。

   第 31 轮给 `a.flag()` 加了「记下这个标记是第几次行动打上的」（s.flagAt），
   于是后续事件可以写 `flagAge('node_broken') >= 15` ——「过了一阵子，那件事回来了」。
   下游 102 个回响事件全都依赖这个功能。

   但当时**只有 a.flag() 那一处**在写 flagAt，另外四条写标记的路都没写：
     · applyOutcome()      战斗的数据化战果（例如 win:{flag:'seat_won'}）
     · addCard()           卡牌自带的 flags（page / mirror / ring）
     · addCard() 的 eff.flag
     · newRun() 的开局签运（junior / pet / jade / letter / losttime / extraline）

   而 flagAge() 对「没记过时间」的标记返回 -1，`-1 >= 15` 恒为假 ——
   于是这些标记的下游事件**在这一世里永远不会触发**，而且不报错、不崩溃。
   实测：8 处只有战斗胜利才能拿到的标记（won_duel / seat_won / other_won 等）
   全部卡死，其中 ev11_won_duel / ev11_seat_won / ev11_other_won 三整条链是死的。

   修法：所有写标记的地方统一走 raiseFlag()。
   顺带修掉另一个数据缺口 —— 以前 addCard 直接 push s.flags，
   既不记时间也不去重。 */
function raiseFlag(f, opts){
  if (!f || !s) return;
  if ((s.flags || (s.flags = [])).indexOf(f) < 0) s.flags.push(f);
  if (!s.flagAt) s.flagAt = {};
  if (s.flagAt[f] == null) s.flagAt[f] = s.actions || 0;
  /* 「有因有果」的选择要写进记事（结算页的「这一世」）。
     只记 G.CAUSE 里登记过的；战斗/卡牌/签运带来的标记不写 ——
     它们不是「你做的选择」，写进去会把记事淹掉。
     opts.note 显式给 false 可以关掉（默认开，保持第 31 轮的行为）。 */
  if (opts && opts.note === false) return;
  const cz = (G.CAUSE || {})[f];
  if (cz && cz.label) note('choice', `你做了这件事：${cz.label}。`);
}

/* 这一世的统计（称号判定用）。全部从现有状态推出来，不额外存。 */
function runStats(){
  const sx = (s && s.sanxiu) || {};
  const mj = (s && s.mijing) || {};
  const skillsMaxed = Object.keys(sx.skills||{}).filter(function(id){
    const def = (G.SANXIU_SKILLS||[]).find(x=>x.id===id);
    return def && (sx.skills[id]||0) >= def.max;
  }).length;
  return {
    realmIdx: (s && s.realmIdx) || 0,
    acts: (s && s.actions) || 0,
    clues: ((s && s.clues) || []).length,
    sectContrib: sectContribTotal(),
    tianjiaoWon: (s && s.tianjiaoMet || []).filter(id=>(s.flags||[]).indexOf('tj_beaten_'+id)>=0).length,
    champions: ((s && s.titles) || []).length,
    mijingDeep: ((s && s.chronicle) || []).filter(c=>c.kind==='place' && /最深处/.test(c.text)).length,
    shielded: (s && s._discipleShield) || 0,
    disciplesGrown: (s && s._disciplesGrown) || 0,
    disciplesLost: (s && s._disciplesLost) || 0,
    peopleSaved: (s && s._peopleSaved) || 0,
    debtsPaid: (s && s._debtsPaid) || 0,
    /* ⚠️ 第 32 轮：这里原来还有一行
         storyDone: Math.min((s && s.storyStage) || 0, stages.length),
      它读的是 s.storyStage —— 而第 31 轮把那个字段从**数字下标**改成了
      页面 id 字符串（'st2' / 'st4a' / 收束哨兵 STORY_DONE）。
      Math.min('st4a', 9) 是 NaN，于是这个字段永远是 NaN。
      它和下面那一行同名，JS 对象字面量里**后面的覆盖前面的**，
      所以功能没坏 —— 但那一行是死代码，还引用了已经变了类型的字段。
      下一个人改这一块时很可能改错行，然后发现「怎么改都没反应」。
      删掉它。真正在数页数的是 s.storyDone（advanceStory 里 +1）。 */
    storyDone: (s && s.storyDone) || 0,
    sanxiuDays: sx.days || 0,
    skillsMaxed: skillsMaxed,
    bosses: ((s && s.flags) || []).filter(f=>/_done$/.test(f) && /^boss/.test(f)).length,
    /* storyRoute = 当前这条路线一共几页（走完一条路要翻的页数）。
       ⚠️ 不能用 storyPages 去比 —— 那是整个故事图的页数（9），
       而一条路线只走 5 页，拿 9 当门槛会让称号永远拿不到。 */
    storyRoute: (function(){ try { return (storyProgress()||{}).total || 0; } catch(e){ return 0; } })(),
    storyPages: (G.SECT_STORY.stages||[]).length
  };
}

/* 算出这一世的称号 */
function daotu(){
  const st = runStats();
  const hit = (G.DAOTU||[]).find(d=>{
    try { return !!d.t(s, st); } catch(e){ return false; }
  }) || { id:'plain', name:'一个普通的修士', color:'#8a8078', why:'' };
  return { id:hit.id, name:hit.name, color:hit.color, why:hit.why, stats:st };
}

/* 结算页要用的整块「这一世」。
   编年 = 显式记下的 + 从状态推出来的（按行动数排序）。 */
function daotuSummary(){
  if (!s) return null;
  const st = runStats();
  const lines = [];

  /* ---- 从状态推出来的（不带行动数，排在显式记录之间） ---- */
  (s.chronicle || []).forEach(c=>lines.push({ at:c.at, kind:c.kind, text:c.text }));

  if (st.storyDone > 0){
    /* ⚠️ 别再写死「4 页」：主线第 31 轮从线性四页改成了 9 页 / 每条路 5 页的
       故事图，写死 4 会让走完一条路的人看到「剩下的几页还夹在册子里」。
       改成跟这一条路线的长度比（storyRoute）。 */
    const routeN = st.storyRoute || 0;
    const finished = routeN > 0 && st.storyDone >= routeN;
    lines.push({ at:0, kind:'story',
      text:`《三月初七》翻到了第 ${st.storyDone} 页。` +
           (finished ? '你这条路走到头了。' : '剩下的几页还夹在册子里。') });
  }
  if (st.tianjiaoWon > 0){
    const names = (s.tianjiaoMet||[]).filter(id=>(s.flags||[]).indexOf('tj_beaten_'+id)>=0)
      .map(id=>{ const t=(G.TIANJIAO||[]).find(x=>x.id===id); return t?t.name:id; });
    lines.push({ at:0, kind:'fight', text:`榜上的${names.join('、')}——你赢过。` });
  } else if ((s.tianjiaoMet||[]).length){
    lines.push({ at:0, kind:'fight', text:'榜上的人你遇见过，但一次也没赢。' });
  }
  if (st.champions > 0) lines.push({ at:0, kind:'fight', text:`名号：${(s.titles||[]).join('　')}` });
  if ((s.mijing && s.mijing.done || []).length){
    const names = s.mijing.done.map(id=>{ const d=(G.MIJING||[]).find(x=>x.id===id); return d?d.name:id; });
    lines.push({ at:0, kind:'place', text:`你进过秘境：${names.join('、')}。` });
  }
  if ((s.disciples||[]).length){
    const d0 = s.disciples;
    lines.push({ at:0, kind:'people',
      text:`门下 ${d0.length} 人：${d0.map(x=>x.name).join('、')}。` +
           (st.disciplesLost ? `其中 ${st.disciplesLost} 个没能陪你走到最后。` : '') });
  }
  if (typeof sectContribTotal === 'function' && sectContribTotal() > 0){
    lines.push({ at:0, kind:'people', text:`一生为宗门做了 ${sectContribTotal()} 点贡献。` });
  }
  const t = daotu();
  return { dao:t, lines:lines.sort((a,b)=>a.at-b.at), stats:st };
}

/* ---------------- 抽卡 ---------------- */

/* 把卡池里的品阶恢复成出厂值。
   ⚠️ 不恢复的话，「升品」会跨局累积（见 G.CARD_BASE_RARITY 的说明）。 */
function resetCardRarity(){
  if (!G.CARD_BASE_RARITY) return;
  Object.keys(G.CARD_BASE_RARITY).forEach(function(k){
    if (G.CARDS[k]) G.CARDS[k].rarity = G.CARD_BASE_RARITY[k];
  });
}

/* 一张卡是不是已经「练到头了」（第 28 轮）。
   ------------------------------------------------------------
   玩家要求：「卡牌重复获得时升到最高等级后就停止获取该卡牌」。

   什么叫到头：精炼满 G.REFINE.max **且** 品阶已是 rarityOrder 的最后一档。
   两者都满了之后，再拿到同一张只会 `converted`（转成一点点修为）——
   那对玩家就是「这抽废了」。与其让他反复抽到废牌，不如把这张卡
   从池子里拿掉。
   ⚠️ 只有品阶满、精炼没满**不算**到头 —— 那种情况再拿一张还能 +15% 威力。 */
function cardMaxed(name){
  if (!s || !s.deck || s.deck.indexOf(name) < 0) return false;
  const c = G.CARDS[name];
  if (!c) return true;
  const order = (G.REFINE && G.REFINE.rarityOrder) || ['凡','良','玄','道'];
  const topRarity = order[order.length-1];
  if (c.rarity !== topRarity) return false;
  return ((s.refine && s.refine[name]) || 0) >= ((G.REFINE && G.REFINE.max) || 3);
}
/* 这一局已经练到头的卡（给界面显示「已满」用） */
function maxedCards(){
  if (!s || !s.deck) return [];
  return s.deck.filter(cardMaxed);
}

function addCard(name, silent){
  if (!G.CARDS[name]) return false;
  if (!s.refine) s.refine = {};
  const c = G.CARDS[name];

  /* ---- 精炼制（第 18 轮）：重复卡不再浪费 ----
     已经有这张卡 → 精炼 +1（上限 3）；满 3 则自动升一品。 */
  if (s.deck.indexOf(name) >= 0){
    const cur = s.refine[name] || 0;
    if (cur < G.REFINE.max){
      s.refine[name] = cur + 1;
      if (!silent) log(`【${name}】精炼至 +${cur+1}。`);
      return { refined:true, name:name, level:cur+1 };
    }
    // 已满精炼 → 升品
    const order = G.REFINE.rarityOrder;
    const idx = order.indexOf(c.rarity);
    if (idx >= 0 && idx < order.length-1){
      c.rarity = order[idx+1];
      s.refine[name] = 0;
      if (!silent) log(`【${name}】品阶提升为「${c.rarity}」！`);
      return { upgraded:true, name:name, rarity:c.rarity };
    }
    // 已至道品：转成修为
    gainCult(G.cultBase(s.realmIdx) * 2);
    if (!silent) log(`【${name}】已至道品，化作修为。`);
    return { converted:true, name:name };
  }

  s.deck.push(name);
  if (c.eff){
    if (c.eff.lifeMax) raiseMaxLife(c.eff.lifeMax);
    if (c.eff.attr){
      addAttrBonus(c.eff.attr);
    }
  }
  /* 卡牌自带的标记也走 raiseFlag（第 32 轮）：以前直接 push，
     既不记 flagAt 也不去重 —— 而 page / mirror / ring 这三个标记
     是有下游事件在读 flagAge 的。 */
  if (c.flags) c.flags.forEach(function(f){ raiseFlag(f, { note:false }); });
  if (c.eff && c.eff.flag) raiseFlag(c.eff.flag, { note:false });
  if (!silent) log('你得到了【' + name + '】。');
  return { added:true, name:name };
}

function removeCard(name){
  const i = s.deck.indexOf(name);
  if (i<0) return false;
  s.deck.splice(i,1);
  return true;
}

function randCardName(opts){
  const o = opts||{};
  const a = agg();
  const weights = Object.assign({}, G.CONFIG.rarityWeight);
  // 机缘加成提高高稀有度权重
  const bonus = (a.findBonus||0) + (o.bonus||0);
  weights['玄'] += bonus*4;
  weights['道'] += bonus*1.5;
  weights['良'] += bonus*2;

  const myMajor = (G.REALMS[s.realmIdx] || {major:1}).major;
  const pool = Object.keys(G.CARDS).filter(k=>{
    const c = G.CARDS[k];
    if (c.hidden && s.flags.indexOf('page') < 0) return false;
    if (o.type && c.type!==o.type) return false;
    /* 第 18 轮：高境界才能抽到高境界的卡 */
    if (c.minMajor && c.minMajor > myMajor) return false;
    /* 第 28 轮：已经练到头的卡不再出现（玩家要求）。
       副作用是好的：随着牌组成长，池子会慢慢收窄，
       后期的三选一反而更有针对性，而不是一堆废牌。 */
    if (cardMaxed(k)) return false;
    return true;
  });
  if (!pool.length) return null;
  const total = pool.reduce((sum,k)=>sum + (weights[G.CARDS[k].rarity]||1), 0);
  let r = s.rng()*total;
  for (const k of pool){
    r -= (weights[G.CARDS[k].rarity]||1);
    if (r<=0) return k;
  }
  return pool[pool.length-1];
}

/* ---------------- 抽卡 ----------------
   一次给 3 张候选，由玩家自己选——这是「构筑」的手感来源。
   返回候选数组（不直接入牌组）。                                    */
function offerCards(n, opts){
  const picked = [];
  let guard = 0;
  while (picked.length < n && guard++ < 60){
    const name = randCardName(opts);
    if (!name) break;
    if (!picked.includes(name)) picked.push(name);
  }
  return picked;
}

function rollCardChance(kind){
  const a = agg();
  /* ⚠️ 第 33 轮：改走 upLevel()（本局快照） */
  const luck = upLevel('cardRate') * 0.04;
  if (kind==='explore') return Math.min(0.95, 0.72 + a.findBonus*0.04 + luck);
  if (kind==='cultivate') return Math.min(0.8, 0.26 + a.findBonus*0.04 + luck);
  if (kind==='sectwork') return Math.min(0.8, 0.20 + a.findBonus*0.04 + luck);
  return 0;
}

/* 机缘抽卡时叠加「眼力」升级带来的品质加成 */
function cardBonus(){
  return upLevel('cardLuck');
}

/* ---------------- 探索 ----------------
   ⚠️⚠️ 第 27 轮抓到的**旧 bug**：这个函数原本**从来没有被调用过**。
   `doAction` 里没有 `kind==='explore'` 的分支，于是「探索」这条路
   实际上只拿得到第 8 步那份通用的三选一卡牌 ——
   下面算的灵石、修为、受伤、以及新加的秘境图残片，全是死代码。

   什么时候坏的已不可考（大概率是第 20~21 轮重排 doAction 时漏接的），
   但这解释了一件旧事：玩家一直觉得「探索」比「修行」薄。
   现在把它接回 doAction 的 explore 分支，并且**只留一份实现**：
   得卡仍旧走第 8 步的统一入口（rollCardChance 里 explore = 72%），
   这里不再自己掷一次，否则探索会变成两次抽卡。 */
function explore(){
  const a = agg();
  /* ⚠️ 第 33 轮：改走 upLevel()（本局快照） */
  const mul = 1 + upLevel('findGain')*0.1;

  const stoneGain = Math.round((6 + s.realmIdx*3 + s.rng()*8) * mul);
  const cultGain  = Math.round((G.cultBase(s.realmIdx)*0.5 + s.rng()*5) * mul);

  gainStone(stoneGain);
  gainCult(cultGain);

  const res = { stone: stoneGain, cult: cultGain, hurt: 0, msgs: [] };

  // 机缘事件：受伤
  if (s.rng() < 0.22 - Math.min(0.12, a.evade*0.2)){
    const hurt = Math.round(6 + s.rng()*12 + s.realmIdx*2);
    s.life -= hurt;
    res.hurt = hurt;
  }

  /* 第 27 轮：探索时小概率捡到「秘境图残片」。
     它是残片型秘境的唯一来源 —— 玩家要攒够 G.MIJING_SHARD.need 片
     才能在主界面推演出一处入口。之所以挂在这里：
     探索本来就是「往外走」的行动，而秘境是「走出去才会碰上」的东西。 */
  if (s.rng() < (G.MIJING_SHARD.chance||0.10)){
    gainMijingShard(1);
    res.shard = (miJing() || {}).shards || 0;
    res.msgs.push('你在一处塌了半边的洞里摸到一片硬东西——是张残图。' +
                  `（秘境图残片 ${res.shard}/${(G.MIJING_SHARD.need||3)}）`);
  }
  return res;
}

/* ---------------- 事件收益缩放（第 18 轮） ----------------
   问题：事件奖励原本写死（+20 修为、+10 灵石），到筑基期一次修行就有
   几十修为，事件奖励变成噪音，玩家自然不想选。
   修法：事件只写「基准值」，实际收益 = 基准 × 当前大境界系数。
   这样同一个事件在任何境界都有意义。                            */
/* 事件收益的大境界缩放。
   基准是「炼气期一个 base=20 的中档事件」——在那个尺度上它约等于
   一层的七八成修为，玩家会觉得「遇到好事就往前跳一截」。

   第 19 轮把 a.gain 修好之后（此前 250 处选项根本没给修为），
   这组数字要重算。它按每个大境界 ×4.4 增长，
   而「一层需要的修为」是按 ×4.6 增长的（need = 寿元/4，寿元每境 ×4.6），
   所以两边基本同步：一个 base=20 的中档事件，在任何一个大境界
   都恰好值「一层的六到八成」。写事件的人不需要为不同境界调数字。
   （旧表按 ×5 增长，到渡劫时一个事件值一层半，后期直接跳过境界。） */
/* 事件收益的大境界缩放（第 23 轮重新标定）
   ------------------------------------------------------------
   ⚠️ 这里有一个**单位**问题，改的时候必须一起想清楚，否则 166 个事件
   的文案会集体说谎（verify-eventrewards.js 会当场抓住）。

   事件的写法是：`a.cult(5)` 且文案写死「修为 +5」——
   也就是说，**base 数字在设计上就等于炼气期的修为数**。
   所以缩放的锚点必须是：

        scale[炼气] = 1        ← base 5 就给 5，文案成立
        scale[其它] = gain[大境界] ÷ gain[炼气]

   这样：
      · 炼气期：base 数字 = 修为数字，601 处文案全部成立
      · 任何境界：一个 base=20 的中档事件 = 20 × (gain/3) 修为
        ≈ 6.7 次修行（gain=3 时正好 6.7 次）
      · 事件的份量随境界同步放大，不会在后半程替玩家把活干完

   为什么 anchor 用 gain[炼气] 而不是 gain[炼气九层]：
     因为事件分层的 tier=1 覆盖整个炼气期（一层到九层），
     锚在段首能让炼气期所有文案都对得上（gain 在段内只涨 1.5 倍，
     误差在容差内；这也是第 19 轮定下 tier 分层时就成立的近似）。

   这张表 = round(gain[大境界首层] / gain[炼气一层] × 100) / 100。
   改动 gain 或 speed 之后请重跑：
     node dev/verify-eventrewards.js     （601 处文案对账）
     node dev/verify-cultspeed.js        （事件份量是否恒定）
     node dev/dbg-cultspeed.js           （把新表打出来） */
G.EVENT_SCALE = [0.3, 4.1, 55.4, 757.4, 10436.9, 144086.9, 1988311.1, 27439086.2, 378898800];

function evScale(){
  const major = (G.REALMS[s.realmIdx] || {major:1}).major;
  return G.EVENT_SCALE[Math.min(major-1, G.EVENT_SCALE.length-1)] || 1;
}

/* 收益档位：低/中/高，决定缩放后再乘多少 */
G.GAIN_TIER = { low:0.5, mid:1.0, high:2.2 };

function evGain(base, tier){
  const k = G.GAIN_TIER[tier || 'mid'] || 1;
  /* ⚠️ 第 32 轮：原来直接 Math.max(1, Math.round(base * evScale() * k))。
     传负数时（例如 a.cult(-200) 表示「修为倒退 200」）会算出
     Math.max(1, -60) = **1** —— 于是「倒退 200」变成了「前进 1」。
     这和 evLifePct 是同一个模子刻出来的坑：下限保护只对收益成立，
     碰到损失就变成静默反号。现在取绝对值再补回符号。 */
  const v = Math.max(1, Math.round(Math.abs(base) * evScale() * k));
  return base < 0 ? -v : v;
}
/* 寿元类收益不按大境界缩放（寿元本身已随境界涨），改用百分比。
   ⚠️ 第 32 轮：这里原来是 Math.max(1, Math.round(maxLife * pct))。
   传进来负数时（例如 a.lifePct(-0.06)）它会算出 Math.max(1, -894) = **1**，
   于是文案印出「寿元 −1」而不是「−6%」—— 一个不会报错的静默错值。
   现在取绝对值：lifePct 的语义钉死为「返回变动**量**（正数）」，
   方向由调用方决定（a.life(-a.lifePct(x)) / a.lifeBy(-x)），
   传负数也不再产生假数字。dev/verify-apiconventions.js 会守这一条。 */
function evLifePct(pct){
  return Math.max(1, Math.round((s.maxLife || 100) * Math.abs(pct)));
}

/* ---------------- 事件读六维属性（第 29 轮新增） ----------------
   玩家反馈：「当前的属性对应到时间上没有得到很好的体现，
   事件可能因为玩家属性的变化而变化这个效果也完全没有做出来」。
   实测确认了这句话：196 个事件里，`when` 读到六维属性的有 **0 个**。

   原因不是不想写，是**写不了** —— 事件的 when/eff 拿到的是裸状态对象 s，
   而属性是算出来的（抽签 + 境界成长 + 功法 + 内景 + 卡牌），
   没有一个函数可以从 s 直接算出来给事件用。

   现在补上这一层。事件里这样写：

       when: () => evAttr('shenshi') >= 40          // 神识够高才看得见
       text: () => evAttr('tipo') >= 50
               ? '你伸手把门推开了。门轴没有响。'      // 体魄高的写法
               : '你推了一下，门没有动。'
       choices:[{ label:'…', when:()=>evAttr('shenfa')>=36, … }]

   ⚠️ 这些函数**只读当前这一局**（和 attrs() 同源）。
   事件的 when/text 永远是在「正在玩的那一局」上求值的，
   所以不需要（也不该）传参进来。 */
function evAttr(id){
  const A = attrs();
  return A[id] || 0;
}
function evAttrSum(){
  const A = attrs();
  return G.ATTRS.reduce((n,a)=>n + (A[a.id]||0), 0);
}
/* 相对同境界的水平：0~1。用来写「你在这一境界里算不算突出」*/
function evAttrRank(id){
  const max = maxAttrFor(id);
  if (!max) return 0;
  return Math.max(0, Math.min(1, evAttr(id) / max));
}

/* ---------------- 「你的底子是多少」（第 29 轮） ----------------
   ⚠️ 事件门槛**不能写死数字**。
   实测（dev/dbg-attrrange.js）同一项属性：
       炼气九层 神识 ≈ 21　筑基 ≈ 48　金丹 ≈ 84　元婴 ≈ 139
   所以 `when:()=>evAttr('shenshi')>=40` 在天平两端分别是
   「炼气期永远不触发」和「元婴期人人触发」——两边都是废的。

   第一版这里写的是「同一境界普通人的水平 = 抽签平均值 + 境界成长」。
   那个定义**不成立**，被 dev/verify-eventattr.js 第 3 节当场抓到：
   没在任何一项上砸过机缘的玩家，神识也有 59，
   而算出来的「普通人」是 48 —— 于是「神识远超同辈」对**所有人**都成立，
   门槛形同虚设（分不出任何东西）。

   现在换成精确的定义：

       evPeer(id) = 如果你从来没在这一项上砸过机缘，你现在有多少
                  = evAttr(id) − evBonus(id)

   于是 `evAttr(id) >= evPeer(id)*1.15` 的意思非常干净：
   **「你在这项上的投入，让你比不投入的自己高出了 15%」**。
   它同时满足三件事：与境界无关、与抽签无关、投入为 0 时必定不成立。 */
function evPeer(id){
  return Math.max(1, evAttr(id) - evBonus(id));
}

/* 机缘（功法 / 法宝 / 事件）砸在某项属性上的量 —— 也就是「你的 build 选了什么」。
   attrs() 里这部分是**加法**，所以它是玩家主动选择留下的最干净信号。 */
function evBonus(id){
  return ((s && s.attrBonus) || {})[id] || 0;
}
function evBonusTotal(){
  const b = (s && s.attrBonus) || {};
  return G.ATTRS.reduce((n,a)=>n + (b[a.id]||0), 0);
}
/* 你在哪一项上砸得最多（build 的招牌）。没砸过任何机缘就返回 null。 */
function evMainAttr(){
  const b = (s && s.attrBonus) || {};
  let best = null, bv = 0;
  G.ATTRS.forEach(a=>{ const v = b[a.id]||0; if (v > bv){ bv = v; best = a.id; } });
  return best;
}
/* 这一项占你全部机缘投入的比例（0~1）。
   用来写**弱点**事件：机缘总量不小、却几乎没砸在这一项上
   → 这一项相对你的其它项是短的。
   ⚠️ 「弱」不能用 evAttrRank 判断。evAttrRank 除的是
   maxAttrFor()（跨到渡劫的理论上限 ≈490），而金丹期实际只有 60~180，
   于是所有人的 rank 都在 0.12~0.36 之间，门槛定在哪儿都是废的
   （实测：不砸机缘 0.12、砸满 0.35 —— 两边都低于 0.55）。
   第 29 轮第一版就是这么写错的，被 dev/verify-eventattr.js 抓到。 */
function evBonusShare(id){
  const t = evBonusTotal();
  if (t <= 0) return 0;
  return evBonus(id) / t;
}
/* 把函数型文案求值成字符串（事件支持 text/flavor/title 是函数）*/
function evTextOf(v){
  if (typeof v !== 'function') return v == null ? '' : String(v);
  try { const r = v(s); return r == null ? '' : String(r); } catch(e){ return ''; }
}

/* ---------------- 长期因果（第 18 轮） ----------------
   有些选择会在若干次行动后才回来找你。                          */
function addDebt(cfg){
  if (!s.debts) s.debts = [];
  /* ⚠️ 第 31 轮：`cfg.after || 12` 是错的 —— after:0（立刻回来）
     会被当成「没写」而变成 12。用 == null 判断才是「没写」。 */
  const after = (cfg.after == null) ? 12 : cfg.after;
  s.debts.push({ id:cfg.id, name:cfg.name, due:(s.actions||0) + after,
                 kind:cfg.kind || 'good', text:cfg.text, note:cfg.note,
                 eff:cfg.eff || null,
                 /* ⚠️ 第 31 轮：origin = 「这笔账是谁埋下的」。
                    以前不记这个，所以后续回来的时候说不出
                    「这是你当初在某某事件里做的选择」—— 因果感就没了。 */
                 origin:cfg.origin || null,
                 bornAt:(s.actions||0) });
}
function checkDebts(){
  if (!s.debts || !s.debts.length) return null;
  const due = s.debts.filter(function(d){ return (s.actions||0) >= d.due; });
  if (!due.length) return null;
  s.debts = s.debts.filter(function(d){ return (s.actions||0) < d.due; });
  return due;
}

/* ============================================================
   长期因果的**结算**（第 31 轮新增）
   ------------------------------------------------------------
   ⚠️ 这一段以前根本不存在：addDebt 会记下账、checkDebts 会到期取出来，
   但**没有任何人读 doAction().debts，eff 也从来没有被执行过**。
   于是 9 个事件里写的「那棵树长起来了」「那个誓回来找你了」全部
   静悄悄地什么都没发生 —— 内容里写好的承诺，一行都没兑现。

   现在 checkDebts 取出来的账在这里真的结算：
     · 有 eff 的跑 eff（走和事件同一个 a.* API）
     · 没写 eff 的按 kind 给一个**默认**回报（好/坏/中性三档，随境界缩放）
   返回一份可以给界面渲染的记录。
   ============================================================ */
function settleDebts(){
  const due = checkDebts();
  if (!due || !due.length) return null;
  const api = makeActions({});
  const out = [];
  due.forEach(function(d){
    const rec = { id:d.id, name:d.name, kind:d.kind, text:d.text || '',
                  origin:d.origin || null, waited:(s.actions||0) - (d.bornAt||0),
                  effect:'' };
    let applied = '';
    try{
      if (typeof d.eff === 'function') applied = d.eff(s, api) || '';
      else applied = defaultDebtSettle(d);
    }catch(e){ applied = ''; }
    rec.effect = String(applied || '');
    note('choice', `「${d.name}」有了下文。`);
    out.push(rec);
  });
  return out;
}

/* 没写 eff 的账按 kind 给一个默认结算。
   缩放沿用事件那一套（evGain/evLifePct），这样任何境界都不虚。
   好：修为 + 一点寿元　　坏：寿元 −　　中性：只有修为，很少 */
function defaultDebtSettle(d){
  const good = d.kind === 'good', bad = d.kind === 'bad';
  if (bad){
    const lost = evLifePct(0.05);
    gainLife(-lost);
    return `寿元 −${lost}`;
  }
  const g = evGain(good ? 45 : 18, good ? 'high' : 'low');
  gainCult(g);
  if (!good) return `修为 +${g}`;
  gainLife(evLifePct(0.04));
  return `修为 +${g}　寿元 +${evLifePct(0.04)}`;
}

/* ---------------- 未了之事（第 31 轮） ----------------
   玩家看得见的那一份「我还有什么没结的」。
   两个来源：
     ① 到期还没到的账（debt）—— 知道起因、知道大概什么时候回来
     ② 已经打了标记、而且**我们确实写了后续事件**的那些选择
   只列「真的有下文」的，不把 74 个标记全倒出来（那只会变成噪音）。 */
function openThreads(){
  if (!s) return [];
  const out = [];
  (s.debts || []).forEach(function(d){
    out.push({ kind:'debt', id:d.id, name:d.name, tone:d.kind,
               origin:d.origin || null,
               when: Math.max(0, (d.due||0) - (s.actions||0)),
               text: d.text || '' });
  });
  const CA = G.CAUSE || {};
  Object.keys(CA).forEach(function(f){
    if (!s.flags || s.flags.indexOf(f) < 0) return;
    const c = CA[f];
    /* 后续事件已经看过了就不再列（seenEvents 里出现过它的 id） */
    if (c.event && (s.seenEvents||[]).indexOf(c.event) >= 0) return;
    out.push({ kind:'chain', id:f, name:c.label, tone:'chain',
               origin:c.from || null,
               when:null, text:c.hint || '' });
  });
  return out;
}

/* 某个标记是第几次行动打上的；没打上返回 -1 */
function flagAge(f){
  if (!s || !s.flagAt || s.flagAt[f] == null) return -1;
  return (s.actions||0) - s.flagAt[f];
}
/* 「你还记得：这是你当初……的回响」—— 给后续事件用的旁白。
   找不到起因就返回空串，事件可以据此换成普通写法。 */
function causeLine(flag){
  const c = (G.CAUSE || {})[flag];
  if (!c) return '';
  return c.from ? `你还记得，这是从「${c.from}」那件事上来的。` : '';
}

/* ============================================================
   选择记录（deed）· 串联的读侧（第 32 轮新增）
   ------------------------------------------------------------
   为什么要有它：实测（第 32 轮审计）——
     被写过的标记 76 个，**每个都只被恰好 1 个事件读取**，
     扇出 ≥3 的标记是 **0 个**；而且**没有任何一个事件的正文会因为标记而改变**。
   也就是说当时全是「A 选 1 → B 出现」的孤立两点直线，
   玩家感觉不到「这个世界记得我」。flags 的表达力只够做到这里。

   deed 比 flag 厚三个维度，于是能写出三种串联：
     · **扩散**（A→B/C/D）：同一个记录被 3~5 个不同事件引用，
       各用 deedAge 错开时间 —— 一个人会以不同身份在不同场合再出现
     · **汇聚**（A+B+C→D）：一个事件同时读 2~3 个记录，
       正文与选项数随排列组合变
     · **正文变形**：deedPick 读出「你当时选的是哪一支」，
       让同一个事件条目在不同人眼里是**不同的故事**

   写法（给事件作者）：
     a.deed('thief', 'let_go')                       记一笔（选「放走」）
     when: s => deedHas('thief') && deedAge('thief') >= 12
     text: () => deedPick('thief') === 'let_go'
                  ? '集市上那个卖鱼的看了你一眼，然后把头低下了。'
                  : '集市上那个卖鱼的朝你笑了一下。'
     choices:[{ label:'再放他一次', when:s => deedTimes('thief') >= 2, … }]

   ⚠️ 关于「见证」：一个事件只要引用了某个 deed（deedHas/Age/Times/Pick），
   引擎就算它见证过一次，记进 s.deeds[id].seen。
   这是为了做两件事：① 防止同一个记录被同一批事件反复消费（那样就不像"记得"，
   像"卡住了"）；② pickEvent 的串联优先档要知道**哪些记录还没被讲完**。 */
function deedRec(id){
  return (s && s.deeds && s.deeds[id]) || null;
}
/* 做过没有 */
function deedHas(id){ return !!deedRec(id); }
/* 距今几次行动；没做过返回 -1（和 flagAge 同一个约定） */
function deedAge(id){
  const d = deedRec(id);
  if (!d || d.at == null) return -1;
  return (s.actions||0) - d.at;
}
/* 做过几次 */
function deedTimes(id){
  const d = deedRec(id);
  return d ? (d.n || 1) : 0;
}
/* 当时选的是哪一支；没做过返回 null */
function deedPick(id){
  const d = deedRec(id);
  return d ? (d.choice == null ? null : d.choice) : null;
}
/* 已经被多少个事件见证过 */
function deedWitness(id){
  const d = deedRec(id);
  return d && d.seen ? d.seen.length : 0;
}
/* 这个记录「还没被讲完」吗（用于 pickEvent 的串联优先档） */
function deedPending(id, cap){
  cap = cap || 4;
  const d = deedRec(id);
  if (!d) return false;
  return (d.seen ? d.seen.length : 0) < cap;
}
/* 记一笔见证。eventId 由 pickEvent 在抽中时统一补上。
   ⚠️ 第一版想"从事件里推导出它引用了哪些 deed"，那需要在求值时埋钩子，
   又慢又脆。改成**显式声明**：事件上写 deeds:['thief','bridge']，
   引擎按声明记账。好处有三个：pickEvent 能直接按它筛、
   dev/verify-linkage.js 能静态数出"每个记录被几个事件见证"、
   写内容的人一眼看得出这个事件属于哪条线。 */
function eventDeeds(e){
  if (!e || !e.deeds) return [];
  return [].concat(e.deeds).filter(Boolean);
}
function markDeedSeen(eventId, deedIds){
  if (!s || !s.deeds || !eventId) return 0;
  let n = 0;
  (deedIds || []).forEach(function(id){
    const d = s.deeds[id];
    if (!d) return;                       // 玩家没做过这件事 → 这个事件本来也抽不到
    if (!d.seen) d.seen = [];
    if (d.seen.indexOf(eventId) < 0){ d.seen.push(eventId); n++; }
  });
  return n;
}

/* ---------------- 事件动作 API（唯一真源） ----------------
   第 19 轮重构：以前界面、宗门剧情、测试脚本各写了一份 a.cult/a.life……，
   三份慢慢长歪了——测试里少一个 gainStone，就把 events5 里那场决斗的崩溃
   藏了整整一轮。现在只留这一份，界面与测试都用它。
   hook.onDeath(reason) 交给界面处理「死给你看」的过场。            */
function makeActions(hook){
  hook = hook || {};
  const api = {
    _pendingChallenge: null,
    _pendingTianjiao: null,      // 事件里碰上天骄（第 22 轮）
    _pendingTourney: null,       // 事件里把请帖塞给玩家
    _ended: false,

    /* 修为。
       · a.gain(base, tier) —— 只算数，不施加。用来在文案里显示「能给多少」：
             return '……修为 +' + a.gain(20,'mid');
       · a.cult(base, tier) —— 真的加修为，并把加了多少返回。
       第 19 轮之前有一批事件把 a.gain 写在语句位置当成 a.cult 用，
       于是文案上写着「修为 +30」、实际上一点修为都没给（共 118 处）。
       现在两者的分工是明确的，dev/verify-eventrewards.js 会逐个事件
       比对「文案说的数」与「实际加的数」，再长歪就会当场报错。 */
    gain(n, tier){ return evGain(n, tier); },
    cult(n, tier){
      const v = evGain(n, tier);
      s.cult = Math.max(0, s.cult + v);
      return v;
    },
    lifePct(pct){ return evLifePct(pct); },

    /* 机缘直接给六维属性（第 29 轮新增）。
       ⚠️ 以前动作 API 里**没有**给属性的方法 ——
       事件想奖励属性只能绕道 a.addCard()，靠卡牌自带的 eff.attr。
       于是「这次奇遇让你身法涨了」这种写法根本表达不出来，
       第 29 轮写属性反应事件时踩到了（a.attrGain is not a function）。
       现在直接给，和卡牌走的是同一个 store（s.attrBonus），
       所以 attrs() / evBonus() / evMainAttr() 都能看见它。 */
    attr(obj){
      if (!obj || typeof obj !== 'object') return '';
      addAttrBonus(obj);
      return Object.keys(obj).map(k=>{
        const cn = (G.ATTRS.find(x=>x.id===k)||{}).name || k;
        return cn + ' +' + obj[k];
      }).join('　');
    },

    life(n){
      if (n > 0){ s.life = Math.min(s.maxLife, s.life + n); return; }
      s.life += n;
      if (s.life <= 0 && !s.ended){
        const d = endRun('life');
        if (hook.onDeath) hook.onDeath(d); else api._ended = true;
      }
    },
    /* 按**上限的百分比**施加寿元，并返回实际变了多少（正=回血，负=折寿）。
       ------------------------------------------------------------
       第 32 轮补的。补它是因为：这一批动作 API 里
         · a.gain(n,t)    只算数（给文案显示）
         · a.cult(n,t)    真的施加，并把加了多少返回
         · a.lifePct(p)   只算数（给文案显示）
         · a.life(n)      施加，但只认**绝对值**
       四缺一 —— 少了「按百分比施加、并把变动量返回」的那一个。
       于是写内容的人（包括我）自然地去够 `const l = a.lifePct(-0.09);`
       这个写法（那是照着 `const g = a.cult(...)` 抄的），
       结果 lifePct 是计算器，一点寿元都没扣 ——
       events9/10/11 里 93 处就这么白写了。

       现在有了 lifeBy，正确写法是：
           const l = a.lifeBy(-0.09);           // 真的扣 9%，l = 实际扣掉的数
           return '……寿元 −' + l;               // 文案直接用它，账目按构造相等
       ⚠️ 返回值是**变动量的绝对值**（和 a.lifePct 一样只给大小），
       方向由传进去的正负号决定。这样 '寿元 −' + l 不会印成「−−135」，
       而且和已有的 lifePct 显示写法对称 —— 那两个函数给的是同一种数，
       区别只是 lifeBy 还会真的施加。 */
    lifeBy(pct){
      if (typeof pct !== 'number' || !isFinite(pct) || pct === 0) return 0;
      const before = s.life;
      api.life(pct < 0 ? -evLifePct(Math.abs(pct)) : evLifePct(pct));
      return Math.abs(s.life - before);   /* 实际值：回血被上限截断时如实返回 */
    },
    stone(n){ s.stone = Math.max(0, s.stone + n); },
    /* 灵石：施加**并返回**加了多（和 a.cult 一个规矩）。
       ------------------------------------------------------------
       第 32 轮修。之前是 `gainStone(n){ s.stone = Math.max(0, s.stone + n); }`
       —— 没有 return，而且忽略第二个参数。于是内容里
       `'灵石 +' + a.gainStone(30)` 会印出「灵石 +undefined」，
       而且因为语句位置也调了一次，灵石实际发了两遍。
       22 处中招（events3/4/5）。
       ⚠️ 档位参数**不影响灵石**：灵石是硬通货，不随境界膨胀，
       所以这里不乘 evScale —— 保持原来的数值，只修「显示 undefined」和「发两遍」。
       （第二参数留着是为了不改几十处调用点的签名；它现在被显式忽略，
        dev/verify-apiconventions.js 会禁止再把它拼进文案。） */
    gainStone(n, tier){                       // eslint-disable-line no-unused-vars
      s.stone = Math.max(0, s.stone + n);
      return n;
    },
    karma(n){ s.karma = Math.max(0, Math.min(30, s.karma + n)); },
    favor(n){ s.favor += n; },
    sectQi(n){ s.sectQi = Math.max(0, Math.min(s.sectQiMax, s.sectQi + n)); },
    contrib(n){ gainContrib(n); },
    sectContrib(n){ gainContrib(n); },   // 宗门剧情沿用的旧名
    addCard(n){ addCard(n); },
    removeCard(n){ removeCard(n); },

    debt(cfg){ addDebt(cfg); },
    /* 记一笔「选择记录」（第 32 轮）。见文件上方 deedRec 那一段的说明。
       ------------------------------------------------------------
       和 a.flag() 的区别：flag 记「这件事发生过」，deed 记
       「你当时选了哪一支、做过几次、被谁见证过」。
       两者并存，不互相替代 —— 现有 102 条因果链全部继续走 flag。

       choice 是**自由字符串**（'let_go' / 'burn' / 'a' 都行），
       事件里用 deedPick(id) 取出来做正文变形。
       同一个 id 再做一次 → n 累加、at 刷新（"最近一次是第几步"），
       choice 取最后一次 —— 这样「你又做了一次同样的选择」和
       「你这次改主意了」都能表达。 */
    deed(id, choice){
      if (!id) return null;
      if (!s.deeds) s.deeds = {};
      const d = s.deeds[id] || (s.deeds[id] = { choice:null, at:0, n:0, seen:[] });
      d.choice = (choice == null) ? d.choice : choice;
      d.at = s.actions || 0;
      d.n = (d.n || 0) + 1;
      /* 记一笔记事：只有第一次做的时候写，免得反复做把编年刷满 */
      if (d.n === 1) note('choice', G.deedNote ? G.deedNote(id, d.choice) : `你做了一个选择：${id}。`);
      return d;
    },
    chance(p){ return Math.random() < p; },
    clue(id){ addClue(id); },
    flag(f){
      /* ⚠️ 第 32 轮：这一段（直接 push + 记 flagAt + 写记事）已经收进
         raiseFlag()，因为以前只有这里在写 s.flagAt，另外四条写标记的路
         都没写，导致它们的下游事件永远触发不了。见 raiseFlag 的说明。 */
      raiseFlag(f);
    },
    /* 第 22 轮：在事件里碰到「天骄榜」上的人。
       事件只需要写 a.tianjiao()，引擎挑一个当前大境界、
       这一局还没遇过的天骄；挑不到就返回 null（事件可以据此换文案）。 */
    tianjiao(){ api._pendingTianjiao = tianjiaoForRealm(); return api._pendingTianjiao; },
    /* 比武大会：事件里也能直接报名（少数特殊剧情用） */
    tourney(){ const b = tourneyBracket(); if (b) api._pendingTourney = b; return b; },
    randomCard(){
      const pool = Object.keys(G.CARDS).filter(k=>!G.CARDS[k].hidden);
      return pool[Math.floor(Math.random()*pool.length)];
    },
    challenge(cfg){ api._pendingChallenge = cfg; }
  };
  return api;
}

/* ---------------- 事件 ----------------
   事件有三层筛选（第 24 轮补上第三层）：

     ① once / when  —— 老规矩
     ② tier         —— 大境界分层：只抽「通用(0)」与「当前大境界」
     ③ **篇章分层**  —— 只抽「通用」与「当前篇章」的事件

   ③ 是第 24 轮补的。玩家反馈：「进入散修篇之后，接触到的事件大多还是
   宗门事件，散修篇的特色几乎没有体现」。实测确实如此 ——
   当时散修篇可抽的池子是 88 个事件，其中散修专属只有 6 个（6.8%），
   剩下 82 个是宗门事件，而且它们有 33% 的选项还在改「宗门气运/贡献」，
   人已经不在宗门了，那些数值却还在动。

   判定规则（向后兼容，不需要给 160 个事件逐个补字段）：
     · 显式写了 e.chapter        -> 按它判
     · 没写，但 cat 是「宗门」    -> 只在宗门篇出
     · 其余没写的                -> 通用，两个篇章都能出
                                                  */
function eventChapter(e){
  if (e.chapter) return e.chapter;
  if (e.cat === '宗门') return 'zongmen';
  return 'any';
}
/* 当前篇章能不能抽到这个事件 */
function chapterAllows(e, chapter){
  const ec = eventChapter(e);
  return ec === 'any' || ec === chapter;
}

/* ============================================================
   地理 · 远行（第 34 轮新增）
   ------------------------------------------------------------
   见 src/geography.js 的数据说明。这里只做四件事：
     ① 你现在在哪儿 / 哪些地方看得见
     ② 赶路要花多少寿元（公式是唯一真源，界面照抄）
     ③ 走过去（扣寿元、记来源、写记事）
     ④ 每个地方一次行动要额外付的环境代价

   ⚠️ 三处刻意的设计约束：
     · **赶路不额外扣「行动数」** —— 它自己就是一次行动。
       如果既扣行动又扣寿元，等于收两道税。
     · **环境代价只在「待在某个地方做事」时收**，赶路那一步不收
       （否则跨一次冰原要付两份钱）。环境代价挂在 doAction 上。
     · **门槛要在引擎层挡**（canTravelTo），不能靠界面藏按钮 ——
       这是第 27 轮秘境那条规矩，interface 不能是唯一的守卫。
   ============================================================ */
function currentPlace(){
  const p = G.placeById(s && s.place);
  return p || G.placeById('home');            // 老存档 / 脏数据都退回家
}
function isPlaceKnown(id){
  const p = G.placeById(id);
  if (!p) return false;
  if (p.kind === 'home') return true;
  if (p.hidden && !placeDiscovered(p)) return false;   // 神识不够 → 地图上根本不画
  return true;
}
/* 「发现」判定：神识门槛。血河宗这类藏起来的地方靠它。
   比例是相对同境界普通人（evPeer），所以任何境界都成立。 */
function placeDiscovered(p){
  if (!p.hidden) return true;
  const need = (p.gate && p.gate.shenshi) || 1;
  if (need <= 1) return true;
  return evAttr('shenshi') >= evPeer('shenshi') * need;
}
function canTravelTo(id){
  const p = G.placeById(id);
  if (!p) return { ok:false, msg:'没有这个地方' };
  if (s.place === id) return { ok:false, msg:'你已经在这儿了' };
  if (challenge && challenge.active) return { ok:false, msg:'架还没打完' };
  const maj = (G.REALMS[s.realmIdx] || { major:1 }).major;
  if (p.gate && p.gate.major && maj < p.gate.major)
    return { ok:false, msg:`境界不够（要到第 ${p.gate.major} 个大境界）` };
  if (p.hidden && !placeDiscovered(p))
    return { ok:false, msg:'你不知道有这么个地方' };
  const cost = travelCost(id);
  if (s.life - cost <= 0) return { ok:false, msg:`寿元不够（要 ${cost}，你还有 ${s.life}）` };
  return { ok:true, cost:cost };
}
/* 赶路消耗。
   ⚠️ 公式是唯一真源 —— 界面必须调用它来显示，不许自己算一遍
     （第 20 轮的教训：界面自己算 = 界面会说谎）。 */
function travelCost(id){
  const dist = G.travelDist(s.place, id);
  const base = actionCost();
  const units = Math.max(G.TRAVEL.minUnits, G.TRAVEL.minUnits + dist * G.TRAVEL.perGrid);
  const raw = base * units;
  /* 身法折扣：走得快的人少烧一点。封顶 −50%，不让它把距离抹平。 */
  const cut = Math.min(G.TRAVEL.shenfaCap, evAttr('shenfa') * G.TRAVEL.shenfaPer);
  return Math.max(base, Math.round(raw * (1 - cut)));
}
/* 环境代价：在这个地方做一次行动，额外扣多少寿元。
   返回 { amount, env, discount } —— 界面要显示「这里在耗你多少」。 */
function placeEnvCost(placeId){
  const p = placeId ? G.placeById(placeId) : currentPlace();
  if (!p || !p.env) return { amount:0, env:null, discount:0 };
  const e = G.PLACE_ENV[p.env];
  if (!e) return { amount:0, env:null, discount:0 };
  const discount = G.envDiscount(p.env, evAttr(e.resist));
  const amount = Math.max(0, Math.round(actionCost() * e.cost * (1 - discount)));
  return { amount:amount, env:p.env, discount:discount };
}
/* 走过去。返回 { ok, place, cost, first } */
function travelTo(id){
  const chk = canTravelTo(id);
  if (!chk.ok) return { ok:false, msg:chk.msg };
  const p = G.placeById(id);
  const from = currentPlace();
  const first = (s.visited || []).indexOf(id) < 0;

  s.actions++;                       // 赶路自己就是一次行动
  s.life -= chk.cost;
  s.travelFrom = from.id;
  s.place = id;
  if (!s.visited) s.visited = [];
  if (s.visited.indexOf(id) < 0) s.visited.push(id);
  /* 到了别处，宗门的日常事务暂时做不了 —— 这件事在 availableActions 里体现，
     不在这里扣任何隐藏数值（玩家不该被暗算）。 */
  log(`你走了 ${G.travelDist(from.id, id)} 天的路，到了${p.name}。`);
  if (first) note('place', `第一次到${p.name}。`);
  else note('place', `又回了一趟${p.name}。`);

  /* 到了就得看看路上有没有事 —— 交给界面 afterActionFlow 抽事件
     （它本来就在每次行动后跑，这里只需要一个标记说「这一步是赶路」）。 */
  s.travelled = true;

  if (s.life <= 0){
    const d = endRun('life');
    return { ok:true, place:p, cost:chk.cost, first:first, from:from.id, dead:d };
  }
  return { ok:true, place:p, cost:chk.cost, first:first, from:from.id };
}
/* 地图要画的那些点（含「看得见但进不去」的） */
function visiblePlaces(){
  return G.PLACES.filter(p => isPlaceKnown(p.id)).map(p => {
    const chk = canTravelTo(p.id);
    const reach = p.gate && p.gate.major
      ? ((G.REALMS[s.realmIdx] || {major:1}).major >= p.gate.major) : true;
    return {
      id:p.id, name:p.name, region:p.region, kind:p.kind, you:p.you,
      env:p.env, attrs:p.attrs || [], tianjiao:p.tianjiao || null,
      open: p.open !== false,
      openNote: p.openNote || '',
      here: s.place === p.id,
      visited: (s.visited || []).indexOf(p.id) >= 0,
      known: isPlaceKnown(p.id),
      reach: reach,                                  // 境界够不够
      can: !!chk.ok,                                 // 现在能不能走
      why: chk.msg || '',
      cost: (s.place === p.id) ? 0 : travelCost(p.id),
      dist: G.travelDist(s.place, p.id)
    };
  });
}

/* 「回响优先级」：哪些事件是某条因果的**兑现**。
   第 31 轮实测的问题：内容 336 个事件、可抽 291 个，
   而一局只抽得到 45~66 次事件 —— 于是「你当初那一步的回响」
   平均每局只出现 0.3 次。因果写了，玩家感觉不到，等于没写。

   所以给「已经埋下、还没兑现」的因果一个**优先抽中的机会**：
   每次抽事件时，先掷一次 CALLBACK_CHANCE，中了就只在
   「当前池子里、且是玩家已埋因果的兑现」这些事件里抽。
   pending 为空时（没埋因果 / 都兑现完了）老老实实退回普通池子，
   不会凭空造事件，也不会挤掉别的内容的手感。

   数值可以用 G.CALLBACK_CHANCE 覆盖（dev/dbg-callback.js 用它量对比表）。 */
function callbackChance(){
  return (typeof G.CALLBACK_CHANCE === 'number') ? G.CALLBACK_CHANCE : 0.34;
}
let _causeTargets = null;          // event id -> true，懒建一次
function causeTargets(){
  if (_causeTargets) return _causeTargets;
  _causeTargets = {};
  const C = G.CAUSE || {};
  Object.keys(C).forEach(function(f){ if (C[f] && C[f].event) _causeTargets[C[f].event] = true; });
  return _causeTargets;
}

/* 事件在大境界内的分段（第 32 轮新增，可选字段）。
   ------------------------------------------------------------
   玩家要求「每一个大境界有其对应的事件集」。tier 只做到「哪个大境界」，
   还想更细的话 —— 同一个大境界的前期和后期该是不同的事件 ——
   就给事件加一个可选的 stage。

   语义：
     · 不写 stage          → 全段可抽（244 个老事件一行都不用改）
     · stage = 1..N        → 只在第 N 段可抽
   段数：
     · 炼气 9 档（一层~九层）→ 按 3 档一组折成 3 段，够用且不用改表
     · 筑基起 4 档（前期/中期/后期/巅峰）→ 就是那 4 段，一一对应
   ⚠️ 段数是**算出来的**，不写死 —— 改境界表不会再让这个静默失准。 */
function stageOf(realm){
  if (!realm) return 1;
  const subs = (G.subsOfMajor ? G.subsOfMajor(realm.major) : 4) || 4;
  const sub = realm.sub || 1;
  if (subs <= 4) return Math.min(4, Math.max(1, sub));
  /* 9 档的炼气：3 档一段 → 1,2,3 / 4,5,6 / 7,8,9 */
  return Math.min(3, Math.floor((sub - 1) / 3) + 1);
}
function stageAllows(e, realm){
  if (e.stage == null) return true;
  const want = [].concat(e.stage);
  return want.indexOf(stageOf(realm)) >= 0;
}

/* 地域分层（第 34 轮）。见 pickEvent 里 ④ 的说明。
   travellingNow = 这一步是不是「刚赶完路」。 */
function placeAllows(e, placeId, travellingNow){
  if (!e.loc) return true;                       // 没写 = 基础事件，哪都能抽
  const want = [].concat(e.loc);
  if (want.indexOf(placeId) >= 0) return true;
  if (want.indexOf('*travel') >= 0 && travellingNow) return true;
  return false;
}

function pickEvent(){
  const myMajor = (G.REALMS[s.realmIdx] || {major:1}).major;
  const myChapter = s.chapter || 'zongmen';
  const myRealm = G.REALMS[s.realmIdx];
  const pool = G.EVENTS.filter(function(e){
    if (e.once && s.seenEvents.indexOf(e.id) >= 0) return false;
    if (e.when && !e.when(s)) return false;
    /* ② 大境界分层：只抽「通用(0)」与「当前大境界」的事件。
       这样筑基期就不会再碰到炼气期的事件。 */
    const et = e.tier || 0;
    if (et !== 0 && et !== myMajor) return false;
    /* ②b 段内分层（可选）：同一个大境界的前期/后期各是不同的事件集 */
    if (!stageAllows(e, myRealm)) return false;
    /* ③ 篇章分层：散修篇不再抽到宗门事件 */
    if (!chapterAllows(e, myChapter)) return false;
    /* ④ 地域分层（第 34 轮）—— 规则是**加法式**的：
          · 没写 loc  → 基础事件，在任何地方都能抽（370 个老事件一行都不用改）
          · 写了 loc  → 只在列出的那些地方能抽
        ⚠️ 刻意不做「写了 loc 就从别处排除」那种全局改写 ——
       那会让「在某地」变成「别处内容变少」，与「加内容」的初衷正好相反。
       特殊值 '*travel'：只在「刚赶完路」的那一步出现。 */
    if (!placeAllows(e, s.place, !!s.travelled)) return false;
    return true;
  });
  if (!pool.length) return null;

  /* ④ 回响优先：因果的兑现，比新内容更该被看见 */
  let pick = pool;
  if (s.rng() < callbackChance()){
    const tgt = causeTargets();
    const pending = pool.filter(function(e){ return tgt[e.id]; });
    if (pending.length) pick = pending;
  }

  /* ⑤ 串联优先：你的选择要**有下文**（第 32 轮新增）
     ------------------------------------------------------------
     第 31 轮只给 G.CAUSE 登记的 102 条因果开了优先档。但实测发现
     每个标记只被 1 个事件读取（扇出恒为 1），所以「这一档优先」最多
     只能把一条两点直线提前，串不成网。

     现在给**选择记录（deed）**同样开一档：抽事件时，只要池子里有
     「引用了你还挂着、而且还没被讲完的记录」的事件，就优先从它们里抽。
     于是 A→B→C 这种多步因果真的走得完，而不是靠运气。
     池子里没有这类事件时老老实实退回普通池子，不会凭空造事件。 */
  if (s.rng() < callbackChance()){
    const chained = pool.filter(function(e){
      const ds = eventDeeds(e);
      if (!ds.length) return false;
      return ds.some(function(id){ return deedPending(id, 4); });
    });
    if (chained.length) pick = chained;
  }

  const e = pick[Math.floor(s.rng()*pick.length)];
  s.seenEvents.push(e.id);
  /* 第 32 轮：记下这个事件见证过哪些选择记录。
     记完它就不再算「还没被讲完」，于是同一件事不会被同一批事件反复上演
     （配合 deeds:[...] 的显式声明，verify-linkage 能静态数出扇出）。 */
  markDeedSeen(e.id, eventDeeds(e));
  /* 第 31 轮：这一抽如果是某条因果的**兑现**，就写进记事。
     和 a.flag() 里那条「你做了这件事」配对 ——
     结算页上读起来就是：你当初种了一棵树 → 多年之后，它有了下文。
     （长期因果 debt 的那一句在 settleDebts 里，早就有了。） */
  if (causeTargets()[e.id]){
    const flag = causeFlagOf(e.id);
    const cz = flag && (G.CAUSE || {})[flag];
    if (cz && cz.label) note('choice', `「${cz.label}」有了下文。`);
  }
  return e;
}
/* 反向查：这个事件是哪条因果的兑现 */
let _causeFlagOf = null;
function causeFlagOf(eventId){
  if (!_causeFlagOf){
    _causeFlagOf = {};
    const C = G.CAUSE || {};
    Object.keys(C).forEach(function(f){
      const t = C[f] && C[f].event;
      if (t && !_causeFlagOf[t]) _causeFlagOf[t] = f;   // 一个事件只认第一条因果
    });
  }
  return _causeFlagOf[eventId] || null;
}

/* ---------------- Boss ----------------
   Boss 是特殊的「事件 + 挑战」组合：有前情文本、有多个非战斗选项，
   打赢/打输都有专属结算文本，并可能直接导向结局。                  */

/* 找出当前应该触发的 Boss（每次行动后检查）
   · 已经打完的 Boss 不再触发（靠各自的 _done 标记）
   · 正在进行的挑战期间不触发
   · 同一个 Boss 在同一次遭遇里不会被重复抓取（_bossActive 标记） */
function pickBoss(){
  if (!s || s.ended) return null;
  if (challenge && challenge.active) return null;
  const list = Object.keys(G.BOSSES).map(k=>G.BOSSES[k]);
  for (const b of list){
    let hit = false;
    try { hit = !!b.trigger(s); } catch(e){ hit = false; }
    if (hit){
      // 防止界面在处理过程中重复触发同一个 Boss
      if (s._bossActive === b.id) return null;
      return b;
    }
  }
  return null;
}

/* 界面在真正展示 Boss 之后调用，锁住这个 Boss 直到遭遇结束 */
function markBossActive(id){
  if (s) s._bossActive = id;
}
function clearBossActive(){
  if (s) s._bossActive = null;
}

/* ---------------- 六维属性 ----------------
   属性 = 初始值（抽签） + 境界成长 + 功法/法宝机缘
   它是战斗、修行、转盘的共同地基。                                  */
function attrBase(){
  if (!s) return {};
  const seed = (s.lots && s.lots.bonus && s.lots.bonus.attrs) || {};
  const base = {};
  G.ATTRS.forEach(a=>{ base[a.id] = (seed[a.id]||0); });
  return base;
}

function attrs(){
  if (!s) return {};
  const out = {};
  G.ATTRS.forEach(a=>{ out[a.id] = 0; });

  // ① 抽签初始
  const seed = (s.lots && s.lots.bonus && s.lots.bonus.attrs) || {};
  G.ATTRS.forEach(a=>{ out[a.id] += (seed[a.id]||0); });

  /* ② 境界成长（境界越高，加成越大）
     ⚠️ 第 25 轮：根骨从「每次突破多算一行属性表」改成「属性点 ×（1+8%/级）」。
     旧写法有个致命上限：属性表只有 72 行，点满 10 级之后 7 次突破就吃光了，
     之后一辈子拿不到境界属性 —— 前 7 层是神，往后是零。 */
  const gained = s.attrGain || 0;
  const agMul = 1 + attrGainBonus();
  const realmAttr = {};
  G.ATTRS.forEach(a=>{ realmAttr[a.id] = 0; });
  for (let i=0;i<gained && i<G.REALM_ATTR_GAIN.length;i++){
    const g = G.REALM_ATTR_GAIN[i];
    G.ATTRS.forEach(a=>{ realmAttr[a.id] += (g[a.id]||0); });
  }
  G.ATTRS.forEach(a=>{ out[a.id] += Math.round(realmAttr[a.id] * agMul); });

  // ③ 机缘（事件 / 功法 / 法宝 / 散修技艺）
  const bonus = s.attrBonus || {};
  G.ATTRS.forEach(a=>{ out[a.id] += (bonus[a.id]||0); });

  /* ③.5 内景（第 26 轮）：六维各加同一个数。
     ⚠️ 它和「根骨」是两回事，别混：
       根骨 乘的是**境界成长**那一项（乘法），内景是**另加一份**（加法）。
     所以根骨练满不会把内景也放大 —— 这是有意的，
     否则「全属性 +300」会被根骨再乘 1.3，两个系统互相放大就没人算得清了。 */
  const dj = daoJiPerAttr();
  if (dj > 0) G.ATTRS.forEach(a=>{ out[a.id] += dj; });

  // ④ 功法与法宝的常驻加成
  if (s.deck){
    s.deck.forEach(name=>{
      const c = G.CARDS[name];
      if (!c || !c.eff) return;
      if (c.eff.attr){
        Object.keys(c.eff.attr).forEach(k=>{ out[k] = (out[k]||0) + c.eff.attr[k]; });
      }
    });
  }

  // ⑤ 宗门气运加持（第 15 轮新增）——气运不只是数字，它直接加持你
  if (s.chapter === 'zongmen'){
    const bless = sectBlessing();
    G.ATTRS.forEach(a=>{ out[a.id] += bless.attr; });
  }

  return out;
}

/* ---------------- 宗门气运加持 ----------------
   玩家反馈「宗门存在感太低」——所以让气运**直接变成属性**：
   气运充盈你更强，气运将尽你还会被拖累。                        */
function sectTier(){
  const qi = (s && s.sectQi) || 0;
  let cur = G.SECT_TIERS[G.SECT_TIERS.length-1];
  for (const t of G.SECT_TIERS){ if (qi >= t.min){ cur = t; break; } }
  return cur;
}
function sectBlessing(){
  const t = sectTier();
  return { tier:t, attr:t.attr, cult:t.cult, salary:t.salary };
}

/* ---------------- 战斗派生数值 ----------------
   调参要点（踩过两次坑，务必读完再改）：
     ① 境界只给温和的线性乘数。最初让「境界 × 属性」都乘算攻击力，
        结果是二次增长，炼气五层就能一回合秒杀。
     ② 玩家伤害在炼气期约长 7.5 倍，所以敌人 HP 必须同步成长，
        否则高境界「一击秒杀」，玩家根本感觉不到战斗。
     ③ 最终目标：**每个境界的战斗都稳定在 8~14 回合**，
        而且玩家越往后越轻松（成长有体感，但不是无脑碾压）。
     ④ ⚠️ 第 20 轮补上：以前这里**只读 attrs() 和 meta.up**，
        完全没读 agg()。于是「卡牌的常驻战力 / 护体」是空头支票——
        牌组界面把它们算进「常驻战力」，战斗里一分钱不算（33 张卡受影响）。
        现在接上了，但**刻意做成乘算加成而不是平加**：
        因为战力是随境界线性涨的，敌人 HP 是随境界指数涨的，
        平加会让战力在后期变成噪音；乘算才能让「吃卡」在任何境界都有体感。 */
function combatStats(){
  const A = attrs();
  const realmMul = 1 + s.realmIdx * 0.16;
  const attrSum = G.ATTRS.reduce((n,a)=>n + (A[a.id]||0), 0);
  /* ⚠️ 第 33 轮：这里原来直接读 `meta.up` —— 那就是「局内降级当场变弱」的来源。
     实测：正在打的一局里降两级「攻伐」，当场普攻 25 → 23。
     而界面在降级确认层里承诺的是「已经打完的局不受影响，改动从下一局生效」。
     现在用一个**取值代理**：下面几十处 up.xxx 一行都不用改，
     但读到的永远是本局快照（s.upSnap），于是那句承诺是真的。 */
  const up = { get qiRegen(){ return upLevel('qiRegen'); },
               get atkBase(){ return upLevel('atkBase'); },
               get techBase(){ return upLevel('techBase'); },
               get hpBase(){ return upLevel('hpBase'); },
               get qiBase(){ return upLevel('qiBase'); },
               get crit(){ return upLevel('crit'); },
               get evade(){ return upLevel('evade'); },
               get wardBase(){ return upLevel('wardBase'); } };
  const ag = agg();

  /* 卡牌的常驻战力 → 伤害乘数（最高 ×2）。
     为什么是乘算而不是平加：战力随境界线性涨，敌人 HP 随境界指数涨，
     平加会让「吃卡」在后期变成噪音；乘算才能让每一张卡在任何境界都有体感。
     又为什么要封顶：不然堆满卡就是无敌，而「永远差一点点」才是本作的紧张感来源。 */
  const powerMul = 1 + Math.min(1.0, (ag.power || 0) * 0.005);
  /* 套装「剑冢遗风」：招式伤害 +50%。以前收集了却没人用。 */
  const techMul = 1 + (ag.techMul || 0);

  /* ---- 元层「战法」升级：第 25 轮全部改为**百分比** ----
     ⚠️ 旧版是平加（+2 普攻/级、+12 气血/级…），而基础值随境界指数涨，
     于是同一级在炼气期值 +25%、在金丹期值 +3% —— 后期买满了也没体感。
     现在统一乘在**算完境界与卡牌之后**的结果上，任何境界都值同样多。

     各档的每级百分比写在 G.UPGRADES 里（chars.js），这里必须同步：
       atkBase  3%/级 ×20  = +60% 普攻
       techBase 3%/级 ×20  = +60% 招式
       hpBase   3%/级 ×20  = +60% 气血
       qiBase   4%/级 ×15  = +60% 真气
       wardBase 6%/级 ×10  = +60% 护体
     ⚠️ 改 G.UPGRADES 的 val/fmt 时**务必**回来改这里的系数，
     否则界面承诺的「+3%」和战斗里实际吃的就不是一回事。 */
  const pct = (id, per) => 1 + (up[id] || 0) * per;

  /* ---- 丹药的战斗加成（第 25 轮） ----
     pillPerm：「永久战斗丹」在本局内累加，下一局归零。
     pillTemp：「限时战斗丹」，只在剩余场次 > 0 时生效。
     两者都乘在**算完境界、卡牌、元层之后**的结果上，
     所以「+6% 伤害」在任何境界都是 +6%。 */
  const perm = s.pillPerm || {};
  const temp = (s.pillTemp && s.pillTemp.fights > 0) ? s.pillTemp : {};
  /* 第 29 轮：劫余也进伤害/气血/真气/护体，和永久丹同一层乘算
     （都在算完境界、卡牌、元层之后，所以「+12%」在任何境界都是 +12%）。 */
  const boon = s.boons || {};
  const dmgBonus = (perm.atkPct || 0) + (boon.atkPct || 0) + (temp.atkPct || 0);

  const hpMulSet = 1 + (ag.hpMul || 0);   // 卡牌与套装「不坏之身」的气血加成
  const maxHp = Math.round((46 + A.tipo*7 + A.gengu*3) * realmMul * hpMulSet
                           * pct('hpBase', 0.03) * (1 + (perm.hpPct || 0) + (boon.hpPct || 0)));
  const maxQi = Math.round((24 + A.gengu*4 + A.lingli*1.5) * pct('qiBase', 0.04)
                           * (1 + (perm.qiPct || 0) + (boon.qiPct || 0)));
  const qiRegen = Math.max(3, Math.round(5 + A.gengu*1.1)) + (up.qiRegen||0);
  // 普通攻击：由属性总和驱动 × 卡牌战力，不限次数的可靠输出
  const basicAtk = Math.max(3, Math.round((4 + attrSum*0.20) * realmMul * powerMul * pct('atkBase', 0.03) * (1 + dmgBonus)));
  const techPower = Math.round(Math.max(5, Math.round((6 + attrSum*0.30) * realmMul * powerMul)) * techMul * pct('techBase', 0.03) * (1 + dmgBonus));
  /* 重击与闪避：**软上限**（第 34 轮改）
     ------------------------------------------------------------
     玩家反馈：「很多数值是无效的，例如神识，游戏中似乎没有任何地方
     能体现出这些属性的作用」。

     实测确认了这件事，但原因和「没用」不太一样：
     六项都通过 attrSum 影响普攻与招式，所以任何一项都不是死的；
     问题是**溢出的那部分白拿**：
       · 一局能拿到的神识上限约 133 点，而 `3% + 神识×1%` 在 57 点就顶到 60% ——
         后面的 76 点在战斗里毫无作用
       · 身法同理：一局 135 点，`身法×1%` 在 38 点就顶到 38% 的闪避上限 ——
         后面 97 点白拿

     所以改成「先线性、后衰减、上限抬高」：
       前 rampAt 点之内仍然是一点换一个百分点（**手感不变**，
       这是刻意保住的：改数值最先坏掉的就是手感），
       超过之后按 half 为半衰距离指数逼近 cap。

     ⚠️ 这里我连着写错了三次，三次错法都值得记下来 ——
       它们全都是「软上限退化成硬上限」，而且**看起来都对**：
       ① cap=0.87, half=0.40：`rampAt×per + half` = 0.57+0.40 = 0.97 > 0.87
          → 在 rampAt 那一点就撞顶。
       ② cap=0.80, half=0.60：0.57+0.60 = 1.17 > 0.80 → 又在 57 点撞顶。
       ③ cap=1.0, half=0.45：指数段终于展开了，但**外层还有一道硬上限**
          （`Math.min(0.90, …)`），而曲线渐近到 1.0 > 0.90 ——
          于是玩家在 57 点就顶到那个 0.90，后面还是白拿。
       三次的共同根因：**渐近值没有对齐真正想要的天花板**。
       正确做法是让内层曲线直接渐近到「上限减去基础值」，
       这样外层那道 min 永远不会被触发，曲线在整局里都在涨。
       现在：重击 = 3% + 0.87×(1−e^−…)（渐近 90%，**永远差一点点**），
             闪避 = 0.55×(1−e^−…)（渐近 55%）。
       前 rampAt 点仍然一点换一个百分点，手感不变。
       渐近值必须离硬顶留出可见的余量（这里留 0.87 / 0.55 而不是 0.90 / 0.55），
       否则浮点误差会让它正好落在硬顶上，测试里就能看到「不再增长」。
     dev/verify-attrvalue.js 会断言「一局上限处仍在涨」。 */
  const soft = (attrValue, per, rampAt, asymptote) => {
    const v = Math.max(0, attrValue || 0);
    if (v <= rampAt) return v * per;
    const y0 = rampAt * per;
    /* ⚠️ 指数必须**减去 1**：写成 `asym − (asym−y0)·e^(−over/t)` 在 over=0 处
       会得到 asym 而不是 y0 —— 于是 rampAt 那一点会突然跳一大截，
       曲线出现一个台阶，而且台阶前后会**下降**（这一段被
       dev/verify-attrvalue.js 的单调性检查当场抓到）。
       正确写法是 `y0 + (asym−y0)·(1 − e^(−over/t))`，
       它在 over=0 处正好等于 y0，是连续的。 */
    const t = 50;
    return y0 + (asymptote - y0) * (1 - Math.exp(-(v - rampAt) / t));
  };
  const critChance = 0.03 + soft(A.shenshi, 0.010, 57, 0.87)
                          + (up.crit||0)*0.02 + (ag.critSet||0);
  const evade = soft(A.shenfa, 0.010, 38, 0.55)
                     + (up.evade||0)*0.015 + (temp.evade || 0);
  /* 常驻护体：卡牌的 ward 第一次真的有用。
     转换成百分比减伤（上限 35%），而不是直接减去伤害点——
     因为敌人攻击是随境界指数涨的，平减会在后期变成零。 */
  const wardGuard = Math.min(0.35, (ag.ward || 0) * 0.0009);
  /* 基础护体（招式护体的基数）。套装「符阵相生」每轮额外给一层。 */
  const ward = Math.round(realmMul * 3 * pct('wardBase', 0.06)
                          * (1 + (perm.wardPct || 0) + (boon.wardPct || 0))) + (ag.wardPerRound || 0);
  /* 受到的伤害乘数：套装「不坏之身」的 −20%、限时丹的减伤都走这里 */
  const dmgTakenMul = clamp(((ag.dmgTakenSet || 0) ? 1 + ag.dmgTakenSet : 1) * (1 - (temp.dmgCut || 0)), 0.4, 1.5);

  return { attrs:A, attrSum, maxHp, maxQi, qiRegen, basicAtk, techPower,
           critChance, evade, ward, realmMul, powerMul, techMul, wardGuard, dmgTakenMul,
           cardPower: ag.power || 0, cardWard: ag.ward || 0,
           pillPerm: perm, pillTemp: temp, dmgBonus: dmgBonus };
}
/* ---------------- 大境界跨越（第 17 轮） ----------------
   以前「筑基」是结局；现在它只是九个大境界里的第二个。
   所以渡雷池改成「开闸」：赢了就真的进入筑基，游戏继续。        */
function advanceMajor(){
  const cur = G.REALMS[s.realmIdx];
  const next = G.REALMS[s.realmIdx+1];
  if (!next || next.major !== cur.major + 1) return null;

  const oldMajor = cur.major;
  s.cult = Math.max(0, s.cult - breakNeed());
  s.realmIdx++;
  s.attrGain = Math.min(G.REALM_ATTR_GAIN.length, (s.attrGain||0) + 1);
  s.restUsed = 0;
  s.nourishUsed = 0;
  /* 第 26 轮：这一条路径（打赢结丹天劫）同样要蜕变内景。
     漏掉它就会出现「已经是金丹了，内景还叫气海」的错位。 */
  const djShift = syncDaoJi();

  const oldMax = s.maxLife;
  const consti = G.CONSTITUTIONS.find(function(c){ return c.id===s.constId; });
  s.maxLife = Math.round(next.maxLife * (1 + lifeCapBonus()) * consti.lifeMul);
  s.life += Math.max(0, s.maxLife - oldMax) + Math.round(next.maxLife * 0.08);

  log('你跨过了一个大境界：' + next.name + '。寿元上限 ' + s.maxLife + '。');
  note('realm', `跨进${next.name}。（寿元上限 ${s.maxLife}）`);

  const md = G.MAJOR_DEFS[next.major-1];
  return { from: oldMajor, to: next.major, realm: next.name,
           majorName: md ? md.name : '?', desc: next.desc, maxLife: s.maxLife,
           daoJi: djShift };
}

/* ---------------- 挑战（战斗 / 天劫共用） ----------------
   新模型：双方都有 HP，轮流行动，谁先见底谁输。
   · 普通攻击：不限次、不耗真气
   · 招式：耗真气 + 冷却，但威力大得多
   · 敌人每轮都会反击
   · 失败不再直接死，而是进入「转盘」决定后果

   ⚠️ 第 22 轮：挑战必须能被**存档**。
   以前 cfg 里塞的是 win/lose 两个**函数**，JSON 序列化不了，
   于是 saveRun() 只能把整场战斗丢掉 ——
   玩家打到一半关掉页面，重开后战斗凭空消失（审计脚本第 3 项）。
   现在额外支持一套**数据化战果** `outcome`：

     outcome: { win:{cult:90, stone:70, flag:'x'}, lose:{life:-30} }

   纯数据 → 可以原样写进存档 → 读回来还能结算。
   原来的函数形式仍然支持（向后兼容），但新写的内容一律用 outcome。 */

/* 把一份数据化战果施加到局内状态上。字段与事件的 actions API 一一对应。 */
function applyOutcome(o){
  if (!o) return;
  if (typeof o === 'function'){ try{ o(); }catch(e){} return; }
  if (typeof o !== 'object') return;
  const pct = (v) => Math.round((s.maxLife || 100) * v);
  if (o.cult != null)  gainCult(evGain(o.cult, o.tier));
  /* 按当前修为的**比例**扣（第 28 轮）。
     天劫打输时「气散了一半」需要这个 —— 固定点数在不同境界没有意义。 */
  if (o.cultPct != null){
    const lost = Math.round((s.cult || 0) * Math.abs(o.cultPct));
    s.cult = Math.max(0, (s.cult || 0) - lost);
  }
  if (o.stone != null) gainStone(o.stone);
  if (o.karma != null) gainKarma(o.karma);
  if (o.favor != null) gainFavor(o.favor);
  if (o.sectQi != null) gainSectQi(o.sectQi);
  /* life 正数 = 固定值，0~1 之间的小数 = 寿元上限的百分比（与事件一致） */
  if (o.life != null) gainLife(o.life > 0 ? o.life : -pct(-o.life));
  if (o.lifePct != null) gainLife(o.lifePct > 0 ? pct(o.lifePct) : -pct(-o.lifePct));
  if (o.contrib != null) gainContrib(o.contrib);
  if (o.clue) [].concat(o.clue).forEach(c=>addClue(c));
  /* ⚠️ 第 32 轮：这里以前是直接 push s.flags —— 不记 flagAt。
     于是所有「只有打赢才拿得到」的标记（won_duel / seat_won / other_won /
     mj_*_win …）在 flagAge() 眼里永远返回 -1，
     它们那些 `flagAge(...) >= N` 的下游回响事件整条链都是死的。
     现在统一走 raiseFlag（note:false —— 打架赢来的不算「你做的选择」，
     写进记事会把那一栏淹掉）。 */
  if (o.flag) [].concat(o.flag).forEach(f=>raiseFlag(f, { note:false }));
  if (o.card) [].concat(o.card).forEach(c=>addCard(c));
}

/* 挑战里的 cfg 只保留「能存进 JSON」的部分。
   函数（win/lose）与大的 stats 对象剔除掉 —— stats 在读档时会重算。 */
function serializableChallenge(){
  if (!challenge || !challenge.active) return null;
  const c = Object.assign({}, challenge, { cfg: null, stats: null });
  const cfg = {};
  Object.keys(challenge.cfg || {}).forEach(function(k){
    const v = challenge.cfg[k];
    if (typeof v === 'function') return;             // 回调不能存
    try{ JSON.stringify(v); cfg[k] = v; }catch(e){}
  });
  c.cfg = cfg;
  return c;
}
function startChallenge(cfg){
  const cs = combatStats();
  const tierKey = cfg.tier || 'normal';
  const tier = G.ENEMY_TIERS[tierKey] || G.ENEMY_TIERS.normal;
  const T = G.TUNE;

  /* 难度阶梯 × 手动微调（兼容旧的 power 参数，当作 ±% 微调）
     ⚠️ 第 25 轮：阶梯现在可以给「血」「攻」各自的倍率（天劫需要）。
     给了 hpMul/atkMul 就**取代** mul，不是再乘一层 ——
     否则天劫会吃两次倍率（实测血条 ×3.9 而不是 ×1.5，一场打 32 回合）。
     mul 仍然保留，用于奖励缩放与显示。 */
  const manual = (cfg.power || 0) / 100;
  const hpScale  = (tier.hpMul  != null ? tier.hpMul  : tier.mul) * (1 + manual);
  const atkScale = (tier.atkMul != null ? tier.atkMul : tier.mul) * (1 + manual);

  /* 敌人强度 = 一条曲线（G.foePowerAt）× 难度阶梯 × 手动微调
     ⚠️ 第 21 轮重做。旧公式是
          foeBase(×2.4/大境界) × (1 + 境界序数 × 0.72)
        那个 0.72 的线性项其实承担了绝大部分成长（到大乘时贡献 ×52），
        而它是在属性表还只有 41 个值时调的；属性表扩到 72 个值之后，
        同一个大境界内玩家涨 6 倍、敌人只涨 1.3 倍 → 中期开始一路横扫。
     现在敌人只跟着**一条**曲线走：G.foePowerAt()，它由玩家自己的
     伤害公式镜像而来（见 realms.js 的说明），两边永远不会脱节。   */
  const power = (typeof G.foePowerAt === 'function') ? G.foePowerAt(s.realmIdx) : 1;
  const hpCurve  = 1 + (power - 1) * (T.curveHp  != null ? T.curveHp  : 1.0);
  const atkCurve = 1 + (power - 1) * (T.curveAtk != null ? T.curveAtk : 1.0);

  /* 阶梯可以给「血」「攻」各自的倍率（第 25 轮，天劫需要）。
     不写就沿用 mul —— 也就是「整档一起变强」，那是绝大多数阶梯的语义。
     hpScale / atkScale 已经在上面算好（含 ±% 微调）。 */

  /* 天骄：在同境界「凶物」的基础上再乘一层倍率（第 22 轮）。
     玩家要求「除非数值远超同境界，否则不可能战胜」——
     所以这不是强一点，是量级上的差距（气血 ×5.2 / 攻击 ×2.9）。
     ⚠️ 第 34 轮：倍率可以**按大境界分级**（G.TIANJIAO_MUL_BY_MAJOR）。
     起因是把重击/闪避的硬上限换成软上限之后，堆满数值的玩家在元婴段
     变成 100% 稳赢，而「最高那一段要留一点威慑」是定过的设计约束。
     见 chars.js 里 G.TIANJIAO_MUL_BY_MAJOR 的说明。 */
  let TJ = { hp:1, atk:1 };
  if (cfg.tianjiao){
    const majNow = (G.REALMS[s.realmIdx] || { major:1 }).major;
    TJ = (G.TIANJIAO_MUL_BY_MAJOR && G.TIANJIAO_MUL_BY_MAJOR[majNow])
       || G.TIANJIAO_MUL || { hp:1, atk:1 };
  }

  const foeHpMax = Math.round(G.foeHpBase * hpCurve * hpScale * TJ.hp);
  const foeAtk = Math.round(G.foeAtkBase * atkCurve * 0.9 * atkScale * TJ.atk);

  challenge = {
    active: true,
    cfg: cfg,
    type: cfg.type || 'fight',
    killer: !!cfg.killer,
    bossId: cfg.bossId || null,
    /* 第 29 轮：天劫的名字（雷劫/风劫/火劫）要留在 challenge 上，
       战果结算要用它去查「这一劫留了什么劫余」。 */
    tbName: cfg.tbName || null,
    tier: tierKey,

    round: 1,
    maxRounds: cfg.rounds || 40,

    // 敌方
    foeName: cfg.name || '对手',
    foeHp: foeHpMax,
    foeHpMax: foeHpMax,
    foeAtk: foeAtk,
    foeMajor: cfg.major || null,        // 敌人的大境界（不填则按 tier 推断）
    foeTierLabel: tier.label,

    // 我方（战斗内临时状态，战斗结束即丢弃）
    hp: cs.maxHp,
    hpMax: cs.maxHp,
    qi: cs.maxQi,
    qiMax: cs.maxQi,
    qiRegen: cs.qiRegen,
    stats: null,            // 读档时重算；新建时在下面填

    cooldowns: {},          // { 招式名: 剩余回合 }
    buffs: { evade:0, dmgMul:1, ward:0 },

    over: false,
    result: null,
    logLines: [],

    /* 本场战斗属于哪个「赛事 / 榜单」场景（第 22 轮）。
       tourney: { bracket, round, total }  —— 比武大会第几轮
       tianjiao: 'id'                      —— 天骄榜上是谁
       这两个都要能存档，所以是纯数据。 */
    tourney: cfg.tourney || null,
    tianjiaoId: cfg.tianjiaoId || null,
    isTianjiao: !!cfg.tianjiao,
    /* 数据化战果（可存档） */
    outcome: cfg.outcome || null
  };
  challenge.stats = cs;
  return challenge;
}

/* 战斗中吃了「永久 / 限时战斗丹」之后，把战斗内的数值重算一次。
   ⚠️ 不重算的话，玩家在战斗里吃下淬体丹会看到「气血上限 +6%」的提示，
   但血条一动不动 —— 那是界面在撒谎（第 25 轮踩过）。
   做法是按**比例**缩放当前值，这样「还剩几成血」不会因为重算而跳变。 */
function refreshChallengeStats(){
  const ch = challenge;
  if (!ch || !ch.active) return null;
  const before = ch.stats || {};
  const after = combatStats();
  const scale = (oldMax, newMax, cur) =>
    newMax === oldMax ? cur : Math.max(0, Math.min(newMax, Math.round(cur * newMax / (oldMax || 1))));

  ch.hpMax = scale(before.maxHp, after.maxHp, ch.hpMax);
  ch.hp    = Math.min(ch.hpMax, scale(before.maxHp, after.maxHp, ch.hp));
  ch.qiMax = scale(before.maxQi, after.maxQi, ch.qiMax);
  ch.qi    = Math.min(ch.qiMax, scale(before.maxQi, after.maxQi, ch.qi));
  ch.qiRegen = after.qiRegen;
  ch.stats = after;
  return after;
}

/* ---------------- 敌人境界显示 ----------------
   把敌人的强度换算成「境界」，超过玩家太多就显示「境界未知」。
   这样玩家能一眼看出：这场我该不该打。                          */
function foeRealmInfo(){
  const ch = challenge;
  if (!ch) return { label:'?', known:false, compare:'' };
  const myIdx = s.realmIdx;
  const t = G.ENEMY_TIERS[ch.tier] || G.ENEMY_TIERS.normal;
