function sanxiuActions(){
  return Object.keys(SANXIU_ACTS).map(function(k){
    return {
      id: 'sx_' + k,
      name: SANXIU_ACTS[k].name,
      cost: SANXIU_ACTS[k].cost,
      desc: SANXIU_ACTS[k].desc,
      lv: skillLv(k),
      meta: '技艺 ' + skillLv(k) + ' 级　收益 ×' + skillMul(k).toFixed(2)
    };
  });
}

function doSanxiuAction(kind){
  const act = SANXIU_ACTS[kind];
  if (!act) return null;
  const d = sx();
  const hb = homeBonus();
  s._sxNote = null;
  /* 散修活动只花「这件事本身的功夫」，不再按境界收时间税——
     这是「休闲」的数值保障：在放松的时候不该还在赔命。
     想要寿元上限与境界，仍然得去修行/突破。 */
  const cost = Math.max(1, act.cost - Math.floor(homeLv('lingxi')/2));
  s.life -= cost;
  s.actions++;
  d.days++;

  const msg = act.run();

  /* 洞府持续产出：每次行动都结算 */
  if (hb.herb > 0){ d.herbStock += hb.herb; d.herbs += hb.herb; }
  /* ⚠️ 关键限制：洞府回复不能让散修「永动」。
     回复量硬性封顶在活动消耗以内，保证寿元依然是硬约束——
     否则散修篇会变成无限循环，故事永远结束不了。 */
  const cap = cost + 1 + Math.floor(homeLv('lingxi')/2);
  if (hb.lifePerAction > 0) gainLife(Math.min(hb.lifePerAction, cap));

  /* 丹炉自动炼丹 */
  if (homeLv('danlu') > 0){
    d.pillTick++;
    if (d.pillTick >= Math.max(3, 8 - homeLv('danlu'))){
      d.pillTick = 0;
      const pool = Object.keys(G.CARDS).filter(function(k){ return G.CARDS[k].type==='丹药'; });
      const pick = pool[Math.floor(s.rng()*pool.length)];
      addCard(pick);
      s._sxNote = '丹炉炼成了【' + pick + '】';
    }
  }

  const goals = checkSanxiuGoals();

  /* 活满四季（一年）→ 这一世就有了一个完整的交代。
     散修篇不该拖到寿元耗尽才结束，那样太冷。 */
  if (d.days >= 24 && !s.ended){
    return { ok:true, cost:cost, msg:msg, cards:s._pendingCards||null,
             kind:kind, goals:goals, note:s._sxNote||null,
             season:season().name, end:sanxiuYearEnd() };
  }

  const dead = checkDeath();
  return { ok:true, cost:cost, msg:msg, dead:dead,
           cards:s._pendingCards||null, kind:kind,
           goals:goals, note:s._sxNote||null, season:season().name };
}

/* 散修一年期满：给一个温暖的收束 */
function sanxiuYearEnd(){
  return endRun('sanxiu');
}
/* ---------------- 局内存档（第 17 轮） ----------------
   玩家要求：一局可以硬跑到渡劫，但**中途关掉浏览器不能丢进度**。
   方案：每次行动后自动存档到 localStorage；下次打开可直接继续。
   注意：rng 是函数，不能序列化——恢复时用种子重建。              */
const RUN_KEY = 'jiyi_xiufu_ju_run_v1';

/* 存档失败的最近一次原因（给界面提示用）。
   第 21 轮新增：以前 saveRun/saveMeta 都是「try 一下，失败就算了」，
   玩家的进度**静默消失**却什么提示都没有——
   无痕模式、浏览器禁用存储、配额满，都会走到这条路。
   静默丢档是最伤玩家信任的一类问题，所以这里把失败记下来并报给界面。 */
let _saveError = null;
function saveError(){ return _saveError; }
function clearSaveError(){ _saveError = null; }

/* localStorage 到底能不能用？（无痕模式 / 禁用 Cookie 时会抛错） */
function storageAvailable(){
  try{
    const k = '__jiyi_probe__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}

function saveRun(){
  if (!s || s.ended) return false;
  try{
    const copy = {};
    Object.keys(s).forEach(k=>{ if (k !== 'rng') copy[k] = s[k]; });
    copy.__savedAt = Date.now();
    /* ⚠️ 第 22 轮：把「正在进行的战斗」一起存下来。
       以前只存 s，于是玩家打到一半关掉页面，重开后战斗凭空消失，
       而战斗之前的行动已经被扣掉了 —— 净亏损。
       现在把挑战的机械状态一并写盘（stats 与 win/lose 回调会被剔除，
       读档时重算 / 用数据化战果替代）。 */
    copy.__challenge = serializableChallenge();
    localStorage.setItem(RUN_KEY, JSON.stringify(copy));
    _saveError = null;
    return true;
  }catch(e){
    _saveError = { where:'局内', msg:(e && e.message) || '写不进去' };
    return false;
  }
}

function hasSavedRun(){
  try{
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.deck) return null;
    /* 已经结束的局不算「可继续的存档」（第 21 轮加的两道防线之一） */
    if (d.ended) return null;
    // 用存档里的行动步数做扰动，让恢复后的随机数不会完全重复
    return { realm: (G.REALMS[d.realmIdx]||{}).name || '?',
             chapter: d.chapter, actions: d.actions||0,
             life: d.life, maxLife: d.maxLife,
             inBattle: !!d.__challenge,          // 存档时正在战斗中？
             savedAt: d.__savedAt };
  }catch(e){ return null; }
}

function loadRun(){
  try{
    const raw = localStorage.getItem(RUN_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.deck) return null;
    if (d.ended) return null;          // 打完的局不允许读回来（第 21 轮）
    delete d.__savedAt;
    const savedChallenge = d.__challenge || null;
    delete d.__challenge;
    d.rng = makeRng((d.seed||'x') + '#' + (d.actions||0));
    s = d;
    challenge = null;
    /* 把没打完的那场战斗接回来。
       stats 不存盘（它由 attrs/agg 派生），这里按当前局面重算，
       所以读档后的战斗数值永远和当前 build 一致。 */
    if (savedChallenge && savedChallenge.active){
      savedChallenge.stats = combatStats();
      /* 一个「被打断过」的标记：界面会告诉玩家那场战斗还没打完 */
      savedChallenge.interrupted = true;
      challenge = savedChallenge;
    }
    return s;
  }catch(e){ return null; }
}

function clearRun(){
  try{ localStorage.removeItem(RUN_KEY); }catch(e){}
}

/* ---------------- 线索 ---------------- */
function addClue(id){
  if (!s.clues.includes(id)) s.clues.push(id);
}

/* ============================================================
   比武大会（第 22 轮）
   ------------------------------------------------------------
   · 按大境界分赛道，门槛是该大境界的第 5 层
   · 每 G.TOURNEY.period 次行动开一次
   · 一局内每条赛道只能打一次（记在 s.tourneyDone）
   · 输一场淘汰，但**不会死**（比武不是生死斗）
   ============================================================ */

/* 当前玩家能报名的赛道（未打过、境界够、身体撑得住） */
function tourneyBracket(){
  if (!s || s.chapter !== 'zongmen' || s.ended) return null;
  const cur = G.REALMS[s.realmIdx];
  if (!cur) return null;
  /* 第 22 轮：身上太虚的时候不发请帖。
     理由有两个 ——
       ① 设计上：宗门不会把一个只剩半条命的人推上台（那叫送死，不叫比武）
       ② 体感上：比武要连打 4 场，如果请帖在你寿元见底时弹出来，
          玩家会陷入「为了比武把自己耗死」的陷阱。这是设计的锅，不该怪玩家。
     低于这个比例时请帖**推迟**（不是作废）—— 下一次窗口还会来。 */
  const lifeRatio = (s.maxLife > 0) ? s.life / s.maxLife : 1;
  if (lifeRatio < 0.45) return null;
  const done = s.tourneyDone || [];
  for (const b of G.TOURNEY_BRACKETS){
    /* 只报「自己当前大境界」的赛道 —— 赛道按境界划分，不越级 */
    if (b.major !== cur.major) continue;
    if (done.indexOf(b.id) >= 0) continue;
    /* 门槛：该大境界的第 needSub 层 */
    if ((cur.sub || 0) < b.needSub) continue;
    return b;
  }
  return null;
}

/* 现在是不是「比武大会开了」？界面在每个行动后问一次 */
function tourneyReady(){
  if (!tourneyBracket()) return null;
  if ((s.actions || 0) < G.TOURNEY.firstAt) return null;
  const period = G.TOURNEY.period || 28;
  /* 每 period 次行动开一次：落在窗口里就算「正在开」 */
  if ((s.actions || 0) % period !== 0) return null;
  return tourneyBracket();
}

/* 开一场：标记这条赛道已参加，返回赛事状态 */
function startTourney(bracketId){
  const b = G.TOURNEY_BRACKETS.find(x=>x.id===bracketId) || tourneyBracket();
  if (!b) return null;
  if (!s.tourneyDone) s.tourneyDone = [];
  if (s.tourneyDone.indexOf(b.id) >= 0) return null;
  s.tourneyDone.push(b.id);
  s.tourney = { id:b.id, round:0, total:G.TOURNEY.rounds, wins:0, alive:true };
  log(`你报名了「${b.name}」。`);
  return s.tourney;
}

/* 下一位对手的配置（交给 startChallenge） */
function tourneyNextOpponent(){
  const t = s.tourney;
  if (!t || !t.alive) return null;
  const b = G.TOURNEY_BRACKETS.find(x=>x.id===t.id);
  if (!b) return null;
  const step = G.TOURNEY.ladder[t.round];
  if (!step) return null;
  const pool = G.TOURNEY_NAMES[G.REALMS[s.realmIdx].major]
            || G.TOURNEY_NAMES[1] || ['无名散修'];
  const name = pool[Math.floor(s.rng()*pool.length)];
  return {
    name: name,
    tier: step.tier,
    type: 'tourney',
    rounds: 40,
    tourney: { bracket:b.id, round:t.round, total:t.total, label:step.label },
    /* 比武输了不死：只淘汰，战果只是面子与灵石。
       注：战斗本身不额外扣寿元（寿元只在「行动」和「战败转盘」上扣），
       所以参加比武的代价是「占用了行动预算」，不是「额外赔命」。 */
    outcome: {
      win:  { stone: Math.round(b.reward.stone * (1 + t.round*0.35)),
              cult:  Math.round(b.reward.cult  * (1 + t.round*0.35)) },
      lose: { stone: -Math.round(b.reward.stone * 0.15) }
    }
  };
}

/* 一场比武打完之后推进赛程。win = 这一场赢了没有。 */
function advanceTourney(win){
  const t = s.tourney;
  if (!t) return null;
  if (win){
    t.wins++;
    t.round++;
    if (t.round >= t.total){
      t.alive = false; t.champion = true;
      const b = G.TOURNEY_BRACKETS.find(x=>x.id===t.id);
      if (b){
        gainStone(b.champion.stone);
        gainContrib(b.champion.contrib);
        gainFavor(b.champion.favor);
        /* 夺魁的修为按大境界缩放，直接给绝对数不合理 */
        s.cult += evGain(b.champion.cult, 'high');
        if (!s.titles) s.titles = [];
        if (b.champion.title && s.titles.indexOf(b.champion.title) < 0)
          s.titles.push(b.champion.title);
        log(`你在「${b.name}」夺魁，得了「${b.champion.title}」的名号。`);
      }
      return { champion:true, bracket:b, tourney:t };
    }
    return { next:true, tourney:t };
  }
  t.alive = false; t.eliminated = true;
  return { eliminated:true, tourney:t };
}

/* 赛事结束后收尾（界面在弹层关掉时调） */
function clearTourney(){ if (s) s.tourney = null; }

/* ============================================================
   天骄榜（第 22 轮）
   ============================================================ */

/* 这一局里、当前境界能碰上的天骄（同大境界，且没打过） */
function tianjiaoForRealm(){
  if (!s) return null;
  const major = (G.REALMS[s.realmIdx] || {major:1}).major;
  const met = s.tianjiaoMet || [];
  const pool = G.TIANJIAO.filter(t=>t.major===major && met.indexOf(t.id) < 0);
  if (!pool.length) return null;
  return pool[Math.floor(s.rng()*pool.length)];
}

/* 把天骄变成一场挑战的配置。
   数值刻意压到「同境界基本打不过」——见 G.TIANJIAO_MUL 的说明。 */
function tianjiaoChallenge(tj){
  if (!tj) return null;
  return {
    name: tj.name,
    tier: 'terror',                    // 起步就是凶物级
    type: 'tianjiao',
    bossId: null,
    tianjiaoId: tj.id,
    rounds: 60,
    /* 天骄额外机制：更高的重击、每轮回气、减伤 —— 由 startChallenge 读取 */
    tianjiao: true,
    outcome: {
      win:  { stone: tj.reward.stone, cult: tj.reward.cult,
              favor: tj.reward.favor||0, lifeMax: tj.reward.lifeMax||0,
              karma: tj.reward.karma||0,
              clue: tj.reward.clue||null,
              flag: 'tj_beaten_' + tj.id },
      lose: { flag: 'tj_lost_' + tj.id, lifePct: -0.08 }
    }
  };
}

/* 记录「这位天骄已经遭遇过」（不论输赢，一局只遇一次） */
function markTianjiaoMet(id){
  if (!s) return;
  if (!s.tianjiaoMet) s.tianjiaoMet = [];
  if (s.tianjiaoMet.indexOf(id) < 0) s.tianjiaoMet.push(id);
  const tj = G.TIANJIAO.find(t=>t.id===id);
  if (!tj) return;
  /* 打赢了就记进元层档案柜（终身成就） */
  if (s.flags.indexOf('tj_beaten_' + id) >= 0){
    if (!meta.tianjiao) meta.tianjiao = [];
    if (meta.tianjiao.indexOf(id) < 0){
      meta.tianjiao.push(id);
      if (!meta.lore.includes(id)) meta.lore.push(id);
      saveMeta(meta);
    }
  }
}

/* 元层：已击败的天骄 */
function tianjiaoDefeated(){ return (meta && meta.tianjiao) || []; }
/* 玩家在这一局里的名号（比武夺魁等） */
function titles(){ return (s && s.titles) || []; }

/* ---------------- 宗门：贡献 · 职衔 · 藏经阁 · 月俸 · 主线 ---------------- */
function sectContrib(){ return s.sectContrib || 0; }
function sectRank(){
  const c = sectContrib();
  let cur = G.SECT_RANKS[0];
  for (const r of G.SECT_RANKS){ if (c >= r.need) cur = r; }
  return cur;
}
function gainContrib(n){
  s.sectContrib = Math.max(0, (s.sectContrib||0) + n);
  const before = s._lastRank || 'waimen';
  const r = sectRank().id;
  if (r !== before && s._lastRank){
    log('你在宗门里的位份变了：' + sectRank().name);
    s._rankUp = sectRank();
  }
  s._lastRank = r;
}

/* 藏经阁价格：气运越高越便宜，职衔越高折扣越大 */
function shopPrice(itemId){
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  if (!it) return null;
  const rank = sectRank();
  const qiMul = 1.25 - (s.sectQi / 100) * 0.4;    // 气运 100 → ×0.85，气运 0 → ×1.25
  const price = Math.round(it.price * qiMul * (1 - rank.discount));
  return { price:price, base:it.price, qiMul:qiMul, discount:rank.discount };
}
function canBuyShop(itemId){
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  if (!it) return { ok:false, msg:'没有这本功法' };
  const ranks = G.SECT_RANKS.map(r=>r.id);
  if (ranks.indexOf(sectRank().id) < ranks.indexOf(it.rank))
    return { ok:false, msg:'你的位份还不够（需要 ' + (G.SECT_RANKS.find(r=>r.id===it.rank)||{}).name + '）' };
  if (s.deck.indexOf(it.card) >= 0) return { ok:false, msg:'这门功法你已经会了' };
  const p = shopPrice(itemId);
  if (s.stone < p.price) return { ok:false, msg:'灵石不够（需 ' + p.price + '）' };
  return { ok:true, price:p.price };
}
function buyFromShop(itemId){
  const chk = canBuyShop(itemId);
  if (!chk.ok) return chk;
  const it = G.SECT_SHOP.find(x=>x.id===itemId);
  s.stone -= chk.price;
  addCard(it.card);
  gainContrib(8);
  log('你在藏经阁请了《' + it.card + '》。');
  return { ok:true, card:it.card, price:chk.price };
}

/* 宗门任务 */
function doSectTask(taskId){
  const t = G.SECT_TASKS.find(x=>x.id===taskId);
  if (!t) return null;
  const cost = actionCost();
  s.life -= cost;
  s.actions++;
  s.sectActions = (s.sectActions||0) + 1;
  gainContrib(t.contrib);
  gainStone(t.stone);
  gainSectQi(1);
  let hurt = 0;
  if (t.risk > 0 && s.rng() < t.risk){
    hurt = Math.round(s.maxLife * 0.10);
    s.life -= hurt;
  }
  const dead = checkDeath();
  return { ok:true, task:t, cost:cost, contrib:t.contrib, stone:t.stone, hurt:hurt, dead:dead };
}

/* 月俸：每 10 次宗门行动发一次 */
function paySalary(){
  const rank = sectRank();
  const bless = sectBlessing();
  const amount = Math.round(rank.salary * bless.salary);
  gainStone(amount);
  gainSectQi(2);
  return { amount:amount, rank:rank.name };
}

/* ---- 宗门主线《三月初七》---- */
function storyStage(){
  const idx = s.storyStage || 0;
  if (idx >= G.SECT_STORY.stages.length) return null;
  return G.SECT_STORY.stages[idx];
}
function storyReady(){
  const st = storyStage();
  if (!st) return null;
  if ((s.sectActions||0) < st.at) return null;
  return st;
}
function advanceStory(){
  const st = storyStage();
  if (!st) return null;
  s.storyStage = (s.storyStage||0) + 1;
  gainContrib(10);
  return st;
}
function storyProgress(){
  const total = G.SECT_STORY.stages.length;
  const done = Math.min(s.storyStage||0, total);
  const next = storyStage();
  return { done:done, total:total, next:next,
           need: next ? Math.max(0, next.at - (s.sectActions||0)) : 0 };
}

/* ---------------- 弟子 ---------------- */
function recruitDisciple(){
  const jl = s.buildings.jiangjing;
  const q = 1 + jl + Math.floor(s.rng()*3) + (((meta.up&&meta.up.discipleQ)||0));
  const names = ['阿石','小满','青禾','无咎','子规','拾一','闻笛','长安','守拙','半山','知白','砚秋'];
  const traits = [
    { n:'勤勉', e:'采药收益 +30%' },
    { n:'聪慧', e:'修行时额外 +2 修为' },
    { n:'忠厚', e:'忠诚下降更慢' },
    { n:'寡言', e:'不容易惹事' },
    { n:'倔',   e:'偶尔拒绝任务' },
    { n:'命薄', e:'受伤概率更高' }
  ];
  const d = {
    id: 'd'+Math.floor(s.rng()*1e9),
    name: names[Math.floor(s.rng()*names.length)],
    quality: q,
    trait: traits[Math.floor(s.rng()*traits.length)],
    loyalty: clamp(50 + jl*8 + Math.floor(s.rng()*20), 0, 100),
    cult: 0
  };
  s.disciples.push(d);
  s.discipleCount = s.disciples.length;
  gainSectQi(4 + q);
  return d;
}

function sendDisciple(discId, taskId){
  const d = s.disciples.find(x=>x.id===discId);
  const t = G.DISCIPLE_TASKS.find(x=>x.id===taskId);
  if (!d || !t) return null;
  if (d.loyalty < 25 && s.rng()<0.4) return { refused:true, name:d.name };

  const out = { name:d.name, task:t.name, msgs:[] };
  if (s.sectQi < t.cost.qi) return { noqi:true };

  gainSectQi(-t.cost.qi);
  const q = 1 + d.quality*0.2;
  if (t.gain.stone){ const v = Math.round(t.gain.stone*q); gainStone(v); out.msgs.push(`灵石 +${v}`); }
  if (t.gain.cult){ const v = Math.round(t.gain.cult*q); gainCult(v); out.msgs.push(`修为 +${v}`); }
  if (t.gain.qi){ gainSectQi(t.gain.qi); out.msgs.push(`宗门气运 +${t.gain.qi}`); }
  if (t.gain.favor){ gainFavor(t.gain.favor); out.msgs.push(`人情 +${t.gain.favor}`); }

  // 风险
  const risk = t.risk * (d.trait.n==='命薄'?1.5:1) * (d.trait.n==='寡言'?0.6:1);
  if (s.rng() < risk){
    out.hurt = true;
    d.loyalty -= 12;
    const h = Math.round(10 + s.rng()*20);
    s.life -= h;
    out.msgs.push(`出了事：${t.riskTxt} 寿元 −${h}`);
  } else {
    d.loyalty = clamp(d.loyalty + 4, 0, 100);
    d.cult += 8 + d.quality*2;
  }
  const dead = checkDeath('slay');
  if (dead) out.end = dead;
  return out;
}

/* ---------------- 建筑 ---------------- */
function buildCost(id){
  const b = G.BUILDINGS.find(x=>x.id===id);
  const lv = s.buildings[id] || 0;
  if (lv >= b.max) return null;
  return b.cost[lv];
}

function doBuild(id){
  const cost = buildCost(id);
  if (cost===null || s.stone < cost) return false;
  gainStone(-cost);
  s.buildings[id] = (s.buildings[id]||0) + 1;
  if (id==='zushi'){ s.sectQiMax += 25; gainSectQi(5); }
  log(`宗门建起了 ${G.BUILDINGS.find(x=>x.id===id).name}（${s.buildings[id]} 级）。`);
  return true;
}

/* ---------------- 天劫 ----------------
   强度随境界缓涨。伤害已压低：打输只是重伤，不会直接重开。 */
function startTribulation(){
  const names = Object.keys(G.TRIBULATIONS);
  const key = names[Math.floor(s.rng()*names.length)];
  const t = G.TRIBULATIONS[key];
  const scale = 1 + s.realmIdx*0.16 + s.karma*0.03;
  return startChallenge({
    type:'tribulation',
    tbName:key,
    name:key,
    power: Math.round(t.basePower * scale),
    rounds: t.rounds,
    txt: t.txt
  });
}

/* ---------------- 业障满：天谴 ----------------
   这是唯一「打输可能真的死」的战斗，也是业障唯一的用处。 */
function karmaOverflow(){
  return s.karma >= G.CONFIG.tribulation.killerKarma;
}

function startKillerTribulation(){
  const names = Object.keys(G.TRIBULATIONS);
  const key = names[Math.floor(s.rng()*names.length)];
  const t = G.TRIBULATIONS[key];
  const scale = 1 + s.realmIdx*0.18 + s.karma*0.04;
  return startChallenge({
    type:'tribulation', killer:true, tbName:key,
    name:'天谴 · ' + key,
    power: Math.round(t.basePower * scale * 1.5),
    rounds: t.rounds,
    txt: '云不是从天上来的。\n是从你自己身上长出来的。\n\n' + t.txt
  });
}

/* ---------------- 元层操作 ---------------- */
function upLevel(id){ return (meta.up && meta.up[id]) || 0; }
function upCost(id){
  const u = G.UPGRADES.find(x=>x.id===id);
  if (!u) return 0;
  const lv = upLevel(id);
  if (lv >= u.max) return null;
  return u.cost(lv);
}
function buyUpgrade(id){
  const cost = upCost(id);
  if (cost===null || meta.frag < cost) return false;
  meta.frag -= cost;
  meta.up[id] = upLevel(id)+1;
  saveMeta(meta);
  return true;
}

/* ---------------- 个人气运（元层「气运」升级） ----------------
   与「宗门气运」是两回事：
     · 宗门气运 = 集体，影响你的属性加持
     · 个人气运 = 你自己攒的运气，影响**开局抽签**
   效果：① 体质可以重抽 N 次  ② 「变数」签更容易抽到吉签        */
function luckLevel(){
  return (meta.up && meta.up.luck) || 0;
}
function luckRerolls(){ return luckLevel(); }

/* 变数签的好坏权重：气运越高，吉签越容易出 */
function luckyWeight(tag){
  const L = luckLevel();
  if (tag === 'lucky') return 1 + L * 0.10;      // 吉签权重提升
  if (tag === 'bad')   return Math.max(0.35, 1 - L * 0.06);  // 凶签权重下降
  return 1;
}

/* 按权重从一张签表里抽一条 */
function pickWeighted(list, rng){
  const ws = list.map(t => luckyWeight(t.tag));
  const total = ws.reduce((a,b)=>a+b, 0);
  let r = rng() * total;
  for (let i=0;i<list.length;i++){
    r -= ws[i];
    if (r <= 0) return list[i];
  }
  return list[list.length-1];
}

/* ---------------- 抽签 ---------------- */
function drawLots(forceSeed){
  const seed = forceSeed || (Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36));
  const rng = makeRng(seed);
  const result = { seed: seed, bonus: { startCards:[], flags:[], attrs:{} }, entries: [] };

  G.LOTS.forEach(lot=>{
    if (lot.pick==='constitution'){
      const c = G.CONSTITUTIONS[Math.floor(rng()*G.CONSTITUTIONS.length)];
      result.constitution = c.id;
      result.entries.push({ key:lot.key, label:lot.label, hint:lot.hint,
        name:c.name, desc:c.desc,
        eff:`行动消耗 ×${c.costMul.toFixed(2)}　寿元上限 ×${c.lifeMul.toFixed(2)}` });
      return;
    }
    // 「变数」签吃个人气运：吉签更容易出，凶签更难出
    const t = (lot.key === 'bianshu')
      ? pickWeighted(lot.table, rng)
      : lot.table[Math.floor(rng()*lot.table.length)];    result.entries.push({ key:lot.key, label:lot.label, hint:lot.hint,
      name:t.name, desc:t.desc, eff: describeLot(t) });

    // 合并加成
    if (t.stone) result.bonus.stone = (result.bonus.stone||0)+t.stone;
    if (t.life) result.bonus.lifeMax = (result.bonus.lifeMax||0)+t.life;
    if (t.favor) result.bonus.favor = (result.bonus.favor||0)+t.favor;
    if (t.karmaStart) result.bonus.karmaStart = (result.bonus.karmaStart||0)+t.karmaStart;
    if (t.sectQi) result.bonus.sectQi = (result.bonus.sectQi||0)+t.sectQi;
    if (t.cultStart) result.bonus.cultStart = (result.bonus.cultStart||0)+t.cultStart;
    if (t.cultMul) result.bonus.cultMul = (result.bonus.cultMul||0)+t.cultMul;
    if (t.lifeMul) result.bonus.lifeMul = (result.bonus.lifeMul||0)*(t.lifeMul||1);
    if (t.startCards) result.bonus.startCards = result.bonus.startCards.concat(t.startCards);
    if (t.flag) result.bonus.flags.push(t.flag);
    if (t.flags) result.bonus.flags = result.bonus.flags.concat(t.flags);
    // 六维属性：逐签累加
    if (t.attrs){
      Object.keys(t.attrs).forEach(k=>{
        result.bonus.attrs[k] = (result.bonus.attrs[k]||0) + t.attrs[k];
      });
    }
    if (t.name) result.bonus.flags.push('lot_'+lot.key+'_'+t.name);
  });

  // 身份
  const role = G.ROLES[Math.floor(rng()*G.ROLES.length)];
  result.role = role.id;
  result.entries.push({ key:'shenfen', label:'身 份', hint:'你在宗门里的位置',
    name:role.name, desc:role.desc, eff:`灵石 +${role.mods.stone}　修为效率 ×${role.mods.cultMul}` });

  // 应用身份修正
  result.bonus.stone = (result.bonus.stone||0) + role.mods.stone;
  result.bonus.cultMul = (result.bonus.cultMul||0) * (role.mods.cultMul||1);
  if (role.mods.karmaStart) result.bonus.karmaStart = (result.bonus.karmaStart||0)+role.mods.karmaStart;
  if (role.mods.sectQi) result.bonus.sectQi = (result.bonus.sectQi||0)+role.mods.sectQi;

  // 个人气运：还能重抽几次体质
  result.rerolls = luckRerolls();
  result.rerollsLeft = luckRerolls();

  return result;
}

/* 重抽体质（消耗一次个人气运） */
function rerollConstitution(lots){
  if (!lots || lots.rerollsLeft <= 0) return null;
  const rng = makeRng(lots.seed + '#' + lots.rerollsLeft + '#' + Date.now());
  const c = G.CONSTITUTIONS[Math.floor(rng()*G.CONSTITUTIONS.length)];
  lots.constitution = c.id;
  lots.rerollsLeft--;
  // 更新展示条目
  const entry = lots.entries.find(e=>e.key === 'tizhi');
  if (entry){
    entry.name = c.name;
    entry.desc = c.desc;
    entry.eff = `行动消耗 ×${c.costMul.toFixed(2)}　寿元上限 ×${c.lifeMul.toFixed(2)}`;
  }
  return c;
}

function describeLot(t){
  const parts = [];
  if (t.attrs){
    const seg = G.ATTRS.filter(a=>t.attrs[a.id])
      .map(a=>`${a.name} +${t.attrs[a.id]}`).join('　');
    if (seg) parts.push(seg);
  }
  if (t.stone) parts.push(`灵石 ${t.stone>0?'+':''}${t.stone}`);
  if (t.life) parts.push(`寿元 ${t.life>0?'+':''}${t.life}`);
  if (t.favor) parts.push(`人情 ${t.favor>0?'+':''}${t.favor}`);
  if (t.karmaStart) parts.push(`业障 ${t.karmaStart>0?'+':''}${t.karmaStart}`);
  if (t.sectQi) parts.push(`宗门气运 ${t.sectQi>0?'+':''}${t.sectQi}`);
  if (t.cultStart) parts.push(`修为 +${t.cultStart}`);
  if (t.cultMul) parts.push(`修为效率 +${Math.round(t.cultMul*100)}%`);
  if (t.lifeMul) parts.push(`寿元 ×${t.lifeMul}`);
  if (t.startCards) parts.push(`起始功法：${t.startCards.join('、')}`);
  return parts.join('　');
}

/* ---------------- 行动定义（给 UI 用） ---------------- */
function availableActions(){
  const st = state();
  if (!st) return [];
  const list = [];

  /* 修行按钮上的预估值 —— 必须和 doAction('cultivate') 用同一个公式，
     否则界面又在骗玩家（第 20 轮的教训）。 */
  const R = G.REALMS[s.realmIdx] || { speed:1, gain:1 };
  const speed = R.speed || 1;
  const consti = G.CONSTITUTIONS.find(c=>c.id===s.constId) || G.CONSTITUTIONS[0];
  const cultPreview = Math.max(1, Math.round(
    (speed * st.cost + (st.a.cultFlat || 0))
    * (1 + (st.a.cultMul || 0))
    * (consti.cultMul || 1)
    * (s.lots.bonus.cultMul || 1)
    * (1 + (st.attrs.wuxing||0) * 0.012)
    * (1 + st.sectBless.cult)
  ));

  list.push({
    id:'cultivate', name:'修行', cost:st.cost,
    desc:'打坐、吐纳、把那一口气往下压。稳定获得修为。',
    meta:`修为 +${cultPreview}　修炼速度 ${speed.toFixed(2)} / 寿元`,
    primary: st.canBreak ? false : true
  });

  list.push({
    id:'explore', name:'探索', cost:st.cost,
    desc:'下山、入林、翻废墟。有灵石、有修为、有机缘，也可能受伤。',
    meta:'灵石 + 修为 + 几率得卡'
  });

  list.push({
    id:'sectwork', name:'宗门事务', cost:st.cost,
    desc:'处理执事、采买、巡山、调解纠纷。赚灵石，稳住宗门气运。',
    meta:'灵石 +　宗门气运 +　人情 +'
  });

  const restLeft = Math.max(0, G.CONFIG.restPerRealm - (s.restUsed||0));
  list.push({
    id:'rest', name:'静养', cost:st.cost, disabled: restLeft<=0,
    desc:'什么都不做，睡一觉。回复寿元，但宗门会少一个人手。',
    meta: restLeft>0
      ? `寿元回复约 ${Math.round(st.maxLife*0.14)}　本境界还可 ${restLeft} 次`
      : '本境界的静养次数已经用完了。突破后方可再养。'
  });

  const nourishLeft = Math.max(0, 2 - (s.nourishUsed||0));
  list.push({
    id:'nourish', name:'养身', cost:st.cost, disabled: nourishLeft<=0,
    desc:'用灵气缓缓滋养身体。永久提升寿元上限，净收益很薄。',
    meta: nourishLeft>0
      ? `寿元上限 +${16 + ((meta.up&&meta.up.startLife)||0)*2}　本境界还可 ${nourishLeft} 次`
      : '本境界已经养过了。'
  });

  if (st.canBreak){
    const nextRealm = G.REALMS[st.realmIdx+1];
    list.unshift({
      id:'break',
      name:'★ 突破 · ' + (nextRealm?nextRealm.name:'—'),
      cost:0,
      desc:'修为已足。破境。寿元上限与当前寿元都将大增——但可能引来天劫。',
      meta:`需修为 ${st.breakNeed}　现有 ${st.cult}`,
      primary:true, special:'break'
    });
  } else if (st.canAscend){
    // 炼气九层 → 筑基：不是普通突破，是「渡雷池」
    list.unshift({
      id:'break',
      name:'★ 渡 雷 池 · 筑基',
      cost:0,
      desc:'炼气九层，已是此界之巅。雷池就在前面——走进去，就没有回头路了。',
      meta:`需修为 ${st.breakNeed}　现有 ${st.cult}`,
      primary:true, special:'break'
    });
  } else if (st.canCapstone){
    /* 第 21 轮：修为已足，但已到本世上限（元婴九层）。
       这里不再给「突破」，而是给一个收束 —— 让玩家自己合上山门。 */
    list.unshift({
      id:'capstone',
      name:'★ 此 世 圆 满 · 收 束',
      cost:0,
      desc:'修为已满，前面没有路了。把这一世收好——回桌前，拼图还在等。',
      meta:`${G.realmCapName ? G.realmCapName() : ''}已至圆满　需修为 ${st.breakNeed}　现有 ${st.cult}`,
      primary:true, special:'capstone'
    });
  } else if (!st.isMaxRealm){
    list.push({
      id:'break', name:'突破 · ' + (G.REALMS[st.realmIdx+1]?G.REALMS[st.realmIdx+1].name:'—'),
      cost:0, disabled:true,
      desc:'修为不足，破境无门。',
      meta:`还需修为 ${Math.max(0, st.breakNeed - st.cult)}`
    });
  } else if (st.atEnd){
    list.unshift({
      id:'break', name:'此 世 已 满', cost:0, disabled:true,
      desc:'你走到这一段路的尽头了。',
      meta:'这一世到此为止——主动坐化，或者继续活下去。'
    });
  }

  // 下山：经历了一些之后，谁都可以选择离开宗门去做散修。
  // 这不是失败，是另一种活法——「休闲修仙」的正门。
  if (s.chapter === 'zongmen' && s.actions >= 25){
    list.push({
      id:'leavesect', name:'下 山', cost:0, special:'leavesect',
      desc:'把东西收拾好，离开宗门，去做一个散修。山野很大，没人管你。',
      meta:'转 入 散 修 篇 · 不是结局，是换一种活法'
    });
  }

  return list;
}

(function(){
'use strict';

const $  = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
};

/* ---------------- 屏幕切换 ---------------- */
function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  const target = $(id);
  target.classList.add('active');
  target.scrollTop = 0;
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(text, kind){
  const wrap = $('toast');
  const t = el('div', 'toast ' + (kind||''), text);
  wrap.appendChild(t);
  while (wrap.children.length > 4) wrap.removeChild(wrap.firstChild);
  setTimeout(()=>{ t.classList.add('fade'); setTimeout(()=>t.remove(), 420); }, 2200);
}

/* ---------------- 弹层 ---------------- */
function sheet(title, bodyNode, footNodes){
  $('sheetTitle').textContent = title;
  const body = $('sheetBody');
  body.innerHTML = '';
  if (typeof bodyNode === 'string') body.innerHTML = bodyNode;
  else if (bodyNode) body.appendChild(bodyNode);
  const foot = $('sheetFoot');
  foot.innerHTML = '';
  (footNodes||[]).forEach(n=>foot.appendChild(n));
  $('overlay').classList.remove('hidden');
  body.scrollTop = 0;
}
function closeSheet(){ $('overlay').classList.add('hidden'); }
function sheetOpen(){ return !$('overlay').classList.contains('hidden'); }

function btn(label, cls, fn, disabled){
  const b = el('button', cls||'btn-main', label);
  if (disabled) b.disabled = true;
  else b.addEventListener('click', fn);
  return b;
}

  const m = G.Engine.meta;
  /* 第 19 轮：碎片改成「按进度归一化」之后，这里的旧除数（28）会让拼图
     一局就拼完。改成一个人玩十几局才拼满的节奏。 */
  return Math.min(PUZZLE_TOTAL,
    Math.floor(m.frag/150) + m.wins*2 + Math.floor(m.totalActions/800));
}

/* ---- 永久升级（按类别分组） ---- */
function renderUpgrades(){
  const pane = $('pane-upgrade');
  pane.innerHTML = '';
  const m = G.Engine.meta;

  // 汇总：总等级 / 总项数
  let totalLv = 0, totalMax = 0;
  G.UPGRADES.forEach(u=>{ totalLv += G.Engine.upLevel(u.id); totalMax += u.max; });

  const head = el('div','up-head');
  head.innerHTML =
    `<div class="up-frag"><span class="frag-icon">◈</span> <b>${m.frag}</b> 碎片</div>
     <div class="up-total">已修复 ${totalLv} / ${totalMax} 级</div>`;
  pane.appendChild(head);

  // 按类别分组
  const cats = [];
  G.UPGRADES.forEach(u=>{ if (cats.indexOf(u.cat||'其他')<0) cats.push(u.cat||'其他'); });

  cats.forEach(cat=>{
    const sec = el('div','up-cat');
    const items = G.UPGRADES.filter(u=>(u.cat||'其他')===cat);
    const lvSum = items.reduce((n,u)=>n+G.Engine.upLevel(u.id),0);
    const maxSum = items.reduce((n,u)=>n+u.max,0);
    sec.appendChild(el('div','arc-h', `${cat}　<span class="cat-lv">${lvSum}/${maxSum}</span>`));

    items.forEach(u=>{
      const lv = G.Engine.upLevel(u.id);
      const cost = G.Engine.upCost(u.id);
      const maxed = cost===null;
      const can = !maxed && m.frag >= cost;

      const item = el('div','up-item' + (maxed?' maxed':''));
      const b = el('button','up-buy', maxed ? '已满' : `修复<small>◈ ${cost}</small>`);
      if (!can) b.disabled = true;
      else b.addEventListener('click', ()=>{
        if (G.Engine.buyUpgrade(u.id)){ toast(`${u.name} → ${G.Engine.upLevel(u.id)} 级`,'good'); renderMeta(); }
      });

      // 等级进度条
      const pct = Math.round(lv/u.max*100);
      item.innerHTML =
        `<div class="up-info">
           <div class="up-name">${u.name}<span class="up-lv">${lv}/${u.max}</span></div>
           <div class="up-bar"><div class="up-fill" style="width:${pct}%"></div></div>
           <div class="up-desc">${u.desc}${lv>0?'　<b class="up-cur">当前 '+u.fmt(lv)+'</b>':''}</div>
         </div>`;
      item.appendChild(b);
      sec.appendChild(item);
    });
    pane.appendChild(sec);
  });
}

function renderArchive(){
  const pane = $('pane-archive');
  pane.innerHTML = '';

  // 元层剧情
  const sec1 = el('div','arc-sec');
  sec1.appendChild(el('div','arc-h','它 说 过 的 话'));

  if (unlocked===0){
    sec1.appendChild(el('div','arc-empty','还没有声音。\n走完一局，它会开口。'));
  } else {
    for (let i=0;i<G.LORE.meta.length;i++){

      else sec1.appendChild(el('div','arc-i unk','……（还差一些）'));

  }
  pane.appendChild(sec1);

  // 宗门线索
  const sec2 = el('div','arc-sec');
  sec2.appendChild(el('div','arc-h','宗 门 · 线 索'));
  let anyClue = false;
  G.LORE.zongmen.forEach(c=>{
    if (m.lore.includes(c.id)){ sec2.appendChild(el('div','arc-i', c.text)); anyClue = true; }
  });
  if (!anyClue) sec2.appendChild(el('div','arc-empty','你还没有注意到什么不对。'));
  pane.appendChild(sec2);

  // 结局
  const sec3 = el('div','arc-sec');
  sec3.appendChild(el('div','arc-h','结 局'));
  if (!m.endings.length) sec3.appendChild(el('div','arc-empty','你还没有走到任何一个结局。'));
  else {
    m.endings.forEach(id=>{
      const e = Object.values(G.Engine.ENDINGS).find(x=>x.id===id);
      if (e) sec3.appendChild(el('div','arc-i', e.title.replace(/\s/g,'') + '　—　' + (G.Engine.END_SUB[id]||'').split('\n')[0]));
    });
    const hidden = Object.keys(G.Engine.ENDINGS).filter(k=>!m.endings.includes(G.Engine.ENDINGS[k].id));
    if (hidden.length) sec3.appendChild(el('div','arc-i unk', `还有 ${hidden.length} 个结局，你没有见过。`));
  }

  // 统计
  const sec4 = el('div','arc-sec');
  sec4.appendChild(el('div','arc-h','统 计'));
  sec4.appendChild(el('div','arc-i',
    `走过 ${m.runs} 世　突破筑基 ${m.wins} 次<br>累计行动 ${m.totalActions} 次`));
  pane.appendChild(sec4);

  /* ---- 天骄榜（第 22 轮）----
     榜上的人打赢了才会在这里留下记录。
     没打赢的不显示名字——只显示「还有几位你没赢过」。 */
  const sec5 = el('div','arc-sec');
  sec5.appendChild(el('div','arc-h','天 骄 榜'));
  const beaten = G.Engine.tianjiaoDefeated();
  const all = G.TIANJIAO || [];
  if (beaten.length){
    all.filter(t=>beaten.includes(t.id)).forEach(t=>{
      const rec = G.LORE.zongmen.find(x=>x.id===t.id);
      sec5.appendChild(el('div','arc-i',
        `<b style="color:#c9a227">${t.name}</b>　—　${t.epithet}<br>` +
        `<span style="color:#6f6459">${rec ? rec.text : ''}</span>`));
    });
  }
  const left = all.length - beaten.length;
  if (left > 0){
    sec5.appendChild(el('div','arc-i unk',
      `榜上还有 ${left} 个人，你没有赢过。\n（他们只在机缘与宗门事件里偶尔露面。）`));
  }
  sec5.appendChild(el('div','rune','— 打赢一个，才会记下一个名字 —'));
  pane.appendChild(sec5);
}

function renderRun(){
  const st = G.Engine.state();
  if (!st) return;
  const raw = st.raw;

  // HUD
  $('hudRealm').textContent = st.realmName;
  $('hudRole').textContent = raw.roleName + ' · ' + raw.constName +
    (st.chapter === 'sanxiu' ? ' · 散修' : '');

  const pct = Math.max(0, Math.min(100, st.life / st.maxLife * 100));
  const fill = $('lifeFill');
  fill.style.width = pct + '%';
  fill.className = 'life-fill' + (pct<15?' danger':(pct<35?' warn':''));
  $('lifeText').textContent = `${st.life} / ${st.maxLife}`;
  $('lifeCost').textContent = '−' + st.cost;

  setRes('resStone', st.stone);
  setRes('resCult', st.cult);
  setRes('resKarma', st.karma);
  setRes('resFavor', st.favor);
  setRes('resSect', st.sectQi);

  const need = st.breakNeed || 1;
  $('cultFill').style.width = Math.min(100, st.cult/need*100) + '%';
  $('cultNeed').textContent = st.isMaxRealm ? '此界之巅' : Math.max(0, need - st.cult);
  $('deckCount').textContent = raw.deck.length;
  $('bagCount').textContent = G.Engine.pillCount();
  $('clueCount').textContent = st.clue ? st.clue.got : raw.clues.length;

  // 战力：改用战斗派生数值，让玩家看得懂自己「能不能打」
  const powEl = $('powText');
  const cs = st.combat;
  powEl.textContent = `气血 ${cs.maxHp}　攻 ${cs.basicAtk} · ${fightHint(cs)}`;
  powEl.className = 'pow' + (cs.maxHp >= 400 ? ' strong' : '');

  // 行动列表
  const main = $('runMain');
  main.innerHTML = '';

  // 散修篇：换一套更松弛的行动表
  if (st.chapter === 'sanxiu'){ renderSanxiu(); return; }

  const hint = el('div','act-hint', st.canBreak ? '修为已足。该破境了。' : '你还能做什么？');
  main.appendChild(hint);

  G.Engine.availableActions().forEach((a,i)=>{
    const b = el('button','act' + (a.primary?' primary':''));
    b.style.animationDelay = (i*45)+'ms';
    if (a.disabled) b.disabled = true;
    b.innerHTML =
      `<div class="act-top">
         <span class="act-name">${a.name}</span>
         <span class="act-cost">${a.cost>0?'寿元 −'+a.cost:'不耗寿元'}</span>
       </div>
       <div class="act-desc">${a.desc}</div>
       ${a.meta?`<div class="act-meta">${a.meta}</div>`:''}`;
    if (!a.disabled){
      b.addEventListener('click', ()=>onAction(a));
    }
    main.appendChild(b);
  });
}

function setRes(id, val){
  const e = $(id);
  const old = prevRes[id];
  e.textContent = val;
  const parent = e.parentElement;
  parent.classList.remove('up','down');
  if (old!==undefined && old!==val){
    parent.classList.add(val>old?'up':'down');
    setTimeout(()=>parent.classList.remove('up','down'), 700);
  }
  prevRes[id] = val;
}

/* ---- 战力求值（用于展示「你有多能打」）----
   第 21 轮：删掉了旧的 powerHint()。它算的是 agg().power 的档位，
   而那个数值在战斗里不直接使用（见 combatStats 的说明），
   于是它从来没被调用过 —— 一段死代码，留着只会误导后来的人。 */
function fightHint(cs){
  const hp = cs.maxHp, atk = cs.basicAtk;
  if (hp < 120) return '身子单薄';
  if (atk < 15) return '还不太会打';
  if (hp < 300) return '能应付一般的';
  if (hp < 600) return '不好惹';
  return '少有对手';
}

const RARITY_COLOR = { '凡':'#8a8078', '良':'#5fae8f', '玄':'#5b7fa8', '道':'#c9a227' };

/* ---- 三选一：机缘 ---- */
let cardChooserOpen = false;

function showCardPick(cards, onDone){
  if (!cards || !cards.length){ if (onDone) onDone(null); return; }
  cardChooserOpen = true;

  const body = el('div');
  body.appendChild(el('div','arc-i','你在这一趟里摸到了几样东西。只能带走一样。'));

  const csPick = G.Engine.combatStats();   // 第 20 轮：卡面要显示「实际会变成什么」
  cards.forEach(name=>{
    const c = G.CARDS[name];
    if (!c) return;
    const b = el('button','ev-choice');
    const t = G.TECHNIQUES[name];
    /* 第 20 轮：这里以前显示卡自己的 power/heal/ward 原始值，
       而战斗实际用的是「属性 × 招式倍率 × 常驻战力乘数」。
       现在按引擎真正会算的方式显示，玩家选卡时看到的就是拿到的。 */
    const stat = t
      ? (t.kind==='dmg' ? `招式伤害约 ${Math.round(csPick.techPower * csPick.techMul * t.mul)}`
        : t.kind==='heal' ? `回复约 ${Math.round(csPick.techPower * t.heal)} 气血`
        : t.kind==='ward' ? `护体 +${Math.round(csPick.ward * t.ward)}`
        : t.kind==='buff' ? `闪避大幅提升`
        : t.kind==='karma' ? `业障 ${t.karma}`
        : `招式` + (t.mul ? `　伤害约 ${Math.round(csPick.techPower * csPick.techMul * t.mul)}` : ''))
      : c.type === '丹药' && c.use
        ? [c.use.life?`气血 +${c.use.life}`:'', c.use.cult?`修为 +${c.use.cult}`:'',
           c.use.lifeMax?`寿元上限 +${c.use.lifeMax}`:''].filter(Boolean).join('　')
      : (c.power || (c.eff && c.eff.power)) ? `常驻战力 +${c.power || c.eff.power}`
      : (c.ward || (c.eff && c.eff.ward)) ? `常驻护体 +${c.ward || c.eff.ward}`
      : c.eff && c.eff.attr ? Object.keys(c.eff.attr).map(k=>{
          const at = G.ATTRS.find(x=>x.id===k); return `${at?at.name:k} +${c.eff.attr[k]}`; }).join('　')
      : c.eff && c.eff.cultFlat ? `修行 +${c.eff.cultFlat}`
      : c.eff && c.eff.costReduce ? `行动减耗 ${c.eff.costReduce}`
      : c.eff && c.eff.lifeMax ? `寿元上限 +${c.eff.lifeMax}`
      : c.eff && c.eff.lifePerAction ? `每次行动回复寿元`
      : c.eff && c.eff.stonePerAction ? `每次行动得灵石`
      : c.eff && c.eff.cultMul ? `修为效率 +${Math.round(c.eff.cultMul*100)}%`
      : c.eff && c.eff.karmaPer ? `此物损阴德（每次行动积业障）`
      : '——';
    b.innerHTML =
      `<div class="ev-ctext">${name}
         <span class="card-tag" style="color:${RARITY_COLOR[c.rarity]||'#8a8078'};border-color:${RARITY_COLOR[c.rarity]||'#8a8078'}">${c.rarity}</span>
         <span class="card-tag">${c.type}</span>
       </div>
       <div class="ev-cmeta">${stat}　${c.desc||''}</div>`;
    b.addEventListener('click', ()=>{
      G.Engine.addCard(name);
      cardChooserOpen = false;
      closeSheet();
      toast(`你带走了【${name}】`,'good');
      if (onDone) onDone(name);
    });
    body.appendChild(b);
  });

  const foot = [];
  foot.push(btn('都不要','btn-main',()=>{
    cardChooserOpen = false;
    closeSheet();
    if (onDone) onDone(null);
  }));

  sheet('机 缘', body, foot);
}

/* 每次行动后自动存档——玩家要求「中途不能丢进度」 */
let _saveWarned = false;
function autoSave(){
  const st = G.Engine.state();
  if (!st || st.raw.ended){ G.Engine.clearRun(); return; }
  const okSave = G.Engine.saveRun();
  /* 第 21 轮：存档失败必须让玩家知道。
     无痕模式 / 禁用存储 / 配额满 都会走到这里——
     以前是静默失败，玩家玩一小时才发现什么都没留下。 */
  if (!okSave && !_saveWarned){
    _saveWarned = true;
    const err = G.Engine.saveError();
    toast('⚠ 进度存不下来：' + ((err && err.msg) || '浏览器不允许写入存储'), 'bad');
    setTimeout(()=>{
      sheet('⚠ 进度没有被保存',
        `<div class="ev-text">这一局的进度**没能写进浏览器存储**。\n\n` +
        `常见原因：\n` +
        `· 你在**无痕 / 隐私模式**下打开（这种模式不允许长期保存）\n` +
        `· 浏览器设置里**禁用了网站数据 / Cookie**\n` +
        `· 存储空间已满\n\n` +
        `**关掉页面后，这一段进度就会丢。**\n\n` +
        `你可以在「菜单 → 存档搬移」里导出一段字符串手动保存，\n` +
        `下次粘回来就能接着玩。</div>`,
        [ btn('知道了','btn-main',()=>closeSheet()),
          btn('去导出存档','btn-go btn-main',()=>{ closeSheet(); showSaveIO(); }) ]);
    }, 600);
  }
}

/* ---- 执行行动 ---- */
function onAction(a){
  if (a.special==='break'){ doBreakSequence(); return; }
  if (a.special==='capstone'){ capstoneFlow(); return; }
  if (a.special==='leavesect'){ leaveSectFlow(); return; }

  const res = G.Engine.doAction(a.id);
  if (!res.ok) return;

  // 行动旁白
  const fl = ACT_FLAVOR[a.id] || [''];
  const line = fl[Math.floor(Math.random()*fl.length)];
  const parts = [line].concat(res.msgs||[]);
  toast(parts.join('　'), a.id==='rest'||a.id==='nourish' ? 'good' : '');

  if (res.dead){ afterDeath(res.dead); return; }

  renderRun();
  autoSave();                       // 每次行动后存档

  // 三选一机缘
  if (res.cards && res.cards.length){
    setTimeout(()=>showCardPick(res.cards, afterActionFlow), 240);
    return;
  }
  afterActionFlow();
}

/* 每次行动之后要检查的一串东西（Boss / 天谴 / 宗门 / 事件） */
function afterActionFlow(){
  const st = G.Engine.state();
  if (!st || st.raw.ended) return;

  // Boss 遭遇（优先级最高）
  const boss = G.Engine.pickBoss();
  if (boss){ setTimeout(()=>showBoss(boss), 260); return; }

  // 业障满 → 天谴（输了直接死）
  if (G.Engine.karmaOverflow() && Math.random()<0.5){
    startKillerTribulationFlow();
    return;
  }

  // 宗门散了 → 转入散修篇（不是结局！）
  const sc = G.Engine.checkSectCollapse();
  if (sc){
    if (sc.enterSanxiu){ enterSanxiuFlow(); return; }
    showEnding(sc); return;
  }

  // 《三月初七》：宗门事务做够了，就翻到下一页
  const story = G.Engine.storyReady();
  if (story){ setTimeout(()=>showSectStory(), 320); return; }

  /* ---- 比武大会（第 22 轮）----
     按境界分赛道，每隔一段行动开一次。
     优先级放在剧情之后、随机事件之前：
     因为它是「有请帖送到手上」的事，不该被随机事件挤掉。 */
  const bracket = G.Engine.tourneyReady();
  if (bracket){ setTimeout(()=>showTourneyInvite(bracket), 340); return; }

  // 随机事件
  const evChance = 0.30;
  if (Math.random() < evChance){
    const ev = G.Engine.pickEvent();
    if (ev) showEvent(ev);
  }
  renderRun();
}

/* ---- Boss 遭遇 ---- */
function showBoss(boss){
  G.Engine.markBossActive(boss.id);   // 锁住，避免处理过程中被重复触发
  const body = el('div');
  body.innerHTML = `<div class="ev-text">${boss.intro.replace(/\n/g,'<br>')}</div>`;

  const wrap = el('div');
  wrap.style.marginTop = '4px';
  body.appendChild(wrap);

  const st = G.Engine.state();
  boss.choices.forEach((c,i)=>{
    const b = el('button','ev-choice');
    b.innerHTML = `<div class="ev-ctext">${i+1}. ${c.label}</div>` +
      (c.hint?`<div class="ev-cmeta">${c.hint}</div>`:'');
    b.addEventListener('click', ()=>{
      const r = c.eff(st.raw, api);
      closeSheet();
      if (r) toast(r, '');
      renderRun();
      if (api._pendingChallenge){
        /* 先取走 pendingChallenge，再进战斗流程 ——
           startChallengeFlow() 自己会 autoSave，见 showEvent 里的说明 */
        const cfg = api._pendingChallenge; api._pendingChallenge = null;
        setTimeout(()=>startChallengeFlow(cfg), 320);
        return;
      }
      // 没有进入战斗（选了非战斗选项）→ 解除锁定
      G.Engine.clearBossActive();
      autoSave();                        // 第 22 轮：Boss 的非战斗选项也会改状态
      if (pendingDeath){ const d = pendingDeath; pendingDeath = null; afterDeath(d); }
      else afterActionFlow();
    });
    wrap.appendChild(b);
  });

  sheet('◆ ' + boss.title, body, []);
}

/* 挑战结束后统一处理：Boss 结算文本 / 结局 / 隐藏结局 */
function afterChallenge(out){
  if (!out) return;
  if (out.bossText){
    sheet('◆ ' + out.name, `<div class="ev-text">${out.bossText.replace(/\n/g,'<br>')}</div>`, []);
  }
  if (out.end){ setTimeout(()=>showEnding(out.end), out.bossText?700:200); return true; }
  return false;
}

/* ---- 突破 ---- */
function doBreakSequence(){
  const r = G.Engine.doBreak();
  if (!r) return;

  /* 第 21 轮：到了本世上限（元婴九层），修为已满 → 收束这一世。
     不给「突破」，因为前面那一段还没有被写出来。 */
  if (r.capstone){ capstoneFlow(); return; }

  // 炼气九层 → 筑基：交给终极 Boss「雷池之影」
  if (r.needBoss){
    const boss = G.BOSSES[r.needBoss];
    if (boss){ showBoss(boss); return; }
  }

  toast(`破境！${r.realm}　寿元上限 ${r.maxLife}`,'epic');
  renderRun();
  if (r.tribulation){
    setTimeout(()=>startTribulationFlow('破境之时，天上有东西在看。'), 420);
    return;
  }
  // 破境后也可能撞上 Boss（例如青云观主、心魔）
  const boss = G.Engine.pickBoss();
  if (boss) setTimeout(()=>showBoss(boss), 420);
}

/* ---- 事件 ---- */
function showEvent(ev){
  const body = el('div');
  body.innerHTML = `<div class="ev-text">${ev.text.replace(/\n/g,'<br>')}</div>` +
    (ev.flavor ? `<div class="ev-flavor">${ev.flavor}</div>` : '');

  const wrap = el('div');
  body.appendChild(wrap);

  const st = G.Engine.state();

  const foot = [];
  const choices = ev.choices.filter(c=>!c.when || c.when(st.raw));
  choices.forEach((c,i)=>{
    const b = el('button','ev-choice');
    b.innerHTML = `<div class="ev-ctext">${i+1}. ${c.label}</div>` +
      (c.hint?`<div class="ev-cmeta">${c.hint}</div>`:'');
    b.addEventListener('click', ()=>{
      const r = c.eff(st.raw, api);
      // 关闭事件，显示结果
      closeSheet();
      if (r) toast(r, '');
      renderRun();
      if (api._pendingChallenge){
        /* ⚠️ 顺序很重要：必须**先**把 pendingChallenge 取走，
           再进入战斗流程。startChallengeFlow() 自己会 autoSave，
           而它会存下环境里的 challenge —— 如果此时 _pendingChallenge
           还挂着，存档就会出现「有一场战斗在等，但战斗又没开始」的中间态。 */
        const cfg = api._pendingChallenge; api._pendingChallenge = null;
        setTimeout(()=>startChallengeFlow(cfg), 320);
        if (!st.raw.ended) autoSave();   // 事件对资源的改动仍然要落盘
        return;
      }
      /* 事件里碰上了天骄榜上的人（第 22 轮） */
      if (api._pendingTianjiao){
        const tj = api._pendingTianjiao; api._pendingTianjiao = null;
        if (!st.raw.ended) autoSave();
        setTimeout(()=>showTianjiao(tj), 320);
        return;
      }
      /* 事件把比武请帖直接塞给了你 */
      if (api._pendingTourney){
        const b = api._pendingTourney; api._pendingTourney = null;
        if (!st.raw.ended) autoSave();
        setTimeout(()=>showTourneyInvite(b), 320);
        return;
      }
      /* 第 22 轮：事件会改修为 / 寿元 / 卡牌 / 灵石，
         以前这些改动**不落盘** —— 看完事件直接关页面就白改了。 */
      if (!st.raw.ended) autoSave();
      if (api._ended) return;
      const sc = G.Engine.checkSectCollapse();
      if (sc) showEnding(sc);
      if (pendingDeath) { const d = pendingDeath; pendingDeath=null; afterDeath(d); }
    });
    wrap.appendChild(b);
  });

  sheet(ev.title, body, foot);
}

/* 给事件用的 API——第 19 轮起由引擎提供唯一真源，界面只挂一个「死亡过场」钩子 */
let pendingDeath = null;

const api = G.Engine.makeActions({
  onDeath(d){ pendingDeath = d; }
});

/* ---- 挑战（战斗 / 天劫） ---- */
let activeChallenge = null;

function startTribulationFlow(preText){
  const ch = G.Engine.startTribulation();
  ch.cfg.preText = preText;
  activeChallenge = ch;
  autoSave();                       // 战斗一旦开始就落盘，避免中途关掉丢局面
  renderChallenge();

/* 业障满 → 天谴 */
function startKillerTribulationFlow(){
  const ch = G.Engine.startKillerTribulation();
  activeChallenge = ch;
  autoSave();
  renderChallenge();
}

function startChallengeFlow(cfg){
  const ch = G.Engine.startChallenge(cfg);
  activeChallenge = ch;
  autoSave();                       // 同上：先把「正在战斗」写进存档
  renderChallenge();
}

function renderChallenge(){
  const ch = activeChallenge || G.Engine.challenge;
  if (!ch) return;
  activeChallenge = ch;

  const isTb = ch.type === 'tribulation';
  const body = el('div');

  if (ch.round === 1 && ch.cfg.preText){
    body.appendChild(el('div','ev-flavor', ch.cfg.preText));
  }
  if (ch.round === 1 && ch.cfg.txt){
    body.appendChild(el('div','ev-text', ch.cfg.txt.replace(/\n/g,'<br>')));
  }

  // ---- 双方血条 ----
  const bars = el('div','fight-bars');
  const ri = G.Engine.foeRealmInfo();
  const foeSub = `境界：<b class="${ri.known?'':'unknown'}">${ri.label}</b>` +
    (ri.known ? `　${ri.compare}` : '') +
    `　·　${ri.tierLabel}　攻击 ${ch.foeAtk}`;
  bars.appendChild(barBlock(ch.foeName, ch.foeHp, ch.foeHpMax, 'foe', foeSub));
  bars.appendChild(barBlock('你', ch.hp, ch.hpMax, 'me',
    `普通攻击 ${ch.stats.basicAtk}　真气 ${ch.qi}/${ch.qiMax}`));
  body.appendChild(bars);

  // 一场战斗开始时，给一次「该不该打」的提示
  if (ch.round === 1){
    const warn = el('div','fight-warn ' + (ri.known ? (ri.gap>=3?'risky':'ok') : 'danger'));
    if (!ri.known){
      warn.textContent = '⚠ 此敌境界未知，深不可测。打赢了收获极大，打输了要去转盘。';
    } else if (ri.gap >= 3){
      warn.textContent = '⚠ 它比你强不少。想清楚再动手。';
    } else if (ri.gap <= -2){
      warn.textContent = '它远不如你。这一场很轻松。';
    } else {
      warn.textContent = '势均力敌。放心打。';
    }
    body.appendChild(warn);
  }

  // ---- 真气条 ----
  const qiWrap = el('div','qi-wrap');
  qiWrap.innerHTML = '<div class="qi-bar"><div class="qi-fill" style="width:' +
    Math.round(ch.qi/ch.qiMax*100) + '%"></div></div><div class="qi-label">真 气</div>';
  body.appendChild(qiWrap);

  // ---- 战斗日志 ----
  if (ch.logLines && ch.logLines.length){
    const lg = el('div','fight-log');
    ch.logLines.slice(-4).forEach(function(t){ lg.appendChild(el('div','fight-log-i', t)); });
    body.appendChild(lg);
  }

  // ---- 行动区 ----
  const acts = el('div');
  acts.style.marginTop = '12px';

  const bBasic = el('button','ev-choice fight-basic');
  bBasic.innerHTML =
    '<div class="ev-ctext">普通攻击　<span class="tag-inf">不限次</span></div>' +
    '<div class="ev-cmeta">造成约 ' + ch.stats.basicAtk + ' 点伤害　不消耗真气</div>';
  bBasic.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.basicAttack(); }); });
  acts.appendChild(bBasic);

  // 招式（冷却制，永久保留）
  const techs = Array.from(new Set(G.Engine.state().raw.deck)).filter(function(n){ return G.TECHNIQUES[n]; });
  techs.forEach(function(n){
    const t = G.TECHNIQUES[n];
    const cd = ch.cooldowns[n] || 0;
    const noQi = ch.qi < t.qi;
    // 材料成本（灵石 / 阳寿）——第 20 轮接上，以前卡面写了引擎不认
    let costTxt = '', noCost = false;
    if (t.cost){
      const parts = [];
      if (t.cost.stone){
        parts.push('石' + t.cost.stone);
        if (G.Engine.state().raw.stone < t.cost.stone) noCost = true;
      }
      if (t.cost.life){
        const need = G.Engine.evLifePct(t.cost.life);
        parts.push('寿' + need);
        if (G.Engine.state().raw.life <= need) noCost = true;
      }
      if (parts.length) costTxt = '　需' + parts.join(' ');
    }
    let effect = '';
    if (t.kind==='dmg') effect = '伤害约 ' + Math.round(ch.stats.techPower * (ch.stats.techMul||1) * t.mul);
    else if (t.kind==='heal') effect = '回复约 ' + Math.round(ch.stats.techPower * t.heal) + ' 气血';
    else if (t.kind==='ward') effect = '护体 +' + Math.round(ch.stats.ward * t.ward);
    else if (t.kind==='buff') effect = '闪避大幅提升';
    else if (t.kind==='karma') effect = '业障 ' + t.karma + '，回复气血';
    // 复合招式（例如「万符归阵」= 伤害 + 护体）：两半都要显示出来
    if (t.kind!=='ward' && t.ward) effect += '　护体 +' + Math.round(ch.stats.ward * t.ward);
    if (t.kind!=='heal' && t.heal) effect += '　回复气血';
    if (t.kind!=='dmg' && t.mul) effect += '　伤害约 ' + Math.round(ch.stats.techPower * (ch.stats.techMul||1) * t.mul);
    const stateTxt = cd>0 ? ('冷却 ' + cd) : (noQi ? ('真气不足 需' + t.qi) : ('真气 ' + t.qi));
    const b = el('button','ev-choice');
    b.innerHTML =
      '<div class="ev-ctext">' + n + '　<span class="tag-inf ' + (cd>0?'dim':'') + '">' + stateTxt + '</span></div>' +
      '<div class="ev-cmeta">' + effect + '　冷却 ' + t.cd + ' 回合' +
        (costTxt ? '　<span class="' + (noCost?'cost-lack':'cost-ok') + '">' + costTxt + '</span>' : '') + '</div>';
    if (cd>0 || noQi || noCost) b.disabled = true;
    b.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.useTechnique(n); }); });
    acts.appendChild(b);
  });

  // 丹药（一次性）
  const pills = Array.from(new Set(G.Engine.state().raw.deck)).filter(function(n){
    const c = G.CARDS[n]; return c && c.type === '丹药';
  });
  pills.slice(0,3).forEach(function(n){
    const c = G.CARDS[n];
    const b = el('button','ev-choice');
    b.innerHTML = '<div class="ev-ctext">服丹 · ' + n + '</div>' +
      '<div class="ev-cmeta">' + (c.desc||'').slice(0,20) + '　（用掉一枚）</div>';
    b.addEventListener('click', function(){ doFightAct(function(){ return G.Engine.usePill(n); }); });
    acts.appendChild(b);
  });

  body.appendChild(acts);

  const foot = [ el('div','fight-round', '第 ' + ch.round + ' 回合') ];
  sheet(isTb ? '◆ 天 劫' : '◆ 交 手', body, foot);
}

/* 双方血条块 */
function barBlock(name, hp, hpMax, side, sub){
  const pct = Math.max(0, Math.min(100, hp/hpMax*100));
  const cls = pct < 20 ? 'danger' : (pct < 45 ? 'warn' : '');
  const d = el('div','fight-bar-block ' + side);
  d.innerHTML =
    '<div class="fight-name"><span>' + name + '</span><span>' + Math.max(0,hp) + ' / ' + hpMax + '</span></div>' +
    '<div class="life-bar"><div class="life-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
    '<div class="fight-sub">' + sub + '</div>';
  return d;
}

/* 执行一次战斗行动并刷新界面 */
function doFightAct(fn){
  const r = fn();
  if (r && r.ok === false){ if (r.msg) toast(r.msg,'bad'); return; }
  const ch = G.Engine.challenge;
  activeChallenge = ch;
  /* 第 22 轮：每打一个回合就存一次。
     战斗是「关掉页面最亏」的地方 —— 不存的话整场遭遇凭空消失，
     而进场前的行动已经被扣掉了。 */
  autoSave();
  if (ch && ch.over) finishChallenge();
  else renderChallenge();
}

function finishChallenge(){
  const out = G.Engine.resolveChallenge();
  activeChallenge = null;
  G.Engine.clearBossActive();      // 遭遇结束，解除 Boss 锁定
  closeSheet();
  if (!out) return;
  renderRun();
  autoSave();                      // 第 22 轮：一场仗打完立刻落盘

  /* ---- 天骄榜之战（第 22 轮）------------------------------------------------
     天骄不管输赢都有专属结算文本，而且输了**不进转盘** ——
     设定上他们是「留手」的（你连让他认真的资格都还没有）。
     这样玩家才敢去试，而不是遇到天骄只能躲。 */
  if (out.tianjiaoId){
    const tj = G.TIANJIAO.find(t=>t.id===out.tianjiaoId);
    if (tj){
      autoSave();
      setTimeout(()=>showTianjiaoOutcome(tj, out.win), 320);
      return;
    }
  }

  /* ---- 比武大会（第 22 轮）------------------------------------------------
     比武输了也不进转盘 —— 台下有人拦着，这是规矩。
     输一场就淘汰，但赛果（奖金 / 名号）照给。 */
  if (out.tourney){
    const adv = G.Engine.advanceTourney(out.win);
    autoSave();
    if (adv && adv.next){
      setTimeout(()=>{
        toast(out.win ? '这一场赢了，进下一轮。' : '这一场输了。', out.win?'good':'bad');
        showTourneyRound();
      }, 420);
      return;
    }
    setTimeout(()=>showTourneyResult(), 420);
    return;
  }

  // Boss 结算文本 / 隐藏结局 / 普通结局
  if (afterChallenge(out)) return;
  if (out.end){ afterDeath(out.end); return; }

  // 胜利 → 展示战利品
  if (out.win && out.rewards){
    const r = out.rewards;
    let html = `<div class="ev-text">你胜了 <b>${out.foeName}</b>。\n（${out.rounds} 回合，余气血 ${out.hpLeft} / ${out.hpMax}）</div>`;
    html += `<div class="reward-box">
      <div class="reward-line">灵石 <b>+${r.stone}</b></div>
      <div class="reward-line">修为 <b>+${r.cult}</b></div>
      ${r.card ? `<div class="reward-line gold">获得招式 · <b>${r.card}</b></div>` : ''}
      ${r.extra ? `<div class="reward-line">${r.extra}</div>` : ''}
    </div>`;
    sheet('◆ 战 利 品', html, [ btn('收下','btn-main btn-go', ()=>{
      closeSheet(); renderRun();
      const sc = G.Engine.checkSectCollapse();
      if (sc){ if (sc.enterSanxiu){ enterSanxiuFlow(); return; } showEnding(sc); return; }
      afterActionFlow();
    }) ]);
    return;
  }

  toast(out.win ? `你战胜了 ${out.foeName}（${out.rounds} 回合）`
                : `你败给了 ${out.foeName}`, out.win?'good':'bad');
  // 战斗失败 → 转盘决定后果
  if (out.wheel){
    setTimeout(()=>showWheel(!!out.killerWheel), 400);
    return;
  }
  const sc = G.Engine.checkSectCollapse();
  if (sc){
    if (sc.enterSanxiu){ enterSanxiuFlow(); return; }
    showEnding(sc); return;
  }
  afterActionFlow();
}

/* ---- 储物袋（第 24 轮）----
   玩家反馈：「丹药什么的物品，仅能在战斗中使用，在战斗外无法使用，
   建议新增一个『背包』或储物袋设定」。

   丹药本来就是牌（一张牌 = 一枚），所以这里不需要新数据，
   只是给它们一个**随时能用**的入口。 */
const RARITY_TEXT = { '凡':'#8a8078', '良':'#5fae8f', '玄':'#5b7fa8', '道':'#c9a227' };

function showBag(){
  const st = G.Engine.state();
  if (!st) return;
  const list = G.Engine.inventory();
  const body = el('div');

  const inBattle = !!(G.Engine.challenge && G.Engine.challenge.active);

  body.appendChild(el('div','arc-i',
    `储物袋里有 <b style="color:#c9a227">${G.Engine.pillCount()}</b> 枚丹药。\n` +
    (inBattle
      ? '<span style="color:#f0a99f">你正在战斗中 —— 这里吃丹会消耗一个回合。</span>'
      : '战斗内外都能服用。回血的丹在战斗里补气血，在战斗外补寿元。') +
    '<br><span style="color:#6f6459">（功法、术法、法宝在「牌组」里看）</span>'));

  if (!list.length){
    body.appendChild(el('div','arc-empty','袋子是空的。\n\n丹药来自：探索、机缘、丹房、散修洞府的丹炉。'));
    sheet('储 物 袋', body, []);
    return;
  }

  list.forEach(it=>{
    const row = el('div','bld-item' + (it.rarity==='道'||it.rarity==='玄' ? ' built':''));
    const eff = [];
    if (it.effect.life) eff.push((inBattle?'气血':'寿元') + ' +' + it.effect.life);
    if (it.effect.cult) eff.push('修为 +' + it.effect.cult);
    if (it.effect.lifeMax) eff.push('寿元上限 +' + it.effect.lifeMax);
    if (it.effect.karma) eff.push('业障 ' + (it.effect.karma>0?'+':'') + it.effect.karma);
    const nameCls = it.rarity==='道' ? 'var(--gold2)' : (it.rarity==='玄' ? 'var(--blue)' : 'var(--ink)');
    row.innerHTML =
      `<div class="bld-info">
         <div class="bld-name"><span style="color:${nameCls}">${it.name}</span>` +
         `<span class="lv" style="color:${RARITY_TEXT[it.rarity]}">${it.rarity}</span>` +
         `<span class="lv">×${it.count}</span></div>
         <div class="bld-desc">${eff.join('　')}</div>
         <div class="bld-desc" style="color:#5c5349">${it.desc}</div>
       </div>`;
    const bt = el('button','bld-btn','服 用');
    bt.addEventListener('click', ()=>{
      const r = G.Engine.usePill(it.name);
      if (!r || !r.ok){ toast((r&&r.msg)||'用不了','bad'); return; }
      autoSave();
      if (r.outOfBattle){
        toast(r.msg, 'good');
        renderRun();
        showBag();                       // 刷新列表（可能吃完了）
        return;
      }
      /* 战斗内吃丹：交给战斗界面接管 */
      closeSheet();
      const ch = G.Engine.challenge;
      if (ch && ch.over) finishChallenge();
      else { activeChallenge = ch; renderChallenge(); }
    });
    row.appendChild(bt);
    body.appendChild(row);
  });

  sheet('储 物 袋', body, [
    btn('关 上','btn-main',()=>closeSheet())
  ]);
}

/* ---- 牌组 / 宗门 / 记事 ---- */
function showDeck(){
  const raw = G.Engine.state().raw;
  const cs2 = G.Engine.combatStats();   // 第 20 轮：卡面要显示「战斗里真正的数值」
  const body = el('div');
  const groups = { '功法':[], '术法':[], '法宝':[], '丹药':[] };
  const counted = {};
  raw.deck.forEach(n=>{ counted[n] = (counted[n]||0) + 1; });
  Object.keys(counted).forEach(n=>{
    const c = G.CARDS[n];
    if (c) groups[c.type].push({ n:n, c:c, k:counted[n] });
  });

  // ---- 流派套装状态（第 18 轮）----
  const sets = G.Engine.activeSets();
  const schoolCount = {};
  raw.deck.forEach(n=>{
    const c = G.CARDS[n];
    if (c && c.type==='法宝'){ const sc = c.school||'zhong'; schoolCount[sc]=(schoolCount[sc]||0)+1; }
  });
  if (Object.keys(schoolCount).length){
    body.appendChild(el('div','arc-h','法 宝 流 派'));
    const box = el('div','set-box');
    G.SETS.forEach(st=>{
      const have = schoolCount[st.school] || 0;
      const on = have >= st.need;
      const row = el('div','set-row' + (on?' on':''));
      row.innerHTML =
        `<div class="set-top"><span class="set-name">${st.name}</span>
           <span class="set-prog">${have} / ${st.need}</span></div>
         <div class="set-eff">${st.effect}</div>`;
      box.appendChild(row);
    });
    body.appendChild(box);
  }

  Object.keys(groups).forEach(t=>{
    if (!groups[t].length) return;
    body.appendChild(el('div','arc-h', t + `（${groups[t].reduce((a,b)=>a+b.k,0)}）`));
    groups[t].forEach(g=>{
      const rl = (raw.refine && raw.refine[g.n]) || 0;
      const cm = G.Engine.cardMul(g.n);
      /* 第 20 轮：以前卡面显示的是卡自己的 power/heal/ward 原始值，
         而战斗实际用的是「属性 × 招式倍率 × 常驻战力乘数」。
         两个数字对不上，玩家就觉得「界面在骗我」。现在显示实际值。 */
      const t = G.TECHNIQUES[g.n];
      let powTxt = '';
      if (t){
        if (t.kind==='dmg') powTxt = '伤害约 ' + Math.round(cs2.techPower * cs2.techMul * t.mul);
        else if (t.kind==='heal') powTxt = '回复约 ' + Math.round(cs2.techPower * t.heal);
        else if (t.kind==='ward') powTxt = '护体 +' + Math.round(cs2.ward * t.ward);
        else if (t.kind==='buff') powTxt = '闪避大幅提升';
        else if (t.kind==='karma') powTxt = '业障 ' + t.karma;
        if (t.kind!=='ward' && t.ward) powTxt += '　护体 +' + Math.round(cs2.ward * t.ward);
        if (t.kind!=='dmg' && t.mul) powTxt += '　伤害约 ' + Math.round(cs2.techPower * cs2.techMul * t.mul);
      } else if (g.c.power) {
        powTxt = '常驻战力 ' + Math.round(g.c.power * cm);
      } else if (g.c.eff && g.c.eff.power) {
        powTxt = '常驻战力 ' + Math.round(g.c.eff.power * cm);
      } else if (g.c.ward || (g.c.eff && g.c.eff.ward)) {
        powTxt = '常驻护体 ' + Math.round((g.c.ward||0) + ((g.c.eff&&g.c.eff.ward)||0));
      } else if (g.c.use) {
        const u = g.c.use;
        const pm = 1 + (a.pillSetMul||0);
        powTxt = [u.life?('气血 +'+Math.round(u.life*pm)):'', u.cult?('修为 +'+Math.round(u.cult*pm)):'',
                  u.lifeMax?('寿元上限 +'+Math.round(u.lifeMax*pm)):''].filter(Boolean).join('　');
      }
      const d = el('div','card-item');
      d.innerHTML =
        `<div class="card-top">
           <span class="card-name">${g.n}
             ${rl>0?`<span class="refine-tag">+${rl}</span>`:''}
             <span class="card-tag">${g.c.rarity}</span>
           </span>
           <span class="card-pow">${powTxt}</span>
         </div>
         <div class="card-desc">${g.c.desc||''}</div>`;
      body.appendChild(d);
    });
  });

  /* ---- 总计 ----
     第 20 轮：这里以前显示 agg().power / agg().ward 的原始值，
     而战斗里一分钱都不算——等于在骗玩家。现在**显示战斗真正用的数值**，
     并且把「卡牌对你伤害的乘数」讲清楚。 */
  const a = G.Engine.agg();
  const sum = el('div','arc-sec');
  sum.appendChild(el('div','arc-h','总 计'));
  sum.appendChild(el('div','arc-i',
    `常驻战力 ${Math.round(a.power)}　→　伤害 <b>×${cs2.powerMul.toFixed(2)}</b><br>` +
    `常驻护体 ${Math.round(a.ward)}　→　受到伤害 <b>−${Math.round(cs2.wardGuard*100)}%</b><br>` +
    `招式加成 +${Math.round((a.techMul||0)*100)}%　修为效率 +${Math.round(a.cultMul*100)}%<br>` +
    `行动减耗 ${a.costReduce}${a.costReducePct?` + ${Math.round(a.costReducePct*100)}%`:''}　机缘 +${a.findBonus}` +
    (sets.length ? `<br><b style="color:#c9a227">生效套装：${sets.map(x=>x.name).join('、')}</b>` : '')));
  body.appendChild(sum);

  sheet('牌 组', body, []);
}

/* ---- 失败转盘 ----
   扇区大小由属性决定：身法高则「脱身」大，体魄高则不易「身死」。
   转盘 = 你的道行替你赌命。                                     */
function showWheel(killerBoost){
  const res = G.Engine.spinWheel(killerBoost);
  const body = el('div');

  body.appendChild(el('div','ev-text','你倒下了。\n接下来的事，不由你决定。'));

  const wheel = el('div','wheel-wrap');
  const disc = el('div','wheel-disc');
  // 按权重画扇区（用 conic-gradient 表现）
  let acc = 0;
  const stops = res.slices.map(s=>{
    const from = acc / res.total * 360;
    acc += s.weight;
    const to = acc / res.total * 360;
    const color = s.tone==='fatal' ? '#7a2f28'
                : s.tone==='bad' ? '#5a3a26'
                : s.tone==='ok' ? '#4a4436' : '#3a5a4a';
    return `${color} ${from}deg ${to}deg`;
  }).join(', ');
  disc.style.background = `conic-gradient(${stops})`;

  const pointer = el('div','wheel-pointer');
  wheel.appendChild(disc);
  wheel.appendChild(pointer);
  body.appendChild(wheel);

  // 图例：让玩家看见自己的属性把哪些扇区变大了
  const legend = el('div','wheel-legend');
  res.slices.forEach(s=>{
    const pct = (s.weight / res.total * 100).toFixed(0);
    legend.appendChild(el('div','wheel-li tone-' + s.tone,
      `${s.name}　<span class="wp">${pct}%</span>`));
  });
  body.appendChild(legend);

  const foot = [];
  const btnSpin = btn('转 动','btn-main btn-go', ()=>{
    btnSpin.disabled = true;
    disc.classList.add('spinning');
    pointer.classList.add('spinning');
    setTimeout(()=>{
      disc.classList.remove('spinning');
      pointer.classList.remove('spinning');
      const out = G.Engine.applyWheelResult(res.hit.id);
      closeSheet();
      sheet('◆ ' + res.hit.name,
        `<div class="ev-text">${res.hit.text.replace(/\n/g,'<br>')}</div>` +
        (out.effect ? `<div class="ev-flavor">${out.effect}</div>` : ''),
        []);
      renderRun();
      setTimeout(()=>{
        closeSheet();
        if (out.end){ showEnding(out.end); return; }
        afterActionFlow();
      }, 1700);
    }, 1500);
  });
  foot.push(btnSpin);

  sheet('◆ 转 盘', body, foot);
}

function onSanxiuAction(a){
  const kind = a.id.replace('sx_','');
  const res = G.Engine.doSanxiuAction(kind);
  if (!res) return;
  const line = SANXIU_FLAVOR[a.id] || '';
  toast(line + '　' + res.msg, 'good');
  if (res.note) setTimeout(()=>toast(res.note,'epic'), 400);
  (res.goals||[]).forEach((g,i)=>{
    setTimeout(()=>toast(`【达成】${g.name} — ${g.reward}`,'epic'), 800 + i*500);
  });
  if (res.dead){ afterDeath(res.dead); return; }
  renderRun();
  if (res.cards && res.cards.length){
    setTimeout(()=>showCardPick(res.cards, afterActionFlow), 240);
    return;
  }
  // 活满四季 → 这一世有了完整交代
  if (res.end){
    setTimeout(()=>showEnding(res.end), 600);
    return;
  }
  afterActionFlow();
}

      (story.next ? story.next.name : '') + '</div>' +
      '<div class="ss-hint">' + (story.need > 0

    const b = el('button','sect-task');
    b.innerHTML = '<div class="st-name">' + t.name + '</div>' +
      '<div class="st-desc">' + t.desc + '</div>' +
      '<div class="st-gain">贡献 +' + t.contrib + '　灵石 +' + t.stone +
      (t.risk>0 ? '　风险 ' + Math.round(t.risk*100) + '%' : '　无风险') + '</div>';
    b.addEventListener('click', ()=>{
      const r = G.Engine.doSectTask(t.id);

      toast(t.name + '：贡献 +' + r.contrib + '　灵石 +' + r.stone +
        (r.hurt ? '　受伤 寿元 −' + r.hurt : ''), r.hurt ? 'bad' : 'good');

      showSect(); renderRun();

  body.appendChild(el('div','arc-i',
    '气运越高，请功法越便宜；位份越高，折扣越大。' +
    '<br><span style="color:#6f6459">当前：灵石 ' + raw.stone + '</span>'));
  G.SECT_SHOP.forEach(it=>{
    const know = raw.deck.indexOf(it.card) >= 0;
    const chk = G.Engine.canBuyShop(it.id);
    const pr = G.Engine.shopPrice(it.id);
    const reqRank = G.SECT_RANKS.find(r=>r.id===it.rank);
    const locked = chk.msg && chk.msg.indexOf('位份') >= 0;

    const item = el('div','shop-item' + (know ? ' owned' : '') + (locked ? ' locked' : ''));
    const bt = el('button','shop-buy',

      '<div class="shop-info">' +
        '<div class="shop-name">' + it.card +
          (pr.base > pr.price ? '<span class="shop-off">省 ' + (pr.base - pr.price) + '</span>' : '') +

        '<div class="shop-desc">' + it.desc + '</div>' +

    body.appendChild(item);

  /* ---- 建筑 ---- */
  body.appendChild(el('div','arc-h','建 筑'));
  G.BUILDINGS.forEach(b=>{
    const lv = raw.buildings[b.id] || 0;
    const cost = G.Engine.buildCost(b.id);
    const item = el('div','bld-item' + (lv>0?' built':''));
    const can = cost!==null && raw.stone >= cost;
    const bt = el('button','bld-btn', cost===null?'已满':'营造<small style="display:block;font-size:10px;color:#6f6459">石 '+cost+'</small>');
    if (!can) bt.disabled = true;
    else bt.addEventListener('click', ()=>{
      if (G.Engine.doBuild(b.id)){ toast('营造 ' + b.name + ' 成功','good'); autoSave(); showSect(); renderRun(); }
    });
    item.innerHTML =
      '<div class="bld-info"><div class="bld-name">' + b.name +
        '<span class="lv">' + lv + '/' + b.max + '</span></div>' +
        '<div class="bld-desc">' + b.desc + '</div></div>';
    item.appendChild(bt);
    body.appendChild(item);
  });

  /* ---- 弟子 ---- */
  body.appendChild(el('div','arc-h','弟 子'));
  if (!raw.disciples.length){
    body.appendChild(el('div','arc-empty','门下还没有人。'));
    const b = btn('开 门 收 徒（宗门气运 −8）','btn-main',()=>{
      const d = G.Engine.recruitDisciple();
      toast(d.name + ' 入了门（资质 ' + d.quality + '·' + d.trait.n + '）','good');
      autoSave();
      showSect(); renderRun();
    }, raw.sectQi < 8);
    body.appendChild(b);
  } else {
    raw.disciples.forEach(d=>{
      const item = el('div','bld-item');
      item.innerHTML =
        '<div class="bld-info"><div class="bld-name">' + d.name +
          '<span class="lv">资质 ' + d.quality + '　忠诚 ' + Math.round(d.loyalty) + '</span></div>' +
          '<div class="bld-desc">' + d.trait.n + '　' + d.trait.e + '</div></div>';
      body.appendChild(item);
    });
    const b2 = btn('再 收 一 徒（气运 −8）','btn-main',()=>{
      const d = G.Engine.recruitDisciple();
      toast(d.name + ' 入了门','good');
      autoSave();
      showSect(); renderRun();
    }, raw.sectQi < 8);
    body.appendChild(b2);
  }

  sheet('宗 门', body, []);
}

/* 线索：故意不告诉你每条线索「怎么拿」，只告诉你「还差几条」。
   这是本作「隐隐投射」的核心——玩家自己拼，游戏不讲解。 */
function showClue(){
  const st = G.Engine.state();
  const raw = st.raw;
  const prog = G.Engine.clueProgress();
  const body = el('div');

  body.appendChild(el('div','arc-i',
    `你已经注意到了 <b style="color:#c9a227">${prog.got}</b> / ${prog.total} 处不对。\n` +
    (prog.got===0 ? '目前一切正常。' : '它们之间，好像有点关系。')));

  G.LORE.zongmen.forEach(c=>{
    if (raw.clues.includes(c.id)) body.appendChild(el('div','arc-i', c.text));
    else body.appendChild(el('div','arc-i unk','（你还什么都没有注意到）'));
  });

  body.appendChild(el('div','rune','— 集齐全部，会有什么事发生 —'));
  sheet('线 索', body, []);
}

/* ============================================================
   结局
   ============================================================ */
function showEnding(r){
  if (!r) return;
  $('endTitle').textContent = r.ending.title;
  $('endSub').innerHTML = (r.sub||'').replace(/\n/g,'<br>');

  const st = r.stats;
  const body = $('endBody');
  body.innerHTML = '';
  const rows = [
    ['最终境界', st.realm],
    ['所余修为', st.cult],
    ['所余灵石', st.stone],
    ['业 障', st.karma],
    ['人 情', st.favor],
    ['行 动', st.actions + ' 次'],
    ['牌 组', st.cards + ' 张'],
    ['门 下', st.disciples + ' 人'],
    ['线 索', st.clues + ' 条']
  ];
  rows.forEach(([k,v])=>{
    body.appendChild(el('div','end-row', `<span>${k}</span><b>${v}</b>`));
  });

  // 碎片明细：让玩家看得见「这一局的哪一部分换来了拼图」
  let gainHtml = `拼图 +<b>◈ ${r.frag}</b>`;
  if (r.fragParts){
    const detail = Object.keys(r.fragParts)
      .filter(k => r.fragParts[k] > 0)
      .map(k => `${k} ${r.fragParts[k]}`)
      .join('　');
    gainHtml += `<div class="end-frag-parts">${detail}</div>`;
  }
  $('endGain').innerHTML = gainHtml;
  if (r.newLore){
    const c = el('div','clue', r.newLore);
    $('endSub').appendChild(document.createElement('br'));
    $('endGain').appendChild(c);
  }
  show('screen-end');
  renderMeta();
}

/* ---- 死亡后处理 ---- */
function afterDeath(dead){
  if (!dead) return;
  if (dead.saved){
    toast('你倒下去了。有什么东西托了你一把。','epic');
    renderRun();
    return;
  }
  showEnding(dead);
}

      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      $('pane-' + b.dataset.tab).classList.add('active');
    });
  });

  $('btnReset').addEventListener('click', ()=>{
    sheet('抹去全部记忆', '<div class="ev-text">这将删除所有碎片、升级与档案。<br>拼图会重新空掉。<br><br>确定吗？</div>', [
      btn('确 定','btn-main',()=>{ G.Engine.wipe(); closeSheet(); renderMeta(); toast('桌上空了。',''); }),
      btn('再想想','btn-main',()=>closeSheet())
    ]);
  });

  if ($('btnSaveIO')) $('btnSaveIO').addEventListener('click', showSaveIO);

  $('btnReroll').addEventListener('click', ()=>{ currentLots = G.Engine.drawLots(); renderDraw(); });
  $('btnStartRun').addEventListener('click', ()=>{
    G.Engine.clearRun();                 // 开新局，清掉旧存档
    G.Engine.start(currentLots, currentLots.seed);
    show('screen-run');
    renderRun();
    autoSave();
    toast('你入了山门。','' );
  });

  // 继续上一局（若有存档）
  const saved = G.Engine.hasSavedRun();
  if (saved){
    const btnResume = $('btnResume');
    if (btnResume){
      btnResume.classList.remove('hidden');
      const rname = G.REALMS[saved.realmIdx] ? G.REALMS[saved.realmIdx].name : saved.realm;
      btnResume.innerHTML = `继 续 上 一 局<span>${saved.realm}　第 ${saved.actions} 次行动　寿元 ${saved.life} / ${saved.maxLife}${saved.inBattle ? '　·　战斗未结束' : ''}</span>`;
      btnResume.addEventListener('click', ()=>{
        const r = G.Engine.loadRun();
        if (!r){ toast('存档读不出来','bad'); return; }
        show('screen-run');
        renderRun();
        /* 第 22 轮：如果上次是在战斗中关掉页面的，把那一场接回来 ——
           敌人血量、回合数、真气、冷却都在，接着打就行。 */
        const ch = G.Engine.challenge;
        if (ch && ch.active){
          activeChallenge = ch;
          toast('你回到了那一场没打完的架里。','epic');
          setTimeout(()=>renderChallenge(), 320);
          return;
        }
        toast('你回到了山中。','epic');
      });
    }
  }

  $('btnSheetClose').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', e=>{ if (e.target.id==='overlay') closeSheet(); });

  $('btnAttr').addEventListener('click', showAttrs);
  $('btnDeck').addEventListener('click', showDeck);
  $('btnBag').addEventListener('click', showBag);
  $('btnSect').addEventListener('click', showSect);
  $('btnClue').addEventListener('click', showClue);
  $('btnLog').addEventListener('click', showLog);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnBackMeta').addEventListener('click', ()=>{ show('screen-meta'); renderMeta(); });

  // 键盘
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape') closeSheet();
    if (!sheetOpen() && $('screen-run').classList.contains('active')){
      const n = parseInt(e.key,10);
      if (n>=1 && n<=9){
        const acts = G.Engine.availableActions().filter(a=>!a.disabled);
        if (acts[n-1]) onAction(acts[n-1]);
      }
    }
  });

  renderMeta();
  show('screen-meta');

  /* 第 21 轮：开局就检查存储能不能用。
     如果不能用（无痕模式 / 禁用网站数据），
     与其让玩家玩一小时后才发现什么都没留下，不如现在就说清楚。 */
  if (!G.Engine.storageAvailable()){
    setTimeout(()=>{
      sheet('⚠ 这个浏览器不让保存进度',
        `<div class="ev-text">游戏需要把进度写进浏览器的**本地存储**。\n` +
        `但这个浏览器现在不允许写入。\n\n` +
        `最常见的原因：你在**无痕 / 隐私模式**下打开的。\n\n` +
        `<b style="color:#c9a227">这意味着：关掉页面，进度就没了。</b>\n\n` +
        `想留下进度，可以：\n` +
        `· 用**普通窗口**重新打开这个网址\n` +
        `· 或者在「存档搬移」里导出一段字符串，自己保管</div>`,
        [ btn('知道了','btn-main',()=>closeSheet()),
          btn('去存档搬移','btn-go btn-main',()=>{ closeSheet(); showSaveIO(); }) ]);
    }, 400);
  }
}

G.UI = { init, toast, show, renderMeta, renderRun, showEnding };

document.addEventListener('DOMContentLoaded', init);

})();

</script>
</body>
</html>
