/* ==================== 四季与天气 ==================== */

{
  id:'sx_flood', chapter:'sanxiu', tier:0, title:'春汛', cat:'散修',
  text:'开春下了半个月的雨。\n溪水漫上来了，你门前那块地泡在水里。\n\n溪边你搭的那个取水的小台子，冲没了。',
  choices:[
    { label:'把地重新整一遍',
      eff:(s,a)=>{ a.lifeBy(-0.05); a.cult(20); a.stone(10);
        return '你干了两天，把土翻出来重新垒好。\n\n垒到最后你发现，泡过的地其实更肥。\n寿元 −' + a.lifePct(0.05) + '　修为 +' + a.gain(20) + '　灵石 +10'; } },
    { label:'趁着水大，去下游捞一捞',
      eff:(s,a)=>{ if(a.chance(0.5)){ a.stone(55); a.lifeBy(-0.03);
          return '你在下游的弯道里捞上来不少东西：木头、一只没主的桶、还有一柄锈得看不清的刀。\n\n刀你留下了。铁是好铁。\n灵石 +55　寿元 −' + a.lifePct(0.03); }
        a.lifeBy(-0.06);
        return '水太急了。你被冲出去很远，抱住一棵树才停下来。\n\n上岸的时候，鞋没了。\n寿元 −' + a.lifePct(0.06); } },
    { label:'待在屋里，等它退',
      eff:(s,a)=>{ a.lifeBy(0.04); a.cult(30);
        return '你哪也没去。\n\n雨打在屋顶上，一整天都没停。你把三本翻烂的书又翻了一遍。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(30); } }
  ]
},

{
  id:'sx_snow', chapter:'sanxiu', tier:0, title:'雪把门堵了', cat:'散修',
  text:'一夜的雪。\n早上你推门，推不开。\n\n你从窗户翻出去，发现雪已经齐腰了。',
  choices:[
    { label:'挖一条路出来',
      eff:(s,a)=>{ a.lifeBy(-0.04); a.cult(25);
        return '你挖了半天，从门口一直挖到溪边。\n\n挖完回头看，那条路在雪地里显得特别直。\n你站了一会儿，觉得挺好看。\n寿元 −' + a.lifePct(0.04) + '　修为 +' + a.gain(25); } },
    { label:'不挖了，回去烧火',
      eff:(s,a)=>{ a.lifeBy(0.05); a.cult(18);
        return '你把门从里面堵死，烧了一整天的火。\n\n雪在外面，你在里面。\n这一整天你没有做任何有用的事。\n寿元 +' + a.lifePct(0.05) + '　修为 +' + a.gain(18); } },
    { label:'去林子里看看有没有压塌的树',
      eff:(s,a)=>{ a.stone(35); a.lifeBy(-0.05); a.flag('snow_wood');
        return '你踩着雪进了林子。压塌的树有七棵。\n\n你拖回来两棵，劈了一个冬天都烧不完的柴。\n灵石 +35（剩下的卖给山下）　寿元 −' + a.lifePct(0.05); } }
  ]
},

{
  id:'sx_summer_night', chapter:'sanxiu', tier:0, title:'夏夜', cat:'散修',
  text:'屋里太热了，你搬了张竹席睡到院子里。\n\n躺下来才发现，头顶上全是星星。\n你以前从来没躺着看过。',
  choices:[
    { label:'数星星',
      eff:(s,a)=>{ a.lifeBy(0.04); a.cult(25);
        return '你数到三百多就数不清了。\n\n不是数不清——是有几颗的位置，你觉得刚才不在那儿。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(25); } },
    { label:'就这么躺着，什么都不数',
      eff:(s,a)=>{ a.lifeBy(0.05); a.cult(15);
        return '你什么都没想，就那么躺着。\n\n不知道什么时候睡着的。早上是被鸟吵醒的。\n寿元 +' + a.lifePct(0.05) + '　修为 +' + a.gain(15); } },
    { label:'回屋拿纸笔，把星图画下来',
      eff:(s,a)=>{ a.cult(35); a.clue('clue_world'); a.lifeBy(-0.02);
        return '你画了半宿。\n\n第二天摊开看，你画的那些星星连起来，是一个圈。\n你不记得自己为什么这么连。\n修为 +' + a.gain(35) + '　寿元 −' + a.lifePct(0.02); } }
  ]
},

{
  id:'sx_autumn_leaf', chapter:'sanxiu', tier:0, title:'秋', cat:'散修',
  text:'一夜之间，山黄了。\n你站在门口，看着叶子一片一片往下掉。\n\n你想起来，你是春天上山的。',
  choices:[
    { label:'扫一扫院子',
      eff:(s,a)=>{ a.lifeBy(0.03); a.cult(20);
        return '你扫了半天，堆了一小堆。\n\n扫到一半你就不想扫了，坐在叶堆上，把它们抓起来往天上扔。\n寿元 +' + a.lifePct(0.03) + '　修为 +' + a.gain(20); } },
    { label:'下山一趟，看看山下的秋天',
      eff:(s,a)=>{ a.stone(30); a.favor(2); a.lifeBy(-0.03);
        return '山下的秋天和山上不一样：田里是黄的，路上有人在推车。\n\n你在一户人家讨了碗水。他们问你从哪来。\n你想了想，说：“山上。”\n灵石 +30　人情 +2　寿元 −' + a.lifePct(0.03); } },
    { label:'什么都不做，看它掉完',
      eff:(s,a)=>{ a.lifeBy(0.04); a.cult(28);
        return '你在门口站了一炷香，又坐下来接着看。\n\n叶子掉了一天才掉完。\n你一片都没漏。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(28); } }
  ]
},

/* ==================== 山下的人 ==================== */

{
  id:'sx_village_sick', chapter:'sanxiu', tier:0, title:'山下有人病了', cat:'散修',
  text:'山下那户人家的小孩病了。\n老太太半夜来敲门，走了半宿的山路。\n\n“你会不会看病？”她问。\n你其实不会。',
  choices:[
    { label:'把存着的草药都带上，跟她下山',
      eff:(s,a)=>{ const d=s.sanxiu||{}; const cost=Math.min(d.herbStock||0, 20);
        a.lifeBy(-0.05); a.karma(-4); a.favor(5);
        s.sanxiu.herbStock = Math.max(0, (d.herbStock||0) - cost);
        return '你把药都带上了，虽然你只知道其中几味是干什么的。\n\n到了之后你煮了一锅，让小孩喝下去。\n你守了一夜。第二天早上，烧退了。\n\n老太太要给你钱。你没要。\n业障 −4　人情 +5　存药 −' + cost + '　寿元 −' + a.lifePct(0.05); } },
    { label:'只给她能治伤风的那几味',
      eff:(s,a)=>{ const d=s.sanxiu||{}; const cost=Math.min(d.herbStock||0, 8);
        a.karma(-2); a.favor(2); a.lifeBy(-0.01);
        s.sanxiu.herbStock = Math.max(0, (d.herbStock||0) - cost);
        return '你挑了几味最稳的给她，又写了个方子。\n\n“要是明天还烧，再来找我。”你说。\n她收下了，没再多要。\n业障 −2　人情 +2　存药 −' + cost; } },
    { label:'“我不会看病。”',
      eff:(s,a)=>{ a.cult(15);
        return '你说了实话。\n\n她愣了一下，说了声“打扰了”，转身走了。\n你在门口站着，看她打着灯笼一点点下山。\n\n第二天你下山打听了一次。小孩好了，是山下的大夫看的。\n修为 +' + a.gain(15); } }
  ]
},

{
  id:'sx_village_build', chapter:'sanxiu', tier:0, title:'村里修桥', cat:'散修',
  text:'山下那条河上的木桥塌了。村里凑钱重修，人手不够。\n\n管事的看见你，眼睛亮了一下：\n“山上那位，能不能来搭把手？”',
  choices:[
    { label:'去干三天',
      eff:(s,a)=>{ a.lifeBy(-0.08); a.karma(-5); a.favor(6); a.stone(-20); a.flag('built_bridge');
        return '你干了三天。搬石头、抬木头、下水打桩。\n\n第三天傍晚，桥合上了。有人放了一挂炮。\n晚上他们拉你喝酒，你没喝多少，但坐到最后。\n\n走的时候，管事的塞给你一个布包，你没打开看，回去才发现是钱。\n业障 −5　人情 +6　灵石 −20（你垫的料钱）　寿元 −' + a.lifePct(0.08); } },
    { label:'只出钱不出力',
      eff:(s,a)=>{ a.stone(-45); a.karma(-2); a.favor(2);
        return '你把灵石给了管事的，说自己有别的要紧事。\n\n他谢了几句，态度客气了很多。\n你回去的路上觉得，那几句客气有点扎人。\n灵石 −45　业障 −2　人情 +2'; } },
    { label:'“我不住山下。”',
      eff:(s,a)=>{ a.lifeBy(0.03); a.cult(20);
        return '“我不住山下。”你说。\n\n他“哦”了一声，也没多劝。\n\n桥后来修好了。你从上面走过一次，很稳。\n寿元 +' + a.lifePct(0.03) + '　修为 +' + a.gain(20); } }
  ]
},

{
  id:'sx_letter_from_sect', chapter:'sanxiu', tier:0, title:'一封信', cat:'散修', once:true,
  text:'山下捎上来一封信。\n信封上写的门派名，你认得。\n\n里面只有一张纸，纸上四个字：\n\n「尚在否？」',
  choices:[
    { label:'回信：在',
      eff:(s,a)=>{ a.lifeBy(0.02); a.cult(25); a.flag('replied_yes');
        return '你回了一个字：“在。”\n\n写完你想了想，又添了一句：“山上挺好的。”\n\n信捎走了。此后再没有回音。\n寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(25); } },
    { label:'不回',
      eff:(s,a)=>{ a.lifeBy(0.04); a.cult(35); a.karma(1);
        return '你把信收进箱底，没回。\n\n当天晚上你睡得不太好，第二天就好了。\n再往后你就没想起过这件事。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(35) + '　业障 +1'; } },
    { label:'把信烧了',
      eff:(s,a)=>{ a.karma(2); a.cult(50); a.flag('burned_letter');
        return '你把信丢进了灶里。\n\n火苗跳了一下就没了。\n你盯着灶看了一会儿，然后去劈柴，劈到天黑。\n修为 +' + a.gain(50) + '　业障 +2'; } }
  ]
},

{
  id:'sx_disciple_passing', chapter:'sanxiu', tier:0, title:'过路的弟子', cat:'散修',
  text:'两个年轻弟子从山道上下来，背着剑，一路在说话。\n经过你门口的时候，其中一个停下来，看了你一眼。\n\n“前辈。”他拱了拱手，\n“您也是修行的？”',
  choices:[
    { label:'点头',
      eff:(s,a)=>{ a.favor(1); a.cult(22);
        return '你点了点头。\n\n他等着你多说点什么，你什么都没说。\n他有点尴尬，又拱了拱手，追上同伴走了。\n\n走远了之后，你听见他跟同伴说：“那位前辈好深。”\n人情 +1　修为 +' + a.gain(22); } },
    { label:'请他们喝水',
      eff:(s,a)=>{ a.favor(3); a.lifeBy(0.02); a.cult(15);
        return '你打了两碗水给他们。\n\n他们坐下来歇了一刻，说了很多宗门里的事：\n谁升了执事，谁下山了，哪块灵田今年收成不好。\n\n你听着，像听别人家的事。\n人情 +3　寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(15); } },
    { label:'“不是。”',
      eff:(s,a)=>{ a.cult(30); a.karma(-1);
        return '“不是。”你说。\n\n他愣了一下，然后笑了笑，走了。\n\n你回屋继续干你的活。那天你干得特别顺。\n修为 +' + a.gain(30) + '　业障 −1'; } }
  ]
},

/* ==================== 灵兽与草木 ==================== */

{
  id:'sx_beast_injured', chapter:'sanxiu', tier:0, title:'它受伤了', cat:'散修',
  when:s=>s.sanxiu && s.sanxiu.beast,
  text:'它今天回来的时候，前腿是跛的。\n它不让你碰，自己趴在墙角舔。\n\n你蹲在旁边看了很久。',
  choices:[
    { label:'强行给它上药',
      eff:(s,a)=>{ if(a.chance(0.6)){ a.lifeBy(-0.03);
          return '你按住它，把药敷上去。它挣了两下就不动了。\n\n上完药它没走，就趴在你脚边。\n那是它第一次让你碰它。\n寿元 −' + a.lifePct(0.03); }
        a.lifeBy(-0.05);
        return '你按住它的时候，它咬了你一口。\n\n不重，但血流了不少。它跑了，三天没回来。\n寿元 −' + a.lifePct(0.05); } },
    { label:'去找能治伤的药',
      eff:(s,a)=>{ a.lifeBy(-0.06); a.stone(-25);
        return '你翻了两座山，找到一味能接骨的药。\n\n回来的时候它还在墙角。你把药嚼烂了放在它面前。\n它闻了闻，吃了。\n\n第二天早上，它能站起来了。\n寿元 −' + a.lifePct(0.06) + '　灵石 −25'; } },
    { label:'不碰它，让它自己好',
      eff:(s,a)=>{ a.lifeBy(0.02); a.cult(20);
        return '你什么都没做，只是每天把吃的放在它够得着的地方。\n\n第七天，它自己好了。\n它好了之后，跟你的距离近了一点。\n寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(20); } }
  ]
},

{
  id:'sx_herb_rare', chapter:'sanxiu', tier:0, title:'崖上的那一株', cat:'散修',
  text:'你在崖壁上看见一株药。\n长在很难够到的地方，看起来年份很久。\n\n底下就是雾。',
  choices:[
    { label:'爬上去采',
      eff:(s,a)=>{ if(a.chance(0.65)){ a.stone(80); a.lifeBy(-0.05);
          return '你贴着石壁挪过去，手指头全是血。\n\n采到了。根须完整，是上品。\n拿到山下，收药的看了半天，给了你一个好价。\n灵石 +80　寿元 −' + a.lifePct(0.05); }
        a.lifeBy(-0.14);
        return '你抓到的那块石头是松的。\n\n摔下去的时候你抓住了藤，但肩膀脱了臼。\n那株药还在崖上，你躺在下面看了它很久。\n寿元 −' + a.lifePct(0.14); } },
    { label:'记下位置，回去拿绳子',
      eff:(s,a)=>{ a.lifeBy(0.01); a.cult(25); a.flag('marked_herb');
        return '你记下了位置，回去了。\n\n第二天带着绳子来的时候，那株药还在。\n你采得很稳。\n\n稳到你觉得少了点什么。\n修为 +' + a.gain(25); } },
    { label:'不采',
      eff:(s,a)=>{ a.karma(-3); a.cult(20); a.lifeBy(0.02);
        return '你看了一会儿，走了。\n\n“长在那儿不容易。”你对自己说。\n\n第二年你又路过一次，它还在。开花了。\n业障 −3　修为 +' + a.gain(20) + '　寿元 +' + a.lifePct(0.02); } }
  ]
},

{
  id:'sx_tree_plant', chapter:'sanxiu', tier:0, title:'种一棵树', cat:'散修', once:true,
  text:'你屋前是空的。\n今天你忽然想，这儿应该有一棵树。\n\n你去山下要了一棵苗。',
  choices:[
    { label:'种在门前',
      eff:(s,a)=>{ a.lifeBy(-0.02); a.cult(25); a.flag('planted_tree');
        return '你挖了坑，把苗放进去，埋土，浇水。\n\n弄完你退后两步看了看，觉得有点小。\n“慢慢长。”你说。\n寿元 −' + a.lifePct(0.02) + '　修为 +' + a.gain(25); } },
    { label:'种在屋后，靠溪那边',
      eff:(s,a)=>{ a.lifeBy(-0.02); a.cult(30); a.flag('planted_tree_stream');
        return '你种在了溪边。那儿水好，长得快。\n\n种完你蹲在溪边洗手，看见水里自己的脸。\n\n你冲它点了点头。它也点了点头。\n修为 +' + a.gain(30) + '　寿元 −' + a.lifePct(0.02); } },
    { label:'把苗还给山下',
      eff:(s,a)=>{ a.favor(2); a.cult(15);
        return '你想了想，把苗送回去了。\n\n“我没打算住这么久。”你说。\n\n说完这句话，你在回山的路上走了很久。\n人情 +2　修为 +' + a.gain(15); } }
  ]
},

/* ==================== 心里的东西 ==================== */

{
  id:'sx_count_days', chapter:'sanxiu', tier:0, title:'数日子', cat:'散修',
  text:'你今天早上起来，忽然想不起今天是第几天了。\n墙上的刻痕还在，但你懒得去数。\n\n以前在宗门，你每天都在数。',
  choices:[
    { label:'去数一数',
      eff:(s,a)=>{ const d=(s.sanxiu&&s.sanxiu.days)||0;
        a.cult(25); a.lifeBy(0.02);
        return '你数了一遍。' + d + ' 天。\n\n数完你发现，你其实并不在乎是多少天。\n你只是想知道自己还数得清。\n修为 +' + a.gain(25) + '　寿元 +' + a.lifePct(0.02); } },
    { label:'把刻痕抹掉',
      eff:(s,a)=>{ a.cult(40); a.karma(1); a.flag('erased_marks');
        return '你拿手把墙上的刻痕抹平了。\n\n抹完墙面干净了，看着有点陌生。\n从今天起，你不数日子了。\n修为 +' + a.gain(40) + '　业障 +1'; } },
    { label:'刻一道新的，然后接着过',
      eff:(s,a)=>{ a.lifeBy(0.04); a.cult(18);
        return '你在墙上刻了一道，把刀放下，去挑水。\n\n水挑回来，你忘了刚才在烦什么。\n寿元 +' + a.lifePct(0.04) + '　修为 +' + a.gain(18); } }
  ]
},

{
  id:'sx_visit_old_home', chapter:'sanxiu', tier:0, title:'路过', cat:'散修', once:true,
  text:'你下山办事，路过了那道山门。\n\n你没有打算进去。但路就是从那儿过的。\n你在山门外站了一会儿。',
  choices:[
    { label:'进去看看',
      eff:(s,a)=>{ a.lifeBy(-0.04); a.cult(45); a.favor(2);
        return '你进去了。\n\n守门的是个不认识的年轻人，问你是谁。\n你说：“以前在这儿的。”\n\n他让你进去了。\n院子里还是那个院子。你走了一圈，谁也没碰见。\n出来的时候，那个年轻人朝你点了点头。\n修为 +' + a.gain(45) + '　人情 +2　寿元 −' + a.lifePct(0.04); } },
    { label:'站一会儿就走',
      eff:(s,a)=>{ a.lifeBy(0.02); a.cult(30);
        return '你站了一会儿。\n\n里面传出打饭的钟声。你听完了才走。\n寿元 +' + a.lifePct(0.02) + '　修为 +' + a.gain(30); } },
    { label:'绕路走',
      eff:(s,a)=>{ a.lifeBy(-0.02); a.cult(20); a.karma(1);
        return '你从山后的那条小路绕过去了。\n\n多走了半天。\n晚上你在客栈住了一夜，做了个梦，醒来忘了。\n寿元 −' + a.lifePct(0.02) + '　修为 +' + a.gain(20) + '　业障 +1'; } }
  ]
},

/* ============================================================
   《记忆修复局》事件数据 · 第九批（第 29 轮）
   ------------------------------------------------------------
   玩家这一轮对事件提了三条意见，逐条对应：

   ①「事件太少了」
     实测：196 个事件里 tier 3（金丹）只有 9 个、tier 4（元婴）只有 7 个 ——
     也就是说中期两大境界一共只有 16 个事件可以抽，
     而一局大半时间都花在那里。这一批专门补 tier 3 / tier 4。

   ②「表现形式有限」
     实测：189/196 都是「三选一」，只有 3 个带 flavor 斜体小字。
     这一批刻意做了结构变化：两选一（非此即彼的重抉择）、
     四选一（信息多的场面）、以及**跟着属性变的正文**。

   ③「属性对应到事件上完全没有体现」
     实测：196 个事件里 when 读到六维属性的有 **0 个**。
     这一批是第一次真的用上属性，写法见下面每个事件的注释。

   ---------------- 写属性事件时的三个工具 ----------------
   全部由 engine.js 挂到全局（事件文件在另一个作用域里，必须显式发布）：

     evAttr('shenshi')         这一项属性现在是多少（绝对值，随境界涨）
     evPeer('shenshi')         同一境界「普通人」大概是多少 ← **门槛要用这个**
     evBonus('shenshi')        你在这一项上砸了多少机缘（功法/法宝/事件）
     evMainAttr()              你砸得最多的那一项（你的招牌），没砸过是 null

   ⚠️ 门槛千万不要写死数字。实测同一项属性：
        炼气九层 神识 ≈ 21　筑基 ≈ 48　金丹 ≈ 84　元婴 ≈ 139
      写死 40 的话，炼气期永远不触发、元婴期人人触发，两边都是废的。
      正确写法： evAttr('shenshi') >= evPeer('shenshi') * 1.15

   ---------------- 收益档位（必须用，不然数字在中期变成噪音）----------------
     a.cult(n, 'low'|'mid'|'high')   修为按当前大境界缩放（低0.5 / 中1.0 / 高2.2）
     a.lifePct(0.03)                 寿元一律按上限的百分比
     a.life(n)                       固定寿元，只在很小的时候用
   收货时还要把数字写进返回文案里 —— dev/verify-eventrewards.js 会逐条对账。
   ============================================================ */

/* ==================== 三、弱点事件 ====================

{
  id:'ev9_short_sight', tier:0, title:'看不清', cat:'世界',
  /* 反面门槛：这一项**相对弱**才会遇到。这是「属性影响事件」的另一半。
     ⚠️ 「弱」怎么判断，试错了两次：
       ① evAttr < evPeer*0.85 —— 不可能成立。evPeer 就是「不砸机缘的你」，
          不砸时两者相等，比值恒为 1，谁都不低于自己。
       ② evAttrRank < 0.55 —— 也不成立。evAttrRank 除的是跨到渡劫的
          理论上限（≈490），而金丹期实际只有 60~180，于是**所有人**
          都落在 0.12~0.36，门槛定在哪儿都拦不住谁。
       现在的定义是唯一说得通的那个：**机缘总量不小、却几乎没砸在这一项上**
       → 这一项相对你的其它项是短的。它同时也自动排除了新人

  when:s=>evBonusTotal() >= 30 && evBonusShare('shenshi') < 0.10,
  text:()=>'那东西离你不到三丈。\n\n' +
    '你看不清它是什么。\n\n' +
    '你只能确定它比你大。\n\n' +
    '（你身上那些机缘，几乎没有一样是给眼睛的。）',
  flavor:'神识不够的时候，你连自己怕的是什么都不知道。',
  choices:[

      eff:(s,a)=>{

a.lifeBy(-0.10); a.karma(1);

    { label:'喊一声', eff:(s,a)=>{ a.karma(-1); a.favor(1);
        return '“谁在那儿？”\n\n没有回答。\n\n但那个东西退开了。你听得见脚步声，\n一深一浅，走得很慢。\n\n业障 −1　人情 +1'; } }

},

{

/* ============================================================

   这一批专治第 29 轮审计里剩下的两个洞：

   ①「表现形式有限」——实测 216 个事件里 **207 个是三选一**（96%）。
      三选一本身没错，但每个事件都是「稳妥 / 激进 / 走开」的三件套时，
      玩家在第 30 个事件上就已经不看选项了。
      这一批刻意做两极化结构：
        · **两选一**：非此即彼的重抉择，没有第三条退路
        · **四选一**：场面大、信息多的时刻（四个人、四样东西、四条路）

   ②「选项里有条件的只有 4 / 641（1%）」——几乎等于没有。
      这一批给选项大量加 when，而且**优先加属性条件**：
        · 体魄够 → 你能把它扛起来
        · 神识够 → 你看得见别人看不见的那一层
        · 身法够 → 你追得上 / 躲得开
        · 悟性够 → 你能从这段话里读出功法
        · 根骨够 → 你熬得住
      属性不够的人看到的选项更少，但**每个都是他能选的**——
      不是「灰着的选项」，而是那条路根本不在他眼前。

   写法约定（和 events9.js 一致）：
     evAttr('x') / evPeer('x')     ← 门槛用相对判断，不写死数字
     evBonus('x') / evMainAttr()   ← 认 build
     a.cult(n,'low'|'mid'|'high')  ← 收益按大境界缩放
     a.attr({shenfa:5})            ← 机缘直接给属性
     a.lifePct(0.03)               ← 寿元一律用百分比
   返回文案里的每个数字都必须和实际加的一致（dev/verify-eventrewards.js 逐条对账）。
   ============================================================ */

/* ============================================================
   《记忆修复局》事件数据 · 第十一批（第 31 轮）
   「因果回响」—— 让事件之间真的有关系
   ------------------------------------------------------------
   玩家原话：
   > 「我希望很多事件能做到『有关联』，当前的事件普遍都缺少关联性
   > （哪怕是三月初七也一样，本质上内容量过少了），例如事件 A 选这个选项
   > 可能导致事件 B，事件 A 没这么干则可能导致事件 C。
   > 当前的所有事件都做不到这一点」

   先做了实测（dev/dbg-linkage.js），结论比「缺少关联」更难看：

     事件总数 234
     · 会打标记（flag）的选择：74 种，来自 53 个事件
     · 会读标记的事件：7 个 —— 而且读的是**另一套**旧命名，
       和上面那 74 个**一个都对不上**
     · 真正的「写 → 读」因果链：**0 条**
     · 挂了「长期因果」(debt) 的：9 处
       但引擎里**没有任何人读它的结果、eff 也从没被执行过**（第 31 轮修好）
     · 真正的二选一分叉（选 A 走 B、不选 A 走 C）：**0 处**

   也就是说：之前那 53 个事件里，作者（我）写下了 74 个「我以后要用」的标记，
   然后一个后续都没写。它们全部是断头路。

   这一批就是把那些断头路接上。写法：
     · **成对/成组**：同一个事件的不同选项会打上互斥的标记，
       这里给每个标记各写一个后续 → 你走了哪条，就只会遇到哪条的后果
     · 后续**不立刻出现**：用 flagAge() 隔开十几次行动，
       让「过了一阵子，那件事回来了」有节奏
     · 每个后续都登记进 G.CAUSE，于是玩家在「案卷 · 未了之事」里
       能看见自己身上挂着什么，事后也能看出这是当初哪一步招来的
   ============================================================ */

  when:s=>s.flags.includes('wrote_wall') && flagAge('wrote_wall') >= 16,
  text:()=>'你绕回那面墙。\n\n' +
    '你写的那一行还在。\n\n' +
    '但它下面多了一行，笔迹很新。\n\n' +
    '写的是一句问话——问的是你写的那句话该怎么读。',
  flavor:()=>causeLine('wrote_wall'),
  choices:[
    { label:'在下面接着写', hint:'这算是一来一回',
      eff:(s,a)=>{ a.flag('wall_talk'); const g=a.cult(70,'high'); a.karma(1);
        return '你蹲下来，一笔一笔回了他。\n\n写完你往后退，看着这三行字。\n\n它们放在一起，像两个人隔着很多年在说话。\n\n修为 +'+g+'　业障 +1'; } },
    { label:'把自己写的那行刮掉', eff:(s,a)=>{ s.flags = s.flags.filter(f=>f!=='wrote_wall');
        a.karma(-1); a.lifeBy(0.03);
        return '你用石头把自己那一行刮掉了。\n\n刮到一半你停了手，还是刮完了。\n\n现在墙上只剩他那句问话，没有上下文。\n\n业障 −1　寿元 +'+a.lifePct(0.03); } }
  ]
},

{
  id:'ev11_wall_down', once:true, tier:0, title:'墙倒了之后', cat:'世界',
  when:s=>s.flags.includes('wall_down') && flagAge('wall_down') >= 16,
  text:()=>'那面墙倒了之后，后面是一条很窄的沟。\n\n' +
    '沟里堆着东西——都是些没用的：破碗、断簪、一只鞋。\n\n' +
    '摆得整整齐齐。',
  flavor:()=>causeLine('wall_down'),
  choices:[
    { label:'翻一翻', hint:'摆得这么整齐，是有人在管',
      eff:(s,a)=>{
        if(a.chance(0.55)){ a.stone(90); a.clue('clue_date'); const g=a.cult(50,'mid');
          return '你翻到最底下，摸出一块小木牌。\n\n上面刻着一个日子。你认得那个日子。\n\n灵石 +90　线索 +1　修为 +'+g; }
        a.karma(2); a.lifeBy(-0.05);
        return '你翻到一半，手被什么划了一下。\n\n拿出来一看，是半片碎瓷，边缘很利。\n你把它放回去了，摆成原来的样子。\n\n业障 +2　寿元 −'+a.lifePct(0.05); } },
    { label:'把东西重新摆好，走', eff:(s,a)=>{ a.karma(-3); a.lifeBy(0.05);
        return '你蹲下来，把碰乱的那几样一件件摆回去。\n\n摆完你退后看了看，跟刚才一样整齐。\n\n业障 −3　寿元 +'+a.lifePct(0.05); } }
  ]
},

/* ==================== 那个位子：看 / 抢 / 让 （三选一） ==================== */

{
  id:'ev11_seat_met', once:true, tier:0, title:'位子还空着', cat:'修行',
  when:s=>s.flags.includes('met_seat') && flagAge('met_seat') >= 20,
  text:()=>'你又去看了那个位子。\n\n' +
    '还是空的。但上面有一层薄灰，被压出一个人坐过的形状。\n\n' +
    '形状比上次深了。',
  flavor:()=>causeLine('met_seat'),
  choices:[
    { label:'坐下来试试', hint:'灰上会多一个形状',
      eff:(s,a)=>{ const g=a.cult(120,'high'); a.lifeBy(-0.06); a.karma(1);
        return '你坐下了。\n\n什么都没有发生。就是坐着。\n\n坐了很久之后你站起来，回头看那个形状——\n两个形状叠在一起，几乎分不出哪个是新的。\n\n修为 +'+g+'　寿元 −'+a.lifePct(0.06)+'　业障 +1'; } },
    { label:'把灰抹平', eff:(s,a)=>{ a.karma(-2); a.lifeBy(0.04); const g=a.cult(35,'mid');
        return '你伸手把那一层灰抹平了。\n\n抹完石头上什么都没有了，干净得像新的。\n\n修为 +'+g+'　业障 −2　寿元 +'+a.lifePct(0.04); } }
  ]
},

{
  id:'ev11_seat_won', once:true, tier:3, title:'抢来的位子会认人', cat:'修行',
  when:s=>s.flags.includes('seat_won') && flagAge('seat_won') >= 20,
  text:()=>'你抢下的那个位子，最近开始认人。\n\n' +
    '别人坐上去，不到一刻就站起来，说坐不住。\n\n' +
    '你坐上去，什么事都没有。',
  flavor:()=>causeLine('seat_won'),
  choices:[
    { label:'让他们也坐坐看', hint:'分享一个坐不住的东西',
      eff:(s,a)=>{ a.favor(4); a.karma(-2); const g=a.cult(70,'high');
        return '你叫了几个人轮流试。\n\n每一个都坐不住，但每一个坐完之后都说：\n“奇怪，我好像想起来一件很久以前的事。”\n\n人情 +4　业障 −2　修为 +'+g; } },
    { label:'谁也不许坐', eff:(s,a)=>{ a.karma(3); const g=a.cult(130,'high');
        return '你在位子旁边立了块石头，写着“不许坐”。\n\n从那以后，没人再来了。\n\n你一个人坐着，坐得越来越稳。\n\n修为 +'+g+'　业障 +3'; } }
  ]
},

{
  id:'ev11_seat_gave', once:true, tier:3, title:'你让出去的那个位子', cat:'人事',
  when:s=>s.flags.includes('gave_seat') && flagAge('gave_seat') >= 20,
  text:()=>'坐了你让出去那个位子的人，来找你了。\n\n' +
    '他比上次见的时候老了很多。\n\n' +
    '“那个位子，”他说，“我坐了三十年。”',
  flavor:()=>causeLine('gave_seat'),
  choices:[
    { label:'问他这三十年怎么样', eff:(s,a)=>{ a.clue('clue_master'); a.favor(2); const g=a.cult(85,'high');
        return '“什么都没发生。”他说，“就是坐着。”\n\n“那你为什么来？”\n\n“因为我今天早上想起来，那个位子本来是你的。”\n\n他站起来，朝你鞠了一躬，走了。\n\n线索 +1　人情 +2　修为 +'+g; } },
    { label:'什么都不问，送他走', eff:(s,a)=>{ a.karma(-3); a.lifeBy(0.06);
        return '你给他倒了碗水，看着他喝完。\n\n他走的时候你送到门口，没说话。\n\n业障 −3　寿元 +'+a.lifePct(0.06); } }
  ]
},

/* ==================== 那三条路：走 / 断 / 看 （三选一） ==================== */

{
  id:'ev11_road_in', once:true, tier:4, title:'你进去的那条路', cat:'世界',
  when:s=>s.flags.includes('road_in') && flagAge('road_in') >= 22,
  text:()=>'你走过的那条路，最近有人也在走。\n\n' +
    '路上多了脚印，不止一双。\n\n' +
    '方向和你当初一样。',
  flavor:()=>causeLine('road_in'),
  choices:[
    { label:'跟上去看看是谁', eff:(s,a)=>{
        if(a.chance(0.6)){ a.clue('clue_disciple'); a.favor(3); const g=a.cult(100,'high');
          return '你跟了半日，看见三个背剑的年轻人。\n\n他们在路口停下来，其中一个说：\n“前面那位前辈也是从这儿进去的。”\n\n你没露面，转身走了。\n\n线索 +1　人情 +3　修为 +'+g; }
a.lifeBy(-0.09);
        return '你跟到天黑，脚印忽然断了。\n\n断在一处什么都没有的地方。\n\n你在那儿站了一会儿，觉得后背发凉，就回去了。\n\n寿元 −'+a.lifePct(0.09); } },
    { label:'在路口留个字，让他们别进去', eff:(s,a)=>{ a.karma(-3); a.favor(2);
        return '你找了块木片，刻了三个字插在路口：\n\n“不必进。”\n\n你不知道他们会不会听。\n\n业障 −3　人情 +2'; } }
  ]
},

{
  id:'ev11_road_break', once:true, tier:4, title:'你砸断的那条路', cat:'世界',
  when:s=>s.flags.includes('road_break') && flagAge('road_break') >= 22,
  text:()=>'你砸断的那条路，断口在往外渗东西。\n\n' +
    '不多，一天大概一小碗。\n\n' +
    '是黑的。',
  flavor:()=>causeLine('road_break'),
  choices:[
    { label:'把断口堵上', eff:(s,a)=>{ a.lifeBy(-0.07); a.karma(-2); const g=a.cult(60,'high');
        return '你搬了一整天的石头，把断口垒上了。\n\n垒到最后一层，石头开始往外顶。\n你用背抵着，一点点塞进去。\n\n堵住了。\n\n寿元 −'+a.lifePct(0.07)+'　业障 −2　修为 +'+g; } },
    { label:'接一点回去研究', eff:(s,a)=>{ a.clue('clue_xinmo'); a.karma(3); const g=a.cult(140,'high');
        return '你用个陶碗接了小半碗。\n\n端回去的路上，碗一直是凉的。\n\n放到桌上，它自己在碗里转。\n\n线索 +1　业障 +3　修为 +'+g; } }
  ]
},

{
  id:'ev11_road_watch', once:true, tier:4, title:'你还守在那儿', cat:'修行',
  when:s=>s.flags.includes('road_watch') && flagAge('road_watch') >= 22,
  text:()=>'你选择在旁边看着的那条路，到现在还荒着。\n\n' +
    '你偶尔会绕过去看一眼。\n\n' +
    '今天你发现：路上长东西了。',
  flavor:()=>causeLine('road_watch'),
  choices:[
    { label:'走近看是什么', eff:(s,a)=>{ a.clue('clue_page'); a.cult(95,'high');
        return '是一种你没见过的草，长得又密又矮。\n\n你蹲下来拔了一根，根是红的。\n\n折断的地方飘出一点味道，很淡——\n和你小时候闻过的某种味道一样。\n\n线索 +1　修为 +'+a.gain(95,'high'); } },
    { label:'回头就走', eff:(s,a)=>{ a.karma(-1); a.lifeBy(0.04); const g=a.cult(40,'mid');
        return '你看了一眼，转身走了。\n\n有些东西长出来就长出来了，不需要你管。\n\n业障 −1　寿元 +'+a.lifePct(0.04)+'　修为 +'+g; } }
  ]
},

/* ==================== 那个格子：开 / 称 / 听 （三选一） ==================== */

{
  id:'ev11_cell_opened', once:true, tier:4, title:'你放出来的东西', cat:'世界',
  when:s=>s.flags.includes('opened_cell') && flagAge('opened_cell') >= 20,
  text:()=>'你打开的那个格子，现在是空的。\n\n' +
    '但旁边的人说，最近山里多了点东西。\n\n' +
    '“不是什么大东西，”他们说，“就是晚上有动静。”',
  flavor:()=>causeLine('opened_cell'),
  choices:[
    { label:'上山去找', eff:(s,a)=>{
        if(a.chance(0.55)){ a.clue('clue_xinmo'); const g=a.cult(150,'high'); a.karma(2);
          return '你找了三天。\n\n第三天夜里，你在一块石头后面看见了它。\n\n很小。它在哭。\n\n你没有过去。你只是记住了它在哪儿。\n\n线索 +1　修为 +'+g+'　业障 +2'; }
a.lifeBy(-0.12); a.karma(1);
        return '你找了三天，什么都没找到。\n\n第四天早上你下山，发现自己鞋底沾着一层灰——\n你在山上根本没走过有灰的地方。\n\n寿元 −'+a.lifePct(0.12)+'　业障 +1'; } },
    { label:'把格子重新封上', eff:(s,a)=>{ a.karma(-3); a.lifeBy(-0.05); const g=a.cult(70,'high');
        return '你回去把格子重新封了。\n\n封的时候，格子里传来一声很轻的响，像是叹气。\n\n你手抖了一下，但还是封完了。\n\n业障 −3　寿元 −'+a.lifePct(0.05)+'　修为 +'+g; } }
  ]
},

{
  id:'ev11_cell_rescaled', once:true, tier:4, title:'你称过的那份量', cat:'线索',
  when:s=>s.flags.includes('rescaled') && flagAge('rescaled') >= 20,
  text:()=>'你重新称过的那份量，最近又变了。\n\n' +
    '不是变多，是变轻。\n\n' +
    '同样大小，拿在手里几乎没有重量。',
  flavor:()=>causeLine('rescaled'),
  choices:[
    { label:'再称一次', hint:'看看它到底剩多少',
      eff:(s,a)=>{ a.clue('clue_date'); const g=a.cult(110,'high');
        return '你把它放回原来的秤上。\n\n秤没动。\n\n你又加了一块石头上去，秤还是没动。\n\n你忽然明白：不是它变轻了，是秤坏了。\n\n线索 +1　修为 +'+g; } },
    { label:'把它扔掉', eff:(s,a)=>{ a.karma(-2); a.lifeBy(0.05);
        return '你走到河边，把它扔了出去。\n\n它没有落水的声音。\n\n河面上连个圈都没有。\n\n业障 −2　寿元 +'+a.lifePct(0.05); } }
  ]
},

{
  id:'ev11_cell_listened', once:true, tier:4, title:'你听见的那个东西', cat:'线索',
  when:s=>s.flags.includes('listened_cell') && flagAge('listened_cell') >= 20,
  text:()=>'你贴着听过的那只格子，现在不用贴了。\n\n' +
    '隔着三步就能听见。\n\n' +
    '它在数数。数得很慢，一直在数。',
  flavor:()=>causeLine('listened_cell'),
  choices:[
    { label:'跟着它一起数', eff:(s,a)=>{ a.clue('clue_erased'); const l = a.lifeBy(-0.08); const g=a.cult(160,'high');
        return '你跟着数了很久。\n\n数到某个数的时候，它停了。\n\n停了整整一天。\n\n然后它从一开始重新数。\n\n你算了一下：那个数，是你今年多大。\n\n线索 +1　修为 +'+g+'　寿元 −'+l; } },
    { label:'走开，别听', eff:(s,a)=>{ a.karma(-1); a.lifeBy(0.03);
        return '你走开了。\n\n走出去很远，那个数数的声音还在。\n\n但你不去听了，它就拿你没办法。\n\n业障 −1　寿元 +'+a.lifePct(0.03); } }
  ]
},

/* ==================== 另一个你：赢 / 输 / 给 （三选一） ==================== */

{
  id:'ev11_other_won', once:true, tier:4, title:'它赢了，所以它还在', cat:'修行',
  when:s=>s.flags.includes('other_won') && flagAge('other_won') >= 18,
  text:()=>'那个替你打的东西，最近出现在你的镜子里。\n\n' +
    '它比你年轻。\n\n' +
    '它在镜子里做你做过的事，但顺序不太一样。',
  flavor:()=>causeLine('other_won'),
  choices:[
    { label:'问它想干什么', eff:(s,a)=>{ a.clue('clue_name'); a.karma(2); const g=a.cult(130,'high');
        return '“你想干什么？”\n\n它停下来，看着你。\n\n然后它说了一个名字——你的名字。\n\n说得比你自己的还准。\n\n线索 +1　业障 +2　修为 +'+g; } },
    { label:'把镜子盖上', eff:(s,a)=>{ a.karma(-2); a.lifeBy(0.06);
        return '你拿了块布把镜子盖上了。\n\n盖了之后，屋里安静了很多。\n\n业障 −2　寿元 +'+a.lifePct(0.06); } }
  ]
},

{
  id:'ev11_other_lost', once:true, tier:4, title:'它输了，所以它不在了', cat:'修行',
  when:s=>s.flags.includes('other_lost') && flagAge('other_lost') >= 18,
  text:()=>'替你打的那一个输了之后，你身上空了一块。\n\n' +
    '不是难受，是空。\n\n' +
    '有一段时间你连自己练到哪儿了都不太确定。',
  flavor:()=>causeLine('other_lost'),
  choices:[
    { label:'重新把它练回来', eff:(s,a)=>{ const l = a.lifeBy(-0.10); const g=a.cult(170,'high'); const at=a.attr({lingli:6});
        return '你重新开始练。\n\n从最基础的那一层练起，一样一样补。\n\n补到某一天，你忽然觉得那块空补上了。\n补上的东西和原来不一样，但是你的。\n\n修为 +'+g+'　寿元 −'+l+'　'+at; } },
    { label:'让那块空着', eff:(s,a)=>{ a.karma(-2); a.lifeBy(0.08); const g=a.cult(60,'high');
        return '你想了想，决定不补了。\n\n空着也挺好。空着的地方风能穿过去。\n\n业障 −2　寿元 +'+a.lifePct(0.08)+'　修为 +'+g; } }
  ]
},

{
  id:'ev11_self_given', once:true, tier:4, title:'你给出去的那部分', cat:'世界',
  when:s=>s.flags.includes('gave_self') && flagAge('gave_self') >= 18,
  text:()=>'你把一部分自己给出去之后，有人一直在找你。\n\n' +
    '他们不说是谁派来的。\n\n' +
    '他们只问一句话：“剩下的那些，你还要吗？”',
  flavor:()=>causeLine('gave_self'),
  choices:[
    { label:'“要。”', eff:(s,a)=>{ a.flag('claimed_self'); a.karma(-2); const g=a.cult(120,'high'); a.lifeBy(0.10);
        return '“要。”\n\n他们互相看了一眼，让开了路。\n\n你走过去的时候，觉得身上沉了一点——\n是那种很久没有过的、踏实的沉。\n\n业障 −2　修为 +'+g+'　寿元 +'+a.lifePct(0.10); } },
    { label:'“不要了。”', eff:(s,a)=>{ a.karma(3); a.lifeBy(-0.06); const g=a.cult(180,'high');
        return '“不要了。”\n\n他们点点头，像是早就知道。\n\n“那我们收了。”\n\n他们走的时候，你听见自己心里有个声音也跟着走了。\n\n业障 +3　修为 +'+g+'　寿元 −'+a.lifePct(0.06); } }
  ]
},

/* ==================== 还 / 不还 （两选一） ==================== */

{
  id:'ev11_kept_all', once:true, tier:4, title:'你一样都没还', cat:'世界',
  when:s=>s.flags.includes('kept_all') && flagAge('kept_all') >= 20,
  text:()=>'你留下的那些东西，最近开始占地方。\n\n' +
    '屋子越来越挤，虽然东西并没有变多。\n\n' +
    '晚上睡觉的时候，你会听见它们互相碰的声音。',
  flavor:()=>causeLine('kept_all'),
  choices:[
    { label:'全部搬出去烧了', eff:(s,a)=>{ a.karma(-4); a.lifeBy(0.10); const g=a.cult(90,'high');
        return '你花了三天，把它们一件件搬出去。\n\n烧的时候火很大，烟是白的。\n\n烧完你回到屋里，屋子空得能听见回声。\n\n业障 −4　寿元 +'+a.lifePct(0.10)+'　修为 +'+g; } },
    { label:'再挤一挤', eff:(s,a)=>{ a.karma(2); const g=a.cult(150,'high'); const at=a.attr({tipo:5});
        return '你把它们重新码了一遍，码得更高。\n\n码完你退后看，像一堵墙。\n\n那天晚上你睡得很沉，一个梦都没做。\n\n业障 +2　修为 +'+g+'　'+at; } }
  ]
},

{
  id:'ev11_gave_all', once:true, tier:4, title:'你全都还了回去', cat:'人事',
  when:s=>s.flags.includes('gave_back_all') && flagAge('gave_back_all') >= 20,
  text:()=>'你把东西全还回去之后，那边一直没有消息。\n\n' +
    '今天来了个人，空着手。\n\n' +
    '“还回来的都收到了。”他说，“所以我来问你一件事。”',
  flavor:()=>causeLine('gave_back_all'),
  choices:[

    '前面那两百步，你走了小半年，\n但你想不起这条路上有什么。\n\n' +
    '一棵树都没有。',
  flavor:()=>causeLine('story_closed_door'),
  choices:[
    { label:'回头，去看一眼藏经阁', eff:(s,a)=>{ a.clue('clue_page'); a.clue('clue_erased'); a.sectContrib(14); a.cult(120,'high'); a.life(-14);
        return '你走回去。\n\n藏经阁还在。门开着。\n\n你站在门口往里看，最里面那排架子——\n\n是空的。\n\n不是册子没了，是**架子**没了。\n那面墙是平的，抹得跟旁边一模一样。\n\n线索 +2　宗门贡献 +14　修为 +'+a.gain(120,'high')+'　寿元 −14'; } },
    { label:'不回头，接着走', eff:(s,a)=>{ a.karma(-2); a.life(22); a.sectContrib(10); a.cult(60,'high');
        return '你接着往前走。\n\n两百步走完，转上大路。\n\n路上有人跟你打招呼，你应了一声。\n\n那天之后你没再数过步数。\n\n业障 −2　寿元 +22　宗门贡献 +10　修为 +'+a.gain(60,'high'); } }
  ]
},

{
  id:'ev12_story_cat', once:true, tier:3, title:'那只猫又来了', cat:'世界',
  when:s=>s.flags.includes('story_waited_door') && flagAge('story_waited_door') >= 16,
  text:()=>'那只猫又来了。\n\n' +
    '它蹲在藏经阁门口，看着你。\n\n' +
    '嘴里叼着东西——又是从册子上撕下来的一片纸。',
  flavor:()=>causeLine('story_waited_door'),
  choices:[
    { label:'拿吃的跟它换', eff:(s,a)=>{ a.stone(-20); a.clue('clue_erased'); a.clue('clue_page'); a.sectContrib(12); a.cult(90,'high');
        return '你去伙房要了半条鱼。\n\n它闻了闻，把纸放下，叼着鱼跑了。\n\n纸上有两个字。\n\n一个你认得，另一个被咬掉了。\n\n灵石 −20　线索 +2　宗门贡献 +12　修为 +'+a.gain(90,'high'); } },
    { label:'直接抢', eff:(s,a)=>{ a.karma(2); a.life(-8); a.clue('clue_erased'); a.sectContrib(6); a.cult(60,'high');
        return '你伸手去抢。\n\n它比你想的快得多。\n\n手背上留了三道口子，纸也没抢到。\n\n它叼着纸跳上墙头，回头看了你一眼。\n\n业障 +2　寿元 −8　线索 +1　宗门贡献 +6　修为 +'+a.gain(60,'high'); } }
  ]
},

/* ============ 路线 C 的余波 ============ */

{
  id:'ev12_story_book', once:true, tier:3, title:'第一页的字迹', cat:'线索',
  when:s=>s.flags.includes('story_asked_book') && flagAge('story_asked_book') >= 16,
  text:()=>'你又想起了那本册子的第一页。\n\n' +
    '那手很嫩的字。\n\n' +
    '你忽然想起来：那种字，你见过。\n\n' +
    '在刚入门的小弟子写的字帖上。',
  flavor:()=>causeLine('story_asked_book'),
  choices:[
    { label:'去找今年刚入门的小弟子', eff:(s,a)=>{ a.clue('clue_book'); a.clue('clue_master'); a.sectContrib(14); a.cult(100,'high'); a.favor(2);
        return '你找了个最小的，让他写几个字给你看。\n\n他写了自己的名字，手抖得厉害。\n\n和册子第一页的字，一模一样。\n\n“你今年多大？”\n\n“十一。”\n\n你算了一下：师父说第一年他十九岁。\n\n线索 +2　宗门贡献 +14　修为 +'+a.gain(100,'high')+'　人情 +2'; } },
    { label:'去问师父他今年多大', eff:(s,a)=>{ a.clue('clue_master'); a.sectContrib(10); a.cult(70,'high'); a.life(-6);
        return '“七十三。”他说。\n\n“那您十九岁是哪一年？”\n\n他算了很久。\n\n久到你觉得他算不出来。\n\n“算不出来。”他最后说，“我每年都算一遍，每年都算不出来。”\n\n线索 +1　宗门贡献 +10　修为 +'+a.gain(70,'high')+'　寿元 −6'; } }
  ]
},

{
  id:'ev12_story_why', once:true, tier:3, title:'二十三块木牌', cat:'线索',
  when:s=>s.flags.includes('story_asked_why') && flagAge('story_asked_why') >= 18,
  text:()=>'祖师堂的香炉底下，你摸到了东西。\n\n' +
    '掏出来一看，是二十三块小木牌。\n\n' +
    '每一块上面刻着一个名字。',
  flavor:()=>causeLine('story_asked_why'),
  choices:[
    { label:'一个一个念出来', eff:(s,a)=>{ a.clue('clue_name'); a.clue('clue_erased'); a.sectContrib(18); a.cult(140,'high'); a.life(-20); a.karma(-4);
        return '你把二十三块木牌摆在供桌上，一块一块念。\n\n念到第十九块的时候，堂里的风停了。\n\n念完最后一块，你把木牌收回香炉底下，\n又添了一炷香。\n\n那天晚上你梦见二十三个背影，都在往山上走。\n\n线索 +2　宗门贡献 +18　修为 +'+a.gain(140,'high')+'　寿元 −20　业障 −4'; } },
    { label:'原样放回去', eff:(s,a)=>{ a.karma(-2); a.life(12); a.sectContrib(8);
        return '你把木牌一块块放回香炉底下，摆成原来的样子。\n\n摆完你退后两步，确认看不出来。\n\n然后你上了一炷香。\n\n业障 −2　寿元 +12　宗门贡献 +8'; } }
  ]
},

{
  id:'ev12_story_rain', once:true, tier:3, title:'那六个人的名字', cat:'线索',
  when:s=>s.flags.includes('story_asked_rain') && flagAge('story_asked_rain') >= 18,
  text:()=>'你按师父说的那个年份，去翻那一年的记档。\n\n' +
    '「外出未归」——六个名字。\n\n' +
    '其中一个，姓和你一样。',
  flavor:()=>causeLine('story_asked_rain'),
  choices:[
    { label:'去问师父认不认识这个人', eff:(s,a)=>{ a.clue('clue_name'); a.clue('clue_master'); a.sectContrib(16); a.cult(130,'high'); a.life(-16);
        return '你把那个名字写给师父看。\n\n他看了很久，然后把纸折起来，还给你。\n\n“认识。”他说。\n\n“他是谁？”\n\n“他是我师兄。”师父说，“也是你师祖收的第一个徒弟。”\n\n“那为什么记档上写的是外人？”\n\n“因为写记档的人，把他忘了。”\n\n线索 +2　宗门贡献 +16　修为 +'+a.gain(130,'high')+'　寿元 −16'; } },
    { label:'自己悄悄查下去', eff:(s,a)=>{ a.clue('clue_erased'); a.sectContrib(12); a.cult(100,'high'); a.karma(1);
        return '你没告诉任何人。\n\n你把那六个名字抄下来，藏在身上。\n\n查了几天，你发现这六个人有一个共同点：\n他们都在某一年拜入宗门，\n而那一年，记档上写的是「无事」。\n\n线索 +1　宗门贡献 +12　修为 +'+a.gain(100,'high')+'　业障 +1'; } }
  ]
},

/* ============ 第五页：三条路线的收束 ============ */

{
  id:'ev12_story_incense', once:true, tier:3, title:'那两炷香', cat:'修行',
  when:s=>s.flags.includes('story_incense') && flagAge('story_incense') >= 16,
  text:()=>'你又去祖师堂上香。\n\n' +
    '炉子里有烧了一半的香——不是你的。\n\n' +
    '插的位置和你上次一模一样。',
  flavor:()=>causeLine('story_incense'),
  choices:[
    { label:'在那儿等', eff:(s,a)=>{ a.clue('clue_master'); a.cult(120,'high'); a.sectContrib(14); a.life(-14);
        return '你跪下来等。\n\n等到第二炷香烧完，师父来了。\n\n他看见你，点了点头，在你旁边跪下。\n\n“以后初一十五，都来。”他说。\n\n“好。”\n\n线索 +1　修为 +'+a.gain(120,'high')+'　宗门贡献 +14　寿元 −14'; } },
    { label:'上完香就走', eff:(s,a)=>{ a.karma(-2); a.life(18); a.sectContrib(8);
        return '你把自己那炷香插好，磕了三个头，起身走了。\n\n走到门口，你回头看了一眼。\n\n两炷香并排烧着，烟往上走，在半空合成一股。\n\n业障 −2　寿元 +18　宗门贡献 +8'; } }
  ]
},

{
  id:'ev12_story_all', once:true, tier:4, title:'你抄的那些名字', cat:'线索',
  when:s=>s.flags.includes('story_copied_all') && flagAge('story_copied_all') >= 16,
  text:()=>'你抄的那二十三张纸，最近开始出问题。\n\n' +
    '有三个名字，你怎么看都不认识了。\n\n' +
    '笔画都在，但连不成字。',
  flavor:()=>causeLine('story_copied_all'),
  choices:[
    { label:'把不认识的那三个念出来——照笔画硬念', eff:(s,a)=>{ a.clue('clue_name'); a.clue('clue_erased'); a.sectContrib(20); a.cult(170,'high'); a.life(-24);
        return '你对着笔画，一个音一个音地拼。\n\n拼到第三个的时候，屋子里的灯灭了。\n\n你没有停。黑暗里你把那三个名字念完了。\n\n念完之后灯自己亮了。\n\n纸上那三个名字又连成了字——\n而且比你抄的时候清楚。\n\n线索 +2　宗门贡献 +20　修为 +'+a.gain(170,'high')+'　寿元 −24'; } },
    { label:'把那三张纸烧了', eff:(s,a)=>{ a.karma(-3); a.life(20); a.sectContrib(10);
        return '你把那三张烧了。\n\n火烧到一半，纸上渗出一点水。\n\n你看着它烧完，把灰扫进香炉里。\n\n业障 −3　寿元 +20　宗门贡献 +10'; } }
  ]
},

{
  id:'ev12_story_wait', once:true, tier:4, title:'今天想不起来了', cat:'修行',
  when:s=>s.flags.includes('story_waited') && flagAge('story_waited') >= 16,
  text:()=>'今天早上，你想不起自己叫什么了。\n\n' +
    '不是完全想不起——\n你记得第一个字，记得是三个字。\n\n' +
    '中间那个字，怎么都想不出来。',
  flavor:()=>causeLine('story_waited'),
  choices:[
    { label:'坐下来，一直想到想起来为止', eff:(s,a)=>{ a.clue('clue_name'); a.sectContrib(16); a.cult(150,'high'); a.life(-26); a.karma(-2);
        return '你坐下了。\n\n坐到中午，坐到天黑，坐到第二天早上。\n\n第二天早上，你忽然想起来了。\n\n想起来的时候你出了一身汗，\n像从很深的水里浮上来。\n\n线索 +1　宗门贡献 +16　修为 +'+a.gain(150,'high')+'　寿元 −26　业障 −2'; } },
    { label:'不管了，先去做事', eff:(s,a)=>{ a.karma(2); a.cult(90,'high'); a.sectContrib(6);
        return '你起来去打水、对账、扫地。\n\n一天下来没人叫过你的名字。\n\n晚上躺下的时候，你已经不太在意那个字了。\n\n业障 +2　修为 +'+a.gain(90,'high')+'　宗门贡献 +6'; } }
  ]
},

{
  id:'ev12_story_out', once:true, tier:4, title:'月光穿过去的那只手', cat:'世界',
  when:s=>s.flags.includes('story_went_out') && flagAge('story_went_out') >= 18,
  text:()=>'你开始能在白天看见一些东西。\n\n' +
    '不是影子，也不是人。\n\n' +
    '是**空出来的地方**——\n有些人走过的地方，会短暂地空一下，\n像水面上被抹掉的一圈纹。',
  flavor:()=>causeLine('story_went_out'),
  choices:[
    { label:'记住那些空出来的地方', eff:(s,a)=>{ a.clue('clue_erased'); a.clue('clue_page'); a.sectContrib(18); a.cult(160,'high'); a.life(-18); a.karma(1);
        return '你随身带了块炭，看见空的地方就往地上画一道。\n\n画了十几天，地上那些道连成了一个形状。\n\n你退后看，那是一个人走路的路线。\n\n从伙房出发，绕过祖师堂，一直走到后山。\n\n线索 +2　宗门贡献 +18　修为 +'+a.gain(160,'high')+'　寿元 −18　业障 +1'; } },
    { label:'不再看', eff:(s,a)=>{ a.karma(-2); a.life(22); a.cult(50,'mid');
        return '你开始低头走路。\n\n走了几天，那些空的地方就不出现了。\n\n也可能是你不看了。\n\n业障 −2　寿元 +22　修为 +'+a.gain(50,'mid'); } }
  ]
},

{
  id:'ev12_story_cover', once:true, tier:4, title:'那一夜之后', cat:'修行',
  when:s=>s.flags.includes('story_covered') && flagAge('story_covered') >= 18,
  text:()=>'你把被子蒙上那一夜之后，睡得很好了。\n\n' +
    '好到有点不对。\n\n' +
    '你开始记不住梦。不是梦变少了——\n是醒来之后一点痕迹都不剩。',
  flavor:()=>causeLine('story_covered'),
  choices:[
    { label:'睡前在床头放一张纸，醒来先写三个字', eff:(s,a)=>{ a.clue('clue_dream'); a.sectContrib(14); a.cult(130,'high'); a.life(-14);
        return '第一天早上你写了「什么都没有」。\n\n第七天你写了「又是那条路」。\n\n第十四天你写了三个字，\n写完之后你盯着看，不认识那三个字。\n\n线索 +1　宗门贡献 +14　修为 +'+a.gain(130,'high')+'　寿元 −14'; } },
    { label:'继续睡', eff:(s,a)=>{ a.life(30); a.sectContrib(10); a.cult(70,'high'); a.karma(-2);
        return '你继续睡。\n\n睡得越来越好。\n\n有一天你早上醒来，觉得昨天好像发生过什么，\n但想了半天，只记得伙房的粥。\n\n业障 −2　寿元 +30　宗门贡献 +10　修为 +'+a.gain(70,'high'); } }
  ]
},

{
  id:'ev12_story_window', once:true, tier:4, title:'三百灵石的那口棺材', cat:'线索',
  when:s=>s.flags.includes('story_asked_window') && flagAge('story_asked_window') >= 18,
  text:()=>'你去查了那一年三月初七的账。\n\n' +
    '三百灵石，确实支出去了。\n\n' +
    '同一天，宗门里少了六个人。\n\n' +
    '而一口棺材，装不了六个人。',
  flavor:()=>causeLine('story_asked_window'),
  choices:[
    { label:'去后山找那口棺材', eff:(s,a)=>{ a.clue('clue_page'); a.clue('clue_erased'); a.sectContrib(20); a.cult(180,'high'); a.life(-22);
        return '你在后山找了三天。\n\n第三天在一片竹林后面找到一处新土——\n其实是三十年前的旧土，但表面比周围新。\n\n你挖开。\n\n里面是一口棺，很新，没有钉。\n\n打开，里面是空的，\n底上躺着六样东西：六块牌子，刻着六个名字。\n\n线索 +2　宗门贡献 +20　修为 +'+a.gain(180,'high')+'　寿元 −22'; } },
    { label:'不去，把这件事记下来就够了', eff:(s,a)=>{ a.clue('clue_date'); a.sectContrib(12); a.cult(90,'high'); a.life(10);
        return '你把这个数目、这个日子、这六个人，记在了纸上。\n\n记完你把它和别的纸放在一起。\n\n那一叠已经很厚了。\n\n线索 +1　宗门贡献 +12　修为 +'+a.gain(90,'high')+'　寿元 +10'; } }
  ]
},

{
  id:'ev12_story_cross', once:true, tier:4, title:'你划掉的那一行', cat:'线索',
  when:s=>s.flags.includes('story_crossed_out') && flagAge('story_crossed_out') >= 18,
  text:()=>'你划掉的那一行，最近又显出来了。\n\n' +
    '不是墨渗上来——是纸在那个位置变薄了。\n\n' +
    '薄到能看见下一页的字。',
  flavor:()=>causeLine('story_crossed_out'),
  choices:[
    { label:'把下一页也翻开看', eff:(s,a)=>{ a.clue('clue_page'); a.clue('clue_name'); a.sectContrib(18); a.cult(170,'high'); a.life(-20); a.karma(2);
        return '你翻开下一页。\n\n上面只有一个名字。\n\n是你划掉自己那一行**之后**才写的。\n\n字迹是你的。\n\n线索 +2　宗门贡献 +18　修为 +'+a.gain(170,'high')+'　寿元 −20　业障 +2'; } },
    { label:'用墨把那一行重新涂实', eff:(s,a)=>{ a.karma(-3); a.life(24); a.sectContrib(12); a.cult(80,'high');
        return '你研了很浓的墨，一层一层涂上去。\n\n涂到第五层，纸不再透了。\n\n你把册子合上，放回去。\n\n业障 −3　寿元 +24　宗门贡献 +12　修为 +'+a.gain(80,'high'); } }
  ]
},

{
  id:'ev12_story_wrote', once:true, tier:4, title:'你替师父写的那一行', cat:'线索',
  when:s=>s.flags.includes('story_wrote_master') && flagAge('story_wrote_master') >= 18,
  text:()=>'你写下师父名字的那一页，现在是湿的。\n\n' +
    '纸一直没干。\n\n' +
    '而且那一行下面，多了两个字。\n\n' +
    '写的是「谢谢」。',
  flavor:()=>causeLine('story_wrote_master'),
  choices:[
    { label:'在下面回一句', eff:(s,a)=>{ a.clue('clue_master'); a.sectContrib(20); a.cult(160,'high'); a.life(-16); a.karma(-4);
        return '你在「谢谢」下面写了三个字：「不客气」。\n\n写完纸就干了。\n\n干得很快，一眨眼的工夫。\n\n你把册子合上，发现封面上的字浮出来了——\n原来它一直有字，只是看不见。\n\n上面写着：宗门名录。\n\n线索 +1　宗门贡献 +20　修为 +'+a.gain(160,'high')+'　寿元 −16　业障 −4'; } },
    { label:'把那一页撕下来', eff:(s,a)=>{ a.karma(3); a.clue('clue_erased'); a.cult(130,'high'); a.sectContrib(8); a.life(-10);
        return '你把那一页撕了下来。\n\n撕口很整齐——你找了把尺子压着撕的。\n\n撕完你才反应过来：三十年前撕那一页的人，\n也是这么撕的。\n\n业障 +3　修为 +'+a.gain(130,'high')+'　宗门贡献 +8　寿元 −10　线索 +1'; } }
  ]
},

{
  id:'ev12_story_took', once:true, tier:4, title:'你带走的那本册子', cat:'世界',
  when:s=>s.flags.includes('story_took_book') && flagAge('story_took_book') >= 18,
  text:()=>'你带走的册子，最近开始变重。\n\n' +
    '不是错觉——你称过。\n\n' +
    '每过一天，重一点。',
  flavor:()=>causeLine('story_took_book'),
  choices:[

    '不是写错——是**事情变了**。\n\n' +
    '有一条写着「后山第三棵树下」，' +
    '而你去看了，那棵树现在是第二棵。',
  flavor:()=>causeLine('wrote_all_down'),
  choices:[
    { label:'按现在的样子改一遍', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(110,'high'); a.life(-12); a.sectContrib(12);
        return '你把每一条都重新核了一遍，改到对得上为止。\n\n改完你把旧的划掉，新的写在旁边。\n\n纸上密密麻麻，像两个人写的。\n\n线索 +1　修为 +'+a.gain(110,'high')+'　寿元 −12　宗门贡献 +12'; } },
    { label:'不改，就留着原来那份', eff:(s,a)=>{ a.clue('clue_date'); a.karma(-2); a.cult(80,'high');
        return '你把纸收起来了。\n\n原来那份写的是当时真的样子。\n改了就不是了。\n\n线索 +1　修为 +'+a.gain(80,'high')+'　业障 −2'; } }
  ]
},

{
  id:'ev13_tree_front', once:true, tier:0, title:'门前那棵树', cat:'世界',
  when:s=>s.flags.includes('planted_tree') && flagAge('planted_tree') >= 18,
  text:()=>'你种在门前的那棵树，长得比别处快。\n\n' +
    '快得不正常——两年就长成了别人十年的样子。\n\n' +
    '而且它把门挡了一半。',
  flavor:()=>causeLine('planted_tree'),
  choices:[
    { label:'把它挪到旁边去', eff:(s,a)=>{ a.life(-14); a.cult(60,'high');
        return '你挖了一天，才把根弄出来。\n\n根的下面有一小片整整齐齐的石头——\n像是有人铺过。\n\n你把树挪走了，石头留在那儿。\n\n寿元 −14　修为 +'+a.gain(60,'high'); } },
    { label:'留着它，以后从旁边绕', eff:(s,a)=>{ a.life(16); a.karma(-1);
        return '你决定不挪了。\n\n从那天起你每天出门都往左偏半步。\n\n偏了几年，那条小路被踩出来了。\n\n寿元 +16　业障 −1'; } }
  ]
},

{
  id:'ev13_tree_stream', once:true, tier:0, title:'溪边那棵树', cat:'世界',
  when:s=>s.flags.includes('planted_tree_stream') && flagAge('planted_tree_stream') >= 18,
  text:()=>'你种在溪边的那棵树，把水改了道。\n\n' +
    '改得很小——只是一条细流从树根那儿绕过去。\n\n' +
    '但绕过去之后，那条细流是**温的**。',
  flavor:()=>causeLine('planted_tree_stream'),
  choices:[
    { label:'顺着细流往上游走', eff:(s,a)=>{ a.clue('clue_page'); a.cult(80,'high'); a.life(-10);
        return '你顺着走了半里。\n\n细流的源头是一块石头，石头上有一个手指粗的洞。\n\n水是从洞里出来的。\n\n你把手伸进去，洞比你想的深得多。\n\n线索 +1　修为 +'+a.gain(80,'high')+'　寿元 −10'; } },
    { label:'每天来这儿洗一次脸', eff:(s,a)=>{ a.life(24); a.cult(40,'mid');
        return '你每天来洗一次脸。\n\n水是温的，洗完脸上会留一层很薄的滑。\n\n洗了一个月，你觉得自己看起来年轻了一点。\n\n寿元 +24　修为 +'+a.gain(40,'mid'); } }
  ]
},

/* ==================== 单个后续 ==================== */

{
  id:'ev13_jade', once:true, tier:1, title:'玉佩发烫的时候', cat:'线索',
  when:s=>s.flags.includes('jade_used') && flagAge('jade_used') >= 15,
  text:()=>'你收好的那块玉佩，最近会发烫。\n\n' +
    '烫的时候都在夜里，而且都是同一个时辰。',
  flavor:()=>causeLine('jade_used'),
  choices:[
    { label:'烫的时候出门看看', eff:(s,a)=>{ a.clue('clue_date'); a.cult(45,'mid'); a.life(-8);
        return '你端着那块玉出去了。\n\n走到院子里，它忽然不烫了。\n\n你站了一会儿，抬起头——\n\n那天晚上的月亮，比平常大一圈。\n\n线索 +1　修为 +'+a.gain(45,'mid')+'　寿元 −8'; } },
    { label:'用布把它包起来', eff:(s,a)=>{ a.life(12); a.cult(25,'low');
        return '你找了块厚布，把它裹了三层，压在箱底。\n\n第二天拿出来摸，还是温的。\n\n寿元 +12　修为 +'+a.gain(25,'low'); } }
  ]
},

{
  id:'ev13_oath', once:true, tier:4, title:'那个誓还在', cat:'修行',
  when:s=>s.flags.includes('oath_taken') && flagAge('oath_taken') >= 18,
  text:()=>'你立的那个誓，最近开始收利息了。\n\n' +
    '不是难受——是有些事你**做不了**了。\n\n' +
    '比如今天有人请你去一个地方，你走到门口就迈不动腿。',
  flavor:()=>causeLine('oath_taken'),
  choices:[
    { label:'硬往里迈', eff:(s,a)=>{ a.life(-30); a.cult(140,'high'); a.karma(3); a.attr({tipo:6});
        return '你迈了。\n\n腿上是刀割的感觉。你一步一步挪进去，\n进去之后什么都不疼了。\n\n但你在里面待的时候，一直听见有人在远处念你发过的那段话。\n\n寿元 −30　修为 +'+a.gain(140,'high')+'　业障 +3　体魄 +6'; } },
    { label:'转身走，不跟自己较劲', eff:(s,a)=>{ a.karma(-3); a.life(22); a.cult(60,'high');
        return '你转身走了。\n\n走的时候腿一点都不沉，反而轻。\n\n有些门关着，就让它关着。\n\n业障 −3　寿元 +22　修为 +'+a.gain(60,'high'); } }
  ]
},

{
  id:'ev13_woodbox', once:true, tier:2, title:'木匣里的那块木头', cat:'世界',
  when:s=>s.flags.includes('woodbox') && flagAge('woodbox') >= 16,
  text:()=>'你打开木匣看了一眼。\n\n' +
    '里面那块刻着侧脸的木头，脸**换了一个方向**。\n\n' +
    '原来朝着盖子上方，现在朝着你。',
  flavor:()=>causeLine('woodbox'),
  choices:[
    { label:'把它翻过去背面朝上', eff:(s,a)=>{ a.karma(-2); a.life(14); a.clue('clue_erased');
        return '你把它翻过去了。\n\n盖上盖子的时候，你听见里面「咔」了一声。\n\n很轻。像什么松开了。\n\n业障 −2　寿元 +14　线索 +1'; } },
    { label:'看着那张脸', eff:(s,a)=>{ a.clue('clue_name'); a.cult(70,'high'); a.karma(1);
        return '你对着那张侧脸看了很久。\n\n看着看着，你认出来了——\n\n那是你入门那天的自己。\n\n线索 +1　修为 +'+a.gain(70,'high')+'　业障 +1'; } }
  ]
},

{
  id:'ev13_wall_talk', once:true, tier:0, title:'墙上多了一行', cat:'线索',
  when:s=>s.flags.includes('wall_talk') && flagAge('wall_talk') >= 16,
  text:()=>'墙上那三行字，现在变成四行了。\n\n' +
    '新加的那一行，不是你的字，也不是上次那个人的字。\n\n' +
    '是**第三种**字迹。',
  flavor:()=>causeLine('wall_talk'),
  choices:[
    { label:'再回一行', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(60,'high'); a.karma(1);
        return '你写下了第五行。\n\n写完你在那儿站了一会儿，等着。\n\n没有第六行出现。\n\n但你走的时候，觉得墙上热闹了一点。\n\n线索 +1　修为 +'+a.gain(60,'high')+'　业障 +1'; } },
    { label:'把整面墙刷白', eff:(s,a)=>{ a.karma(-3); a.life(15);
        return '你找了石灰，把整面墙刷了一遍。\n\n刷的时候你刻意把每一行都盖住。\n\n刷完墙是白的，很干净。\n\n业障 −3　寿元 +15'; } }
  ]
},

{
  id:'ev13_claimed_self', once:true, tier:4, title:'要回来之后', cat:'修行',
  when:s=>s.flags.includes('claimed_self') && flagAge('claimed_self') >= 18,
  text:()=>'你要回来的那部分，装不太进去。\n\n' +
    '它比你现在的壳大一点。\n\n' +
    '所以你每天都要花一点时间，把它按进去。',
  flavor:()=>causeLine('claimed_self'),
  choices:[
    { label:'慢慢撑开自己，把它收下', eff:(s,a)=>{ a.cult(150,'high'); a.life(-24); a.attr({lingli:8,tipo:8});
        return '你花了很久。\n\n每天多收进去一点，撑得疼，但收得住。\n\n收完的那天，你站在镜子前面看了很久——\n镜子里的人比你记得的大一号。\n\n修为 +'+a.gain(150,'high')+'　寿元 −24　体魄 +8　灵力 +8'; } },
    { label:'把多的那点削掉', eff:(s,a)=>{ a.karma(2); a.life(20); a.cult(80,'high');
        return '你把多出来的那点削掉了。\n\n削下来的东西没地方放，你把它埋了。\n\n埋完你觉得轻快，也空了一点。\n\n业障 +2　寿元 +20　修为 +'+a.gain(80,'high'); } }
  ]
},

{
  id:'ev13_tree_planted', once:true, tier:2, title:'树底下长出来的', cat:'世界',
  when:s=>s.flags.includes('tree_planted') && flagAge('tree_planted') >= 18,
  text:()=>'你埋下去的那粒种子，冒出来了。\n\n' +
    '但冒出来的不是苗。\n\n' +
    '是一小截白色的东西，弯着，像一根手指。',
  flavor:()=>causeLine('tree_planted'),
  choices:[
    { label:'挖开看', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(70,'high'); a.karma(2); a.life(-12);
        return '你挖开了。\n\n下面不是种子——是一块骨头，很小，包在树根里。\n\n根是从骨头上长出来的。\n\n线索 +1　修为 +'+a.gain(70,'high')+'　业障 +2　寿元 −12'; } },
    { label:'填回去，浇点水', eff:(s,a)=>{ a.karma(-2); a.life(20); a.cult(45,'mid');
        return '你把土填回去，浇了水。\n\n浇完你拍了两下。\n\n它第二年长成了一棵很普通的树。\n\n业障 −2　寿元 +20　修为 +'+a.gain(45,'mid'); } }
  ]
},

{
  id:'ev13_disciple', once:true, tier:2, title:'你收的那个徒弟', cat:'人事',
  when:s=>s.flags.includes('took_disciple') && flagAge('took_disciple') >= 16,
  text:()=>'你收下的那个徒弟，最近进步很快。\n\n' +
    '快到你有点跟不上了。\n\n' +
    '今天他问你一个问题，你答不上来。',
  flavor:()=>causeLine('took_disciple'),
  choices:[
    { label:'老实说：我也不知道', eff:(s,a)=>{ a.favor(4); a.karma(-3); a.cult(70,'high');
        return '“我也不知道。”\n\n他愣了一下，然后说：“那我们一起去查？”\n\n你们查了三天。\n\n第三天他先查到了。他讲给你听的时候，你听得比谁都认真。\n\n人情 +4　业障 −3　修为 +'+a.gain(70,'high'); } },
    { label:'随便编一个像样的答案', eff:(s,a)=>{ a.favor(1); a.karma(2); a.cult(50,'mid');
        return '你编了一个听起来很有道理的说法。\n\n他点点头，记下来了。\n\n你看着他记，忽然想起自己当年也记过一句差不多的话。\n\n人情 +1　业障 +2　修为 +'+a.gain(50,'mid'); } }
  ]
},

{
  id:'ev13_circle', once:true, tier:2, title:'那个圈子的人', cat:'世界',
  when:s=>s.flags.includes('circle_contact') && flagAge('circle_contact') >= 16,
  text:()=>'你替那封信跑的一趟，把你带进了一个圈子。\n\n' +
    '他们做的事不违法，也不伤人。\n\n' +
    '他们只是**收集**——收集那些快要被忘掉的东西。',
  flavor:()=>causeLine('circle_contact'),
  choices:[
    { label:'也交一样东西进去', eff:(s,a)=>{ a.clue('clue_book'); a.sectContrib(10); a.cult(60,'high'); a.stone(50);
        return '你交了一页旧纸。\n\n他们收下，登记，放进一个很深的柜子。\n\n“这样就丢不了了。”有人说。\n\n你出门的时候，觉得手里空，心里满。\n\n线索 +1　宗门贡献 +10　修为 +'+a.gain(60,'high')+'　灵石 +50'; } },
    { label:'跟他们断干净', eff:(s,a)=>{ a.karma(-3); a.life(16); a.cult(40,'mid');
        return '你把联系方式还了回去，说以后不来了。\n\n他们没劝，只是把你的名字从一本册子上划掉了。\n\n划的时候你看见那本册子很厚。\n\n业障 −3　寿元 +16　修为 +'+a.gain(40,'mid'); } }
  ]
},

{
  id:'ev13_coin', once:true, tier:0, title:'旧钱上的字', cat:'线索',
  when:s=>s.flags.includes('old_coin') && flagAge('old_coin') >= 15,
  text:()=>'你收起来的那枚旧钱，字被磨平了。\n\n' +
    '但最近你发现，斜着看能看见一点痕迹。\n\n' +
    '不是字，是**铸痕**——铸的时候留下的。',
  flavor:()=>causeLine('old_coin'),
  choices:[
    { label:'照着铸痕描出来', eff:(s,a)=>{ a.clue('clue_date'); a.cult(50,'mid'); a.stone(60);
        return '你用炭笔描了半天。\n\n描出来的不是字，是一个图案——\n一枚钱的正面，但中间没有方孔。\n\n你把它收好。也许哪天用得上。\n\n线索 +1　修为 +'+a.gain(50,'mid')+'　灵石 +60'; } },
    { label:'拿去换钱', eff:(s,a)=>{ a.stone(80); a.karma(-1);
        return '你把它换了八十块灵石。\n\n换的时候掌柜多看了两眼，但没多问。\n\n出门之后你回头看了一眼铺子。\n\n灵石 +80　业障 −1'; } }
  ]
},

{
  id:'ev13_dog', once:true, tier:0, title:'那条狗还在', cat:'人事',
  when:s=>s.flags.includes('dog') && flagAge('dog') >= 16,
  text:()=>'你分过吃的那条狗，还在原来那个路口。\n\n' +
    '它认得你。\n\n' +
    '而且它现在会带路——你跟着它走，它总把你带到一个地方。',
  flavor:()=>causeLine('dog'),
  choices:[
    { label:'跟它走到底', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(55,'mid'); a.life(-8);
        return '它把你带到城外一片乱葬岗。\n\n站在一个没有碑的土包前面，它坐下了。\n\n你在那儿站了一会儿。\n\n回去的路上它一直跟着你，跟到城门口才停下。\n\n线索 +1　修为 +'+a.gain(55,'mid')+'　寿元 −8'; } },
    { label:'给它留点吃的就走', eff:(s,a)=>{ a.karma(-2); a.life(12); a.favor(1);
        return '你把干粮掰了一半放在地上。\n\n它没有立刻吃，先看了你一眼。\n\n你走了很远回头看，它才开始吃。\n\n业障 −2　寿元 +12　人情 +1'; } }
  ]
},

{
  id:'ev13_herb', once:true, tier:1, title:'你记的那些药', cat:'修行',
  when:s=>s.flags.includes('know_herb') && flagAge('know_herb') >= 15,
  text:()=>'你认真记下来的那些药，最近救了一个人。\n\n' +
    '一个外门弟子中了毒，管事的都不在。\n\n' +
    '你按记的去采，采回来煎了。',
  flavor:()=>causeLine('know_herb'),
  choices:[
    { label:'守着看他喝完', eff:(s,a)=>{ a.favor(4); a.karma(-3); a.cult(50,'mid');
        return '你守着他喝完，又守了一夜。\n\n第二天早上他退了烧，睁开眼第一句话是问“我怎么了”。\n\n你说：“没事了。”\n\n人情 +4　业障 −3　修为 +'+a.gain(50,'mid'); } },
    { label:'煎完就走', eff:(s,a)=>{ a.karma(-2); a.favor(2); a.cult(35,'mid');
        return '你把药放在床头，说了句“喝了就好”，走了。\n\n后来听说他好了。\n\n他没来找过你。你也没再想起这件事。\n\n业障 −2　人情 +2　修为 +'+a.gain(35,'mid'); } }
  ]
},

{
  id:'ev13_flag', once:true, tier:1, title:'旧旗', cat:'人事',
  when:s=>s.flags.includes('old_flag') && flagAge('old_flag') >= 16,
  text:()=>'你收起来的那面旧旗，最近有人来问。\n\n' +
    '来的是个老人，说是当年绣这面旗的人的后人。\n\n' +
    '他想把它请回去。',
  flavor:()=>causeLine('old_flag'),
  choices:[
    { label:'还给他', eff:(s,a)=>{ a.karma(-4); a.favor(4); a.sectContrib(14);
        return '你把旗取出来，抖了抖灰，交到他手里。\n\n他捧着旗站了很久，然后朝你鞠了一躬。\n\n“我爷爷绣的。”他说，“绣了三个月。”\n\n业障 −4　人情 +4　宗门贡献 +14'; } },
    { label:'留着，但让他看一眼', eff:(s,a)=>{ a.favor(1); a.cult(45,'mid'); a.clue('clue_date');
        return '你把旗挂在墙上，让他看。\n\n他看了很久，指着一处说：“这里少了一根线。”\n\n“本来是什么颜色？”\n\n“不知道。我爷爷没说过。”\n\n人情 +1　修为 +'+a.gain(45,'mid')+'　线索 +1'; } }
  ]
},

{
  id:'ev13_talent', once:true, tier:2, title:'那个孩子的灵根', cat:'人事',
  when:s=>s.flags.includes('found_talent') && flagAge('found_talent') >= 16,
  text:()=>'你帮他测出来的那个灵根，是很好的那种。\n\n' +
    '好到宗门里有人注意到了。\n\n' +
    '今天有两个长老同时来找你问这件事。',
  flavor:()=>causeLine('found_talent'),
  choices:[
    { label:'说不知道', eff:(s,a)=>{ a.karma(-2); a.favor(2); a.life(14);
        return '“我就是随手一测，记不清了。”\n\n他们对视了一眼，走了。\n\n那天晚上你去看那个孩子，他还在伙房劈柴。\n\n没人来找过他。\n\n业障 −2　人情 +2　寿元 +14'; } },
    { label:'如实说，并且替他要一个名额', eff:(s,a)=>{ a.favor(5); a.sectContrib(16); a.karma(-2); a.cult(60,'high');
        return '你把测出来的结果原原本本说了，然后加了一句：\n\n“他该进内门。”\n\n两个长老互相看了一眼。其中一个点了点头。\n\n人情 +5　宗门贡献 +16　业障 −2　修为 +'+a.gain(60,'high'); } }
  ]
},

{
  id:'ev13_ward', once:true, tier:2, title:'门口的阵', cat:'世界',
  when:s=>s.flags.includes('own_ward') && flagAge('own_ward') >= 16,
  text:()=>'你布在洞府门口的那个阵，最近响过一次。\n\n' +
    '响的时候你不在。\n\n' +
    '回来只看见地上有半个脚印，脚尖朝外。',
  flavor:()=>causeLine('own_ward'),
  choices:[
    { label:'顺着脚印找', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(65,'high'); a.life(-10);
        return '脚印只留下半个，然后就没了。\n\n你找了半里，最后在一棵树上看见了刻痕——\n一个记号，你没见过。\n\n线索 +1　修为 +'+a.gain(65,'high')+'　寿元 −10'; } },
    { label:'把阵加固一遍', eff:(s,a)=>{ a.life(16); a.cult(45,'mid'); a.karma(-1);
        return '你花了半天把阵重新描了一遍，又加了两道。\n\n描完你退后看看，觉得踏实。\n\n之后再没响过。\n\n寿元 +16　修为 +'+a.gain(45,'mid')+'　业障 −1'; } }
  ]
},

{
  id:'ev13_name', once:true, tier:2, title:'石头上的名字', cat:'世界',
  when:s=>s.flags.includes('home_named') && flagAge('home_named') >= 16,
  text:()=>'你刻在石头上的那个名字，被人描过一遍。\n\n' +
    '描得很浅，用的是**红色**。\n\n' +
    '你不知道红的是什么。',
  flavor:()=>causeLine('home_named'),
  choices:[
    { label:'照原样再刻深一点', eff:(s,a)=>{ a.life(-8); a.cult(50,'mid'); a.karma(1);
        return '你把那三个字重新刻深了。\n\n刻的时候红色的粉末飞起来，有一股铁味。\n\n刻完你退后看了看，那三个字比原来正。\n\n寿元 −8　修为 +'+a.gain(50,'mid')+'　业障 +1'; } },
    { label:'把整块石头推倒', eff:(s,a)=>{ a.karma(-2); a.life(12); a.clue('clue_erased');
        return '你把石头推倒了。\n\n推倒之后你想了想，又把它扶起来，靠着墙。\n\n字朝着墙，外面看不见了。\n\n业障 −2　寿元 +12　线索 +1'; } }
  ]
},

{
  id:'ev13_domain', once:true, tier:3, title:'你圈的那片地方', cat:'世界',
  when:s=>s.flags.includes('domain') && flagAge('domain') >= 16,
  text:()=>'你圈起来的那片地方，最近有人在你画的界外面盖了间屋子。\n\n' +
    '盖得很规矩，离界正好三尺。\n\n' +
    '住进去的是个年轻人。',
  flavor:()=>causeLine('domain'),
  choices:[
    { label:'过去打个招呼', eff:(s,a)=>{ a.favor(3); a.cult(70,'high'); a.sectContrib(10);
        return '你过去敲了门。\n\n他开门的时候有点紧张，看清是你之后更紧张了。\n\n“我知道这儿是你的地，”他说，“我就挨着住，不进去。”\n\n“没事。”你说，“界画得太大了。”\n\n人情 +3　修为 +'+a.gain(70,'high')+'　宗门贡献 +10'; } },
    { label:'把界往外挪，把他圈进来', eff:(s,a)=>{ a.karma(-2); a.favor(4); a.cult(55,'high'); a.life(-8);
        return '你把界石往外搬了三尺，正好把他那间屋子圈进来。\n\n他第二天看见界石动了，站在门口愣了很久。\n\n后来他成了你这片地方的第一个人。\n\n业障 −2　人情 +4　修为 +'+a.gain(55,'high')+'　寿元 −8'; } }
  ]
},

{
  id:'ev13_array_words', once:true, tier:5, title:'那句话的下半句', cat:'线索',
  when:s=>s.flags.includes('array_words') && flagAge('array_words') >= 18,
  text:()=>'你记下来的那句话，只有上半句。\n\n' +
    '你一直觉得它应该还有下半句。\n\n' +
    '今天你在别的地方，听见了下半句。',
  flavor:()=>causeLine('array_words'),
  choices:[
    { label:'把两句对着念一遍', eff:(s,a)=>{ a.clue('clue_page'); a.cult(130,'high'); a.life(-18); a.karma(2);
        return '你把两句对着念了一遍。\n\n念完中间空了一段——\n两句之间应该还有一句，但那一句谁也不记得了。\n\n线索 +1　修为 +'+a.gain(130,'high')+'　寿元 −18　业障 +2'; } },
    { label:'只记下半句，不往一起凑', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(70,'high'); a.karma(-1);
        return '你把下半句单独记在另一张纸上。\n\n两张纸分开放。\n\n有些话凑齐了会出事，你大概知道。\n\n线索 +1　修为 +'+a.gain(70,'high')+'　业障 −1'; } }
  ]
},

{
  id:'ev13_moon', once:true, tier:0, title:'画下来的月亮', cat:'线索',
  when:s=>s.flags.includes('moon_drawn') && flagAge('moon_drawn') >= 16,
  text:()=>'你画下来的那两个月亮，最近自己变了一点。\n\n' +
    '不是你改的。\n\n' +
    '是墨**扩散**了——两个圈各自往外晕开，边缘碰在了一起。',
  flavor:()=>causeLine('moon_drawn'),
  choices:[
    { label:'拿到外面跟真的对一对', eff:(s,a)=>{ a.clue('clue_date'); a.cult(60,'mid'); a.life(-6);
        return '你把画举起来对着天。\n\n天上只有一个。\n\n但画上那两个圈晕开的地方，形状和天上那个一模一样。\n\n线索 +1　修为 +'+a.gain(60,'mid')+'　寿元 −6'; } },
    { label:'把画收起来，不再看', eff:(s,a)=>{ a.life(14); a.cult(30,'low'); a.karma(-1);
        return '你把画卷起来，塞进箱底。\n\n塞进去之前你又看了一眼，那两圈已经连成一个了。\n\n寿元 +14　修为 +'+a.gain(30,'low')+'　业障 −1'; } }
  ]
},

{
  id:'ev13_map', once:true, tier:3, title:'那个节点上有什么', cat:'世界',
  when:s=>s.flags.includes('map_read') && flagAge('map_read') >= 16,
  text:()=>'你按阵图找到的那个节点，现在被人围起来了。\n\n' +
    '围的是木栏，很新。\n\n' +
    '栏上挂着一块牌子，写着四个字：\n「此处无用」。',
  flavor:()=>causeLine('map_read'),
  choices:[
    { label:'翻进去看看', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(110,'high'); a.life(-16); a.karma(2);
        return '你翻了进去。\n\n节点还在，但被人用石头压住了。\n\n你把石头搬开，底下的东西已经不见了——\n只剩一个很圆的坑。\n\n线索 +1　修为 +'+a.gain(110,'high')+'　寿元 −16　业障 +2'; } },
    { label:'去问是谁围的', eff:(s,a)=>{ a.clue('clue_world'); a.favor(2); a.cult(70,'high');
        return '你问了附近的人。\n\n他们都说不知道，只说围起来很久了。\n\n有一个小孩说：“是我爹围的。他说围起来就没人掉下去了。”\n\n线索 +1　人情 +2　修为 +'+a.gain(70,'high'); } }
  ]
},

{
  id:'ev13_yuan', once:true, tier:4, title:'借走的元婴', cat:'修行',
  when:s=>s.flags.includes('yuan_lent') && flagAge('yuan_lent') >= 18,
  text:()=>'你借出去的元婴，还回来的时候小了一圈。\n\n' +
    '不是被用了——是**被养过**。\n\n' +
    '它现在比你自己养的那部分熟。',
  flavor:()=>causeLine('yuan_lent'),
  choices:[
    { label:'把它收回去，重新养熟', eff:(s,a)=>{ a.cult(160,'high'); a.life(-20); a.attr({lingli:10});
        return '你把它收回来了。\n\n收回来那几天，你总觉得丹田里有两个东西在转，\n转的方向不一样。\n\n一个月之后它们同步了。\n\n修为 +'+a.gain(160,'high')+'　寿元 −20　灵力 +10'; } },
    { label:'再借出去一次', eff:(s,a)=>{ a.stone(300); a.cult(90,'high'); a.karma(1);
        return '你又借了一次。\n\n这次换回来的是灵石，很多。\n\n你把灵石收起来，忽然想：\n再借几次，它还是不是我的。\n\n灵石 +300　修为 +'+a.gain(90,'high')+'　业障 +1'; } }
  ]
},

{
  id:'ev13_line', once:true, tier:5, title:'掐断之后', cat:'世界',
  when:s=>s.flags.includes('line_cut') && flagAge('line_cut') >= 18,
  text:()=>'你掐断那根线之后，有一头**没接回去**。\n\n' +
    '平时没感觉。\n\n' +
    '但每次有人在你背后叫你名字，你都要愣一下才回头。',
  flavor:()=>causeLine('line_cut'),
  choices:[
    { label:'练习听见自己的名字就回头', eff:(s,a)=>{ a.cult(120,'high'); a.life(-16); a.clue('clue_name');
        return '你找人每天叫你十遍。\n\n练了半个月，你终于不用愣那一下了。\n\n但你也分不清哪一声是在叫你。\n\n修为 +'+a.gain(120,'high')+'　寿元 −16　线索 +1'; } },
    { label:'把那一头找回来接上', eff:(s,a)=>{ a.clue('clue_world'); a.cult(140,'high'); a.life(-26); a.karma(-2);
        return '你顺着掐断的地方往回找。\n\n找了很久，找到一头飘在半空的线头。\n\n你把它接回去了。\n\n接上去的一瞬间，你听见很多人同时叫了你的名字。\n\n线索 +1　修为 +'+a.gain(140,'high')+'　寿元 −26　业障 −2'; } }
  ]
},

{
  id:'ev13_master_date', once:true, tier:5, title:'师父被问住之后', cat:'线索',
  when:s=>s.flags.includes('asked_master_date') && flagAge('asked_master_date') >= 18,
  text:()=>'你问师父记不记得三月初七之后，他很久没说话。\n\n' +
    '今天他来找你了。\n\n' +
    '手里拿着一样东西，用布包着。',
  flavor:()=>causeLine('asked_master_date'),
  choices:[
    { label:'接过来打开', eff:(s,a)=>{ a.clue('clue_date'); a.clue('clue_master'); a.cult(150,'high'); a.life(-18);
        return '布里面是一块木牌。\n\n上面刻着一个名字，被刀划过很多遍，' +
        '划到笔画都快没了。\n\n“这是谁？”\n\n“我师兄。”师父说，“我每天划一遍。”\n\n线索 +2　修为 +'+a.gain(150,'high')+'　寿元 −18'; } },
    { label:'不接，让他自己留着', eff:(s,a)=>{ a.favor(3); a.karma(-3); a.life(20);
        return '“您留着吧。”\n\n他看了你一会儿，把布重新包好，收进袖子里。\n\n“也好。”他说，“我还没划完。”\n\n人情 +3　业障 −3　寿元 +20'; } }
  ]
},

{
  id:'ev13_flatland', once:true, tier:5, title:'那片平地上', cat:'世界',
  when:s=>s.flags.includes('flatland') && flagAge('flatland') >= 18,
  text:()=>'你去过的那片平地，最近开始长东西了。\n\n' +
    '长的不是草。\n\n' +
    '是一排一排的、很矮的石桩，' +
    '间距一模一样。',
  flavor:()=>causeLine('flatland'),
  choices:[
    { label:'数一数有多少根', eff:(s,a)=>{ a.clue('clue_page'); a.cult(140,'high'); a.life(-14);
        return '你数了两遍。\n\n第一遍数出四十九根，第二遍也是四十九根。\n\n但你数的时候明明看见有五十根。\n\n线索 +1　修为 +'+a.gain(140,'high')+'　寿元 −14'; } },
    { label:'拔一根带走', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(100,'high'); a.karma(2); a.life(-10);
        return '你拔了一根。\n\n拔出来才发现，桩子下面连着很长的一截，\n长到你把整条手臂伸进去都没到底。\n\n你松了手。它自己缩回去了。\n\n线索 +1　修为 +'+a.gain(100,'high')+'　业障 +2　寿元 −10'; } }
  ]
},

{
  id:'ev13_remerge', once:true, tier:7, title:'重新合出来的', cat:'修行',
  when:s=>s.flags.includes('remerge') && flagAge('remerge') >= 18,
  text:()=>'你重新合出来的那个东西，比原来那两个都小。\n\n' +
    '但它是**完整**的。\n\n' +
    '小，完整，而且很安静。',
  flavor:()=>causeLine('remerge'),
  choices:[
    { label:'让它就这样', eff:(s,a)=>{ a.cult(180,'high'); a.life(28); a.karma(-4);
        return '你什么都没做。\n\n它就在那儿，安安静静地待着。\n\n有时候你几乎忘了它在。\n\n那段时间是你这些年里最安稳的一段。\n\n修为 +'+a.gain(180,'high')+'　寿元 +28　业障 −4'; } },
    { label:'再打散一次，试着合得大一点', eff:(s,a)=>{ a.cult(230,'high'); a.life(-34); a.karma(3); a.attr({wuxing:10});
        return '你又打散了一次。\n\n这次合出来大了一些，但不如上一个安静。\n\n它在你里面动的时候，你会听见细小的声音。\n\n修为 +'+a.gain(230,'high')+'　寿元 −34　业障 +3　悟性 +10'; } }
  ]
},

{
  id:'ev13_own_trib', once:true, tier:9, title:'自己造的雷，落了很久', cat:'修行',
  when:s=>s.flags.includes('made_own_tribulation') && flagAge('made_own_tribulation') >= 18,
  text:()=>'你自己造的那场雷，一直没有停。\n\n' +
    '它不去别处，只在你头顶那一小块地方。\n\n' +
    '走到哪儿跟到哪儿。',
  flavor:()=>causeLine('made_own_tribulation'),
  choices:[
    { label:'站到雷底下去', eff:(s,a)=>{ a.cult(260,'high'); a.life(-40); a.karma(-3); a.attr({tipo:12,gengu:12});
        return '你站进去了。\n\n雷落在你身上的时候，你觉得很吵。\n\n吵了很久之后，忽然安静了——\n\n不是雷停了，是你听得见了。\n\n修为 +'+a.gain(260,'high')+'　寿元 −40　业障 −3　体魄 +12　根骨 +12'; } },
    { label:'把它送走', eff:(s,a)=>{ a.karma(-5); a.life(36); a.cult(120,'high');
        return '你找了个没人的地方，把雷「请」了过去。\n\n你不知道自己怎么会这个动作，但你会。\n\n雷落在那儿了。\n\n你走的时候，身后一直在响。\n\n业障 −5　寿元 +36　修为 +'+a.gain(120,'high'); } }
  ]
},

{
  id:'ev13_asked_other', once:true, tier:9, title:'顶替你的那个东西的回答', cat:'线索',
  when:s=>s.flags.includes('asked_other') && flagAge('asked_other') >= 18,
  text:()=>'你问它「你顶替我之后，我去哪」的时候，它没回答。\n\n' +
    '现在它回了。\n\n' +
    '回的方式是——它**让开了一点**。\n\n' +
    '你看见它身后的地方，是你自己的屋子。',
  flavor:()=>causeLine('asked_other'),
  choices:[
    { label:'从它让开的那点地方看进去', eff:(s,a)=>{ a.clue('clue_name'); a.clue('clue_xinmo'); a.cult(240,'high'); a.life(-32); a.karma(2);
        return '你看进去了。\n\n屋里有人坐在你的位置上，在喝你的茶。\n\n那个人抬起头，朝你笑了一下。\n\n那张脸是你的。\n\n线索 +2　修为 +'+a.gain(240,'high')+'　寿元 −32　业障 +2'; } },
    { label:'不看，让它让回去', eff:(s,a)=>{ a.karma(-4); a.life(34); a.cult(110,'high');
        return '“你让回去。”你说。\n\n它让回去了。\n\n你们两个站在那儿，谁都没再动。\n\n业障 −4　寿元 +34　修为 +'+a.gain(110,'high'); } }
  ]
},

{
  id:'ev13_gave_back', once:true, tier:9, title:'还了七成之后', cat:'世界',
  when:s=>s.flags.includes('gave_back') && flagAge('gave_back') >= 18,
  text:()=>'你还了七成之后，剩下的三成一直在响。\n\n' +
    '像有人在很远的地方敲一样很小的东西。\n\n' +
    '今天你听清了：是三下，停一停，再三下。',
  flavor:()=>causeLine('gave_back'),
  choices:[
    { label:'把剩下三成也还了', eff:(s,a)=>{ a.karma(-6); a.life(40); a.cult(160,'high'); a.attr({gengu:10});
        return '你把最后三成也还了。\n\n还完的那一瞬间，你身上轻得几乎站不稳。\n\n你坐下来，坐了整整一天。\n\n第二天早上起来，你觉得自己是新的。\n\n业障 −6　寿元 +40　修为 +'+a.gain(160,'high')+'　根骨 +10'; } },
    { label:'留着这三成', eff:(s,a)=>{ a.karma(3); a.cult(220,'high'); a.life(-26); a.attr({lingli:12});
        return '你决定留着。\n\n那声音从此没停过，但你习惯了。\n\n习惯之后你发现，它能告诉你一些事——\n比如谁快要消失了。\n\n修为 +'+a.gain(220,'high')+'　寿元 −26　业障 +3　灵力 +12'; } }
  ]
},

{
  id:'ev13_fruit', once:true, tier:0, title:'留在树上的那一半', cat:'世界',
  when:s=>s.flags.includes('left_fruit') && flagAge('left_fruit') >= 16,
  text:()=>'你留在树上的那一半果子，熟透了。\n\n' +
    '没有人摘。\n\n' +
    '但树下有一圈很整齐的果核——' +
    '有人在这儿坐着吃完了一整季。',
  flavor:()=>causeLine('left_fruit'),
  choices:[
    { label:'坐下来等', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(45,'mid'); a.life(-6);
        return '你坐在果核中间，等了一下午。\n\n没人来。\n\n天快黑的时候你站起来，在树干上看见一道刻痕——\n是新刻的，很短。\n\n线索 +1　修为 +'+a.gain(45,'mid')+'　寿元 −6'; } },
    { label:'明年照旧留一半', eff:(s,a)=>{ a.karma(-3); a.life(18); a.cult(30,'low');
        return '你决定明年也这么干。\n\n果子是树上长的，本来也不是你的。\n\n业障 −3　寿元 +18　修为 +'+a.gain(30,'low'); } }
  ]
},

{
  id:'ev13_roof', once:true, tier:0, title:'老人家的屋顶', cat:'人事',
  when:s=>s.flags.includes('oldman_roof') && flagAge('oldman_roof') >= 16,
  text:()=>'你帮山里的老人修过屋顶。\n\n' +
    '今天你路过，屋子还在，门锁着。\n\n' +
    '屋顶是新的——比上次修的还新。',
  flavor:()=>causeLine('oldman_roof'),
  choices:[
    { label:'在门口留点东西', eff:(s,a)=>{ a.karma(-3); a.stone(-40); a.life(16);
        return '你把身上带的干粮和一小袋灵石放在门槛上，用石头压住。\n\n走的时候你回头看了一眼。\n\n新屋顶修得很好。\n\n业障 −3　灵石 −40　寿元 +16'; } },
    { label:'上去看看是谁修的', eff:(s,a)=>{ a.clue('clue_erased'); a.cult(40,'mid');
        return '你爬上屋顶看了。\n\n新换的瓦上有一个记号——和你在树上看见的那个一样。\n\n线索 +1　修为 +'+a.gain(40,'mid'); } }
  ]
},

{
  id:'ev13_snow', once:true, tier:0, title:'雪里拖回来的木头', cat:'世界',
  when:s=>s.flags.includes('snow_wood') && flagAge('snow_wood') >= 16,
  text:()=>'你从雪里拖回来的那些木头，堆在院子里。\n\n' +
    '最近你发现少了一根。\n\n' +

/* ============================================================
   《记忆修复局》事件数据 · 第十四批（第 32 轮）
   「见证者」—— 让一个选择扩散到很多个事件
   ------------------------------------------------------------
   玩家原话：
   > 「很多事件完全没有发挥真正的作用，事件缺乏『串联』的能力，
   >  例如事件 A 你选择了 1，就有可能导致后续的某事件也会因为这个
   >  选项而改变内容。」

   第 32 轮审计量出来的现状（这一批就是来改它的）：

     · 被写过的标记 76 个，**每个都只被恰好 1 个事件读取**
     · 扇出 ≥3 的标记：**0 个**
     · **正文会因标记而改变的事件：0 个**

   也就是说之前全是「A 选 1 → B 出现」的孤立两点直线，而且 B 的内容是死的。
   flag 的表达力只够做到这里 —— 它只记得「这件事发生过」。

   所以这一批用的是新的**选择记录（deed）**：
     a.deed('thief','let_go')       记下「你放走了那个贼」
     deeds:['thief']                声明「这个事件见证那件事」
   引擎按声明记账、优先抽「你还挂着、而且还没被讲完」的记录，
   于是同一个选择可以扩散到四五个事件，而且每个事件看到的
   都是**你当时到底选了哪一支**（deedPick），不是一句笼统的「你做过」。

   这一批四条线，每条线一个开头 + 四个见证 + 汇聚：
     贼（放走 / 交出去）　荒年（开仓 / 闭门）
     树（种门前 / 种溪边）　神像（拜 / 不拜）
   四个记录各有两种走向 → 一共 8 种记录，每种 4 个见证事件。

   ⚠️ 写法约定（和 events9~13 一致，dev 里的脚本会逐条对账）：
     · 收益一律 a.cult(base, tier) / a.lifeBy(pct)，文案用返回值拼
     · 门槛用相对判断（evPeer）或 deedAge，不写死属性数字
     · 打架一律 outcome:{win,lose}，**不许写 win:/lose: 函数**
       （函数存不进存档，读档后战果会静默丢失 —— 见 verify-challenge-saveable）
     · deeds:[...] 必须与正文里真正读的那个记录一致，
       dev/verify-linkage.js 第 10 节按它数扇出
   ============================================================ */

/* ============================================================
   《记忆修复局》事件数据 · 第十六批（第 34 轮）
   北寰·北冥剑冢　+　东寰·白鹿书院
   ------------------------------------------------------------
   玩家要求：
   > 「可以选择消耗寿元来前往地图上的其他地方来进行探索
   >  （这种情况下，事件就不会只是原来的那样的仅针对宗门的事件了，
   >   事件这一块需要极多的扩充）」

   所以这一批事件全部带 `loc`，只在对应的地方抽得到。
   分层规则是**加法式**的（见 engine 的 placeAllows）：
   没写 loc 的 370 个老事件在任何地方都照常抽 —— 加内容不是换内容。

   ── 这两个地方各自「认」一个属性 ──────────────────
   北冥剑冢（北寰·冰原）　env = cold（严寒），认 **体魄**
     体魄是这里的第一道门槛：同一片冰原，体魄高的人走起来是散步，
     体魄低的人走起来是掉命。竞技性的时刻（拔剑、对抗）另读神识与身法。
   白鹿书院（东寰·书山）　env = 无，认 **悟性**
     这里不耗你的身体，耗的是你看不看得懂。读碑、抄录、认字迹
     全都按悟性分流 —— 悟性低的人也进得来，但拿不走东西。

   ⚠️ 写法约定（和 events9~15 一致，dev 里的脚本会逐条对账）：
     · 收益一律 a.cult(base, tier) / a.lifeBy(pct)，文案用返回值拼
     · 门槛用相对判断（evPeer）或 evAttr，不写死属性数字
     · 打架一律 outcome:{win,lose}，**不许写 win:/lose: 函数**

        return '你没有动。\n\n他等了一会儿，笑了一下，自己走了。\n\n走之前他说：\n\n「也行。路又不会跑。」'; } },
    { label:'问他那把剑是哪儿来的', hint:'他未必肯说',
      when:()=>evAttr('lingli') >= evPeer('lingli')*1.05,
      eff:(s,a)=>{
        a.tianjiao('tj_lingyun');

        const g = a.cult(50,'high');
        return '他愣了一下。\n\n「捡的。」他说，「就在这儿捡的。」\n\n「这儿？」\n\n他指了指脚下。你这才发现，\n他站的地方是一个坑 —— 冰面上凹下去一块，\n形状正好是一把剑。\n\n「原来插在这儿的。」他说，「我拔出来了。」\n\n修为 +'+g; } }
  ]
},

{
  id:'ev16_bm_baishuang', loc:'beiming', tier:2, title:'守冢人的女儿', cat:'人事',
  text:'石屋门口多了个人。\n\n是个女孩，十几岁，正在把一摞木牌搬进屋里。\n木牌不大，一摞有十几块。\n\n她搬得很稳，一次也没有掉。\n\n她看见你，停下来，把最上面那块翻过去扣在怀里。',
  choices:[

      eff:(s,a)=>{

        a.favor(1);
        return '你说了一声「打扰」，就往回走。\n\n走到林子口的时候，你回头看了一眼。\n\n她还站在原地，怀里那块木牌扣着。\n\n你看不见上面的字。\n\n人情 +1'; } },
    { label:'问她搬的是什么',

        return '她看了你一会儿，然后把怀里那块翻过来给你看。\n\n上面是空的。什么字都没有。\n\n「这块还没刻。」她说。\n\n「那什么时候刻？」\n\n「等人来认的时候。」\n\n修为 +'+g; } },
    { label:'帮她搬', hint:'不用说话也能帮',

  ]
},

/* ---- 汇聚：把「冰底下的名字」与《三月初七》接上 ---- */
{
  id:'ev16_bm_ledger', loc:'beiming', tier:2, once:true, title:'他手上的那本册子', cat:'线索',
  text:(s)=>{
    const seen = (G.Engine.deedHas && G.Engine.deedHas('bm_ice'));
    const broke = (G.Engine.deedPick && G.Engine.deedPick('bm_ice')) === 'broke';
    if (broke) return '守冢人把你叫进石屋。\n\n屋里很暗。他从怀里掏出一本册子，放在桌上。\n\n「你昨天砸开的那块冰，」他说，「底下那块牌子，是我放的。」\n\n他没有生气。他把册子推过来：\n\n「你翻翻。」';
    if (seen) return '守冢人把你叫进石屋。\n\n屋里很暗。他从怀里掏出一本册子，放在桌上。\n\n「你趴下去看了。」他说。不是问句。\n\n「看了也没关系。」他把册子推过来，\n「反正你迟早要看这个。」';
    return '守冢人把你叫进石屋。\n\n屋里很暗。他从怀里掏出一本册子，放在桌上。\n\n「你在这片林子里待了几天。」他说，\n「有个东西该给你看了。」';
  },
  flavor:'册子很旧，但纸是新的 —— 旧的是封皮。',
  choices:[
    { label:'翻开',
      eff:(s,a)=>{
        a.clue('clue_erased'); a.karma(-2);
        const g = a.cult(60,'high');
        return '你翻开。\n\n第一页写着一行字：\n\n**「以下诸人，剑已归冢，名从其愿。」**\n\n下面是名字。一页十几个，写了几十页。\n\n翻到中间，你停住了 ——\n\n有一页被整整齐齐地撕掉了。撕口很平。\n\n「那一页上的人，」守冢人说，\n「后来有人来认过。认走了。」\n\n业障 −2　线索 +1　修为 +'+g; } },
    { label:'先问他：这册子是谁写的',
      eff:(s,a)=>{
        a.clue('clue_page');
        const g = a.cult(45,'mid');
        return '「我爹。」他说。\n\n「他写了多少年？」\n\n「写到走。」\n\n「走去哪？」\n\n他没有回答。他把册子翻到最后一页，\n指了指最下面那行 —— 那行字比别的都小：\n\n**「三月初七，无名小山，一人。」**\n\n修为 +'+g; } },
    { label:'不翻。把册子推回去',
      eff:(s,a)=>{
        a.deed('bm_ledger','refused');
        a.favor(2); a.karma(-1);
        return '你把册子推了回去。\n\n他看了你很久，然后点点头，收进怀里。\n\n「你是第一个不翻的。」他说。\n\n「前面的人都翻了？」\n\n「都翻了。」他说，「翻完就走了。」\n\n人情 +2　业障 −1'; } }
  ]
},

{
  id:'ev16_bl_arrive', loc:'bailu', tier:1, once:true, title:'山道上全是碑',
  text:'书山没有台阶。\n\n上山的道是踩出来的，两边立着碑，一块挨一块，\n一直排到你看见的最高处。\n\n碑上刻的全是字。走近了看，不是经文，是记事：\n\n**「永和三年，东乡旱，书院开仓。」**\n**「永和四年，东乡又旱。仓未开。」**\n**「永和五年，东乡无。」**\n\n每一块碑都在讲一件已经发生过的事。',
  flavor:'你数了数，从山脚到你站的这里，有两百多块。',
  choices:[
    { label:'一块一块往上看',
      eff:(s,a)=>{
        a.deed('bl_gate','read');
        a.lifeBy(-0.02);
        const g = a.cult(35,'mid');
        return '你从第一块看起。\n\n看了二十几块，你发现一件事：\n\n**有些年份是跳过去的。**\n\n永和六年没有碑。永和七年也没有。\n一直到永和十一年才接上。\n\n中间那五年，什么都没有记。\n\n修为 +'+g; } },
    { label:'直接上山，回头再看',
      eff:(s,a)=>{
        a.deed('bl_gate','skipped');
        const g = a.cult(25,'mid');
        return '你往上走。\n\n走到半山腰，风从下面吹上来，\n把碑林里的落叶卷起来一片。\n\n你忽然想：这些碑立在这儿，是给谁看的？\n\n上山的人不看。下山的人不看。\n\n修为 +'+g; } },
    { label:'找「永和五年」那块，看它后面写了什么', hint:'那一年「东乡无」',
      when:()=>evAttr('wuxing') >= evPeer('wuxing')*1.15,
      eff:(s,a)=>{
        a.deed('bl_gate','found');
        a.clue('clue_page');
        const g = a.cult(50,'high');
        return '你回头找了很久。\n\n找到了。碑比别的小一圈，像是后补的。\n\n**「永和五年，东乡无。」**\n\n底下还有一行，刻得很浅，几乎被磨平了：\n\n**「无者，非无人。人不载。」**\n\n不是没有人。是没有人被记下来。\n\n修为 +'+g; } }
  ]
},

{
  id:'ev16_bl_copy', loc:'bailu', tier:1, title:'抄书', cat:'机缘',
  text:'半山有一间敞着的屋子，里面摆着几十张矮案。\n\n其中一张案上摊着一本书，旁边压着一张纸，纸上写了一半。\n\n写的人不在。墨还没干。',
  choices:[
    { label:'坐下来接着往下抄',
      eff:(s,a)=>{
        a.lifeBy(-0.025);
        const g = a.cult(55,'high');
        return '你坐下，拿起笔。\n\n抄了两页，手就酸了。\n\n抄到第五页的时候你才发现，\n这本书每抄一遍，字都会**变一点点**。\n\n不是抄错 —— 是原本上的字，和你抄下来的字，\n有几个地方不一样。\n\n修为 +'+g; } },
    { label:'只看，不动笔',
      eff:(s,a)=>{
        const g = a.cult(30,'mid');
        return '你把书从头翻了一遍。\n\n是本很普通的地方志，记的都是些小事：\n谁家生了孩子，哪年收成不好，谁在哪儿修了座桥。\n\n翻到最后，你看见一行夹在正文里的小字：\n\n**「以上诸事，皆有人记得。」**\n\n修为 +'+g; } },
    { label:'去找写字的那个人', hint:'墨还没干，人没走远',
      eff:(s,a)=>{
        a.deed('bl_copy','find');
        a.favor(2);
        const g = a.cult(40,'mid');
        return '你顺着墨迹走出去。\n\n院墙后面蹲着一个女孩，正在洗笔。\n\n她抬头看见你，说：「你抄了吗？」\n\n「没有。」\n\n「哦。」她低下头继续洗，「那就好。」\n\n人情 +2　修为 +'+g; } }
  ]
},

{
  id:'ev16_bl_name', loc:'bailu', tier:1, title:'被人涂掉的名字', cat:'线索',
  text:'藏书的架子最下层，有一册很薄的册子。\n\n翻开，是一份名录。前后都写满了，字迹工整。\n\n中间有一个名字，被墨涂掉了。\n涂得很厚，厚到那一页的背面都透了黑。',

    { label:'把这一页撕下来',
      eff:(s,a)=>{
        a.deed('bl_name','tore');
        a.karma(4); a.favor(-2);
        const g = a.cult(35,'mid');
        return '你捏住那一页，撕了下来。\n\n撕口很毛。你把纸折好，塞进怀里。\n\n出门的时候，门口站着一个记录官。\n\n他没有拦你。他只是看着你怀里那张纸，\n然后说了一句：\n\n「你撕的是你自己的那一页。」\n\n业障 +4　人情 −2　修为 +'+g; } },
    { label:'合上，放回原处',
      eff:(s,a)=>{
        a.deed('bl_name','closed');
        a.karma(-1);
        const g = a.cult(30,'mid');

  ]
},

{
  id:'ev16_bl_rain', loc:'bailu', tier:2, title:'他说那天下雨了', cat:'人事',
  text:'一个老执笔坐在廊下，看着山下的田。\n\n他忽然开口：「我入门那天，下雨了。」\n\n旁边一个年轻的记录官抬头，说：\n\n「师父，您说过三次了。」\n\n「是吗。」\n\n「三次都说的下雨。」年轻的说，「可那天是大晴天。」\n\n老的没说话。他看着山下的田，看了很久。',
  choices:[
    { label:'问那个年轻人：你怎么知道是晴天',
      eff:(s,a)=>{
        a.clue('clue_date');
        const g = a.cult(45,'mid');
        return '年轻人从袖子里抽出一张纸。\n\n「我查了。」他说，「书院的档里记着那天。」\n\n纸上抄着一行：**「是日，晴，无云。」**\n\n「所以是他记错了？」\n\n年轻人摇摇头。他把纸翻过来，背面还有一行，\n墨色比正面新很多：\n\n**「是日，雨。」**\n\n修为 +'+g; } },
    { label:'不接话，陪老的看田',
      eff:(s,a)=>{
        a.deed('bl_rain','silent');
        a.karma(-2); a.favor(1);
        return '你在廊下坐下来，和他一起看田。\n\n看了很久。田里有人在插秧，弯着腰，一行一行往后退。\n\n老执笔忽然说：\n\n「插秧是往后退的。」\n\n「嗯。」\n\n「可看起来一直在往前走。」\n\n业障 −2　人情 +1'; } },
    { label:'问他：您为什么总说下雨', hint:'要问得软一点',

        const g = a.cult(55,'high');
        return '他沉默了很久。\n\n「因为下雨那天，」他说，「我是被人背上山的。」\n\n「路滑，他摔了两跤。」\n\n「后来我在这山上待了四十年。我一直在找他。」\n\n「找到了吗？」\n\n「找到了。」他说，「他不记得我了。」\n\n业障 −1　修为 +'+g; } }
  ]
},

{

  text:'藏书楼的最后一排，没有编号。\n\n架子上的册子都落着灰，只有一本是干净的。\n\n干净的说明有人常来拿。',

    { label:'看是谁常来拿 —— 在附近等着',

        const g = a.cult(40,'mid');

    { label:'什么都不动，记下位置', hint:'不动也是一种做法',
      eff:(s,a)=>{
        a.deed('bl_shelf','noted');
        a.karma(-1);
        return '你退后一步，把它的位置记了下来：\n\n最后一排，从右数第七格，第三本。\n\n然后你走出藏书楼，把门带上。\n\n门口的记录官抬头看了你一眼，\n在你的名字后面画了一个圈。\n\n业障 −1'; } }
  ]
},

{
  id:'ev16_bl_suyi', loc:'bailu', tier:1, title:'最小的记录官', cat:'人事',
  text:'山道拐角坐着一个女孩，膝盖上摊着本子，正在抄碑。\n\n她抄得很专心，你站在旁边看了一会儿她也没抬头。\n\n然后她说：\n\n「你要过这条路？」\n\n「那我先把这一段抄完。你要等，或者先动手。」',
  choices:[
    { label:'等她抄完',

        a.favor(2); a.karma(-1);
        const g = a.cult(40,'mid');
        return '你靠着碑站下来等。\n\n她抄了一炷香。抄完抬头，把本子合上，让开路。\n\n「抄完了。」她说。\n\n你走过去的时候看见她本子上抄的最后一行：\n\n**「是日，有客过，未留名。」**\n\n人情 +2　业障 −1　修为 +'+g; } },
    { label:'问她抄这些有什么用',
      eff:(s,a)=>{
        a.tianjiao('tj_suyi');
        a.clue('clue_page');
        const g = a.cult(50,'high');
        return '她笔尖停了一下。\n\n「碑上的字会磨掉。」她说。\n\n「磨掉了，事情就没了？」\n\n「磨掉了，事情还在，只是没人知道它在。」\n\n她抬头看你：「你想想，这算不算没了。」\n\n修为 +'+g; } },
    { label:'直接走过去',

  ]
},

{
  id:'ev16_bl_fiveyears', loc:'bailu', tier:2, title:'那五年', cat:'线索',
  text:(s)=>{
    const read = (G.Engine.deedPick && G.Engine.deedPick('bl_gate'));
    if (read === 'found') return '你沿着碑林往回走，想找那五年的痕迹。\n\n有一个穿灰袍的人跟上了你。他没有说话，只是跟着。\n\n走了两百步，他开口了：\n\n「你在找那五年。」';
    if (read === 'read') return '你在碑林里坐了一会儿。\n\n有一个穿灰袍的人走过来，在你旁边站定。\n\n「你一块一块看过了。」他说。\n\n「那你应该已经发现了。」';
    return '你回到山脚。\n\n有一个穿灰袍的人站在第一块碑前面，像在等人。\n\n他看见你，说：\n\n「你上山的时候没看碑。现在看看也不晚。」';
  },
  flavor:'他手里也拿着一本册子，比守冢人那本薄得多。',
  choices:[
    { label:'「那五年，谁不在了？」',
      eff:(s,a)=>{
        a.clue('clue_erased'); a.karma(-3);
        const g = a.cult(65,'high');
        return '他翻开册子。\n\n那一页上只有五个年份，每年下面一行空白。\n\n「不是谁不在了。」他说。\n\n「是**没有人**被记下来。五年，一个都没有。」\n\n「为什么？」\n\n「因为那五年里，」他说，「这座山上只有一个人。」\n\n业障 −3　线索 +1　修为 +'+g; } },
    { label:'「你是谁？」',
      eff:(s,a)=>{
        a.deed('bl_five','who');
        a.clue('clue_page');
        const g = a.cult(45,'mid');
        return '「我是补碑的。」他说。\n\n「补碑？」\n\n「碑上少了的字，我补上去。」他把册子合上，\n「补了两百多年了。」\n\n「补得完吗？」\n\n他看了你一眼。\n\n「补不完。」他说，「但补一块是一块。」\n\n修为 +'+g; } },
    { label:'不问了，把自己知道的告诉他',
      eff:(s,a)=>{
        a.deed('bl_five','told');

/* ============================================================
   《记忆修复局》事件数据 · 第十八批（第 34 轮）
   路上 —— 赶路专属事件（身法）
   ------------------------------------------------------------
   这些事件带 `loc:'*travel'`，**只在「刚赶完路」的那一步**抽得到
   （见 engine 的 placeAllows：`*travel` 要和 s.travelled 一起判）。
   抽完那一步就把标记清掉，所以它们不会在你蹲在家里时冒出来。

   为什么要有这一批：
     第 34 轮加了「花寿元去别处」这个动作。如果赶路只是「扣一笔寿元、
     换个地方」，那地图就变成一道数学题 —— 玩家会算完距离就走最短路径，
     路上什么都不发生。这一批是让**路本身**有内容。

   这里认 **身法**：赶路的消耗本来就按身法打折（engine 的 travelCost），

/* ===== mijing.js ===== */
/* ============================================================
   秘境（第 27 轮新增）
   ------------------------------------------------------------
   玩家原话：
     「我希望增添一个『秘境』功能，玩家可以前往秘境中进行探索，
      秘境中可以获得各种各样的机缘，也可能伴随着危险。
      但秘境不是那么容易才能开启的，秘境可能也会限制境界进入」
   + 追问后的补充：
     「我希望第一种可以参考。还有一种秘境是『大众型秘境』，
      到了一定时间后秘境自动会开启，到时候会引发广大修士的注意」
   + 结构选择：「分层探索，可以中途退出」

   所以一共三类约束，落成下面这套：

   ── 两种开启方式 ──────────────────────────────
   ① **残片型（私密）**：探索时有小概率捡到「秘境图残片」。
      集齐 G.MIJING_SHARD.need 片，可以在主界面「推演」出一处入口。
      推演出来的那处只属于你 —— 因为没有第二个人知道它在哪。
   ② **大众型（公开）**：每 G.MIJING_PUBLIC.period 次行动，
      天地间某处会自己裂开一道口子。消息传得比人快，
      几天之内全天下的修士都在往那边赶。
      它**限时**（G.MIJING_PUBLIC.window 次行动），过时不候。
      里面会碰到别的修士 —— 这是大众型独有的东西。

   ── 境界限制 ─────────────────────────────────
   每个秘境都有 minMajor / maxMajor。
   低于门槛进不去（里面的东西你扛不住）；
   高于上限也进不去（那道口子认修为，修为太高会被弹出来）。

   ── 结构：分层探索 ────────────────────────────
   进去之后一层一层往下走，每层三个选择：
   稳妥 / 激进 / 或者就此回头。
   每层结算一次，随时可以「带着已经拿到的东西出去」。
   越深越肥，也越容易把命留在里面。

   ── 写法约定（沿用前面几轮）────────────────────
   文案里出现的每一个数字都必须真的加（verify-mijing.js 会对账）。
   用 a.cult(n) 的返回值拼字符串，不要手写。
   ============================================================ */

G.MIJING_SHARD  = { need:3, chance:0.10 };   // 探索时 10% 捡到一片；集齐 3 片可推演
G.MIJING_PUBLIC = { period:58, firstAt:40, window:14 };  // 大众型：每 58 次行动开一次，开 14 次行动

G.MIJING = [

/* ============================================================
   道途 · 大事记（第 28 轮新增）
   ------------------------------------------------------------
   玩家选的方向：「多一层『人和人』的关系」+ A（道途·大事记）+ F（弟子加深）。

   为什么需要它：本作叫《记忆修复局》，主题就是**记忆**。
   但在这之前，一世走到结局时只给一句结局词 ——
   你这一世做过的所有选择（放了谁、杀了谁、欠了谁、记住了哪一页）
   全部散在 196 个事件里，结束的时候一点回响都没有。

   这一份东西做两件事：
     ① **编年**：把这一世真正发生过的事按顺序列出来
     ② **称号**：按你的行为算出「你这一世是个什么样的人」

   编年的来源有两处：
     · 显式记下来的（engine.js 里的 `note(kind, text)`，它写进 s.chronicle）
       —— 那些「值得一提但不体现在数值上」的事。
       ⚠️ 这里原来写的是 `G.Chron.note()`，那个函数**不存在** ——
       真的写入点是 engine.js 的 note()，别照着这句去找。
       第 31 轮起，有因果的选择（G.CAUSE 登记过的）也会写进来：
       埋下时一句「你做了这件事：…」，兑现时一句「「…」有了下文。」
     · 从现有状态推出来的 —— 线索、名号、天骄、秘境、主线、弟子、业障

function makeRng(seed){
  let s = 0;
  const str = String(seed);
  for (let i=0;i<str.length;i++){ s = (s*31 + str.charCodeAt(i)) >>> 0; }
  if (!s) s = 123456789;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };

    per: d.per, have: daoJiPerAttr(), full: daoJiPerAttrMax(),
    cost: cost,
    affordable: cost !== null && !!s && s.cult >= cost,
    /* 突破和养丹抢的是同一池修为 —— 界面要把这件事说出来 */
    breakNeed: s ? breakNeed() : 0,
    carry: G.DAOJI_CARRY || 0,
    nextName: (function(){
      const nxt = G.DAOJI.find(x=>x.major === d.major + 1);
      return nxt ? nxt.name : null;
    })()
  };
}

/* ---------------- 局内状态 ---------------- */
let s = null;             // run state
let challenge = null;     // 进行中的挑战

function newRun(lots, seed){
  const C = G.CONFIG;
  const consti = G.CONSTITUTIONS.find(c=>c.id===lots.constitution) || G.CONSTITUTIONS[0];
  const role = G.ROLES.find(r=>r.id===lots.role) || G.ROLES[0];
  /* ⚠️ 第 33 轮：newRun **本身**要读实时 meta —— 它就是那个「拍快照」的时刻
     （s.upSnap = upSnapshot()）。所以这里仍然直接用 meta.up，
     下面那些「本局效果」才走 upLevel()。 */
  const up = meta.up || {};

  const upVal = id => (up[id]||0);

  /* ⚠️ 第 25 轮：「根基」从固定 +10/级 改成「寿元上限 ×（1+3%/级）」。
     旧版在炼气一层相当于 +160%（上限才 100），到元婴巅峰只剩 +1.1%。
     现在它是乘在**当前境界的基础上限**上的，任何境界都值同样的比例。 */
  const maxLife = Math.round(
    (G.REALMS[0].maxLife * (1 + lifeCapBonus()) + (lots.bonus.lifeMax||0))
    * consti.lifeMul * (lots.bonus.lifeMul || 1)
  );

  s = {
    seed: seed,
    rng: makeRng(seed),
    world: 'zongmen',
    worldActions: (meta.worldActions || 0),   // 世界刻度（隐藏 Boss 与世界线的触发依据）

    // 身份与体质
    roleId: role.id, roleName: role.name,
    constId: consti.id, constName: consti.name,
    lots: lots,

    // 寿元
    life: maxLife,
    maxLife: maxLife,

    // 境界
    realmIdx: 0,
    cult: lots.bonus.cultStart || 0,
    attrGain: 0,        // 已经过几次境界成长（每突破一次 +1）
    attrBonus: {},      // 机缘带来的属性加成

    /* 地理（第 34 轮）
       place      你现在在哪儿（place id）
       visited    去过的地方（去过才画实心点；也用来做「第一次到某地」的演出）
       travelFrom 刚从哪儿来（赶路事件用得上：你走的是哪条路）
       placeEnvDue  本步要不要吃环境代价（只有「在一个地方待着的行动」才吃，
                    赶路那一步本身按距离收费，不重复收环境的钱） */
    place: 'home',
    visited: ['home'],
    travelFrom: null,

    // 资源
    /* 开局灵石只来自签运（第 25 轮：「积蓄」不再往这里加固定值，
       它改成了「灵石收入 +6%/级」，见 gainStone 的说明） */
    stone: Math.max(0, (lots.bonus.stone||0)),
    karma: clamp((lots.bonus.karmaStart||0), 0, 20),
    favor: (lots.bonus.favor||0),

    // 篇章：zongmen 宗门篇 / sanxiu 散修篇
    chapter: 'zongmen',
    sanxiu: { started:false, days:0, herbs:0, fish:0, crops:0, beast:null, befriended:0 },

    // 宗门
    sectQi: clamp(C.sectQiStart + (lots.bonus.sectQi||0) + upVal('sectGain')*15, 0, C.sectQiMax + upVal('sectGain')*15),
    sectQiMax: C.sectQiMax + upVal('sectGain')*15,
    sectCollapsed: false,
    sectContrib: 0,          // 宗门贡献（决定职衔与藏经阁折扣）
    sectActions: 0,          // 累计宗门行动（决定月俸与主线推进）
    storyStage: 0,           // 《三月初七》推进到第几幕

    // 建筑
    buildings: { lingtian:0, danfang:0, cangjing:0, jiangjing:0, dazhen:0, zushi:0 },

    // 弟子
    disciples: [],
    discipleCount: 0,

    // 牌组
    deck: [],
    refine: {},          // 精炼等级：{ 卡名: 0~3 }
    // 长期因果：事件留下的后账
    debts: [],

    // 标记
    flags: (lots.bonus.flags||[]).slice(),
    /* 第 32 轮：**选择记录**（deed）—— 串联的地基。
       ------------------------------------------------------------
       flags 只记得「这件事发生过」（一个布尔 + 时间戳）。
       串联需要更厚的东西：**你当时选了哪一支、做过几次、被几个事件见证过**。
       A→B→C 这种多步因果、以及「同一个事件在不同人眼里是不同的故事」，
       都要靠这三个额外维度。

         s.deeds[id] = {
           choice : 当时选的那一支（'a' / 'burn' / 任意字符串）
           at     : 第几次行动做的
           n      : 一共做过几次（叠加强度用，例如「你第三次应它」）
           seen   : 已经被哪些事件见证过（防止同一个记录被反复消费）
         }
       老存档没有这个字段 → loadRun 里补 {}（与 s.flagAt 同一套做法）。 */
    deeds: {},
    clues: [],          // 已发现线索 id
    seenEvents: [],     // 已触发事件 id
    log: [],            // 记事

    /* 第 25 轮：比武大会 与 天骄榜 */
    tourney: null,        // 进行中的赛事 { id, round, total, wins, alive }
    tourneyDone: [],      // 本局已参加过的赛道 id
    titles: [],           // 本局挣到的名号（如「炼气魁首」）
    tianjiaoMet: [],      // 本局已遭遇过的天骄 id

    /* 第 28 轮：道途 · 大事记。见 src/daotu.js */
    chronicle: [],

    /* 第 26 轮：内景（境界养成）
       major = 这个内景是属于哪个大境界的（气海/道基/金丹/元婴…）
       lv    = 已经养到第几层（0 ~ G.DAOJI[max]） */
    daoJi: { major: (G.REALMS[0] || {major:1}).major, lv: 0 },

    /* 第 25 轮：丹药的两类战斗加成
       pillPerm —— 「永久战斗丹」在本局内累加，下一局归零
       pillTemp —— 「限时战斗丹」，fights 是还剩几场；打完就散 */
    pillPerm: { hpPct:0, atkPct:0, qiPct:0, wardPct:0 },
    pillTemp: { fights:0, atkPct:0, dmgCut:0, evade:0 },

    /* 第 29 轮：劫余（渡劫 / 天谴留下的本局永久加成）。
       和 pillPerm 分开存是有意的 —— 丹药是吃出来的，劫余是挨出来的，
       属性面板上要能分别说清楚它们各自给了多少。 */
    boons: { hpPct:0, atkPct:0, qiPct:0, wardPct:0, list:[] },

    // 统计
    actions: 0,
    pillCounter: 0,
    guardUsed: false,
    restUsed: 0,
    nourishUsed: 0,
    /* 第 29 轮：天谴冷却。到这一步数之前，天谴不会再来。
       见 data.js 里 CONFIG.tribulation.karmaCooldown 的注释。 */
    karmaCool: 0,
    /* 第 33 轮：元层升级等级的**本局快照**。
       本局所有效果都读它（见 upLevel 的说明），所以局内买/降升级
       都不会改变这一局 —— 从下一局的快照起才生效。 */
    upSnap: upSnapshot(),
    ended: false
  };

  // 起始卡
  (lots.bonus.startCards||[]).forEach(n=>addCard(n, true));
  // 元层传承：额外稀有卡
  const extra = upVal('startCard');
  for (let i=0;i<extra;i++){
    const pool = Object.keys(G.CARDS).filter(k=>{
      const c = G.CARDS[k];
      return !c.hidden && (c.rarity==='玄'||c.rarity==='道');
    });
    addCard(pool[Math.floor(s.rng()*pool.length)], true);
  }
  if (s.deck.length===0) addCard('吐纳诀', true);

  normalizeDaoJi();                 // 内景对齐当前大境界（第 26 轮）
  resetCardRarity();                // 卡牌品阶回到出厂值（第 28 轮，修跨局泄漏）
  log(`你以「${role.name}」的身份入了山门。${consti.desc}`);
  return s;
}

/* ---------------- 精炼与品阶的威力倍率 ---------------- */
function cardMul(name){
  const c = G.CARDS[name];
  if (!c) return 1;
  const rl = (s.refine && s.refine[name]) || 0;
  const rm = G.RARITY_MUL[c.rarity] || 1;
  return (1 + rl * G.REFINE.perLevel) * rm;
}

/* ---------------- 流派套装 ----------------
   统计每个流派的法宝件数，集齐 need 件即触发联动。 */
function activeSets(){
  const out = [];
  if (!s || !s.deck) return out;
  const count = {};
  s.deck.forEach(function(name){
    const c = G.CARDS[name];
    if (!c || c.type !== '法宝') return;
    const sch = c.school || 'zhong';
    count[sch] = (count[sch] || 0) + 1;
  });
  G.SETS.forEach(function(st){
    const have = count[st.school] || 0;
    if (have >= st.need){
      out.push({ id:st.id, name:st.name, school:st.school, have:have,
                 need:st.need, effect:st.effect, bonus:st.bonus });
    }
  });
  return out;
}
/* 套装加成的聚合 */
function setBonus(){
  const acc = { techMul:0, crit:0, wardPerRound:0, wardHold:false, pillMul:0,
                pillChance:0, cultMul:0, karmaPerAction:0, hpMul:0, dmgTaken:0,
                attr:0, lifeMax:0 };
  activeSets().forEach(function(st){
    const b = st.bonus || {};
    Object.keys(b).forEach(function(k){
      if (typeof b[k] === 'boolean') acc[k] = acc[k] || b[k];
      else acc[k] = (acc[k] || 0) + b[k];
